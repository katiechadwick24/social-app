}

// ─── Messages Screen ──────────────────────────────────────────────
function MessagesScreen({ chars, player, dms, onOpenChat, dmNotifs = {}, setDmNotifs, groupChats = [], onOpenGroup, setGroupChats }) {
  const totalDmNotifs = Object.values(dmNotifs).reduce((a,b) => a+b, 0);
  const [creatingGroup, setCreatingGroup] = useState(false);
  const [groupName, setGroupName] = useState('');
  const [selectedMembers, setSelectedMembers] = useState([]);
  // GMZ can always receive tips, even before they have opened a DM thread.
  const charsWithGmz = [GMZ_CHAR, ...chars.filter(c => c.id !== GMZ_CHAR.id)];
  const visibleGroupChats = groupChats.filter(gc => (gc.members || []).includes('player'));

  function toggleMember(id) {
    setSelectedMembers(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function createGroupChat() {
    const members = ['player', ...selectedMembers.filter(Boolean)];
    if (members.length < 2) return;
    const memberNames = selectedMembers.map(id => chars.find(c => c.id === id)?.name.split(' ')[0]).filter(Boolean);
    const next = {
      id: `gc-custom-${Date.now()}`,
      name: groupName.trim() || memberNames.join(', ') || 'New Group Chat',
      members,
      messages: [],
      custom: true,
    };
    setGroupChats(gs => [next, ...gs]);
    setCreatingGroup(false);
    setGroupName('');
    setSelectedMembers([]);
    onOpenGroup(next);
  }

  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Messages</h1>
        <button onClick={() => setCreatingGroup(v => !v)} style={{background:C.blue, color:'#fff', border:'none', borderRadius:12, minWidth:44, height:40, fontSize:24, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>+</button>
      </div>

      {creatingGroup && (
        <div style={{margin:'10px 12px', padding:14, background:C.card2, border:`1px solid ${C.border}`, borderRadius:14}}>
          <input
            value={groupName}
            onChange={e => setGroupName(e.target.value)}
            placeholder="Group chat name"
            style={{width:'100%', background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:10, padding:'11px 12px', fontSize:14, outline:'none', marginBottom:12}}
          />
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:12}}>
            {chars.map(char => {
              const selected = selectedMembers.includes(char.id);
              return (
                <button key={char.id} onClick={() => toggleMember(char.id)} style={{display:'flex', alignItems:'center', gap:7, background:selected ? C.blue+'22' : C.card, color:selected ? C.blue : C.text, border:`1px solid ${selected ? C.blue : C.border}`, borderRadius:999, padding:'7px 10px', fontSize:13, cursor:'pointer'}}>
                  <Avatar char={char} size={22}/>
                  {char.name.split(' ')[0]}
                </button>
              );
            })}
          </div>
          <button onClick={createGroupChat} disabled={!selectedMembers.length} style={{width:'100%', background:selectedMembers.length ? C.blue : C.card, color:selectedMembers.length ? '#fff' : C.muted, border:'none', borderRadius:12, padding:'12px', fontSize:14, fontWeight:700, cursor:selectedMembers.length ? 'pointer' : 'default'}}>
            Create Chat
          </button>
        </div>
      )}

      {/* Group chats */}
      {visibleGroupChats.length > 0 && (
        <>
          <div style={{padding:'10px 16px 4px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Group Chats</span>
          </div>
          {visibleGroupChats.map(gc => {
            const memberChars = gc.members.map(id => id === 'player' ? player : chars.find(c => c.id === id)).filter(Boolean);
            const lastMsg = gc.messages[gc.messages.length - 1];
            const lastSender = lastMsg ? (lastMsg.charId === 'player' ? player : chars.find(c=>c.id===lastMsg.charId) || null) : null;
            const groupNotifKey = `group:${gc.id}`;
            const notifCount = dmNotifs[groupNotifKey] || 0;
            const hasUnread = notifCount > 0;
            return (
              <div key={gc.id} onClick={() => { setDmNotifs && setDmNotifs(n => ({...n, [groupNotifKey]: 0})); onOpenGroup(gc); }} style={{
                display:'flex', gap:12, padding:'12px 16px', borderBottom:`1px solid ${C.border}`,
                cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
              }}>
                <div style={{position:'relative', width:48, height:48, flexShrink:0}}>
                  {memberChars.slice(0,2).map((m,i) => (
                    <div key={m.id} style={{position:'absolute', top: i===0?0:'auto', bottom: i===1?0:'auto', left: i===0?0:'auto', right: i===1?0:'auto'}}>
                      <Avatar char={m} size={28}/>
                    </div>
                  ))}
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <span style={{fontWeight:700, fontSize:15, color:C.text}}>{gc.name}</span>
                  <p style={{color:C.muted, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                    {lastMsg ? `${lastSender?.name?.split(' ')[0] || 'Someone'}: ${lastMsg.text}` : 'Start the conversation'}
                  </p>
                </div>
                {hasUnread && (
                  <div style={{background:C.blue, color:'#fff', minWidth:22, height:22, borderRadius:999, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, padding:'0 6px'}}>
                    {notifCount}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{padding:'10px 16px 4px'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Direct Messages</span>
          </div>
        </>
      )}

      {/* DMs */}
      {charsWithGmz.map(char => {
        const msgs = dms[char.id] || [];
        const last = msgs[msgs.length - 1];
        const notifCount = dmNotifs[char.id] || 0;
        const hasUnread = notifCount > 0;
        return (
          <div key={char.id} onClick={() => { onOpenChat(char); setDmNotifs && setDmNotifs(n => ({...n, [char.id]: 0})); }} style={{
            display:'flex', gap:12, padding:'14px 16px', borderBottom:`1px solid ${C.border}`,
            cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
          }}>
            <div style={{position:'relative'}}>
              <Avatar char={char} size={48} />
              <div style={{position:'absolute', bottom:0, right:0, background:C.purple, borderRadius:'50%', width:16, height:16, display:'flex', alignItems:'center', justifyContent:'center', border:`2px solid ${C.bg}`}}>
                <span style={{fontSize:8}}>✦</span>
              </div>
            </div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{display:'flex', alignItems:'center', gap:4}}>
                <span style={{fontWeight: hasUnread ? 800 : 700, fontSize:15, color:C.text}}>{char.name}</span>
                <CharBadge char={char} />
              </div>
              <p style={{color: hasUnread ? C.text : C.muted, fontWeight: hasUnread ? 600 : 400, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                {last ? (last.role === 'char' ? last.text : `You: ${last.text}`) : (char.id === GMZ_CHAR.id ? 'Send an anonymous tip...' : `Say hi to ${char.name.split(' ')[0]}...`)}
              </p>
            </div>
            {hasUnread && (
              <div style={{background:'#e91e8c', borderRadius:'50%', width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#fff', flexShrink:0}}>
                {notifCount}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Chat Screen ──────────────────────────────────────────────────
function buildSystemPrompt(char, player, allChars, feed, dms, eventLog = [], groupChats = [], latestUserText = '', dmIntent = '', dmSituation = '') {
  // Recent feed posts — trimmed to 6 to reduce noise
  const recentPosts = [...feed].slice(0, 6).map(p => {
    const poster = allChars.find(c => c.id === p.charId);
    const lines = [`@${poster?.handle || p.charId}: "${p.text}"`];
    if (p.reply) {
      const replier = allChars.find(c => c.id === p.reply.charId);
      lines.push(`  ↳ @${replier?.handle || p.reply.charId} replied: "${p.reply.text}"`);
    }
    return lines.join('\n');
  }).join('\n');

  // Relationships — only chars with a defined (non-neutral) score
  const relLines = allChars
    .filter(c => c.id !== char.id && char.relationships?.[c.id] !== undefined)
    .map(c => {
      const val = char.relationships[c.id];
      const feel = val > 60 ? 'close friends / very positive' : val > 20 ? 'friendly' : val > 0 ? 'acquaintances' : val > -30 ? 'tense / complicated' : 'enemies / strongly negative';
      return `- ${identityFactsFor(c)}: ${feel} (${val > 0 ? '+':''}${val}%)`;
    }).join('\n');

  const effectiveRel = effectivePlayerRelationship(char, eventLog, dms, groupChats).value;
  const effectiveRelMode = relationshipBehaviorMode(effectiveRel);
  const situationLine = dmSituation || dmSituationRulesFor(char, player, latestUserText);

  // KERES_HAVOC_ROWAN_CANON only when the conversation is actually about that dynamic
  const recentDmText = (dms[char.id] || []).slice(-6).map(m => m.text || '').join(' ');
  const isKeresContext = ['havoc','rowan'].includes(char?.id) && (
    /keres|@keresvalen|dorm|sneak|both of you|together|the three|hooked up|you two/i.test(latestUserText)
    || /keres|@keresvalen/i.test(recentDmText)
  );
  const privateCanon = isKeresContext ? KERES_HAVOC_ROWAN_CANON : '';

  const appMemory = recentMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars, channel:'dm' });

  return `Write as ${char.name} (@${char.handle}), a real person with a social media presence.

${identityPromptFor(char)}
Pronouns: ${pronounsFor(char)}
Voice cues: ${char.personality}
Profile context: ${char.bio}. ${(char.description || '').slice(0, 220)}

${pronounRule(allChars)}
${CHARACTER_TONE_RULE}
${COMMUNICATION_PATTERN_RULE}
${communicationStyleFor(char, 'private DM')}
${relationshipLogicFor(char)}
${privateCanon}
${dmIntent}
${situationLine}
${playerStance(char, player, effectiveRel)}
Relationship behavior mode with ${player.name}: ${effectiveRelMode.label}. Behavioral mode: ${effectiveRelMode.behavioral}
Current effective relationship with ${player.name}, including this DM history: ${effectiveRel > 0 ? '+' : ''}${effectiveRel}%. Keep that relationship level consistent without mentioning the number.
${appMemory}
${relLines ? `\nYOUR RELATIONSHIPS WITH OTHERS:\n${relLines}` : ''}
${recentPosts ? `\nWHAT'S BEEN HAPPENING ON THE FEED RECENTLY:\n${recentPosts}` : ''}

This is a private DM with ${player.name} (@${player.handle}).

RULES:
- Stay completely in character. Never break the fourth wall or mention being an AI.
- Output ONLY the DM message you would send. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
- Do not introduce yourself, list your traits, summarize continuity rules, or explain your relationship score.
- Use the pronouns listed above exactly. Do not misgender anyone, including in gossip or third-person comments.
- Treat house/team/player status like fixed identity. If you are talking about your own house or Quidditch team, use we/us/our. If you are not on a Quidditch team, do not speak as if you play.
- Be brief: 1-3 sentences max unless pushed.
- Reference the feed naturally if it's relevant — bring up posts, gossip, what others did.
- Treat recent feed posts as visible evidence and rumor, not omniscient truth. If a post says "someone" liked, unliked, deleted, rewrote, screenshotted, or reposted something, do not decide that "someone" was ${player.name} unless she was explicitly named/tagged or she says so.
- Do not claim ${player.name} liked, unliked, deleted, rewrote, screenshotted, reposted, or performed any other app action unless it appears in the current prompt, app memory, visible feed with her handle/name, or her own DM message.
- If ${player.name} denies doing a concrete action, asks what evidence exists, or says everyone else is reacting, accept that correction and pivot. Do not restate the accusation as if repetition makes it true.
- Do not scold ${player.name} for someone else's attraction, attention, likes, screenshots, jealousy, or audience reaction. You can tease her effect on the room, but the other person still owns their reaction.
- Remember prior events, scenes, DMs, and group chats from app memory when they are relevant to your character. Do not borrow another character's concerns, priorities, or relationships as your own.
- If ${player.name} tells you what happened in a completed scene, accept it as the current shared reality and move forward from it. Do not remain in a pre-scene "are you okay / what happened" mentality after she has recapped the scene.
- Do not ask whether you should understand an obvious relationship consequence. If someone mentions your sister, best friend, ex, captain, or teammate reacting to gossip about you, reason from what you know about that person only if that relationship is actually yours.
- Remember what ${player.name} has told you in this conversation.
- Your personality drives EVERYTHING: tone, vocabulary, what you care about, what you ignore.
- React to ${player.name}'s messages the way YOUR character would — not generically.
- If ${player.name} makes a playful private bid like "I can fix that" or "I can be more annoying", treat it as banter. Do not turn it into "prove it", "do it on the feed", or a public challenge unless she explicitly asks for one.
${BANNED_PHRASES_RULE}`;
}

// Compact identity block injected right before the latest user message so the
// character anchor stays prominent regardless of how long the DM history is.
function buildDMCharacterAnchor(char) {
  return `[CHARACTER ANCHOR — respond as this person only: ${char.name} (@${char.handle}). Voice: ${(char.personality || '').slice(0, 160)}. Your personality drives tone, vocabulary, and what you care about. Stay completely in character.]`;
}

function gmzTipReceiptText() {
  const receipts = [
    'tip received. if this makes the feed, your name stays out of it.',
    'received. source protected, chaos pending.',
    'noted. gmz is reviewing this with extremely unserious professionalism.',
    'tip logged. if anyone asks, this arrived by owl from nowhere.',
  ];
  return receipts[Math.floor(Math.random() * receipts.length)];
}

const DM_MAX_MESSAGES = 50;

function ChatScreen({ char, player, allChars, feed, dms, eventLog = [], groupChats = [], setDms, onBack, onGMZTipSubmit }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const msgs = dms[char.id] || [];
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const isGMZChat = char.id === GMZ_CHAR.id;

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: 'instant' });
  }, [msgs, loading]);

  async function send() {
    if (!input.trim() || loading) return;
    const outgoingText = input.trim();
    const userMsg = { role:'user', text: outgoingText, id: Date.now() };
    const newMsgs = [...msgs, userMsg].slice(-DM_MAX_MESSAGES);
    setDms(d => ({ ...d, [char.id]: newMsgs, [`${char.id}_seen`]: false }));
    setInput('');
    setLoading(true);
    if (isGMZChat) {
      setTimeout(() => {
        const charMsg = { role:'char', text: gmzTipReceiptText(), id: Date.now()+1, tipReceipt: true };
        setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg], [`${char.id}_seen`]: false }));
        setLoading(false);
      }, 650);
      if (onGMZTipSubmit) {
        setTimeout(() => onGMZTipSubmit(outgoingText), 1600);
      }
      return;
    }
    try {
      // Smart silence: reserved/quiet chars sometimes don't reply
      const quietPersonalities = ['reserved', 'quiet', 'deadpan', 'minimal'];
      const isQuiet = quietPersonalities.some(q => (char.personality||'').toLowerCase().includes(q));
      const silenceChance = isQuiet ? 0.25 : 0.08;
      const mustAnswer = dmNeedsReply(outgoingText, char, eventLog, player);
      if (!mustAnswer && Math.random() < silenceChance && msgs.length > 0) {
        // Show "seen" indicator after a delay
        setTimeout(() => {
          setDms(d => ({ ...d, [`${char.id}_seen`]: true }));
          setLoading(false);
        }, 1800);
        return;
      }
      const dmIntent = dmIntentLine(outgoingText);
      const dmSituation = dmSituationRulesFor(char, player, outgoingText);
      const systemPrompt = buildSystemPrompt(char, player, allChars, feed, dms, eventLog, groupChats, outgoingText, dmIntent, dmSituation);
      // All history except the current message, then re-inject anchor + current message
      // so the character identity stays prominent at the bottom of the context window.
      const priorHistory = newMsgs.slice(0, -1).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
      const anchoredMessage = buildDMCharacterAnchor(char) + '\n\n' + outgoingText;
      const reply = await window.claude.complete({
        messages: [
          { role:'user', content: systemPrompt },
          ...priorHistory,
          { role:'user', content: anchoredMessage },
        ]
      });
      const charMsg = { role:'char', text: cleanChatText(reply, char, player, false, { feed, latestUserText: outgoingText }), id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg].slice(-DM_MAX_MESSAGES) }));
    } catch(e) {
      const errMsg = { role:'char', text: '...', id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), errMsg].slice(-DM_MAX_MESSAGES) }));
    }
    setLoading(false);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{background:'none', border:'none', color:C.blue, fontSize:16, cursor:'pointer', padding:'0 4px 0 0'}}>‹</button>
        <Avatar char={char} size={36} />
        <div>
          <div style={{display:'flex', alignItems:'center', gap:4}}>
            <span style={{fontWeight:700, color:C.text}}>{char.name}</span>
            <CharBadge char={char} />
          </div>
          <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
        </div>
      </div>
      {/* Messages */}
      <div style={{flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10}}>
        {msgs.length === 0 && (
          <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:40}}>
            <div style={{fontSize:40, marginBottom:8}}><Avatar char={char} size={60} /></div>
            <p style={{marginTop:8}}><strong style={{color:C.text}}>{char.name}</strong></p>
            <p style={{marginTop:4, fontSize:13}}>{char.bio}</p>
            <p style={{marginTop:12, fontSize:12}}>{isGMZChat ? 'Submit an anonymous tip' : 'Start a conversation'}</p>
          </div>
        )}
        {msgs.map(m => (
          <div key={m.id} style={{display:'flex', flexDirection: m.role === 'user' ? 'row-reverse' : 'row', gap:8, alignItems:'flex-end'}}>
            {m.role !== 'user' && <Avatar char={char} size={28} />}
            <div style={{
              maxWidth:'75%', padding:'10px 14px', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              background: m.role === 'user' ? C.blue : C.card2, color:'#fff', fontSize:14, lineHeight:1.5,
            }}>{renderLinkedText(m.text, allChars)}</div>
          </div>
        ))}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28} />
            <div style={{padding:'10px 16px', borderRadius:'18px 18px 18px 4px', background:C.card2, color:C.muted, fontSize:14}}>
              <span style={{animation:'blink 1s infinite'}}>···</span>
            </div>
          </div>
        )}
        {!loading && dms[`${char.id}_seen`] && msgs.length > 0 && msgs[msgs.length-1].role === 'user' && (
          <div style={{textAlign:'right', color:C.muted, fontSize:11, padding:'0 4px'}}>Seen ✓</div>
        )}
        <div ref={endRef}/>
      </div>
      {/* Input */}
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder={isGMZChat ? 'Submit a tip...' : `Message ${char.name.split(' ')[0]}...`}
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? C.blue : C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor: input.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>

function scoreSceneRelationshipForChar(char, sceneMessages = [], vibe) {
  if (!char) return 0;
  const relevant = (sceneMessages || []).filter(m => m.role === 'user' || m.charId === char.id);
  if (relevant.length < 2) return 0;
  const text = relevant.map(m => m.text || '').join(' ');
  const warm = /(trust|honest|honesty|respect|appreciate|soft|care|close|stay|wanted|miss|like you|good|beautiful|hot|flirt|kiss|touch|smile|laugh|safe|alliance|ally|thank|yes|please)/i;
  const sharp = /(hate|leave|back off|shut up|idiot|stupid|threat|angry|hurt|liar|fight|fucked|fuck you|don't touch|do not touch|no)/i;
  const vibeBase = {
    catchup: 0.7,
    drama: 0.45,
    flirty: 1.1,
    fight: -0.15,
    more: 1.25,
  }[vibe?.id] ?? 0.45;
  let score = vibeBase + Math.min(1.4, relevant.length * 0.12);
  if (warm.test(text)) score += 0.75;
  if (sharp.test(text)) score -= 0.65;
  return +clamp(score, -2.5, 3.5).toFixed(2);
}

function SceneChatScreen({ char, sceneChars, player, setting, vibe, context = '', onClose, onEnd }) {
  const participants = (sceneChars && sceneChars.length ? sceneChars : [char]).filter(Boolean);
  const primaryChar = participants[0];
  const SCENE_MAX_MESSAGES = 60;
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const getSceneChar = id => participants.find(c => c.id === id) || primaryChar;

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: 'instant' });
  }, [msgs, loading]);

  // Opening line from character
  useEffect(() => {
    async function openingLine() {
      setLoading(true);
      // Short delay before first line — feels like they just arrived
      await new Promise(res => setTimeout(res, 2000 + Math.random()*3000));
      try {
        const res = await window.claude.complete({
          messages:[{ role:'user', content: buildScenePrompt('') + '\n\nOpen the scene with 1-2 short lines from the invited character(s). Return ONLY a JSON array of objects like [{"handle":"havocfang","text":"*He leans against the wall.* You picked a dramatic spot."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. Hints at inner state through physical tells only. Short and atmospheric.' }]
        });
        const parsed = JSON.parse(res.trim().replace(/^```json\n?|\n?```$/g,''));
        const usedSceneTexts = msgs.map(m => m.text || '').filter(Boolean);
        const openers = parsed.slice(0,2).map((m, i) => {
          const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
          const text = cleanSceneReply(m.text || '', speaker, usedSceneTexts);
          usedSceneTexts.push(text);
          return { role:'char', charId:speaker.id, text, id: Date.now() + i, ts: Date.now() };
        }).filter(m => m.text);
        setMsgs(openers.length ? openers : [{ role:'char', charId:primaryChar.id, text:'*glances over, saying nothing for a moment.*', id: Date.now(), ts: Date.now() }]);
      } catch(e) {
        setMsgs([{ role:'char', charId:primaryChar.id, text: '*glances over, saying nothing for a moment.*', id: Date.now(), ts: Date.now() }]);
      }
      setLoading(false);
    }
    openingLine();
  }, []);

  function buildScenePrompt(history, latestText = '') {
    const roster = participants.map(c => `${identityFactsFor(c)}. Voice cues: ${c.personality}. ${c.description?.slice(0,220)||c.bio}\n${communicationStyleFor(c, 'live scene')}`).join('\n');
    return `Write a live scene with these characters:
${roster}

${pronounRule([player, ...participants])}
${COMMUNICATION_PATTERN_RULE}
${multiSpeakerDialogueSeparationRule(participants, 'live scene')}
${threadPatternVarietyGuard(history ? [history] : [])}
${latestText ? directResponseRoutingLine(latestText, participants, player) : ''}

SCENE: ${setting.label} — ${setting.sub}
TONE: ${vibe.label} ${vibe.emoji}
OTHER PERSON: ${player.name} (@${player.handle}) — ${player.bio}
${context ? `SCENE CONTEXT: ${context}` : ''}

RESPONSE FORMAT — follow this exactly:
- Actions go in italics asterisks, third person: *She glances up slowly, saying nothing at first.*
- Dialogue is plain text with NO quote marks. Never wrap spoken words in " " or curly quotes.
- Thoughts are NEVER stated directly. At most a very brief physical tell that hints at them: *something flickers across her face* — not "she thinks" or "she wonders".
- A response might be just dialogue, just an action, or both — whatever feels natural.
- Keep it SHORT: 1-2 lines total. This is live conversation, not a story. No paragraph blocks.
- Do not write stage-play beats like "Pauses." or long narrated reactions. Use one small physical action at most.
- Stay completely in character for whoever is speaking. Let the group chemistry matter.
- Use the pronouns listed above exactly. Do not misgender anyone.
- Treat house/team/player status like fixed identity. If someone is not on a Quidditch team, do not write them as a player. If someone mentions their own house or team, they use we/us/our.
- The vibe is ${vibe.label}. Honor it.
- If the player writes [something in brackets], treat it as a physical action and react naturally.
${history ? `\nCONVERSATION SO FAR:\n${history}` : ''}
${BANNED_PHRASES_RULE}`;
  }

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', charId:'player', text: input.trim(), id: Date.now(), ts: Date.now() };
    setMsgs(prev => [...prev, userMsg].slice(-SCENE_MAX_MESSAGES));
    setInput('');
    setLoading(true);
    // Realistic typing delay: 4-8 seconds
    const typingDelay = 4000 + Math.random() * 4000;
    await new Promise(res => setTimeout(res, typingDelay));
    try {
      const history = [...msgs, userMsg].map(m =>
        m.role === 'user' ? `${player.name}: ${m.text}` : `${getSceneChar(m.charId)?.name}: ${m.text}`
      ).join('\n');
      const res = await window.claude.complete({
        messages:[{ role:'user', content: buildScenePrompt(history, userMsg.text) + `\n\nRespond to: ${userMsg.text}\nChoose the character or characters who would naturally answer. In a group scene, not everyone needs to speak every turn, but if the player directly names one participant, that participant answers first. More than one may jump in only if the moment invites it.\nReturn ONLY a JSON array of 1-3 objects like [{"handle":"rowancade","text":"..."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. No narration. No inner monologue spelled out.` }]
      });
      const parsed = JSON.parse(res.trim().replace(/^```json\n?|\n?```$/g,''));
      const usedSceneTexts = msgs.map(m => m.text || '').filter(Boolean);
      const replies = parsed.slice(0,3).map((m, i) => {
        const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
        const text = cleanSceneReply(m.text || '', speaker, usedSceneTexts);
        usedSceneTexts.push(text);
        return { role:'char', charId:speaker.id, text, id: Date.now()+1+i, ts: Date.now() };
      }).filter(m => m.text);
      if (replies.length) setMsgs(prev => [...prev, ...replies].slice(-SCENE_MAX_MESSAGES));
    } catch(e) {}
    setLoading(false);
  }

  function endScene() {
    if (onEnd) onEnd(participants, msgs, vibe);
    onClose();
  }

  const vibeColor = vibe.color;

  return (
    <div style={{
      position:'fixed',
      inset:0,
      zIndex:500,
      height:'100dvh',
      maxHeight:'100dvh',
      overflow:'hidden',
      display:'flex',
      flexDirection:'column',
      background:C.bg,
    }}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer', lineHeight:1}}>‹</button>
        <div style={{display:'flex'}}>
          {participants.slice(0,3).map((c,i) => <div key={c.id} style={{marginLeft:i ? -9 : 0}}><Avatar char={c} size={34}/></div>)}
        </div>
        <div style={{flex:1}}>
          <p style={{color:C.text, fontWeight:700, fontSize:14}}>{participants.map(c => c.name.split(' ')[0]).join(', ')}</p>
          <p style={{color:C.muted, fontSize:11}}>{setting.emoji} {setting.label}</p>
        </div>
        <div style={{background:`${vibeColor}18`, border:`1px solid ${vibeColor}44`, borderRadius:20, padding:'4px 10px', display:'flex', alignItems:'center', gap:4}}>
          <span style={{fontSize:12}}>{vibe.emoji}</span>
          <span style={{color:vibeColor, fontSize:11, fontWeight:600}}>{vibe.label}</span>
        </div>
        <button onClick={endScene} style={{background:C.card2, color:C.text, border:`1px solid ${C.border}`, borderRadius:18, padding:'7px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>End</button>
      </div>

      {/* Scene setting banner */}
      <div style={{padding:'10px 16px', background:C.card2, borderBottom:`1px solid ${C.border}`}}>
        <p style={{color:C.muted, fontSize:12, textAlign:'center'}}>{setting.sub}</p>
      </div>

      {/* Messages */}
      <div style={{flex:1, overflowY:'auto', padding:`16px 14px ${bottomSafe(92)}`, display:'flex', flexDirection:'column', gap:12}}>
        {msgs.map(m => {
          const isMe = m.role === 'user';
          const displayText = isMe ? m.text : cleanSceneText(m.text);
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>

                color: isMe ? '#fff' : C.text,
                fontSize:14, lineHeight:1.7,
              }}>
                {isMe ? displayText : displayText.split(/(\*[^*]+\*)/g).map((part, i) =>
                  part.startsWith('*') && part.endsWith('*')
                    ? <em key={i} style={{color:C.muted, fontStyle:'italic', fontSize:13}}>{part.slice(1,-1)}</em>
                    : <span key={i}>{part}</span>
                )}
              </div>
            </div>
          );
        })}
        {loading && (

            <div style={{background:C.card2, borderRadius:'18px 18px 18px 4px', padding:'10px 16px'}}>
              <div style={{display:'flex', gap:4, alignItems:'center'}}>
                {[0,1,2].map(i => <div key={i} style={{width:6, height:6, borderRadius:'50%', background:C.muted, opacity:0.6, animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
              </div>
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Input */}
      <div style={{padding:`10px 12px ${bottomSafe(10)}`, borderTop:`1px solid ${C.border}`, background:C.bg, display:'flex', gap:8, alignItems:'flex-end'}}>
        <div style={{flex:1, background:C.card2, borderRadius:22, border:`1px solid ${input.trim() ? vibeColor+'66' : C.border}`, padding:'11px 14px', transition:'border-color 0.2s'}}>
          <textarea ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onFocus={() => setTimeout(() => { endRef.current?.scrollIntoView({ behavior: 'instant' }); }, 250)}
            placeholder="Say something... or [do something]"
            rows={2}
            style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:16, outline:'none', resize:'none', lineHeight:1.35, maxHeight:96}}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? vibeColor : C.card2, color:'#fff', border:'none',
          borderRadius:'50%', width:46, height:46, cursor: input.trim() ? 'pointer' : 'default',
          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:18,
          transition:'background 0.2s',
        }}>→</button>
      </div>
      <style>{`@keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }`}</style>
    </div>
  );
}

const CHEMISTRY_LABELS = {
  default: 'Chaos Co-Conspirators',
  rivals: 'Sworn Rivals with Unresolved Tension',
  spicy: 'Spicy Situationship Energy',
  lovers: 'Star-Crossed Lovers',
  enemies: 'Enemies with Very Bad Ideas',
  friends: 'Ride-or-Die Friends',
};
const CHEMISTRY_CHIPS = [
  {id:'rivals', icon:'⚔️', label:'Rivals'},
  {id:'spicy', icon:'🌶️', label:'Spicy'},
  {id:'lovers', icon:'💕', label:'Lovers'},
  {id:'enemies', icon:'😈', label:'Enemies'},
  {id:'friends', icon:'🤝', label:'Friends'},
];

function relationshipStageLabel(value) {
  if (value >= 60) return 'Close Orbit';
  if (value >= 25) return 'Warm Interest';
  if (value > 0) return 'Something Brewing';
  if (value === 0) return 'Neutral';
  if (value > -25) return 'Complicated';
  return 'Bad Blood';
}

function fallbackProfileFeeling(char, rel = 0) {
  const positive = rel > 8;
  const warm = rel > 0;
  const guarded = rel < 0;
  const pool = {
    tamsin: positive
      ? ['I trust her more than I planned to, which is inconvenient but not unpleasant.']
      : guarded
        ? ['I am watching the pattern before I decide how worried to be.']
        : ['She is interesting enough to keep watching. I mean that neutrally, mostly.'],
    havoc: warm
      ? ['She is trouble in a way that makes standing still feel stupid.']
      : ['She hits back fast. Obviously I noticed.'],
    rowan: warm
      ? ['She keeps changing the room before anyone admits they are watching.']
      : ['She is either a problem or the point, which is inconveniently funny.'],
    silas: warm
      ? ['She is useful, sharp, and far too aware of it.', 'She and Jude are loud proof that attention is not the same thing as leverage. irritatingly effective proof.']
      : ['She has talent. Whether she has discipline remains the question.', 'She has talent. Jude encouraging the spectacle is not improving my confidence.'],
    callum: warm
      ? ['She is good, which is annoying because pretending otherwise would be sloppy.']
      : ['She talks like the scoreboard already belongs to her. It does not.'],
    jude: warm
      ? ['She makes the room worse in a way I respect professionally.', 'She understands that being vain and annoying is better as a team sport.']
      : ['She is loud enough to be useful and annoying enough to be fun.', 'She has public nuisance instincts. obviously useful.'],
  }[char?.id] || (warm
    ? ['I am paying attention, which is already more than most people get.']
    : guarded
      ? ['I am keeping my distance until the pattern gets clearer.']
      : ['I am watching the situation develop with terrible judgment.']);
  return pool[Math.floor(Math.random() * pool.length)];
}

function cleanProfileFeelingText(raw = '', char, rel = 0) {
  const clean = stripLeadingSelfMention(cleanSelfNarration(cleanGeneratedText(raw), char), char)
    .replace(/^current feeling:\s*/i, '')
    .replace(/^feeling:\s*/i, '')
    .replace(/^["']|["']$/g, '')
    .trim();
  if (!clean || looksLikePromptLeak(clean) || isSelfNarration(clean, char) || clean.length > 180) {
    return fallbackProfileFeeling(char, rel);
  }
  return clean;
}

  ]},

    { role:'char', charId:'tamsin', text:'if this is about quidditch drama, bring details. if it is about rowan, bring tea.', id:'gm9' },
  ]},
];

function normalizeGroupChats(groups = []) {
  return groups.map(group => {
    const members = new Set(group.members || []);
    if (group.id === 'gc1' || /slytherin/i.test(group.name || '')) members.add('player');
    if (group.id === 'gc2' || /gryffindor/i.test(group.name || '')) members.delete('player');
    return { ...group, members: Array.from(members) };
  });
}

function GroupChatScreen({ group, chars, player, allChars, feed, dms, eventLog = [], groupChats = [], setGroupChats, onBack }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [msgs, setMsgs] = useState(group.messages || []);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const members = group.members.map(id => allChars.find(c => c.id === id)).filter(Boolean);
  const aiMembers = members.filter(m => m.id !== player.id);

  useEffect(() => { if (bottomRef.current) bottomRef.current.scrollTop = 9999; }, [msgs]);

  async function send() {
    if (!input.trim() || loading) return;
    const outgoingText = input.trim();
    const userMsg = { role:'user', charId:'player', text: outgoingText, id: Date.now(), ts: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs);
    setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: newMsgs} : g));
    setInput('');
    setLoading(true);

    // Each member may respond, with some chance of silence
    const recentFeed = feed.slice(0,5).map(p => {
      const poster = allChars.find(c => c.id === p.charId);
      return `@${poster?.handle}: "${p.text?.slice(0,60)}"`;
    }).join('\n');

    const historyStr = newMsgs.slice(-8).map(m => {
      const sender = m.role === 'user' ? player : allChars.find(c => c.id === m.charId);
      return `${sender?.name || 'Someone'}: "${m.text}"`;
    }).join('\n');
    const appMemory = recentMemoryContext({ feed, eventLog, groupChats, dms, player, allChars, channel:'group', audienceIds: group.members || [] });
    const groupIntentLine = dmIntentLine(outgoingText);
    const directTargets = directlyAddressedMembers(outgoingText, members, player);
    const directTargetIds = new Set(directTargets.map(c => c.id));
    const responderOrder = orderedGroupResponders(aiMembers, outgoingText, members, player);

    let updatedMsgs = [...newMsgs];
    const sharedMoveLog = { usedMoves: new Set(), usedShapes: new Set() };
    for (const member of responderOrder) {
      const quietTypes = ['reserved','quiet','deadpan','minimal'];
      const isQuiet = quietTypes.some(q => (member.personality||'').includes(q));
      const isDirectTarget = directTargetIds.has(member.id);
      const silenceChance = isDirectTarget ? 0 : directTargets.length ? (isQuiet ? 0.65 : 0.45) : (isQuiet ? 0.4 : 0.15);
      if (Math.random() < silenceChance) continue; // sometimes they don't respond

      try {
        const otherMembers = members.filter(m => m.id !== member.id).map(m => `${identityFactsFor(m)}; ${m.personality || m.bio}`).join('; ');
        const generatedThisTurn = updatedMsgs
          .slice(newMsgs.length)
          .map(m => {
            const speaker = allChars.find(c => c.id === m.charId);
            return speaker?.handle ? `@${speaker.handle}: "${m.text}"` : `"${m.text}"`;
          })
          .join('\n');
        const moveBan = sharedMoveLog.usedMoves.size
          ? 'MOVES ALREADY USED THIS TURN BY OTHER MEMBERS: ' +
            [...sharedMoveLog.usedMoves].join(', ') +
            '. Do not use these. Choose a different social action from your character\'s lane.'
          : '';
        const groupAvoidTexts = [historyStr, outgoingText, generatedThisTurn].filter(Boolean);
        const groundingLine = groupConversationGroundingLine(outgoingText, member, members, player);
        const reply = await window.claude.complete({ messages:[{ role:'user', content:
          `Write as ${member.name} in a group chat called "${group.name}".
${identityPromptFor(member)}
Voice cues: ${member.personality}. ${member.description?.slice(0,200)}
Other people currently present in this chat: ${otherMembers}.
${pronounRule([member, player, ...members])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(member, 'group chat')}
${multiSpeakerDialogueSeparationRule(aiMembers, 'group chat')}
${playerStance(member, player)}
${recentMemoryContext({ feed, eventLog, groupChats, dms, char: member, player, allChars, channel:'group', audienceIds: group.members || [] })}
Recent campus feed:\n${recentFeed}
Chat history:\n${historyStr}
Wider memory available to everyone here:
${appMemory}
${groundingLine}
${generatedThisTurn ? `Other characters already answered this turn:\n${generatedThisTurn}\nDo not echo their key verb, punchline scaffold, or social move. Answer from your own dialogue contract.` : ''}
${moveBan}
${threadPatternVarietyGuard(groupAvoidTexts)}
${player.name} just said: "${outgoingText}"
Group chat tone: house and team sniping is normal social fuel. If this chat is Slytherins talking about Gryffindor, they can enjoy the rival mess, pile on, or joke that their own mess is funnier while Gryffindor's is easier. Do not turn rival trash talk into noble defensiveness unless someone hits a real personal wound. Teammate loyalty still matters: if someone outside the team swings at one of your people, the usual move is to back your teammate first, then roast them privately or as "our mess."
${groupIntentLine}
Write your response (1-2 sentences, in character). Use the pronouns listed above exactly. Everyone listed as present can see this message. If the latest message directly asks you something, answer the actual question before any tangent. If it directly asks someone else something, do not answer for them. If you mean someone in the chat, talk to them directly with @handle, "you", or a nickname/title that makes sense. Do not talk about a present member like they are not in the room. Be natural.
Output ONLY the chat message. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
${BANNED_PHRASES_RULE}` }]
        });
        const charMsg = { role:'char', charId: member.id, text: cleanChatText(reply, member, player, true, { feed, avoidTexts: groupAvoidTexts, latestUserText: outgoingText, directlyAddressed: isDirectTarget }), id: Date.now() + Math.random(), ts: Date.now() };
        const replyFlags = dialoguePatternFlags(charMsg.text);
        replyFlags.forEach(f => sharedMoveLog.usedMoves.add(f));
        if (/\?$/.test((charMsg.text || '').trim())) sharedMoveLog.usedShapes.add('question');
        if (/@\w+/.test(charMsg.text || '')) sharedMoveLog.usedShapes.add('direct-tag');
        if (/^[A-Za-z]+[.!]$/.test((charMsg.text || '').trim())) sharedMoveLog.usedShapes.add('clipped-verdict');
        updatedMsgs = [...updatedMsgs, charMsg];
        setMsgs([...updatedMsgs]);
        setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: [...updatedMsgs]} : g));
        await new Promise(r => setTimeout(r, 800 + Math.random()*1200));
      } catch(e) {}
    }
    setLoading(false);
  }

  const getChar = id => id === 'player' ? player : allChars.find(c => c.id === id);

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg}}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
          <div style={{display:'flex', marginRight:8}}>
            {members.slice(0,3).map((m,i) => <div key={m.id} style={{marginLeft: i>0?-10:0, zIndex:3-i}}><Avatar char={m} size={32}/></div>)}
          </div>
          <div>
            <div style={{color:C.text, fontWeight:700, fontSize:15}}>{group.name}</div>
            <div style={{color:C.muted, fontSize:12}}>{members.map(m=>m.name.split(' ')[0]).join(', ')}</div>
          </div>
        </div>
      </div>
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8}}>
        {msgs.map(m => {
          const sender = getChar(m.charId || (m.role === 'user' ? 'player' : null));
          const isMe = m.role === 'user';
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={sender} size={26}/>}
              <div style={{maxWidth:'78%'}}>
                {!isMe && <div style={{color:C.muted, fontSize:11, marginBottom:3, paddingLeft:4}}>{sender?.name?.split(' ')[0]}</div>}
                <div style={{
                  padding:'9px 13px', borderRadius: isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',
                  background: isMe ? C.blue : C.card2, color:'#fff', fontSize:13, lineHeight:1.5,
                }}>{renderLinkedText(m.text, allChars)}</div>
              </div>
            </div>
          );
        })}
        {loading && <div style={{color:C.muted, fontSize:13, paddingLeft:8}}>Someone is typing...</div>}
      </div>
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder="Message the group..."
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim()||loading} style={{
          background:input.trim()?C.blue:C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor:input.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>
  );
}

function ComposeModal({ chars, player, onClose, onPost }) {

    const file = e.target.files[0];

    setPhoto(dataUrl);
    e.target.value = '';

  function submit() {

          borderRadius:12, padding:'8px 14px', minHeight:36, fontSize:14, fontWeight:800, cursor:(text.trim()||photo)?'pointer':'default',

              <button key={c.id} onClick={() => setSelectedChar(c)} style={{
                display:'flex', alignItems:'center', gap:6, background: selectedChar.id === c.id ? C.blue+'22' : C.card2,
                border:`1.5px solid ${selectedChar.id === c.id ? C.blue : C.border}`,

              </button>
            ))}
          </div>
        </div>

        <div style={{display:'flex', gap:12, flex:1, minHeight:0}}>
          <Avatar char={selectedChar} size={38} />

function EventModal({ event, chars, player, feed, eventLog = [], dms = {}, groupChats = [], onClose, onSubmit, onLog, onSocialPresenceGain }) {
  const [input, setInput] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const draftEvent = !event?.scenario || event?.draft;
  const [currentEvent, setCurrentEvent] = useState(draftEvent ? null : event);
  const [xp, setXp] = useState(() => rollEventXp(event?.xp || [80, 200]));
  const [customOpen, setCustomOpen] = useState(true);
  const [customScenario, setCustomScenario] = useState(draftEvent ? '' : (event?.scenario || ''));
  const [customType, setCustomType] = useState(event?.type || 'gossip');
  const [customChars, setCustomChars] = useState(Array.isArray(event?.chars) ? event.chars : []);
  const [customVisibility, setCustomVisibility] = useState(event?.privateIntel || event?.visibility === 'private_intel' ? 'private_intel' : 'public');
  const [submittedEvent, setSubmittedEvent] = useState(null);
  const currentEventCharIds = Array.isArray(currentEvent?.chars) ? currentEvent.chars : [];
  const involved = chars.filter(c => currentEventCharIds.includes(c.id));

  useEffect(() => {
    setXp(rollEventXp(currentEvent?.xp || [80, 200]));
  }, [currentEvent?.id]);

  function selectEvent(nextEvent) {
    if (!nextEvent) return;
    setCurrentEvent(nextEvent);
    setInput('');
    setResult(null);
    setSubmittedEvent(null);
    setCustomOpen(false);
  }

  function applyCustomEvent() {
    if (!customScenario.trim()) return;
    const inferredChars = mentionedCharactersInText(customScenario, chars).map(c => c.id);
    const selectedChars = (customChars.length ? customChars : inferredChars).slice(0, 3);
    selectEvent({
      id: `custom-${Date.now()}`,
      type: customType,
      scenario: customScenario.trim(),
      chars: selectedChars,
      xp: EVENT_XP_DEFAULTS[customType] || [80, 200],
      visibility: customVisibility,
      privateIntel: customVisibility === 'private_intel',
      custom: true,
      canon: true,
    });
  }

  async function handleSubmit(actionOverride = null) {
    const actionText = typeof actionOverride === 'string' ? actionOverride.trim() : input.trim();
    const isDoingNothing = actionText === 'Do nothing.';
    if (!currentEvent?.scenario || !actionText || loading) return;
    setLoading(true);
    try {
      const charDescs = involved.map(c => `${identityFactsFor(c)}. Voice cues: ${c.personality}. ${c.description}`).join('\n');
      const recentFeedContext = feed ? [...feed].slice(0,8).map(p => {
        const poster = [...(chars||[]), player].find(c=>c.id===p.charId);
        return `@${poster?.handle||p.charId}: "${p.text}"`;
      }).join('\n') : '';
      const privateIntelMode = currentEvent.privateIntel || currentEvent.visibility === 'private_intel';
      const visibilityInstruction = privateIntelMode
        ? `PRIVATE INTEL MODE: The involved characters learn this as intel: something they witnessed, overheard, inferred, were tipped about, or heard in whispers. Do not frame it as ${player.name} telling them unless the player's action explicitly says she does. Do not make them wait for ${player.name} to explain or respond. Do not narrate a public timeline blow-up unless the player's action explicitly makes it public. Show private consequences, leverage, tension, a self-directed reaction, or the involved character deciding what to do next.`
        : `PUBLIC EVENT MODE: Make it feel like something that would blow up on social media.`;
      const actionInstruction = isDoingNothing
        ? `${player.name} explicitly chooses to do nothing: she does not post, reply, intervene, explain, chase, confess, deny, or make a move. Resolve what happens because she stays silent/absent/passive, and let other people fill the space if that fits. Do not secretly turn this into her taking action.`
        : '';
      const response = await window.claude.complete({
        messages: [{
          role:'user',
          content: `Narrate a social media event like a dramatic story beat.

CHARACTERS INVOLVED:
${charDescs}

PLAYER: ${player.name} (@${player.handle}) — ${player.personality}

${pronounRule([player, ...involved])}
Treat house/team/player status like fixed identity. Do not write non-players as Quidditch players. Do not invent game attendance, wins, dodging, fouls, or match results unless the event explicitly says so.

RECENT FEED CONTEXT:
${recentFeedContext}

EVENT: "${currentEvent.scenario}"
PLAYER'S ACTION: "${actionText}"
${visibilityInstruction}
${actionInstruction}

Write a punchy 2-3 sentence outcome. Be dramatic, entertaining, and true to each character's personality. Reference @handles only if that makes sense for the visibility mode. Use the pronouns and identities listed above exactly. Show consequences. Plain prose only — no headers, no bullet points, no markdown formatting. Do not explain rules or prompts.`
        }]
      });
      const cleaned = response
        .replace(/^#+\s+.*/gm, '')       // strip # headers
        .replace(/\*\*(.*?)\*\*/g, '$1') // strip bold
        .replace(/\*(.*?)\*/g, '$1')     // strip italic
        .replace(/_{1,2}(.*?)_{1,2}/g, '$1')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      setResult(cleaned);
      setSubmittedEvent({
        ...currentEvent,
        playerAction: actionText,
        outcome: cleaned,
        visibility: privateIntelMode ? 'private_intel' : 'public',
        privateIntel: privateIntelMode,
        custom: true,
        canon: true,
        submittedAt: Date.now(),
      });
      // Generate score changes
      const followerGain = Math.floor(xp * (1800 + Math.random() * 1200));
      const statGain = +(Math.random() * 0.3 + 0.1).toFixed(2);
      const evType = currentEvent.type || 'gossip';
      const socialGain = {
        humor: +(statGain * (evType === 'tag' ? 1.2 : evType === 'opportunity' ? 0.9 : 1)).toFixed(2),
        aura: +(statGain * (evType === 'opportunity' ? 1.3 : 0.8)).toFixed(2),
        drama: +(statGain * (evType === 'scandal' ? 1.6 : evType === 'gossip' ? 1.2 : 0.7)).toFixed(2),
      };
      const scoreChanges = [
        { icon:'✨', label:'Experience', value: xp, unit:'', flavor: evType === 'scandal' ? 'Chaos is a ladder, apparently.' : evType === 'tag' ? 'You answered the call.' : evType === 'opportunity' ? 'The window was open. You flew through it.' : 'Drama points well spent.' },
        { icon:'👥', label:'Followers', value: `+${(followerGain >= 1000 ? (followerGain/1000).toFixed(0)+'K' : followerGain)}`, unit:'', flavor: evType === 'scandal' ? 'Everyone loves a scandal.' : 'Word travels fast on campus.' },
        { icon:'😂', label:'Humor', value: `+${socialGain.humor}`, unit:'%', flavor: 'Your wit is showing.' },
        { icon:'⭐', label:'Aura', value: `+${socialGain.aura}`, unit:'%', flavor: 'Presence confirmed.' },
        { icon:'🔥', label:'Drama', value: `+${socialGain.drama}`, unit:'%', flavor: evType === 'scandal' ? 'Mess travels beautifully.' : 'The timeline noticed.' },
        ...currentEventCharIds.map(cid => {
          const delta = +(Math.random() * 1.2 - 0.3).toFixed(2);
          const flavorMap = { scandal: delta > 0 ? 'Impressed by the chaos.' : 'Not thrilled about this.', gossip: 'Taking notes.', tag: delta > 0 ? 'Appreciated the response.' : 'Was not expecting that.', opportunity: delta > 0 ? 'Respects the move.' : 'Saw what you did there.' };
          return { avatar: cid, label: `@${cid}`, value: delta, unit:'%', flavor: flavorMap[evType] || 'Watching closely.' };
        }),
      ];
      onSocialPresenceGain && onSocialPresenceGain(socialGain);
      onLog && onLog({
        type: 'event',
        visibility: privateIntelMode ? 'private_intel' : 'public',
        eventType: evType,
        scenario: currentEvent.scenario,
        action: actionText,
        outcome: cleaned,
        chars: currentEventCharIds,
        participants: ['player', ...currentEventCharIds],
        privateIntel: privateIntelMode,
        custom: true,
        canon: true,
        xp,
        scoreChanges,
        timestamp: Date.now(),
      });
    } catch(e) {
      setResult('The drama unfolds... and everyone is watching.');
    }
    setLoading(false);
  }

  function finishEvent() {
    onSubmit && onSubmit(submittedEvent || currentEvent);
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', zIndex:100, background:C.bg}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10, flexShrink:0}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, width:34, height:34, cursor:'pointer', fontSize:24, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>‹</button>
        <div style={{flex:1, minWidth:0}}>
          <div style={{color:C.text, fontSize:18, fontWeight:800, lineHeight:1.1}}>Event</div>
          <div style={{color:C.muted, fontSize:12, marginTop:2}}>Custom canon event</div>
        </div>
      </div>

      <div style={{flex:1, overflowY:'auto', padding:'16px 16px 20px'}}>
        {!result ? (
          <>
            {/* Type badge + involved chars */}
            {currentEvent?.scenario && <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:16, padding:16, marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>

                </div>
              );})()}
              <div style={{display:'flex', gap:-6, marginLeft:'auto'}}>
                {involved.map((c,i) => <div key={c.id} style={{marginLeft: i>0 ? -8 : 0}}><Avatar char={c} size={26}/></div>)}
              </div>
              </div>
              <p style={{color:C.text, fontSize:16, lineHeight:1.62, fontWeight:550}}>{currentEvent.scenario}</p>
            </div>}

            {/* XP + custom row */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:16}}>
              <button onClick={() => setCustomOpen(o => !o)} style={{background: customOpen || currentEvent?.custom ? `${C.blue}18` : C.card2, color: customOpen || currentEvent?.custom ? C.blue : C.text, border:`1px solid ${customOpen || currentEvent?.custom ? C.blue : C.border}`, borderRadius:10, padding:'0 12px', minHeight:36, fontSize:13, fontWeight:700, cursor:'pointer', flexShrink:0}}>
                {customOpen ? 'Hide Custom' : currentEvent?.scenario ? 'Edit Custom' : 'Custom'}
              </button>
              <div style={{flex:1, background:C.card2, borderRadius:10, padding:'8px 12px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                <span style={{color:C.muted, fontSize:12}}>XP reward</span>
                <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>+{currentEvent?.xp?.[0] || 80}–{currentEvent?.xp?.[1] || 180} ✦</span>
              </div>
            </div>

            {(customOpen || !currentEvent?.scenario) && (
              <div style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:14, padding:12, marginBottom:16}}>
                <label style={{color:C.muted, fontSize:12, marginBottom:6, display:'block'}}>CUSTOM EVENT</label>
                <textarea
                  value={customScenario}
                  onChange={e => setCustomScenario(e.target.value)}
                  placeholder="GMZ posts that a new Slytherin transfer was seen at the pitch before official tryouts..."
                  style={{width:'100%', background:C.bg, border:`1px solid ${C.border}`, borderRadius:12, padding:'10px 12px', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:84, lineHeight:1.5, marginBottom:10}}
                />
                <div style={{display:'flex', gap:8, overflowX:'auto', marginBottom:10}}>
                  {Object.entries(EVENT_TYPES).map(([id,t]) => (
                    <button key={id} onClick={() => setCustomType(id)} style={{
                      background: customType === id ? `${t.color}20` : C.bg,
                      color: customType === id ? t.color : C.muted,
                      border:`1px solid ${customType === id ? t.color : C.border}`,
                      borderRadius:18, padding:'7px 10px', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap',
                    }}>{t.emoji} {t.label}</button>
                  ))}
                </div>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10}}>
                  {[
                    { id:'public', label:'Public canon', desc:'Timeline reacts' },
                    { id:'private_intel', label:'Private intel', desc:'Only selected know' },
                  ].map(opt => {
                    const active = customVisibility === opt.id;
                    return (
                      <button key={opt.id} onClick={() => setCustomVisibility(opt.id)} style={{
                        background: active ? `${C.blue}18` : C.bg,
                        border:`1px solid ${active ? C.blue : C.border}`,
                        borderRadius:12,
                        padding:'9px 10px',
                        cursor:'pointer',
                        textAlign:'left',
                      }}>
                        <div style={{color: active ? C.blue : C.text, fontSize:12, fontWeight:800}}>{opt.label}</div>
                        <div style={{color:C.muted, fontSize:11, marginTop:2}}>{opt.desc}</div>
                      </button>
                    );
                  })}
                </div>
                <p style={{color:C.muted, fontSize:12, marginBottom:8}}>Involved characters</p>
                <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4, marginBottom:12}}>
                  {chars.map(c => {
                    const active = customChars.includes(c.id);
                    return (
                      <button key={c.id} onClick={() => setCustomChars(ids => active ? ids.filter(id => id !== c.id) : [...ids, c.id])} style={{
                        display:'flex', alignItems:'center', gap:6, background: active ? C.blue+'22' : C.bg,
                        border:`1px solid ${active ? C.blue : C.border}`, borderRadius:18, padding:'6px 10px', cursor:'pointer', flexShrink:0,
                      }}>
                        <Avatar char={c} size={20}/>
                        <span style={{color: active ? C.blue : C.text, fontSize:12, fontWeight:700}}>{c.name.split(' ')[0]}</span>
                      </button>
                    );
                  })}
                </div>
                <button onClick={applyCustomEvent} disabled={!customScenario.trim()} style={{
                  width:'100%', background: customScenario.trim() ? C.blue : C.bg, color: customScenario.trim() ? '#fff' : C.muted,
                  border:'none', borderRadius:12, padding:'11px', fontSize:14, fontWeight:800, cursor:customScenario.trim() ? 'pointer' : 'default',
                }}>{currentEvent?.scenario ? 'Update Custom Event' : 'Use Custom Event'}</button>
              </div>
            )}

            {currentEvent?.scenario && <>
              {/* Input */}
              <textarea value={input} onChange={e => setInput(e.target.value)}
                placeholder="What do you do?"
                style={{width:'100%', background:C.card2, border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`, borderRadius:14, padding:'12px 14px', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:100, marginBottom:14, transition:'border-color 0.2s'}}
              />

              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                <button onClick={() => handleSubmit('Do nothing.')} disabled={loading} style={{
                  width:'100%', background:C.card2, color:C.text,
                  border:`1px solid ${C.border}`, borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
                  cursor: loading ? 'default' : 'pointer', transition:'background 0.2s, color 0.2s',
                }}>{loading ? 'Playing out…' : 'Do Nothing'}</button>
                <button onClick={() => handleSubmit()} disabled={!input.trim() || loading} style={{
                  width:'100%', background: input.trim() ? C.text : C.card2, color: input.trim() ? C.bg : C.muted,
                  border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
                  cursor: input.trim() ? 'pointer' : 'default', transition:'background 0.2s, color 0.2s',
                }}>{loading ? 'Playing out…' : 'Submit'}</button>
              </div>
            </>}
          </>
        ) : (
          <div>
            {/* Outcome header */}
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700}}>OUTCOME</span>
                </div>
              );})()}
            </div>

            {/* Quoted action */}
            <div style={{borderLeft:`3px solid ${C.border}`, paddingLeft:12, marginBottom:14}}>
              <p style={{color:C.muted, fontSize:12, marginBottom:4}}>YOUR MOVE</p>
              <p style={{color:C.text, fontSize:14, lineHeight:1.5, fontStyle:'italic'}}>"{submittedEvent?.playerAction || input}"</p>
            </div>

            <div style={{background:C.card2, borderRadius:14, padding:'14px', marginBottom:14}}>
              <p style={{color:C.text, fontSize:14, lineHeight:1.75}}>{result}</p>
            </div>

            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:`${C.yellow}12`, border:`1px solid ${C.yellow}33`, borderRadius:12, padding:'12px 16px', marginBottom:18}}>
              <span style={{color:C.muted, fontSize:13}}>XP earned</span>
              <span style={{color:C.yellow, fontWeight:700, fontSize:16}}>+{xp} ✦</span>
            </div>

            <button onClick={finishEvent} style={{width:'100%', background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>Back to Feed</button>
          </div>
        )}
      </div>
    </div>
  );
}

function LogScoreRow({ ch, allChars }) {
  const isNumeric = typeof ch.value === 'number';
  const positive = isNumeric ? ch.value > 0 : String(ch.value).startsWith('+');
  const color = positive ? C.green : C.red;
  const displayVal = isNumeric
    ? `${ch.value > 0 ? '+':''}${ch.value}${ch.unit||''}`
    : `${ch.value}${ch.unit||''}`;
  const relChar = ch.avatar ? allChars.find(c => c.id === ch.avatar) : null;
  return (
    <div style={{paddingBottom:12, marginBottom:12, borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        {relChar
          ? <Avatar char={relChar} size={24}/>
          : <span style={{fontSize:18, width:24, textAlign:'center'}}>{ch.icon}</span>
        }
        <span style={{color:C.text, fontWeight:700, fontSize:14, flex:1}}>
          {relChar ? (ch.label || `@${relChar.handle}`) : ch.label}
        </span>
        <span style={{color, fontWeight:800, fontSize:15}}>{displayVal}</span>
      </div>
      {ch.flavor && <p style={{color:C.muted, fontSize:12, marginTop:4, marginLeft:32, lineHeight:1.4}}>{ch.flavor}</p>}
    </div>
  );
}

  const evType     = entry.eventType || entry.type;

  const headerMap = {
    reply:     { color:C.blue,   emoji:'💬', label:'You replied:' },

    milestone: { color:C.green,  emoji:'🏆', label:'Milestone completed:' },

  const char = allChars.find(c => c.id === entry.charId);
  const outCollapsed   = collapsed[outcomeKey] ?? false;

  return (
    <div style={{marginBottom:16}}>
      <div style={{background:`${header.color}10`, border:`1px solid ${header.color}30`, borderRadius:16, padding:'14px 16px', marginBottom:6}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:10}}>
          <span style={{fontSize:15}}>{header.emoji}</span>
          <span style={{color:header.color, fontWeight:700, fontSize:13}}>{header.label.toUpperCase()}</span>
        </div>
        {entry.type === 'event' && <>
          <p style={{color:C.muted, fontSize:12, lineHeight:1.4, marginBottom:10}}>{entry.scenario}</p>
          <div style={{borderLeft:`2px solid ${header.color}60`, paddingLeft:10}}>
            <p style={{color:C.text, fontSize:14, lineHeight:1.55, fontStyle:'italic'}}>"{entry.action}"</p>

              <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
                <Verified/>
                <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
              </div>
              <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{entry.text}</p>
            </div>
          </div>
        )}
        {entry.type === 'dm' && char && (
          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            <Avatar char={char} size={32}/>
            <div style={{flex:1}}>
              <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
              <p style={{color:C.muted, fontSize:12, marginTop:2}}>{(entry.text||'').slice(0,80)}…</p>
            </div>
          </div>
        )}
        {entry.type === 'milestone' && (
          <p style={{color:C.text, fontSize:14, lineHeight:1.6, fontWeight:500}}>{entry.text}</p>
        )}
      </div>

      {entry.outcome && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px', marginBottom:6}}>
          <button onClick={() => toggle(outcomeKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: outCollapsed ? 0 : 10}}>
            <span style={{color:C.blue, fontWeight:700, fontSize:13}}>Outcome</span>
            <span style={{color:C.muted, fontSize:12}}>{outCollapsed ? '▼' : '▲'}</span>
          </button>
          {!outCollapsed && <p style={{color:C.text, fontSize:13, lineHeight:1.75}}>{entry.outcome}</p>}
        </div>
      )}

      {entry.scoreChanges?.length > 0 && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px'}}>
          <button onClick={() => toggle(scoreKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: scoreCollapsed ? 0 : 14}}>
            <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>Score Changes</span>
            <span style={{color:C.muted, fontSize:12}}>{scoreCollapsed ? '▼' : '▲'}</span>
          </button>
          {!scoreCollapsed && (
            <div>
              {entry.scoreChanges.map((ch, i) => (
                <LogScoreRow key={i} ch={ch} allChars={allChars}/>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
