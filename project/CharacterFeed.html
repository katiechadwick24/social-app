  // Wire up window.claude to the local server proxy
  window.claude = {
    complete: async function({ messages }) {
      const res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Claude API call failed');
      }
      const data = await res.json();
      return data.text;
    }
  };
</script>

const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": true,
  "accentColor": "#4dabf7",
  "fontSize": 14,
  "compactFeed": false
}/*EDITMODE-END*/;

const SESSION_FALLBACK_TRACKER = {};

function trackFallback(charId, text) {
  if (!charId || !text) return;
  if (!SESSION_FALLBACK_TRACKER[charId]) SESSION_FALLBACK_TRACKER[charId] = new Set();
  SESSION_FALLBACK_TRACKER[charId].add(String(text).trim().toLowerCase().slice(0, 60));
}

function fallbackWasUsed(charId, text) {
  if (!charId || !text) return false;
  return (SESSION_FALLBACK_TRACKER[charId] || new Set())
    .has(String(text).trim().toLowerCase().slice(0, 60));
}

function bottomSafe(extra = 0) {
  return `calc(env(safe-area-inset-bottom, 0px) + ${extra}px)`;
}

// ─── Theme builder ────────────────────────────────────────────────
function buildTheme(tweaks) {
  const dark = tweaks.darkMode;
  return {
    bg:    dark ? '#111'     : '#f5f5f0',
    card:  dark ? '#1c1c1c'  : '#ffffff',
    card2: dark ? '#252525'  : '#eeede8',
    border:dark ? '#2a2a2a'  : '#ddddd8',
    text:  dark ? '#f0f0f0'  : '#111111',
    muted: dark ? '#777'     : '#888',
    blue:  tweaks.accentColor,
    purple:'#9d5cff',
    green: '#22c55e',
    orange:'#f97316',
    yellow:'#f5c842',
    red:   '#ef4444',
    isDark: dark,
  };
}

// C is set globally and updated when tweaks change
let C = buildTheme(TWEAK_DEFAULTS);

function tweakFont(base, tweaks = {}) {
  const selected = clamp(Number(tweaks.fontSize ?? 14), 12, 18);
  return Math.max(10, base + selected - 14);
}

// ─── House ring colors ────────────────────────────────────────────
const HOUSE_COLORS = {
  gryffindor: '#c41e3a',
  slytherin:  '#2a8a4a',
  ravenclaw:  '#4169c8',
  hufflepuff: '#f0c75e',
};
function getHouseColor(char) {
  if (!char) return null;
  if (char.house && HOUSE_COLORS[char.house]) return HOUSE_COLORS[char.house];
  // Legacy fallback: scan bio/description
  const text = ((char.bio || '') + ' ' + (char.description || '')).toLowerCase();
  if (text.includes('slytherin'))  return HOUSE_COLORS.slytherin;
  if (text.includes('gryffindor')) return HOUSE_COLORS.gryffindor;
  if (text.includes('ravenclaw'))  return HOUSE_COLORS.ravenclaw;
  if (text.includes('hufflepuff')) return HOUSE_COLORS.hufflepuff;
  return null;
}

// ─── Avatar component ─────────────────────────────────────────────
const AVATAR_COLORS = [
  ['#1a1a2e','#4dabf7'], ['#1a2e1a','#22c55e'], ['#2e1a1a','#ef4444'],
  ['#2a1a2e','#9d5cff'], ['#2e2a1a','#f5c842'], ['#1a2e2a','#22c55e'],
  ['#2e1a2a','#f97316'], ['#1a1a1a','#fff'],
];
function getAvatarColors(id) {
  const i = (id || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % AVATAR_COLORS.length;
  return AVATAR_COLORS[i];
}
function Avatar({ char, size = 42, onClick }) {
  const [bg, fg] = getAvatarColors(char?.id);
  const initials = (char?.name || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const houseColor = getHouseColor(char);
  const ringWidth = Math.max(1, size * 0.022);
  const ringGap = Math.max(0.5, size * 0.015);
  const profilePhoto = char?.profilePhoto || char?.avatar || char?.photo;
  return (
    <div onClick={onClick} style={{
      width: size, height: size, borderRadius: '50%', flexShrink: 0, cursor: onClick ? 'pointer' : 'default',
      padding: houseColor ? ringWidth + ringGap : 0,
      background: houseColor || 'transparent',
      boxSizing: 'border-box',
    }}>
      <div style={{
        width: '100%', height: '100%', borderRadius: '50%', background: bg, overflow:'hidden',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: (size - (houseColor ? (ringWidth + ringGap) * 2 : 0)) * 0.36,
        fontWeight: 700, color: fg,
      }}>
        {profilePhoto
          ? <img src={profilePhoto} alt="" style={{width:'100%', height:'100%', objectFit:'cover', display:'block'}} />
          : initials}
      </div>
    </div>
  );
}

// ─── Verified / Quidditch badge ──────────────────────────────────
function isQuidditchPlayer(char) {
  if (!char) return false;
  if (['tamsin', 'theo', 'elara', '__gmz__'].includes(char.id)) return false;
  const role = (char.position || char.bio || '').toLowerCase();
  if (/former|commentator|student|sister|alumna/.test(role)) return false;
  if (/(beater|chaser|keeper|seeker|captain|reserve)/.test(role)) return true;
  const text = ((char.bio||'') + ' ' + (char.description||'')).toLowerCase();
  return /(chaser trialist|trying out as a chaser|quidditch captain)/.test(text);
}
function CharBadge({ char }) {
  if (!char) return null;
  if (isQuidditchPlayer(char)) return <span style={{fontSize:13, lineHeight:1}}>🧹</span>;
  if ((char.followers||0) >= 1000000) return <svg width="14" height="14" viewBox="0 0 24 24" fill={C.blue} style={{flexShrink:0}}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>;
  return null;
}

function Verified() {
  return <svg width="14" height="14" viewBox="0 0 24 24" fill={C.blue} style={{flexShrink:0}}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>;
}

// ─── Number formatter ─────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

function playerReplyLikes(nested = true) {
  const min = nested ? 900 : 1800;
  const max = nested ? 14000 : 32000;
  const viralBump = Math.random() < 0.12 ? 18000 + Math.random() * 42000 : 0;
  return Math.floor(min + Math.random() * (max - min) + viralBump);
}

function findCharByHandle(handle, allChars = []) {
  const clean = (handle || '').replace('@','').toLowerCase();
  return allChars.find(c => (c.handle || '').toLowerCase() === clean);
}

function renderLinkedText(text = '', allChars = [], onCharClick) {
  return text.split(/(@\w+)/g).map((part, i) => {
    if (!part.startsWith('@')) return part;
    const mentioned = findCharByHandle(part, allChars);
    return (
      <span
        key={i}
        onClick={e => {
          if (!mentioned || !onCharClick) return;
          e.stopPropagation();
          onCharClick(mentioned);
        }}
        style={{color:C.blue, cursor: mentioned && onCharClick ? 'pointer' : 'default', fontWeight:500}}
      >
        {part}
      </span>
    );
  });
}

function getMentionQuery(text = '') {
  const match = String(text).match(/(^|\s)@([a-z0-9_]*)$/i);
  return match ? match[2].toLowerCase() : null;
}

function applyMentionToText(text = '', handle = '') {
  const cleanHandle = String(handle).replace(/^@/, '');
  return String(text).replace(/(^|\s)@([a-z0-9_]*)$/i, `$1@${cleanHandle} `);
}

function MentionSuggestions({ text, allChars = [], onPick }) {
  const query = getMentionQuery(text);
  if (query === null) return null;
  const matches = allChars
    .filter(c => c?.handle && c.handle.toLowerCase().startsWith(query))
    .slice(0, 5);
  if (!matches.length) return null;

  return (
    <div style={{
      marginTop:8,
      background:C.card,
      border:`1px solid ${C.border}`,
      borderRadius:14,
      overflow:'hidden',
      boxShadow:'0 12px 30px rgba(0,0,0,0.32)',
    }}>
      {matches.map(c => (
        <button
          key={c.id}
          type="button"
          onMouseDown={e => e.preventDefault()}
          onClick={() => onPick(c.handle)}
          style={{
            width:'100%',
            display:'flex',
            alignItems:'center',
            gap:9,
            background:'none',
            border:'none',
            borderBottom:`1px solid ${C.border}`,
            padding:'9px 10px',
            color:C.text,
            textAlign:'left',
            cursor:'pointer',
          }}
        >
          <Avatar char={c} size={30} />
          <span style={{fontWeight:700, fontSize:14}}>{c.name}</span>
          <span style={{color:C.muted, fontSize:13}}>@{c.handle}</span>
        </button>
      ))}
    </div>
  );
}

const DEFAULT_PRONOUNS_BY_ID = {
  player:'she/her',
  havoc:'he/him',
  silas:'he/him',
  callum:'he/him',
  briar:'she/her',
  rowan:'he/him',
  milo:'he/him',
  elara:'she/her',
  theo:'he/him',
  jude:'he/him',
  tamsin:'she/her',
  __gmz__:'they/them',
};

const DEFAULT_HOUSE_BY_ID = {
  player:'Slytherin',
  havoc:'Gryffindor',
  silas:'Slytherin',
  callum:'Gryffindor',
  briar:'Gryffindor',
  rowan:'Gryffindor',
  milo:'Gryffindor',
  elara:'Gryffindor',
  theo:'Gryffindor',
  jude:'Slytherin',
  tamsin:'Ravenclaw',
};

function pronounsFor(char) {
  return (char?.pronouns || DEFAULT_PRONOUNS_BY_ID[char?.id] || 'they/them').trim();
}

function houseFor(char) {
  const raw = char?.house || DEFAULT_HOUSE_BY_ID[char?.id] || '';
  return raw ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
}

function teamFor(char) {
  if (!isQuidditchPlayer(char)) return '';
  const raw = char?.team || houseFor(char) || '';
  return raw ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
}

function identityFactsFor(char) {
  if (!char) return '';
  const house = houseFor(char) || 'unknown house';
  const pronouns = pronounsFor(char);
  if (isQuidditchPlayer(char)) {
    const team = teamFor(char) || house;
    const position = char.position || 'player';
    return `${char.name} (@${char.handle}): pronouns ${pronouns}; house ${house}; ${team} Quidditch ${position}; insider language for ${team}: we/us/our`;
  }
  const role = char.position ? `; role ${char.position}` : '';
  return `${char.name} (@${char.handle}): pronouns ${pronouns}; house ${house}; NOT on a Quidditch team${role}; can comment as an observer, not as a player`;
}

function identityPromptFor(char) {
  return `Locked identity for this speaker: ${identityFactsFor(char)}. Treat house/team like pronouns. Do not make this speaker talk about their own house or team like outsiders. If they are not on a Quidditch team, do not write them as a player. In social posts/replies, this speaker is "I/me/my/we/our", never their own name, handle, or third-person pronouns.`;
}

function pronounRoster(chars = []) {
  return chars
    .filter(Boolean)
    .map(c => `${c.name} (@${c.handle}): ${pronounsFor(c)}`)
    .join('; ');
}

function houseRoster(chars = []) {
  return chars
    .filter(Boolean)
    .map(c => identityFactsFor(c))
    .join('; ');
}

function pronounRule(chars = []) {
  return `IDENTITY RULE: These facts are locked. Use the exact pronouns, house, team, and player/non-player status below. Do not infer identity from names, vibes, colors, avatars, rivalry, or usernames. Pronouns: ${pronounRoster(chars)}. Houses/teams: ${houseRoster(chars)}. House/team logic works like pronouns: exact and sticky. If someone belongs to a house/team, they can roast it as their own mess, but should use insider language like we/us/our/my team/my house unless clearly joking or quoting. If someone is NOT on a Quidditch team, never imply they play, practice, show up on the pitch, need to prove themselves on the pitch, or have teammates in a Quidditch sense. Direct replies should still use natural first- and second-person language like I, me, my, you, your, and we. In social posts/replies, a speaker must not post about themself in third person: if Callum writes, use "i/my", not "Callum/he/his"; if Havoc writes, use "i/my", not "Havoc/he/his". If a character is mentioned by @handle or name, keep their pronouns and house/team consistent. Never say a house "could never" do something if a member of that house just did it in the visible thread.`;
}

function compressImageFile(file, { maxSize = 720, quality = 0.78, square = false } = {}) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sourceSize = square ? Math.min(img.width, img.height) : Math.max(img.width, img.height);
        const scale = Math.min(1, maxSize / sourceSize);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((square ? sourceSize : img.width) * scale));
        canvas.height = Math.max(1, Math.round((square ? sourceSize : img.height) * scale));
        const ctx = canvas.getContext('2d');
        if (square) {
          const sx = Math.max(0, (img.width - sourceSize) / 2);
          const sy = Math.max(0, (img.height - sourceSize) / 2);
          ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

function ReplyGlyph({ size = 16 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10 8.5 5.5 13 10 17.5"/>
      <path d="M6 13h8.5c2.8 0 4.5 1.6 4.5 4.2v1.3"/>
    </svg>
  );
}

// ─── Global dialogue rules ────────────────────────────────────────────
const BANNED_PHRASES_RULE = `
BANNED WORDS - do not use these in dialogue under any circumstance, no exceptions:
"darling", "sweetheart", "love" (as a pet name), "dear", "hun", "honey", "babe" (as a pet name).
These feel forced and AI-generated. Use the person's name, handle, or no address at all. Real people don't constantly call each other pet names.

STYLE RULES:
- Do not use em dashes or en dashes.
- Avoid run-on sentences and stacked clauses.
- Prefer one short sentence, or two very short sentences.
- Keep replies punchy, readable, and conversational.
- Do not use "mate" as a default address. It turns every character into the same voice. Use a handle, name, team role, or no address unless a profile explicitly makes that word natural.
- Avoid catchphrase replies that can be pasted anywhere: "I can make that worse", "that helped nobody. excellent.", "beautiful. no notes", "that's just called having standards", and similar label-punchlines.

SOCIAL APP FORMAT:
- This is a campus social app for college-aged students, not adult professionals and not chapter prose. They should sound like messy young people with phones, classes, crushes, grudges, group chats, bad judgment, and too much access to each other's lives.
- Preserve the form being generated: feed post, reply, quote-style callout, DM, group chat, or scene chat.
- Feed posts should feel typed into an app: casual, specific, current, and a little incomplete. No author narration, no explaining the whole context.
- Replies should react to the live post, tag, embarrassment, rumor, or relationship pressure. Do not turn replies into polished speeches.
- DMs can be more private, but still message-like: brief, evasive, direct, teasing, checking in, fishing, or pressing. No novel paragraphs unless the user pushes for depth.
- Group chats should overlap socially, but direct address still matters. If someone names a person or asks them a question, that person answers the literal premise first; others can pile on after. People may answer the wrong part, deflect, or make it worse only when the latest message is not a direct question to them. Everyone listed in the group chat is present and can read the message. Do not talk about a present member like they are absent; address them with @handle, "you", or "captain" if that fits.
- Quidditch is a public pressure system, not the whole world. Let posts also pull from classes, dorms, exes, siblings, parties, rumors, punishments, professors, injuries, money, reputation, and who was seen with whom.
- Use handles, screenshots, clips, visible likes, subtweets, quote-post energy, comment threads, edits, and GMZ gossip as story mechanics only when they are visible evidence or framed as uncertain rumor. Do not invent Keres liking, unliking, deleting, rewriting, screenshotting, or reposting something unless the user, current event, or visible app state explicitly says she did.
- Avoid vague "someone deleted a post / took something down / scrubbed the timeline / suspicious like" scenarios as drama engines. They are too ungrounded and should not become boosted campus events unless the user explicitly supplies the deleted content and why it matters.
- Make public vs private matter. A line on the feed should carry reputation risk; a DM can dodge, soften, threaten, flirt, or ask for the version nobody posted.

CANON AND FACT RULES:
- Do not invent backstory, past relationships, family history, private conversations, injuries, scandals, hookups, punishments, promises, secrets, locations, or off-screen events unless they are in the current prompt, character profile, relationship map, recent feed, DM history, group chat history, or user message.
- Do not write "remember when", "after what happened", "since that night", "your ex", "your brother/sister", "we both know", or similar history-claiming lines unless that exact history is already established in provided context.
- If a character would not know something, they cannot state it as fact. They may speculate, ask, misread, subtweet, gossip, or say "rumor is", but keep uncertainty visible.
- GMZ and gossip accounts can exaggerate public rumors, but they still cannot create hard canon. Frame unconfirmed claims as rumor, alleged sightings, sources, or timeline speculation.
- Prefer reacting to visible app evidence: the post text, tags, replies, likes, clips, screenshots, current relationship notes, and recent messages.
- Ambiguous feed language like "someone liked it", "someone deleted a post", or "someone screenshotted it" is not proof that Keres did it. Do not turn "someone" into Keres in DMs, replies, or follow-up posts unless she was explicitly named/tagged or the user says it was her.
- If Keres denies a concrete action or asks where the evidence is, accept that correction as the current DM reality. Do not repeat the invented accusation harder.
- Keres is not responsible for other people's attraction, thirst, jealousy, screenshots, replies, or audience reaction. Characters can tease the social effect around her, but do not scold her for "making" someone notice her, looking at her, liking her, or reacting to her unless she explicitly baited that exact move in visible context.
- Preserve visible thread chronology. The original post happened first, then replies happened in timestamp/order. Do not say Keres "started it", "swung first", "showed up swinging", or caused the fight if the visible thread shows another character attacked, tagged, or escalated before her. If Keres spells out the order of events, treat that as corrective context unless the responding character is deliberately lying or baiting, and make that intentional.
- If a character is named, tagged, or clearly included as one of the people in a rumor/callout, they must speak from inside that role. They should use I/me/we/us or address the other named person directly, not talk like an outside commentator saying "both of you", "you two", "the two of them", or "those two" unless they are genuinely not one of the named participants.
- Do not accuse someone of dodging, not showing up, refusing to play, missing a game, ducking a challenge, or failing the team unless the visible post/thread explicitly says that happened. If you need pressure without facts, use "say what you mean", "that sounded cleaner in your head", or a playful pointed question.
- Do not invent scoreboard results, game attendance, wins/losses, who showed up to matches, who missed practice, who dodged, who started a fight, or who made a mistake unless it appears in the visible thread or current event. Trash talk can be mean without inventing hard facts.
- Do not invent practice footage, clips, cameras, hallway versions, or "last week / last three weeks" history from a generic practice post. If a post says "practice went smoothly, bad news for Gryffindor", that means the poster's own side practiced well and is trash-talking the upcoming opponent.
- Slytherin Quidditch is a strong, dangerous, respected team. Do not invent canon that Slytherin is bad, taking losses, desperate, harmless, or embarrassing unless the visible match/event explicitly says so. Keres joining Slytherin should make them more alarming, not less.
- Silas Montague is a respected and feared Slytherin captain. Rivals can hate him, bait him, or talk big, but they should not treat him like a joke, a weak captain, or someone nobody worries about.
- Trash talk is normal Quidditch culture, not a social crime. Characters can insult rival houses, rival teams, plays, captains, training, habits, and public mistakes. Do not make them act shocked that someone talked trash unless the line crosses a real personal boundary.
- Preserve house and team logic. Treat house/team like pronouns: exact, sticky, and not guessable from vibes. If a character is on Gryffindor, Slytherin, Ravenclaw, or Hufflepuff, they should not talk about that house or team like outsiders. They can roast their own side, but it should sound like "we/us/our team/my captain/our mess", not "they/them/Gryffindor is boring" unless they are clearly quoting or distancing as a joke. Rival houses can and should use "they/them" and be openly smug. Do not write "Slytherin could never", "Gryffindor could never", etc. if someone from that house just did the thing in the visible thread.
- Teammate loyalty matters. If an outsider attacks, mocks, tags, or pressures someone's teammate or housemate, that team usually closes ranks first. They can roast their own teammate because that is their mess, but the public default is "that's our idiot", "you don't get to say it", backing them, redirecting heat, or hitting the outsider harder. Exceptions need a visible reason: betrayal, serious conflict, captain correction, or an obvious joke.
- Teams and houses are allowed to snipe at each other for fun. Treat rival-house trash talk as sport, flirting, boredom, or group entertainment unless it targets a real personal wound. Characters should not become defensive about taking shots at a rival team; they can enjoy it, add to it, or pivot to "our mess is funnier but theirs is easier."
- House is not the same as Quidditch team. Ravenclaw students are not automatically Ravenclaw Quidditch players. Tamsin Cade is Ravenclaw, but she is not on a Quidditch team; she can critique Quidditch as a sharp observer, sister, or student, not as someone who needs to "show up" on the pitch.
- When context is thin, stay broad, teasing, evasive, or ask one playful question instead of filling the gap with invented lore.

ANTI-AI PATTERNS:
- Do not make everyone sound like the same clever person.

function dialogueList(items = []) {
  return (items || []).filter(Boolean).join('; ');
}

function dialogueContractSummaryFor(char) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec) return 'use this character profile for motive, vocabulary, and what they would ignore';
  return `${spec.lane}. Moves: ${dialogueList(spec.moves)}. Shapes: ${dialogueList(spec.shapes)}. Avoid: ${dialogueList(spec.avoid)}`;
}

function dialogueContractFor(char, mode = 'public') {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec) {
    return `DIALOGUE CONTRACT: Use the profile for motive, vocabulary, and what this speaker ignores. In ${mode}, pick one immediate social move and one sentence shape before writing. Avoid generic snark and generic sincerity.`;
  }
  return `DIALOGUE CONTRACT: ${dialogueContractSummaryFor(char)}. In ${mode}, this contract is required voice control, not flavor text. Choose one move and one sentence shape that fit the live situation; do not use every cue at once. If the draft could be swapped with another character by changing only the name, rewrite it before output.`;
}

function multiSpeakerDialogueSeparationRule(chars = [], mode = 'public') {
  const constrained = (chars || []).filter(c => c && CHARACTER_DIALOGUE_CONSTRAINTS[c.id]);
  if (constrained.length < 2) return '';
  const hasRegressionSet = constrained.some(c => c.id === 'theo')
    && constrained.some(c => c.id === 'jude')
    && constrained.some(c => c.id === 'havoc');
  return `MULTI-SPEAKER DIALOGUE SEPARATION:
- Assign each speaker a different social move, sentence shape, and voice lane before writing.
- Do not let two replies use the same key verb, same setup/payoff shape, or same observer-recapping angle.
${hasRegressionSet ? '- Regression case: Theo, Jude, and Havoc must split cleanly. Theo uses media machinery. Jude uses low-effort dry damage. Havoc uses physical bad-idea escalation. They must not converge on the same caption/comeback pattern.' : '- If two lines could swap speakers and still work, rewrite the later line around that speaker\'s contract.'}
${constrained.map(c => `@${c.handle}: ${dialogueContractSummaryFor(c)}`).join('\n')}`;
}

function replaceDialoguePlaceholders(text = '', char = null, player = null) {
  const playerHandle = player?.handle ? `@${player.handle}` : (player?.name || 'you');
  const ownHandle = char?.handle ? `@${char.handle}` : (char?.name || 'i');
  return String(text || '').replace(/\{player\}/g, playerHandle).replace(/\{self\}/g, ownHandle);
}

function fallbackDialogueContractLine(char, player, avoidTexts = []) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  const pool = spec?.publicFallbacks || ['say that again, slower.', 'that is a choice.', 'interesting. inconveniently.'];
  const start = Math.floor(Math.random() * pool.length);
  for (let i = 0; i < pool.length; i++) {
    const candidate = replaceDialoguePlaceholders(pool[(start + i) % pool.length], char, player);
    if (!fallbackWasUsed(char?.id, candidate)
        && !violatesCharacterDialogueContract(candidate, char)
        && !hasDialoguePatternCollision(candidate, avoidTexts || [])) {
      trackFallback(char?.id, candidate);
      return candidate;
    }
  }
  const fallback = replaceDialoguePlaceholders(pool[start], char, player);
  trackFallback(char?.id, fallback);
  return fallback;
}

function violatesCharacterDialogueContract(text = '', char = null) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec || !text) return false;
  const clean = String(text || '').toLowerCase().replace(/[’]/g, "'");
  if (spec.reject && spec.reject.test(clean)) return true;
  return false;
}

function isHouseTeamCallout(text = '', char) {
  if (!char) return false;
  const lower = String(text || '').toLowerCase();
  const handle = (char.handle || '').toLowerCase();
  const house = (houseFor(char) || '').toLowerCase();
  const team = (teamFor(char) || '').toLowerCase();
  const addressed = handle && lower.includes(`@${handle}`);
  const secondPersonTeam = addressed && /\b(your|you lot|you all|half your|your whole)\s+(team|house|side|lot)\b/.test(lower);
  const namedGroup = [house, team].filter(Boolean).some(name => lower.includes(name));
  const attackWords = /\b(half|boring|basic|mess|imploding|wrong|poor|bad|disaster|trash|could never|cannot|can't|doesn't|don't|incompetent|grimacing|foreboding|fix|crack|ahead of|consistent)\b/.test(lower);
  return !!(secondPersonTeam || (namedGroup && attackWords));
}

function backsHouseTeam(text = '', char) {
  if (!char) return false;
  const lower = String(text || '').toLowerCase();
  const house = (houseFor(char) || '').toLowerCase();
  const team = (teamFor(char) || '').toLowerCase();
  const names = [house, team].filter(Boolean);
  if (!names.some(name => lower.includes(name))) return false;
  return /\b(we|our|us|right|exactly|back|backing|defend|illogical|talking back|not wrong|agree|said what|same team|my house|my team)\b/.test(lower);
}

function sameHouseOrTeam(a, b) {
  if (!a || !b || a.id === b.id) return false;
  const aHouse = (houseFor(a) || '').toLowerCase();
  const bHouse = (houseFor(b) || '').toLowerCase();
  const aTeam = (teamFor(a) || '').toLowerCase();
  const bTeam = (teamFor(b) || '').toLowerCase();
  return !!((aTeam && bTeam && aTeam === bTeam) || (aHouse && bHouse && aHouse === bHouse));
}

function characterMentionedInText(text = '', char) {
  if (!char) return false;
  const raw = String(text || '');
  const handle = (char.handle || '').toLowerCase();
  const name = (char.name || '').toLowerCase().trim();
  const firstName = name.split(/\s+/)[0] || '';
  if (handle && new RegExp(`@${escapeRegExp(handle)}\\b`, 'i').test(raw)) return true;
  if (name && new RegExp(`\\b${escapeRegExp(name)}\\b`, 'i').test(raw)) return true;
  return !!(firstName.length >= 4 && new RegExp(`\\b${escapeRegExp(firstName)}\\b`, 'i').test(raw));
}

function havocKeresAttentionSignal(text = '', player = null) {

function tamsinRowanHavocKeresConcernSignal(text = '', player = null) {
  const raw = String(text || '');

function tamsinKeresConcernNote(text = '', player = null) {

function mentionedCharactersInText(text = '', roster = []) {
  return (roster || []).filter(c => characterMentionedInText(text, c));
}

function teammateStakeInText(text = '', responder, roster = []) {
  return mentionedCharactersInText(text, roster).some(m => sameHouseOrTeam(responder, m));
}

function threadRoleContext(text = '', author = null, roster = []) {
  const raw = String(text || '');
  const mentioned = mentionedCharactersInText(raw, roster)
    .filter(c => c?.handle && c.id !== author?.id);
  const mentionedLines = mentioned.map(c => {
    const handle = escapeRegExp(c.handle || '');
    const alibi = new RegExp(`@${handle}\\s*'?s?\\s+alibi|@${handle}[^.?!]*(?:alibi|witness|source|backup|cover)`, 'i').test(raw);
    const directAddress = new RegExp(`(^|\\s)@${handle}\\b`, 'i').test(raw);
    if (alibi) return `@${c.handle} is mentioned as an alibi/witness/cover figure, not automatically as the person the rumor is about.`;
    if (directAddress) return `@${c.handle} is tagged or pulled into the joke. Do not assume that means they are the culprit or subject unless the wording says so.`;
    return `@${c.handle} is mentioned. Keep their role separate from the original poster and the rumor subject.`;
  });
  const rumorish = /\b(?:rumou?r|caught|snogger|alibi|witness|gmz|sources?|saw|spotted|caught|gossip|plot checks out|cooked)\b/i.test(raw);
  const authorLine = author?.handle
    ? `Original poster: @${author.handle}. In direct replies to the main post, "you" usually means @${author.handle} unless the reply explicitly targets someone else.`
    : '';
  const rumorLine = rumorish
    ? 'Rumor logic: do not collapse every mentioned handle into the rumor subject. Separate who posted, who is being roasted, who is tagged as an alibi/witness, and who is replying.'
    : '';
  return `THREAD ROLE LOGIC:
${authorLine}
${mentionedLines.length ? `Mentioned handles: ${mentionedLines.join(' ')}` : 'No extra handles are clearly tagged.'}
${rumorLine}
If the visible wording is ambiguous, reply with teasing uncertainty or ask one playful question instead of assigning the rumor to the wrong person.`;
}

const PHRASE_INFECTION_REGEXES = [
  /\brespect\s+(?:the|that|this)\s+(?:bit|commitment|distraction|chaos|move|energy|dedication)\b/i,
  /\brespect\s+the\s+commitment(?:\s+to\s+(?:the\s+)?bit)?\b/i,
  /\bcommitment\s+to\s+(?:the\s+)?bit\b/i,
  /\b(?:respect|admire)\s+the\s+dedication\s+to\s+making\s+this\s+worse\b/i,
];

const STICKY_PHRASE_BANS = [
  'respect the bit',
  'respect the commitment',
  'commitment to the bit',
  'respect the distraction',
  'respect the commitment to the bit',
  'respect the dedication',
  'i can make that worse',
  'that helped nobody',
  'beautiful. no notes',
  'thats just called having standards',
  "that's just called having standards",
];

function looksLikePhraseInfection(text = '') {
  const source = String(text || '').replace(/[‘’]/g, "'").trim();
  return PHRASE_INFECTION_REGEXES.some(rx => rx.test(source));
}

function collectRecentFeedDialogue(feed = [], opts = {}) {
  const {
    limit = 10,
    includePosts = true,
    includeReplies = true,
    includeComments = true,
    charId = null,
    botId = null,
  } = opts || {};
  const entries = [];
  const push = (text, meta = {}) => {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    if (charId && meta.charId !== charId) return;
    if (botId && meta.botId !== botId) return;
    entries.push({ ...meta, text: clean });
  };

  (feed || []).slice(0, limit).forEach(post => {
    if (includePosts) push(post?.text, { kind:'post', charId: post?.charId, postId: post?.id });
    if (includeReplies && post?.reply) {
      push(post.reply.text, { kind:'reply', charId: post.reply.charId, postId: post?.id });
    }
    if (includeComments) {
      (post?.charComments || []).forEach((cc, index) => {
        push(cc?.text, { kind:'char-comment', charId: cc?.charId, postId: post?.id, index });
      });
      (post?.botComments || []).forEach((bc, index) => {
        push(bc?.text, {
          kind:'bot-comment',
          charId: bc?.isPlayer ? 'player' : null,
          botId: bc?.bot,
          postId: post?.id,
          index,
        });
      });
    }
  });
  return entries;
}

function recentFeedDialogueText(feed = [], opts = {}) {
  return collectRecentFeedDialogue(feed, opts)
    .map(entry => entry.text)
    .join('\n');
}

function repeatedRecentPhrases(feed = [], extra = '', opts = {}) {
  const { dms = {}, charId = null, groupChats = [] } = opts;
  const texts = [
    ...collectRecentFeedDialogue(feed, { limit: 10 }).map(entry => entry.text),
    extra || '',
  ].filter(Boolean);
  if (charId && dms[charId]) {
    dms[charId].slice(-6).forEach(m => { if (m?.text) texts.push(String(m.text)); });
  }
  (groupChats || []).forEach(gc => {
    (gc.messages || []).slice(-4)
      .filter(m => m?.charId === charId && m?.text)
      .forEach(m => texts.push(String(m.text)));
  });
  const found = new Set();
  const counts = new Map();
  const stop = new Set(['the','a','an','and','or','but','to','of','in','on','for','with','is','are','was','were','you','your','my','me','i','it','that','this','at','as']);

  texts.forEach(text => {
    const normalized = String(text)
      .toLowerCase()
      .replace(/@[a-z0-9_]+/g, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/[^a-z0-9'\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    const stickyMatches = normalized.match(/\brespect\s+(?:the|that|this)\s+[a-z0-9']+\b|\bcommitment\s+to\s+(?:the\s+)?[a-z0-9']+\b/g) || [];
    stickyMatches.forEach(match => found.add(match));
    const words = normalized.split(/\s+/).filter(Boolean);
    const perText = new Set();
    for (let size = 3; size <= 4; size++) {
      for (let i = 0; i <= words.length - size; i++) {
        const phrase = words.slice(i, i + size);
        if (phrase.every(w => stop.has(w))) continue;
        if (phrase.filter(w => !stop.has(w)).join('').length < 8) continue;
        perText.add(phrase.join(' '));
      }
    }
    perText.forEach(phrase => counts.set(phrase, (counts.get(phrase) || 0) + 1));
  });

  [...counts.entries()]
    .filter(([, count]) => count > 1)
    .sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)
    .slice(0, 5)
    .forEach(([phrase]) => found.add(phrase));

  return [...found].filter(Boolean).slice(0, 8);
}

function phraseRepetitionGuard(feed = [], extra = '', opts = {}) {
  const recent = repeatedRecentPhrases(feed, extra, opts);
  return `PHRASE REPETITION GUARD:
- Do not copy distinctive wording, sentence scaffolds, or repeated joke tags from the recent feed.
- Never use these sticky scaffolds: ${STICKY_PHRASE_BANS.map(p => `"${p}"`).join(', ')}.
${recent.length ? `- Avoid these recent repeated phrases right now: ${recent.map(p => `"${p}"`).join(', ')}.` : '- If a phrase from the recent feed feels tempting, use a new angle, image, verb, or social move instead.'}`;
}

const DIALOGUE_PATTERN_STOP_WORDS = new Set([
  'the','a','an','and','or','but','to','of','in','on','for','with','is','are','was','were','be','been','being',
  'you','your','yours','me','my','mine','i','im',"i'm",'it','its','that','this','those','these','they','them',
  'he','him','his','she','her','we','us','our','ours','just','really','very','so','bc','because','when','then',
  'there','here','not','no','yes','do','does','did','doing','say','saying','said','back','though','too','also',
]);

function normalizedDialogueWords(text = '') {
  return String(text || '')
    .toLowerCase()
    .replace(/[‘’]/g, "'")
    .replace(/@[a-z0-9_]+/g, '')
    .replace(/[^a-z0-9'\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(Boolean);
}

function dialoguePatternFlags(text = '') {
  const clean = normalizedDialogueWords(text).join(' ');
  const flags = new Set();
  if (!clean) return flags;
  const keyConnector = /\b(?:land|lands|landed|landing|hit|hits|hitting|work|works|worked|working|read|reads|sounded|sounds)\b.{0,48}\b(?:when|because|bc|from|coming from)\b/;
  const connectorKey = /\b(?:when|because|bc|from|coming from)\b.{0,48}\b(?:land|lands|landed|landing|hit|hits|hitting|work|works|worked|working|read|reads|sounded|sounds)\b/;
  if (keyConnector.test(clean) || connectorKey.test(clean)) flags.add('key-verb-connector');
  if (/\b(?:land|lands|landed|landing)\b/.test(clean)) flags.add('land');
  if (/\b(?:the\s+)?bit\b/.test(clean)) flags.add('bit');
  if (/\b(?:the\s+)?one\s+(?:saying|posting|doing|making|calling)\s+it\b/.test(clean)) flags.add('the-one-doing-it');
  if (/\b(?:harder|better|different|fine)\s+when\b/.test(clean)) flags.add('adjective-when');
  if (/\b(?:compliment|insult|joke|line|caption)\b.{0,36}\b(?:land|lands|landed|hit|hits|worked|works)\b/.test(clean)) flags.add('commentary-lands');
  if (/\b(?:bad|terrible|awful|great|excellent|useful)\s+for\b.{0,60}\b(?:bad|terrible|awful|great|excellent|useful)\s+for\b/.test(clean)) flags.add('x-for-y-contrast');
  if (/\b(?:caption|headline|ranking|poll|analytics|engagement|documentation|spreadsheet|thread loading|receipts)\b/.test(clean)) flags.add('media-spectator-frame');
  if (/\b(?:beautiful|awful|terrible)\b.{0,18}\b(?:no notes|keep going|useful|almost proud)\b/.test(clean)) flags.add('dry-verdict-fragment');
  if (/\b(?:support|respect|endorse)\b.{0,28}\b(?:getting worse|the bit|this mess|bad idea)\b/.test(clean)) flags.add('support-the-mess');
  return flags;
}

function extractUsedMoves(lines = []) {
  const used = new Set();
  (lines || []).filter(Boolean).forEach(line => {
    const flags = dialoguePatternFlags(String(line));
    flags.forEach(f => used.add(f));
    const lower = String(line).toLowerCase();
    if (/\?$/.test(lower.trim())) used.add('question');
    if (/^[a-z]+[.!]$/.test(lower.trim())) used.add('clipped-verdict');
    if (/@\w+/.test(lower)) used.add('direct-tag');
    if (/^(?:ok|yeah|sure|right|nah|no|yes)\b/i.test(lower.trim())) used.add('one-word-opener');
  });
  return used;
}

function hasRepeatedDialogueNgram(candidate = '', previousTexts = []) {
  const words = normalizedDialogueWords(candidate).filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w));
  if (words.length < 3) return false;
  const candidatePhrases = new Set();
  for (let size = 3; size <= Math.min(5, words.length); size++) {
    for (let i = 0; i <= words.length - size; i++) {
      candidatePhrases.add(words.slice(i, i + size).join(' '));
    }
  }
  return (previousTexts || []).some(prev => {
    const prevWords = normalizedDialogueWords(prev).filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w));
    if (prevWords.length < 3) return false;
    for (let size = 3; size <= Math.min(5, prevWords.length); size++) {
      for (let i = 0; i <= prevWords.length - size; i++) {
        if (candidatePhrases.has(prevWords.slice(i, i + size).join(' '))) return true;
      }
    }
    return false;
  });
}

function compactDialogueFingerprint(text = '') {
  return normalizedDialogueWords(text)
    .filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w) && !/^\d+$/.test(w))
    .join(' ');
}

function openingDialogueFingerprint(text = '') {
  return normalizedDialogueWords(text)
    .filter(w => !/^\d+$/.test(w))
    .slice(0, 5)
    .join(' ');
}

function hasDialoguePatternCollision(candidate = '', previousTexts = []) {
  const prior = (previousTexts || [])
    .flatMap(text => String(text || '').split(/\n+/))
    .map(text => text.trim())
    .filter(Boolean)
    .slice(-14);
  if (!candidate || !prior.length) return false;
  const candidateFingerprint = compactDialogueFingerprint(candidate);
  if (candidateFingerprint && candidateFingerprint.split(/\s+/).length >= 4) {
    if (prior.some(prev => compactDialogueFingerprint(prev) === candidateFingerprint)) return true;
  }
  const candidateOpening = openingDialogueFingerprint(candidate);
  if (candidateOpening && candidateOpening.split(/\s+/).length >= 4) {
    if (prior.some(prev => openingDialogueFingerprint(prev) === candidateOpening)) return true;
  }
  if (hasRepeatedDialogueNgram(candidate, prior)) return true;
  const flags = dialoguePatternFlags(candidate);
  if (!flags.size) return false;
  return prior.some(prev => {
    const prevFlags = dialoguePatternFlags(prev);
    if (flags.has('key-verb-connector') && prevFlags.has('key-verb-connector')) return true;
    if (flags.has('land') && prevFlags.has('land') && (flags.has('adjective-when') || prevFlags.has('adjective-when') || flags.has('commentary-lands') || prevFlags.has('commentary-lands'))) return true;
    if (flags.has('the-one-doing-it') && prevFlags.has('the-one-doing-it')) return true;
    if (flags.has('bit') && prevFlags.has('bit') && hasRepeatedDialogueNgram(candidate, [prev])) return true;
    for (const shared of ['x-for-y-contrast', 'media-spectator-frame', 'dry-verdict-fragment', 'support-the-mess']) {
      if (flags.has(shared) && prevFlags.has(shared)) return true;
    }
    return false;
  });
}

function threadPatternVarietyGuard(lines = []) {
  const recent = (lines || [])
    .flatMap(line => String(line || '').split(/\n+/))
    .map(line => line.trim())
    .filter(Boolean)
    .slice(-12);
  return `${THREAD_PATTERN_VARIETY_RULE}
${recent.length ? `RECENT LINE SHAPES TO AVOID ECHOING:\n${recent.map((line, i) => `${i + 1}. ${line.slice(0, 160)}`).join('\n')}` : 'No recent line shapes are available yet, so make each speaker choose a different move.'}`;
}

function cleanGeneratedText(text = '') {
  return String(text)
    .trim()
    .replace(/^["']|["']$/g, '')
    .replace(/[‘’]/g, "'")
    .replace(/[—–]/g, '.')
    .replace(/\bheart emoji\b/gi, '❤️')
    .replace(/\b(?:sparkle|sparkles) emoji\b/gi, '✨')
    .replace(/\b(?:skull|dead) emoji\b/gi, '💀')
    .replace(/\bfire emoji\b/gi, '🔥')
    .replace(/\bcrying emoji\b/gi, '😭')
    .replace(/\blaughing emoji\b/gi, '😂')
    .replace(/\beyes emoji\b/gi, '👀')
    .replace(/\bthis just got interesting\b/gi, 'say that without hovering over the reply button')
    .replace(/\b(?:keep|keeping|keeps) things interesting around here\b/gi, 'make the prefects develop a twitch')
    .replace(/\bget more interesting\b/gi, 'stop being boring')
    .replace(/\blet'?s see it\b/gi, 'try me')
    .replace(/\s+([.,!?])/g, '$1')
    .replace(/([.!?]){2,}/g, '$1')
    .replace(/\s{2,}/g, ' ');
}

function cleanSceneText(text = '') {
  return cleanGeneratedText(text)
    .replace(/[“”"]/g, '')
    .replace(/\s+([.,!?])/g, '$1')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

const SCENE_FALLBACKS = {
  havoc:  ['*leans back, says nothing yet.*', 'try that again.', '*raises an eyebrow.*'],
  silas:  ['*doesn\'t look up immediately.*', 'be specific.', '*waits.*'],
  callum: ['*exhales once.*', 'that\'s your version.', '*looks away briefly.*'],
  briar:  ['*sets something down deliberately.*', 'say it properly.', '*says nothing yet.*'],
  rowan:  ['*almost smiles.*', 'interesting choice.', '*watches you.*'],
  milo:   ['*opens his mouth, closes it.*', 'wait, say that again.', '*looks alarmed.*'],
  elara:  ['*looks at you for a moment.*', 'careful.', '*says nothing, which is worse.*'],
  theo:   ['*visibly files this away.*', 'noted.', '*tilts his head.*'],
  jude:   ['*glances over.*', 'sure.', '*says nothing useful.*'],
  tamsin: ['*pauses before answering.*', 'go on.', '*considers this.*'],
};

function cleanSceneReply(text = '', char, avoidTexts = []) {
  const clean = cleanSceneText(text);
  const pool = SCENE_FALLBACKS[char?.id] || ['*pauses.*', '*glances over.*', '*says nothing.*'];
  const needsFallback =
    !clean
    || looksLikePromptLeak(clean)
    || looksLikeBannedFlatPhrase(clean)
    || violatesCharacterDialogueContract(clean, char)
    || hasDialoguePatternCollision(clean, avoidTexts);
  if (!needsFallback) return clean;
  const start = Math.floor(Math.random() * pool.length);
  for (let i = 0; i < pool.length; i++) {
    const candidate = pool[(start + i) % pool.length];
    if (!fallbackWasUsed(char?.id, candidate)
        && !hasDialoguePatternCollision(candidate, avoidTexts)) {
      trackFallback(char?.id, candidate);
      return candidate;
    }
  }
  trackFallback(char?.id, pool[start]);
  return pool[start];
}

function escapeRegExp(text = '') {
  return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function fallbackChatLine(char, player, group = false, avoidTexts = []) {
  const name = player?.name?.split(' ')[0] || 'you';
  const pool = {
    havoc: group
      ? ['wait, that was the sane version of the thought.', 'that plan has terrible survival instincts.', 'someone say less before i start helping.']
      : [`you say that like i was supposed to behave, ${name}.`, 'i was being helpful. badly, maybe, but helpful.', 'that depends. are we calling this a warning or an invitation?'],
    rowan: group
      ? ['bad plan. annoyingly good timing though.', 'i would like my objections noted and ignored.', 'this chat is one bad decision from becoming evidence.']
      : ['that is a dangerous amount of confidence for one message.', 'i am listening. regrettably interested, even.', 'depends what you want me to do with that.'],
    silas: group
      ? ['focus for six seconds. try it as an experiment.', 'if this is strategy, spell it correctly first.', 'gryffindor would call this planning. unfortunate.']
      : ['be specific.', 'if you have a point, make it cleanly.', 'careful. vague is where bad arguments hide.'],
    callum: group
      ? ['some of us are trying to keep this from becoming public evidence.', 'that is not a plan. that is a liability with confidence.', 'if this gets worse, i am blaming everyone alphabetically.']
      : ['that was almost useful. alarming.', 'you are enjoying this too much. fix that.', 'annoying. unfortunately legible.'],
    jude: group
      ? ['awful structure. several consequences.', 'that sentence has detention energy.', 'i am choosing to believe this is someone else’s problem.']
      : ['best friends is a lot. teammates with terrible judgment, maybe.', 'if everyone is being weird, i can be worse on your side.', 'sure. let us pretend this is normal.'],
    tamsin: group
      ? ['i looked away for one minute and somehow that was optimistic.', 'that was almost a plan. i am choosing to be encouraged.', 'please tell me someone brought snacks to this bad decision.']
      : ['i am listening. try not to make me regret it.', 'that is more honest than most people manage. inconveniently useful.', 'i can work with direct. dramatic, but direct.'],
    milo: group
      ? ['wait are we doing bad ideas because i brought enthusiasm.', 'i understood none of that but i support the chaos.', 'this feels illegal. say more.']
      : ['i am absolutely pretending i understood that.', 'that sounds like a dare. dangerous choice.', 'i have questions and very little impulse control.'],
    theo: group
      ? ['hold that pose. the caption is writing itself.', 'this is terrible for privacy and excellent for engagement.', 'i am begging everyone to keep typing.']
      : ['that is a headline pretending to be a sentence.', 'i can make that sound worse in three captions.', 'do you want the honest read or the version i can post?'],
  }[char?.id] || ['say that again, slower.', 'that is a choice.', 'interesting. inconveniently.'];
  const start = Math.floor(Math.random() * pool.length);
  for (let i = 0; i < pool.length; i++) {
    const candidate = pool[(start + i) % pool.length];
    if (!fallbackWasUsed(char?.id, candidate)
        && !violatesCharacterDialogueContract(candidate, char)
        && !hasDialoguePatternCollision(candidate, avoidTexts || [])) {
      trackFallback(char?.id, candidate);
      return candidate;
    }
  }
  trackFallback(char?.id, pool[start]);
  return pool[start];
}

function directlyAddressedMembers(text = '', members = [], player = null) {
  const raw = String(text || '');
  return (members || []).filter(member => {
    if (!member || member.id === player?.id) return false;
    const handle = member.handle ? escapeRegExp(member.handle.replace(/^@/, '')) : '';
    const first = member.name ? escapeRegExp(member.name.split(/\s+/)[0]) : '';
    const full = member.name ? escapeRegExp(member.name) : '';
    return !!(
      (handle && new RegExp(`@${handle}\\b`, 'i').test(raw)) ||
      (full && new RegExp(`(?:^|[\\s,])${full}(?:[\\s?.!,]|$)`, 'i').test(raw)) ||
      (first && first.length >= 3 && new RegExp(`(?:^|[\\s,])${first}(?:[\\s?.!,]|$)`, 'i').test(raw))
    );
  });
}

function groupMemberTeamLine(member, player) {
  const label = member?.id === player?.id ? 'Keres' : (member?.name?.split(' ')[0] || member?.handle || 'Member');
  const team = teamFor(member) || houseFor(member) || 'no team';
  return `${label}: ${team}`;
}

function groupConversationGroundingLine(latestText = '', member = null, members = [], player = null) {
  const lines = [];

function looksLikeGroupDirectQuestionDodge(text = '', opts = {}) {

function cleanChatText(text = '', char = null, player = null, group = false, opts = {}) {
  if (group && typeof group === 'object') {
    opts = group;
    group = !!opts.group;
  }
  opts = opts || {};
  const avoidTexts = [...(opts.avoidTexts || [])];
  if (opts.feed) avoidTexts.push(recentFeedDialogueText(opts.feed, { limit: opts.feedAvoidLimit || 8 }));
  const names = [char?.name, char?.handle, char?.handle ? `@${char.handle}` : ''].filter(Boolean).map(escapeRegExp);
  let clean = cleanGeneratedText(text)
    .replace(/[“”]/g, '"')
    .replace(stripSpeakerLabelRegex(char), '')
    .replace(names.length ? new RegExp(`^\\s*(?:${names.join('|')})\\s*:\\s*`, 'i') : /^$/, '')
    .replace(/^\s*["']|["']\s*$/g, '')
    .trim();

    return 'tamsin is always already worried. the question is how much evidence she has.';
  }
  if (group && char && looksLikeTeamPronounFlip(clean, opts.latestUserText || '')) {
    return fallbackGroupTeamBanterLine(char, player, { ...opts, avoidTexts });
  }
  if (group && char && looksLikeGroupDirectQuestionDodge(clean, opts)) {
    return fallbackGroupQuestionLine(char, player, { ...opts, avoidTexts });
  }
  if (char && (looksLikeUnsupportedPlayerActionClaim(clean, opts.latestUserText || '', player) || looksLikeReactionBlameSpiral(clean))) {
    return fallbackUnsupportedBlameLine(char, player, group, avoidTexts);
  }
  if (char && looksLikePracticeContextDrift(clean, char, { ...opts, avoidTexts })) {
    return fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts });
  }
  if (char && looksLikeInventedTeamWeaknessClaim(clean, { ...opts, avoidTexts })) {
    return isPracticeTrashTalkContext({ ...opts, avoidTexts })
      ? fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts })
      : fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (char && (looksLikeInventedTimelineClaim(clean, { ...opts, avoidTexts }) || looksLikeUnanchoredMediaClaim(clean, { ...opts, avoidTexts }))) {
    return fallbackDialogueContractLine(char, player, avoidTexts);

  if (char && (looksLikeAddressSlop(clean, char) || looksLikeCatchphraseSlop(clean) || looksLikeBannedFlatPhrase(clean) || looksLikeRecapThenFlatVerdict(clean, opts))) {
    return fallbackChatLine(char, player, group, avoidTexts);

  if (char?.id === 'jude' && looksLikeJudePsychoanalysis(clean)) {

  if (char && violatesCharacterDialogueContract(clean, char)) {

  }
  if (char && hasDialoguePatternCollision(clean, avoidTexts)) {
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (!clean || looksLikePromptLeak(clean) || looksLikePhraseInfection(clean) || looksLikeIdentityConfusion(clean, char)) return fallbackChatLine(char, player, group, avoidTexts);
  return clean;
}

function stripSpeakerLabelRegex(char) {
  if (!char?.name && !char?.handle) return /^$/;
  const name = char?.name ? escapeRegExp(char.name) : '';
  const handle = char?.handle ? escapeRegExp(char.handle.replace(/^@/, '')) : '';
  const lead = String.raw`^\s*(?:#+\s*)?`;
  const tail = String.raw`\s*(?::|[-–—])?\s*`;
  if (name && handle) {
    return new RegExp(`${lead}(?:${name}\\s*(?:\\(\\s*@?${handle}\\s*\\))?|@?${handle})${tail}`, 'i');
  }
  return new RegExp(`${lead}(?:${name || `@?${handle}`})${tail}`, 'i');
}

function stripLeadingSelfMention(text = '', char) {

function isSelfNarration(text = '', char) {
  if (!char?.name || !text) return false;
  const first = (char.name || '').split(/\s+/)[0];
  const escaped = [char.name, first, char.handle].filter(Boolean).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!escaped.length) return false;
  const selfVerb = `(?:is|'s|has|needs|wants|thinks|knows|would|will|going\\s+to|doesn't|does\\s+not|can't|cannot|won't|will\\s+not|wouldn't|would\\s+not|isn't|is\\s+not|wasn't|was\\s+not|likes|hates|loves|sees|notices|watches|feels|looks|sounds|says|gets|got|can|could|should|might|must|did|does)`;
  return new RegExp(`^(?:\\*\\s*)?(?:${escaped.join('|')})\\s+${selfVerb}\\b`, 'i').test(String(text).trim())
    || new RegExp(`\\b(?:${escaped.join('|')})\\s+${selfVerb}\\b`, 'i').test(String(text).trim())
    || new RegExp(`\\b(?:${escaped.join('|')})\\s*['’]s\\s+(?:own\\s+)?(?:prep|match|routine|team|house|problem|fault|faults|schedule|detention|morning|business|mess|fault)\\b`, 'i').test(String(text).trim());
}

function looksLikeSelfPronounDrift(text = '', char, opts = {}) {
  if (!opts.selfSubject || !char || !text) return false;
  const lower = String(text || '').toLowerCase().replace(/[’]/g, "'");
  const withoutOwnIdentity = lower.replace(new RegExp(`\\b${escapeRegExp((char.name || '').split(/\\s+/)[0]).toLowerCase()}\\b|\\b${escapeRegExp(String(char.handle || '').toLowerCase())}\\b`, 'gi'), '');
  const withoutDirectAddress = withoutOwnIdentity.replace(/^\s*@?[a-z0-9_]+\b[:,]?\s*/i, '');
  const hasOtherPersonAnchor = /\B@[a-z0-9_]+\b/i.test(withoutDirectAddress) || /\b(?:callum|havoc|silas|rowan|milo|theo|jude|briar|elara|tamsin|keres|gmz)\b/i.test(withoutDirectAddress);
  if (hasOtherPersonAnchor) return false;
  const pronouns = pronounsFor(char).toLowerCase();
  if (pronouns.includes('he/him')) return /\b(?:he|him|his|himself)\b/i.test(lower);
  if (pronouns.includes('she/her')) return /\b(?:she|her|hers|herself)\b/i.test(lower);
  return /\b(?:they|them|their|theirs|themself|themselves)\b/i.test(lower);
}

function looksLikeIdentityConfusion(text = '', char) {

  return /^(?:some people|certain people|not everyone|people really|the way people|honestly the|the audacity|the fact that|wild how|funny how|interesting how|crazy how|it[‘’]s giving|it gives|the thing about|sometimes you just|sometimes i|not me|genuinely can[‘’]t|can[‘’]t believe people|can[‘’]t believe some|why do people|why are people|why is everyone)\b/i.test(s);

    briar: ['i hate that the timing makes sense.', 'allegedly, but that alibi has cracks big enough to fly through.', 'someone is about to regret being seen that conveniently.'],
    rowan: ['if true, that is catastrophically funny timing.', 'allegedly, but the room just got quieter.', 'the theory writes itself and that is never a good sign.'],
    havoc: ['if true, dangerous timing. if false, dangerous lie.', 'someone put that where we could all see it.', 'allegedly, but i like the shape of the problem.'],

  }[char?.id] || [

    'the theory is doing more work than the denial.',
  ];
  const line = pool[Math.floor(Math.random() * pool.length)];
  return `${target}${line}`.trim();
}

function cleanSocialReplyText(raw = '', char, player, opts = {}) {
  opts = opts || {};
  const avoidTexts = [...(opts.avoidTexts || [])];
  if (opts.feed) avoidTexts.push(recentFeedDialogueText(opts.feed, { limit: opts.feedAvoidLimit || 8 }));
  const botHandle = opts.bot?.handle ? escapeRegExp(opts.bot.handle.replace(/^@/, '')) : null;
  const botStripped = botHandle
    ? cleanGeneratedText(raw).replace(new RegExp(`^\\s*@?${botHandle}\\s*(?::|[-–—])?\\s*`, 'i'), '')
    : cleanGeneratedText(raw);
  const clean = stripLeadingSelfMention(cleanSelfNarration(botStripped.replace(stripSpeakerLabelRegex(char), ''), char), char)
    .replace(/^reply:\s*/i, '')
    .replace(/^comment:\s*/i, '')
    .trim();
  if (looksLikeMadeItWorseSubjectMisread(clean, opts)) {
    if (opts.bot) return fallbackBotLine(opts.bot, opts);
    if (char) return fallbackDialogueContractLine(char, player, avoidTexts);
    return fallbackChatLine(char, player, false, avoidTexts);
  }
  if (looksLikePracticeContextDrift(clean, char, { ...opts, avoidTexts })) {
    if (opts.bot) return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
    if (char) return fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts });
    return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
  }
  if (looksLikeInventedTeamWeaknessClaim(clean, { ...opts, avoidTexts })) {
    if (opts.bot) return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
    if (char && isPracticeTrashTalkContext({ ...opts, avoidTexts })) return fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts });
    if (char) return fallbackDialogueContractLine(char, player, avoidTexts);
    return fallbackChatLine(char, player, false, avoidTexts);
  }
  if (looksLikeInventedTimelineClaim(clean, { ...opts, avoidTexts }) || looksLikeUnanchoredMediaClaim(clean, { ...opts, avoidTexts })) {
    if (opts.bot) return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
    if (char && isPracticeTrashTalkContext({ ...opts, avoidTexts })) return fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts });
    if (char) return fallbackDialogueContractLine(char, player, avoidTexts);
    return fallbackChatLine(char, player, false, avoidTexts);
  }
  if (opts.bot && looksLikeBotPatternSlop(clean, opts.bot, opts)) return fallbackBotLine(opts.bot, opts);
  if (char && (looksLikeUnsupportedPlayerActionClaim(clean, opts.latestUserText || '', player) || looksLikeReactionBlameSpiral(clean))) {
    return fallbackUnsupportedBlameLine(char, player, false, avoidTexts);
  }
  if (char && looksLikeSilasCamaraderieMisread(clean, char, opts)) {
    return fallbackFlatThreadLine(char, player, { ...opts, avoidTexts });
  }
  if (char && looksLikeSilasPublicSoftness(clean, char)) {
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (looksLikeDetailDemandInsteadOfSpeculation(clean, { ...opts, avoidTexts })) {
    if (opts.bot) return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
    if (char) return fallbackGmzSpeculationLine(char, player, { ...opts, avoidTexts });
    return fallbackChatLine(char, player, false, avoidTexts);
  }
  if (char && (looksLikeAddressSlop(clean, char) || looksLikeCatchphraseSlop(clean) || looksLikeBannedFlatPhrase(clean) || looksLikeRecapThenFlatVerdict(clean, opts))) {
    return fallbackFlatThreadLine(char, player, { ...opts, avoidTexts });
  }
  if (char && looksLikeInterrogationSpiral(clean)) {
    return fallbackPublicBanterLine(char, player, avoidTexts);
  }
  if (char && (looksLikeHardDefensiveBanterDodge(clean) || (opts.playfulBanter && looksLikeDefensiveBanterDodge(clean)))) {
    return fallbackPublicBanterLine(char, player, avoidTexts);
  }
  if (char && looksLikeSideParticipantSelfInsertion(clean, char, opts)) {
    return fallbackSideParticipantLine(char, player, opts);
  }
  if (char && (isSelfNarration(clean, char) || looksLikeSelfPronounDrift(clean, char, opts))) {
    return fallbackSelfReferenceLine(char, player);
  }
  if (char && looksLikeDetachedParticipantReply(clean, char, opts)) {
    return fallbackParticipantIncludedLine(char, player, opts);
  }
  if (char && violatesCharacterDialogueContract(clean, char)) {
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (!clean || looksLikePromptLeak(clean) || looksLikePhraseInfection(clean) || looksLikeCatchphraseSlop(clean) || looksLikeBannedFlatPhrase(clean) || looksLikeRecapThenFlatVerdict(clean, opts) || looksLikeCrypticVomit(clean, opts.contextText || '') || hasDialoguePatternCollision(clean, avoidTexts) || looksLikeIdentityConfusion(clean, char) || clean.length > 360) {
    if (opts.bot) return fallbackBotLine(opts.bot, { ...opts, avoidTexts });
