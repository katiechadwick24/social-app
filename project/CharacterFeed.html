function NotificationsScreen({ chars, player, feed, onOpenThread, onCharClick }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const playerHandle = (player.handle || '').toLowerCase();
  const mentionRe = new RegExp(`@${playerHandle}\\b`, 'i');
  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - (ts || Date.now())) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }
  const notifs = feed.flatMap(post => {
    const items = [];
    const poster = allChars.find(c => c.id === post.charId);
    if (post.charId !== player.id && mentionRe.test(post.text || '')) {
      items.push({ id:`mention-${post.id}`, type:'mention', char:poster, text:'mentioned you in a post', preview: poster ? cleanSocialPostText(post.text, poster, player) : post.text, timestamp:post.timestamp, post });
    }
    if (post.reply?.charId && post.reply.charId !== player.id && (post.charId === player.id || mentionRe.test(post.reply.text || ''))) {
      const replier = allChars.find(c => c.id === post.reply.charId);
      items.push({ id:`reply-${post.id}`, type:'reply', char:replier, text: post.charId === player.id ? 'replied to your post' : 'mentioned you in a reply', preview: replier ? cleanSocialReplyText(post.reply.text, replier, player) : post.reply.text, timestamp:(post.timestamp || Date.now()) + 1, post });
    }
    (post.charComments || []).forEach((cc, i) => {
      if (cc.charId === player.id) return;
      const replier = allChars.find(c => c.id === cc.charId);
      const isForPlayer = post.charId === player.id || cc.replyTo === player.handle || mentionRe.test(cc.text || '');
      if (!isForPlayer) return;
      items.push({
        id:`char-comment-${post.id}-${i}`,
        type:'reply',
        char:replier,
        text: post.charId === player.id ? 'replied to your post' : 'replied to you',
        preview: replier ? cleanSocialReplyText(cc.text, replier, player) : cc.text,
        timestamp:cc.timestamp || post.timestamp,
        post,
      });
    });
    (post.botComments || []).forEach((bc, i) => {
      if (bc.isPlayer) return;
      const isForPlayer = post.charId === player.id || bc.replyTo === player.handle || mentionRe.test(bc.text || '');
      if (!isForPlayer) return;
      const bot = RECURRING_BOTS.find(b => b.id === bc.bot);
      items.push({
        id:`bot-comment-${post.id}-${i}`,
        type:'reply',
        bot,
        text: post.charId === player.id ? 'reacted to your post' : 'reacted to you',
        preview:cleanSocialReplyText(bc.text, null, player, { bot }),
        timestamp:bc.timestamp || post.timestamp,
        post,
      });
    });
    return items;
  }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 40);
  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Notifications</h1>
      </div>
      {notifs.length === 0 && (
        <div style={{padding:28, textAlign:'center', color:C.muted, fontSize:14, lineHeight:1.5}}>
          No replies or mentions yet.
        </div>
      )}
      {notifs.map(n => (
        <div key={n.id} onClick={() => onOpenThread && onOpenThread(n.post)} style={{display:'flex', gap:10, padding:'14px 16px', borderBottom:`1px solid ${C.border}`, alignItems:'center', cursor:'pointer'}}>
          <div style={{position:'relative'}}>
            {n.bot ? <BotAvatar bot={n.bot} size={42} /> : <Avatar char={n.char} size={42} onClick={(e) => { e?.stopPropagation?.(); n.char && onCharClick && onCharClick(n.char); }} />}
            <div style={{position:'absolute', bottom:-2, right:-2, width:18, height:18, borderRadius:'50%', background: n.type==='like'?'#e91e8c':n.type==='mention'?C.blue:n.type==='reply'?C.purple:C.green, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, border:`2px solid ${C.bg}`}}>
              {n.type==='like'?'♥':n.type==='mention'?'@':n.type==='reply'?'↩':'➕'}
            </div>
          </div>
          <div style={{flex:1}}>
            <span style={{fontWeight:700, color:C.text, fontSize:14}}>{n.bot?.name || n.char?.name} </span>
            <span style={{color:C.muted, fontSize:14}}>{n.text}</span>
            <p style={{color:C.text, fontSize:13, marginTop:4, lineHeight:1.35}}>{renderLinkedText((n.preview || '').slice(0,120), allChars, onCharClick)}</p>
            <p style={{color:C.muted, fontSize:12, marginTop:3}}>{timeAgo(n.timestamp)} ago</p>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Activity Screen ──────────────────────────────────────────────
function ActivityScreen({ chars, player, onEvent, feed, dms, eventLog, onOpenChat, onOpenThread, section, setSection }) {
  const allChars = [...chars, player];
  const activeSection = section || 'posts';
  const setActiveSection = setSection || (() => {});

  // My posts — anything posted by player
  const myPosts = feed.filter(p => p.charId === 'player');

  // Recent DM previews — only convos with messages (include GMZ if active)
  const charsForDms = (dms[GMZ_CHAR.id]||[]).length > 0 ? [GMZ_CHAR, ...chars] : chars;
  const activeDMs = charsForDms.filter(c => (dms[c.id]||[]).length > 0);

  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - ts) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }

  const tabs = [
    { id:'posts', label:'My Posts' },
    { id:'events', label:'Events' },
    { id:'dms', label:'DMs' },
    { id:'log', label:'Log' },
  ];

  // Log tab state
  const [logCollapsed, setLogCollapsed] = useState({});
  const [logShowDMs, setLogShowDMs] = useState(false);
  const toggleLog = (key) => setLogCollapsed(c => ({...c, [key]: !c[key]}));
  const filteredLog = logShowDMs ? eventLog : eventLog.filter(e => e.type !== 'dm');
  const eventEntries = (eventLog || []).filter(e => e?.type === 'event' || e?.scenario || e?.action || e?.outcome || typeof e?.xp === 'number');

  return (
    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'16px 16px 0', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:5}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
          <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Activity</h1>
          <button onClick={() => onEvent()} style={{
            background:C.blue, color:'#fff', border:'none', borderRadius:20,
            padding:'7px 16px', fontSize:13, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6,
          }}>📣 Event</button>
        </div>
        {/* Section tabs */}
        <div style={{display:'flex', gap:0, borderBottom:`1px solid ${C.border}`}}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveSection(t.id)} style={{
              flex:1, background:'none', border:'none', color: activeSection===t.id ? C.text : C.muted,
              fontWeight: activeSection===t.id ? 700 : 400, fontSize:14, padding:'10px 0', cursor:'pointer',
              borderBottom: activeSection===t.id ? `2px solid ${C.blue}` : '2px solid transparent',
              transition:'all 0.2s',
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* MY POSTS */}
      {activeSection === 'posts' && (
        <div>
          {myPosts.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>✍️</div>
              <p style={{color:C.muted, fontSize:14}}>You haven't posted yet.</p>
              <p style={{color:C.muted, fontSize:13, marginTop:4}}>Hit + on the feed to post something.</p>
            </div>
          ) : myPosts.map(post => (
            <div key={post.id} onClick={() => onOpenThread && onOpenThread(post)} style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, cursor:'pointer'}}>
              <div style={{display:'flex', gap:10}}>
                <Avatar char={player} size={38} />
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                    <span style={{fontWeight:700, fontSize:14, color:C.text}}>{player.name}</span>
                    <CharBadge char={player} />
                    <span style={{color:C.muted, fontSize:12}}>· {timeAgo(post.timestamp)}</span>
                  </div>
                  {post.text && <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{post.text}</p>}
                  {post.photo && <img src={post.photo} alt="" style={{width:'100%', aspectRatio:'1 / 1', borderRadius:10, marginTop:6, objectFit:'cover', display:'block'}}/>}
                  <div style={{display:'flex', gap:16, marginTop:8}}>
                    <span style={{color:C.muted, fontSize:12, display:'inline-flex', alignItems:'center', gap:3}}><ReplyGlyph size={13} /> {post.comments}</span>
                    <span style={{color:C.muted, fontSize:12}}>🔁 {fmt(post.reposts)}</span>
                    <span style={{color:C.muted, fontSize:12}}>♥ {fmt(post.likes)}</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* EVENTS */}
      {activeSection === 'events' && (
        <div>
          {eventEntries.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>📣</div>
              <p style={{color:C.muted, fontSize:14}}>No events yet.</p>
              <button onClick={() => onEvent()} style={{marginTop:12, background:C.blue, color:'#fff', border:'none', borderRadius:20, padding:'10px 24px', fontSize:14, fontWeight:700, cursor:'pointer'}}>
                Trigger your first event

            </div>
          ) : eventEntries.map((ev, i) => (
            <div key={i} style={{padding:'16px', borderBottom:`1px solid ${C.border}`}}>

                <div style={{width:38, height:38, borderRadius:'50%', background:'#1a1a3a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}>📣</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <span style={{color:C.muted, fontSize:12}}>Event · {timeAgo(ev.timestamp || Date.now())}</span>
                    <span style={{color:C.yellow, fontSize:12, fontWeight:700}}>+{Number(ev.xp || 0)} XP</span>
                  </div>
                  <p style={{color:C.muted, fontSize:13, lineHeight:1.5, marginBottom:8}}>{ev.scenario || ev.title || 'Custom event'}</p>
                  <div style={{background:C.card2, borderRadius:10, padding:'10px 12px', marginBottom:6}}>
                    <p style={{color:C.muted, fontSize:11, marginBottom:4}}>YOUR ACTION</p>
                    <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{ev.action || 'Action logged.'}</p>
                  </div>
                  {ev.outcome && (
                    <div style={{background:'#1a2e1a', borderRadius:10, padding:'10px 12px'}}>
                      <p style={{color:C.muted, fontSize:11, marginBottom:4}}>OUTCOME</p>
                      <p style={{color:C.green, fontSize:13, lineHeight:1.5}}>{ev.outcome}</p>

      )}

      {/* DMs */}
      {activeSection === 'dms' && (
        <div>
          {activeDMs.length === 0 ? (

              <div style={{fontSize:36, marginBottom:12}}>💬</div>
              <p style={{color:C.muted, fontSize:14}}>No DM history yet.</p>
              <p style={{color:C.muted, fontSize:13, marginTop:4}}>Go to Messages to start a conversation.</p>
            </div>
          ) : activeDMs.map(char => {

            const prevMsg = msgs[msgs.length - 2];

              <div key={char.id} onClick={() => onOpenChat(char)} style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, cursor:'pointer'}}>

                    <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:6}}>
                      <span style={{fontWeight:700, fontSize:14, color:C.text}}>{char.name}</span>
                      <Verified/>
                      <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
                    </div>
                    {/* Last 2 messages preview */}
                    <div style={{display:'flex', flexDirection:'column', gap:4}}>

                            </div>
                            <div style={{

            <div style={{display:'flex', justifyContent:'flex-end', padding:'10px 16px 0'}}>
              <button onClick={() => setLogShowDMs(s=>!s)} style={{background:C.card2, border:`1px solid ${C.border}`, color:logShowDMs ? C.blue : C.muted, borderRadius:10, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>

                <p style={{fontWeight:600, color:C.text}}>No activity yet</p>

              [...filteredLog].reverse().map((entry, i) => (

          </div>
        </div>
      )}
      <div style={{height:24}}/>
    </div>
  );

// ─── Main App ─────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  C = buildTheme(tweaks);

  // ── Server-side persistence ───────────────────────────────────
  const _saveTimer = useRef(null);

  function isFileMode() {
    return window.location.protocol === 'file:';
  }

  function saveLocalState(state) {
    try {
      window.localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
    } catch(e) {
      console.warn('Could not save local game state. Uploaded images may be too large.', e);
    }
  }

  function loadLocalState() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || '{}');
      if (saved && Object.keys(saved).length) return saved;
      for (const key of LEGACY_LOCAL_STATE_KEYS) {
        const legacy = JSON.parse(window.localStorage.getItem(key) || '{}');
        if (legacy && Object.keys(legacy).length) return legacy;
      }
      return {};
    } catch(e) {
      return {};
    }
  }

  function isCurrentSave(saved) {
    return saved && saved.stateVersion === SAVE_STATE_VERSION;
  }

  function withStateVersion(state) {
    return {
      ...state,
      chars: normalizeCharactersIdentity(state.chars || []),
      player: normalizeCharacterIdentity(state.player || DEFAULT_PLAYER),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now()
    };
  }

  function applySavedState(saved) {
    const savedChars = normalizeCharactersIdentity(saved.chars || chars);
    const savedPlayer = normalizeCharacterIdentity(saved.player || player);
    if (saved.chars)      setCharsRaw(savedChars);
    if (saved.player)     setPlayerRaw(savedPlayer);
    if (saved.feed)       setFeedRaw(repairPromptLeakPosts(saved.feed, savedChars, savedPlayer));
    if (saved.dms)        setDmsRaw(repairPromptLeakDms(saved.dms, savedChars, savedPlayer));
    if (saved.groupChats) setGroupChatsRaw(normalizeGroupChats(repairPromptLeakGroupChats(saved.groupChats, savedChars, savedPlayer)));
    if (saved.eventLog)   setEventLogRaw(saved.eventLog);
    if (typeof saved.day === 'number') setDayRaw(saved.day);
    if (saved.socialPresence) setSocialPresenceRaw(saved.socialPresence);
  }

  function chooseSavedState(serverState, localState) {
    const serverCurrent = isCurrentSave(serverState);
    const localCurrent = isCurrentSave(localState);
    if (serverCurrent && localCurrent) {
      return (Number(localState.savedAt || 0) > Number(serverState.savedAt || 0)) ? localState : serverState;
    }
    if (localCurrent) return localState;
    if (serverCurrent) return serverState;
    return null;
  }

  function serverSave(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    _saveTimer.current = setTimeout(() => {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(versionedState),
      }).catch(() => {});
    }, 1500);
  }

  function serverSaveNow(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(versionedState),
    }).catch(() => {});
  }

  const [chars, setCharsRaw] = useState(DEFAULT_CHARS);
  const [player, setPlayerRaw] = useState(DEFAULT_PLAYER);
  const [feed, setFeedRaw] = useState(DEFAULT_FEED);
  const [dms, setDmsRaw] = useState({});
  const [groupChats, setGroupChatsRaw] = useState(DEFAULT_GROUP_CHATS);
  const [eventLog, setEventLogRaw] = useState([]);
  const [day, setDayRaw] = useState(DEFAULT_DAY);
  const [socialPresence, setSocialPresenceRaw] = useState(DEFAULT_SOCIAL_PRESENCE);
  const [stateLoaded, setStateLoaded] = useState(false);
  const feedRelationshipKeysRef = useRef(new Set());

  function cloneDefault(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function clearPlayerRelationships(list) {
    return list.map(char => {
      if (!char.relationships || !Object.prototype.hasOwnProperty.call(char.relationships, 'player')) return char;
      const { player: _playerRelationship, ...relationships } = char.relationships;
      return { ...char, relationships };
    });
  }

  function freshGameState({ preserveProfiles = false } = {}) {
    const freshChars = normalizeCharactersIdentity(preserveProfiles ? clearPlayerRelationships(cloneDefault(chars)) : cloneDefault(DEFAULT_CHARS));
    return {
      chars: freshChars,
      player: normalizeCharacterIdentity(preserveProfiles ? cloneDefault(player) : cloneDefault(DEFAULT_PLAYER)),
      feed: cloneDefault(DEFAULT_FEED),
      dms: {},
      groupChats: normalizeGroupChats(cloneDefault(DEFAULT_GROUP_CHATS)),
      eventLog: [],
      day: DEFAULT_DAY,
      socialPresence: preserveProfiles ? cloneDefault(FRESH_SOCIAL_PRESENCE) : cloneDefault(DEFAULT_SOCIAL_PRESENCE),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now(),
    };
  }

  // Load saved state from server on startup
  useEffect(() => {
    const localSaved = loadLocalState();
    if (isFileMode()) {
      if (isCurrentSave(localSaved)) {
        applySavedState(localSaved);
      } else {
        window.localStorage.removeItem(LOCAL_STATE_KEY);
      }
      setStateLoaded(true);
      return;
    }
    fetch('/api/state').then(r => r.json()).then(saved => {
      const bestSaved = chooseSavedState(saved, localSaved);
      if (bestSaved) {
        applySavedState(bestSaved);
        if (bestSaved === localSaved) serverSaveNow(bestSaved);
      } else if (saved && Object.keys(saved).length) {
        serverSaveNow(freshGameState());
      }
      setStateLoaded(true);
    }).catch(() => setStateLoaded(true));
  }, []);

  // Wrapped setters normalize and trim state only. Persistence runs from the
  // assembled current state after React applies all updates.
  function setChars(v)      { setCharsRaw(prev      => normalizeCharactersIdentity(typeof v==='function'?v(prev):v)); }
  function setPlayer(v)     { setPlayerRaw(prev     => normalizeCharacterIdentity(typeof v==='function'?v(prev):v)); }
  function setFeed(v)       { setFeedRaw(prev       => (typeof v==='function'?v(prev):v).slice(0,60)); }
  function setDms(v)        { setDmsRaw(prev        => typeof v==='function'?v(prev):v); }
  function setGroupChats(v) { setGroupChatsRaw(prev => typeof v==='function'?v(prev):v); }
  function setEventLog(v)   { setEventLogRaw(prev   => (typeof v==='function'?v(prev):v).slice(0,30)); }
  function setDay(v)        { setDayRaw(prev        => typeof v==='function'?v(prev):v); }
  function setSocialPresence(v) { setSocialPresenceRaw(prev => typeof v==='function'?v(prev):v); }

  useEffect(() => {
    if (!stateLoaded) return;
    serverSave({ chars, player, feed, dms, groupChats, eventLog, day, socialPresence });
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day, socialPresence]);

  useEffect(() => {
    if (!stateLoaded) return;
    const flushSave = () => serverSaveNow({ chars, player, feed, dms, groupChats, eventLog, day, socialPresence });
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('beforeunload', flushSave);
    return () => {
      window.removeEventListener('pagehide', flushSave);
      window.removeEventListener('beforeunload', flushSave);
    };
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day, socialPresence]);

  useEffect(() => {
    if (!stateLoaded || !feed?.length) return;
    const scan = scanFeedRelationshipInteractions(feed, chars, player, feedRelationshipKeysRef.current);
    if (!scan.changedFeed && !scan.changes.length) return;
    scan.trackedKeys.forEach(key => feedRelationshipKeysRef.current.add(key));
    if (scan.changedFeed) setFeedRaw(scan.feed.slice(0, 60));
    if (scan.changes.length) {
      const logEntry = feedRelationshipLogEntry(scan.changes, chars, player);
      setCharsRaw(prev => applyFeedRelationshipChanges(prev, scan.changes, player));
      if (logEntry) setEventLogRaw(prev => [logEntry, ...prev].slice(0, 30));
    }
  }, [stateLoaded, feed, chars, player]);

  function addSocialPresence(gains) {
    setSocialPresence(prev => ({
      humor: Math.min(300, +(Number(prev?.humor || 0) + Number(gains?.humor || 0)).toFixed(2)),
      aura: Math.min(300, +(Number(prev?.aura || 0) + Number(gains?.aura || 0)).toFixed(2)),
      drama: Math.min(300, +(Number(prev?.drama || 0) + Number(gains?.drama || 0)).toFixed(2)),
    }));
  }

  function getCharsWithRelationshipLogChanges(list, scoreChanges = []) {

      return;
    }
    const isTransferHeat = /keres|transfer|new girl|bombshell|mega babe|pretty|photo|disciplinary|record|tryout|chaser/i.test(ev.scenario || '');
    const tamsinInterestHeat = tamsinRowanHavocKeresConcernSignal(`${ev.scenario || ''} @${player.handle}`, player)
      || (isTransferHeat && /\b(?:rowan|@rowancade|havoc|@havocfang)\b/i.test(ev.scenario || ''));
    if (isTransferHeat) {
      const elara = chars.find(c => c.id === 'elara');
      if (elara && !involved.some(c => c.id === 'elara')) involved = [...involved, elara];
    }
    if (tamsinInterestHeat) {
      const tamsin = chars.find(c => c.id === 'tamsin');
      if (tamsin && !involved.some(c => c.id === 'tamsin')) involved = [...involved, tamsin];
    }
    const fallbackReaction = (char) => {
      if (char.id === 'tamsin' && tamsinInterestHeat) {
        return 'rowan developing taste in public was not on my schedule. havoc being involved is somehow the less surprising part.';
      }
      if (isTransferHeat) {
        if (char.id === 'silas') return 'a reputation is useful if she knows how to aim it. tryouts will be informative.';
        if (char.id === 'jude') return 'new slytherin transfer with a record and cheekbones. finally, a useful public nuisance.';
        if (char.id === 'briar') return 'slytherin getting a talented chaser with attitude is irritating. objectively interesting, but irritating.';
        if (char.id === 'havoc') return 'if the record is real, dangerous. if the photo is real, also dangerous.';
        if (char.id === 'rowan') return 'terrible day for everyone pretending they did not zoom in.';
        if (char.id === 'callum') return 'pretty form is still form. it can prove itself under pressure or stop taking up oxygen.';
        if (char.id === 'milo') return 'wait are we all pretending the photo did not happen or';
        if (char.id === 'theo') return 'ranking the new transfer before tryouts would be irresponsible. unrelated thread loading.';
        if (char.id === 'tamsin') return 'the school pretending this is about the record and not the photo is almost charming.';
        if (char.id === 'elara') return 'funny how quickly everyone discovers a type when the new girl photographs well.';
      }
      return 'watching everyone decide what this means before the facts arrive. efficient, if nothing else.';
    };

    const basePosts = involved.map(char => ({
      id: `gen-${Date.now()}-${char.id}-${Math.random()}`,
      charId: char.id,
      text: fallbackReaction(char),
      likes: Math.floor(Math.random()*100000),
      reposts: Math.floor(Math.random()*5000),
      comments: Math.floor(Math.random()*200),
      timestamp: Date.now(),
      reply: null,
      botComments: [],
      isEventReaction: true,
    }));
    setFeed(f => [...basePosts, ...f]);
    const eventDialogueSeparation = multiSpeakerDialogueSeparationRule(involved, 'public event reaction');

    // Upgrade fallback posts with real in-character reactions as they come in.
    involved.forEach((char, idx) => {
      setTimeout(async () => {
        try {
          const siblingReactions = basePosts
            .filter(p => p.charId !== char.id)
            .map(p => {
              const sibling = involved.find(c => c.id === p.charId);
              return `@${sibling?.handle || p.charId}: "${p.text}"`;
            });
          const eventAvoidTexts = [ev.scenario, ...siblingReactions];
          const raw = await window.claude.complete({ messages:[{ role:'user', content:
            `Write as ${char.name} on a campus social app.
${identityPromptFor(char)}
Voice cues: ${char.personality}. Profile context: ${(char.description||char.bio||'').slice(0,240)}
${pronounRule([char, player, ...involved])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(char, 'public event reaction')}
${eventDialogueSeparation}
${playerStance(char, player)}
${recentMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars:[...chars, player, GMZ_CHAR] })}
${phraseRepetitionGuard(feed, ev.scenario, { charId: char.id, dms, groupChats })}
${siblingReactions.length ? `Other involved characters have event-reaction lanes already in play:\n${siblingReactions.join('\n')}\nDo not echo their sentence shape or social move. Keep your own lane distinct.` : ''}
${threadPatternVarietyGuard(eventAvoidTexts)}

Campus event: "${ev.scenario}"
${isTransferHeat ? `${player.name} is the new Slytherin transfer at the center of this: talented, gorgeous, mouthy, and arriving with a reputation/disciplinary record. The campus should mostly be excited, curious, attracted, impressed, or playfully chaotic. Characters may be wary or competitive, but do not make everyone bully her or tear her down.` : ''}
${isTransferHeat && char.id === 'callum' ? `Callum and Keres do not like each other. He may clock her talent, but his post should sound annoyed, competitive, exacting, or petty, not friendly or supportive.` : ''}
${isTransferHeat && char.id === 'elara' ? `Elara has history with Havoc. If the event makes Keres visible or desirable, Elara should notice with pride, plausible deniability, dangerous humor, or a sharp ex-adjacent jab. She does not sound wounded or beg for attention.` : ''}
${tamsinInterestHeat && char.id === 'tamsin' ? tamsinKeresConcernNote(`${ev.scenario || ''} @${player.handle}`, player) : ''}

Write ONE social media post from ${char.name}'s perspective reacting to the event. 1 sentence, 8-28 words. In character. Natural school-social-app tone. If this is a hot-transfer reveal, lean interested/excited/impressed unless the character has a clear reason not to. If tagging @${player.handle} fits, do it. No hashtags, no quotes around the post. Do not explain your reasoning or mention prompts/context/rules.
${BANNED_PHRASES_RULE}`
          }]});
          const clean = cleanSocialPostText(raw, char, player, { feed, avoidTexts: eventAvoidTexts });
          if (!clean) return;
          setFeed(f => f.map(p => p.id === basePosts[idx].id ? {...p, text: clean} : p));
        } catch(e) {}
      }, 600 + idx * 500);
    });

    setActiveEvent(null);
    // Proactive DM: only characters explicitly attached to the custom event can slide in.
    const reactiveChars = involved.filter(c => !['reserved','quiet'].some(q => (c.personality||'').includes(q)));
    if (reactiveChars.length && Math.random() < 0.4) {
      const pick = reactiveChars[Math.floor(Math.random()*reactiveChars.length)];
      setTimeout(() => triggerProactiveDM(pick, `the event: ${ev.scenario.slice(0,60)}`), 3000);
    }
    // GMZ only posts when the custom event explicitly names the gossip account.
    const shouldTriggerGMZ = /\b(?:gmz|@gmz|gossip account|anonymous tip)\b/i.test(`${ev.scenario || ''} ${ev.outcome || ''}`);
    if (shouldTriggerGMZ) {
      const involvedHandles = evCharIds.map(id => {
        const found = [...chars, player].find(c => c.id === id);
        return found?.handle ? `@${found.handle}` : id;
      }).join(', ');
      const gmzTip = [
        `Anonymous raw tip about a ${ev.type || 'gossip'} event.`,
        `Public setup: "${ev.scenario || ''}"`,
        ev.playerAction ? `Submitted action/details: "${ev.playerAction}"` : '',
        ev.outcome ? `What happened next: "${ev.outcome}"` : '',
        involvedHandles ? `People involved or named in the tip: ${involvedHandles}.` : '',
        'Turn this into public gossip. Do not reveal who submitted the tip.'
      ].filter(Boolean).join('\n');
      setTimeout(() => triggerGMZPost(gmzTip, { anonymousTip: true }), 3500 + Math.random()*4500);
    }
  }

  // Show loading screen until save file is read
  if (!stateLoaded) return (
    <div style={{background:'#111', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontSize:16, fontFamily:'-apple-system, sans-serif'}}>
      ✦ Loading...
    </div>
  );

  // Determine what to show
  let screenContent;
  if (editChar !== null) {
    screenContent = <EditCharScreen char={editChar} onBack={goBack} onSave={handleSaveChar} />;
  } else if (activeGroupChat) {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <GroupChatScreen group={activeGroupChat} chars={chars} player={player} allChars={[...chars, player]} feed={feed} dms={dms} eventLog={eventLog} groupChats={groupChats} setGroupChats={setGroupChats} onBack={goBack} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setActiveGroupChat(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (chatChar && tab === 'messages') {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <ChatScreen char={chatChar} player={player} allChars={[...chars, player, GMZ_CHAR]} feed={feed} dms={dms} eventLog={eventLog} groupChats={groupChats} setDms={setDms} onBack={goBack} onGMZTipSubmit={handleGMZTipSubmit} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setChatChar(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (viewChar) {
    const liveViewChar = chars.find(c => c.id === viewChar.id) || (player.id === viewChar.id ? player : viewChar);
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <CharProfileScreen char={liveViewChar} player={player} eventLog={eventLog} dms={dms} groupChats={groupChats} onBack={goBack} onDM={(c) => { handleOpenChat(c); setViewChar(null); }} feed={feed} allChars={[...chars, player]} onOpenThread={post => { pushNav(); setThreadPost(post); setViewChar(null); }} onSceneEnd={handleSceneEnd} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setViewChar(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (threadPost) {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <PostThreadView post={threadPost} chars={chars} player={player} onBack={goBack} onCharClick={handleViewChar} feed={feed} onPostUpdate={handleThreadPostUpdate} dms={dms} groupChats={groupChats} eventLog={eventLog} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setThreadPost(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else {
    const mainScreen = (() => {
      switch(tab) {
        case 'feed': return <FeedScreen chars={chars} player={player} feed={feed} setFeed={setFeed} day={day} onCharClick={handleViewChar} onEvent={handleEvent} setTab={setTab} onCompose={() => setComposing(true)} onOpenThread={post => { pushNav(); setThreadPost(post); }} onWatchMatch={handleWatchMatch} currentMatch={currentMatch} onRefreshFeed={handleRefreshFeed} tweaks={tweaks} onOpenTweaks={() => setTweaksOpen(true)} />;
        case 'activity': return <ActivityScreen chars={chars} player={player} onEvent={handleEvent} feed={feed} dms={dms} eventLog={eventLog} onOpenChat={c => { handleOpenChat(c); setTab('messages'); }} onOpenThread={post => { pushNav(); setThreadPost(post); }} section={activitySection} setSection={setActivitySection} />;
        case 'messages': return <MessagesScreen chars={chars} player={player} dms={dms} onOpenChat={handleOpenChat} dmNotifs={dmNotifs} setDmNotifs={setDmNotifs} groupChats={groupChats} setGroupChats={setGroupChats} onOpenGroup={gc => { pushNav(); setActiveGroupChat(gc); }} />;
        case 'notifications': return <NotificationsScreen chars={chars} player={player} feed={feed} onOpenThread={post => { pushNav(); setThreadPost(post); }} onCharClick={handleViewChar} />;
        case 'profile': return <ProfileScreen player={player} chars={chars} socialPresence={socialPresence} eventLog={eventLog} dms={dms} groupChats={groupChats} onEditChar={handleEditChar} onCreateChar={handleCreateChar} onCharClick={handleViewChar} onShowLog={() => { setActivitySection('log'); setTab('activity'); }} onResetGame={handleResetGame} />;
        default: return null;
      }
    })();

    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {mainScreen}
        <BottomNav tab={tab} setTab={setTab} dmNotifs={dmNotifs} />
      </div>
    );
  }

  const isMobile = window.innerWidth <= 480;
  const appContent = (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:C.bg, position:'relative', overflow:'hidden'}}>
      {screenContent}
        {activeMatch && (
          <LiveMatchModal match={activeMatch} chars={chars} player={player} onClose={() => setActiveMatch(null)} onPostToFeed={handleMatchPost} onMatchEnd={handleMatchEnd} />
        )}
        {activeEvent && (
          <EventModal event={activeEvent} chars={chars} player={player} feed={feed} eventLog={eventLog} dms={dms} groupChats={groupChats} onClose={() => setActiveEvent(null)} onSubmit={handleEventSubmit} onLog={handleEventLog} onSocialPresenceGain={addSocialPresence} />
        )}
        {composing && (
          <ComposeModal chars={chars} player={player} onClose={() => setComposing(false)} onPost={post => {
            setFeed(f => [post, ...f]);
            setComposing(false);
            // Player posts: simulate growing engagement
            if (post.charId === 'player') {
              maybeTriggerDMsFromPlayerPost(post);
              const ticks = [
                { delay: 1500,  l: 240,  r: 8,   c: 1 },
                { delay: 4000,  l: 1200, r: 22,  c: 3 },
                { delay: 8500,  l: 4800, r: 64,  c: 7 },
                { delay: 14000, l: 12400,r: 180, c: 14 },
                { delay: 22000, l: 28000,r: 410, c: 24 },
                { delay: 34000, l: 56000,r: 820, c: 38 },
              ];
              ticks.forEach(t => setTimeout(() => {
                const jitter = (n) => Math.max(0, Math.round(n * (0.85 + Math.random()*0.3)));
                setFeed(f => f.map(p => p.id === post.id
                  ? {...p, likes: jitter(t.l), reposts: jitter(t.r), comments: jitter(t.c)}
                  : p));
              }, t.delay));
            }
          }} />
        )}
      </div>
  );

  return (
    <>
    {isMobile ? (
      <div style={{
        width: '100vw', height: '100dvh',
        background: C.bg, display: 'flex', flexDirection: 'column',
        paddingTop: 'env(safe-area-inset-top)',
        paddingBottom: 0,
        overflow: 'hidden',
      }}>
        {appContent}
      </div>
    ) : (
      <IOSDevice dark={tweaks.darkMode}>{appContent}</IOSDevice>
    )}
    <TweaksPanel open={tweaksOpen} onOpenChange={setTweaksOpen}>
      <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
      <TweakSection label="Accent color" />
      <TweakColor label="Accent" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
      <TweakSection label="Feed" />
      <TweakSlider label="Font size" value={tweaks.fontSize} min={12} max={18} step={1} unit="px" onChange={v => setTweak('fontSize', v)} />
      <TweakToggle label="Compact feed" value={tweaks.compactFeed} onChange={v => setTweak('compactFeed', v)} />
    </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<style>
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</body>
</html>
