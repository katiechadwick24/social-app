function GroupChatScreen({ group, chars, player, allChars, feed, dms, setGroupChats, onBack }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [msgs, setMsgs] = useState(group.messages || []);
  const bottomRef = useRef(null);
  const members = group.members.map(id => allChars.find(c => c.id === id)).filter(Boolean);

  useEffect(() => { if (bottomRef.current) bottomRef.current.scrollTop = 9999; }, [msgs]);

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', charId:'player', text: input.trim(), id: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs);
    setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: newMsgs} : g));
    setInput('');
    setLoading(true);

    // Each member may respond, with some chance of silence
    const recentFeed = feed.slice(0,5).map(p => {
      const poster = allChars.find(c => c.id === p.charId);
      return `@${poster?.handle}: "${p.text?.slice(0,60)}"`;
    }).join('\n');

    const historyStr = newMsgs.slice(-8).map(m => {
      const sender = m.role === 'user' ? player : allChars.find(c => c.id === m.charId);
      return `${sender?.name || 'Someone'}: "${m.text}"`;
    }).join('\n');

    let updatedMsgs = [...newMsgs];
    for (const member of members) {
      const quietTypes = ['reserved','quiet','deadpan','minimal'];
      const isQuiet = quietTypes.some(q => (member.personality||'').includes(q));
      if (Math.random() < (isQuiet ? 0.4 : 0.15)) continue; // sometimes they don't respond

      try {
        const otherMembers = members.filter(m => m.id !== member.id).map(m => `${m.name} (@${m.handle}; pronouns: ${pronounsFor(m)}): ${m.personality}`).join('; ');
        const reply = await window.claude.complete({ messages:[{ role:'user', content:
          `You are ${member.name} (@${member.handle}; pronouns: ${pronounsFor(member)}) in a group chat called "${group.name}".
Personality: ${member.personality}. ${member.description?.slice(0,200)}
Other people in this chat: ${otherMembers}, and ${player.name} (@${player.handle}).
${pronounRule([member, player, ...members])}
Recent campus feed:\n${recentFeed}
Chat history:\n${historyStr}
${player.name} just said: "${input}"
Write your response (1-2 sentences, in character). Use the pronouns listed above exactly. Sometimes address specific people by @handle. Sometimes ignore the question and say something tangential. Be natural.` }]
        });
        const charMsg = { role:'char', charId: member.id, text: reply.trim().replace(/^["']|["']$/g,''), id: Date.now() + Math.random() };
        updatedMsgs = [...updatedMsgs, charMsg];
        setMsgs([...updatedMsgs]);
        setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: [...updatedMsgs]} : g));
        await new Promise(r => setTimeout(r, 800 + Math.random()*1200));
      } catch(e) {}
    }
    setLoading(false);
  }

  const getChar = id => id === 'player' ? player : allChars.find(c => c.id === id);

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg}}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
          <div style={{display:'flex', marginRight:8}}>
            {members.slice(0,3).map((m,i) => <div key={m.id} style={{marginLeft: i>0?-10:0, zIndex:3-i}}><Avatar char={m} size={32}/></div>)}
          </div>
          <div>
            <div style={{color:C.text, fontWeight:700, fontSize:15}}>{group.name}</div>
            <div style={{color:C.muted, fontSize:12}}>{members.map(m=>m.name.split(' ')[0]).join(', ')}</div>
          </div>
        </div>
      </div>
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8}}>
        {msgs.map(m => {
          const sender = getChar(m.charId || (m.role === 'user' ? 'player' : null));
          const isMe = m.role === 'user';
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={sender} size={26}/>}
              <div style={{maxWidth:'78%'}}>
                {!isMe && <div style={{color:C.muted, fontSize:11, marginBottom:3, paddingLeft:4}}>{sender?.name?.split(' ')[0]}</div>}
                <div style={{
                  padding:'9px 13px', borderRadius: isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',
                  background: isMe ? C.blue : C.card2, color:'#fff', fontSize:13, lineHeight:1.5,
                }}>{m.text}</div>
              </div>
            </div>
          );
        })}
        {loading && <div style={{color:C.muted, fontSize:13, paddingLeft:8}}>Someone is typing...</div>}
      </div>
      <div style={{padding:'10px 12px', borderTop:`1px solid ${C.border}`, display:'flex', gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Message the group..."
          style={{flex:1, background:C.card2, border:`1px solid ${C.border}`, borderRadius:20, padding:'10px 14px', color:C.text, fontSize:14, outline:'none'}}/>
        <button onClick={send} disabled={!input.trim()||loading} style={{
          background:input.trim()?C.blue:'#333', border:'none', borderRadius:'50%', width:38, height:38,
          color:'#fff', cursor:input.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
        }}>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>
  );
}

function ComposeModal({ chars, player, onClose, onPost }) {
  const [text, setText] = useState('');
  const [photo, setPhoto] = useState(null);
  const [selectedChar, setSelectedChar] = useState(player);
  const allChars = [player, ...chars];
  const fileRef = useRef(null);

  function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setPhoto(ev.target.result);
    reader.readAsDataURL(file);
  }

  function submit() {
    if (!text.trim() && !photo) return;
    onPost({
      id: `post-${Date.now()}`,
      charId: selectedChar.id,
      text: text.trim(),
      photo,
      likes: 0, reposts: 0, comments: 0,
      timestamp: Date.now(),
      reply: null,
    });
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.8)', zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end'}}>
      <div style={{background:C.card, borderRadius:'20px 20px 0 0', padding:'16px', maxHeight:'85%', display:'flex', flexDirection:'column'}}>
        {/* Header */}
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>

          <span style={{color:C.text, fontWeight:700, fontSize:15}}>New Post</span>
          <button onClick={submit} disabled={!text.trim() && !photo} style={{
            background: (text.trim() || photo) ? C.blue : '#333', color:'#fff', border:'none',
            borderRadius:20, padding:'6px 16px', fontSize:14, fontWeight:700, cursor:(text.trim()||photo)?'pointer':'default',
          }}>Post</button>
        </div>

        {/* Post as */}
        <div style={{marginBottom:12}}>
          <p style={{color:C.muted, fontSize:11, marginBottom:6}}>POST AS</p>
          <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4}}>
            {allChars.map(c => (
              <button key={c.id} onClick={() => setSelectedChar(c)} style={{
                display:'flex', alignItems:'center', gap:6, background: selectedChar.id === c.id ? C.blue+'22' : C.card2,
                border:`1.5px solid ${selectedChar.id === c.id ? C.blue : C.border}`,
                borderRadius:20, padding:'5px 12px', cursor:'pointer', flexShrink:0,
              }}>
                <Avatar char={c} size={20} />
                <span style={{color: selectedChar.id === c.id ? C.blue : C.text, fontSize:12, fontWeight:600}}>{c.name.split(' ')[0]}</span>
              </button>

        <div style={{display:'flex', gap:10, flex:1}}>
          <Avatar char={selectedChar} size={38} />
          <div style={{flex:1}}>
            <textarea value={text} onChange={e => setText(e.target.value)}

              style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:15, outline:'none', resize:'none', minHeight:80, lineHeight:1.6}}
            />
            {/* Photo preview */}
            {photo && (
              <div style={{position:'relative', marginTop:8}}>
                <img src={photo} alt="" style={{width:'100%', borderRadius:12, maxHeight:200, objectFit:'cover'}} />
                <button onClick={() => setPhoto(null)} style={{position:'absolute', top:6, right:6, background:'rgba(0,0,0,0.7)', border:'none', color:'#fff', borderRadius:'50%', width:26, height:26, cursor:'pointer', fontSize:14}}>×</button>
              </div>

        {/* Toolbar */}
        <div style={{borderTop:`1px solid ${C.border}`, paddingTop:12, marginTop:8, display:'flex', gap:16, alignItems:'center'}}>

          <button onClick={() => fileRef.current.click()} style={{background:'none', border:'none', color:C.blue, cursor:'pointer', display:'flex', alignItems:'center', gap:4, fontSize:13}}>

// ─── Event Modal ──────────────────────────────────────────────────
function EventModal({ event, chars, player, feed, onClose, onSubmit, onLog, onSocialPresenceGain }) {
  const [input, setInput] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [currentEvent, setCurrentEvent] = useState(event);
  const involved = chars.filter(c => currentEvent.chars.includes(c.id));

  function reroll() {
    const others = EVENT_POOL.filter(e => e.id !== currentEvent.id);
    setCurrentEvent(others[Math.floor(Math.random() * others.length)]);
    setInput('');
  }

  const xp = Math.floor(Math.random() * (currentEvent.xp[1] - currentEvent.xp[0])) + currentEvent.xp[0];

  async function handleSubmit() {
    if (!input.trim() || loading) return;
    setLoading(true);
    try {
      const charDescs = involved.map(c => `${c.name} (@${c.handle}; pronouns: ${pronounsFor(c)}) — personality: ${c.personality}. Description: ${c.description}`).join('\n');
      const recentFeedContext = feed ? [...feed].slice(0,8).map(p => {
        const poster = [...(chars||[]), player].find(c=>c.id===p.charId);
        return `@${poster?.handle||p.charId}: "${p.text}"`;
      }).join('\n') : '';
      const response = await window.claude.complete({
        messages: [{
          role:'user',
          content: `You are narrating a social media event like a dramatic story beat.

CHARACTERS INVOLVED:
${charDescs}

PLAYER: ${player.name} (@${player.handle}) — ${player.personality}

${pronounRule([player, ...involved])}

RECENT FEED CONTEXT:
${recentFeedContext}

EVENT: "${event.scenario}"
PLAYER'S ACTION: "${input}"

Write a punchy 2-3 sentence outcome. Be dramatic, entertaining, and true to each character's personality. Reference @handles. Use the pronouns listed above exactly. Show consequences. Make it feel like something that would blow up on social media. Plain prose only — no headers, no bullet points, no markdown formatting.`
        }]
      });
      const cleaned = response
        .replace(/^#+\s+.*/gm, '')       // strip # headers
        .replace(/\*\*(.*?)\*\*/g, '$1') // strip bold
        .replace(/\*(.*?)\*/g, '$1')     // strip italic
        .replace(/_{1,2}(.*?)_{1,2}/g, '$1')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      setResult(cleaned);
      // Generate score changes
      const followerGain = Math.floor(xp * (1800 + Math.random() * 1200));
      const statGain = +(Math.random() * 0.3 + 0.1).toFixed(2);
      const evType = currentEvent.type || 'gossip';
      const socialGain = {
        humor: +(statGain * (evType === 'tag' ? 1.2 : evType === 'opportunity' ? 0.9 : 1)).toFixed(2),
        aura: +(statGain * (evType === 'opportunity' ? 1.3 : 0.8)).toFixed(2),
        drama: +(statGain * (evType === 'scandal' ? 1.6 : evType === 'gossip' ? 1.2 : 0.7)).toFixed(2),
      };
      const scoreChanges = [
        { icon:'✨', label:'Experience', value: xp, unit:'', flavor: evType === 'scandal' ? 'Chaos is a ladder, apparently.' : evType === 'tag' ? 'You answered the call.' : evType === 'opportunity' ? 'The window was open. You flew through it.' : 'Drama points well spent.' },
        { icon:'👥', label:'Followers', value: `+${(followerGain >= 1000 ? (followerGain/1000).toFixed(0)+'K' : followerGain)}`, unit:'', flavor: evType === 'scandal' ? 'Everyone loves a scandal.' : 'Word travels fast on campus.' },
        { icon:'😂', label:'Humor', value: `+${socialGain.humor}`, unit:'%', flavor: 'Your wit is showing.' },
        { icon:'⭐', label:'Aura', value: `+${socialGain.aura}`, unit:'%', flavor: 'Presence confirmed.' },
        { icon:'🔥', label:'Drama', value: `+${socialGain.drama}`, unit:'%', flavor: evType === 'scandal' ? 'Mess travels beautifully.' : 'The timeline noticed.' },
        ...currentEvent.chars.map(cid => {
          const delta = +(Math.random() * 1.2 - 0.3).toFixed(2);
          const flavorMap = { scandal: delta > 0 ? 'Impressed by the chaos.' : 'Not thrilled about this.', gossip: 'Taking notes.', tag: delta > 0 ? 'Appreciated the response.' : 'Was not expecting that.', opportunity: delta > 0 ? 'Respects the move.' : 'Saw what you did there.' };
          return { avatar: cid, label: `@${cid}`, value: delta, unit:'%', flavor: flavorMap[evType] || 'Watching closely.' };
        }),
      ];
      onSocialPresenceGain && onSocialPresenceGain(socialGain);
      onLog && onLog({
        type: 'event',
        eventType: evType,
        scenario: currentEvent.scenario,
        action: input,
        outcome: response,
        chars: currentEvent.chars,
        xp,
        scoreChanges,
        timestamp: Date.now(),
      });
    } catch(e) {
      setResult('The drama unfolds... and everyone is watching.');
    }
    setLoading(false);
  }

  return (
    <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', justifyContent:'flex-end', zIndex:100}}>
      <div style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.7)', backdropFilter:'blur(6px)'}} onClick={onClose}/>
      <div style={{position:'relative', background:C.card, borderRadius:'24px 24px 0 0', padding:'24px 18px 36px', maxHeight:'82%', overflowY:'auto'}}>

        {/* drag handle */}
        <div style={{width:36, height:4, background:C.border, borderRadius:2, margin:'0 auto 20px'}}/>

        <button onClick={onClose} style={{position:'absolute', top:18, right:18, background:C.card2, border:'none', color:C.muted, borderRadius:'50%', width:28, height:28, cursor:'pointer', fontSize:15, display:'flex', alignItems:'center', justifyContent:'center'}}>×</button>

        {!result ? (
          <>
            {/* Type badge + involved chars */}
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:14}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700, letterSpacing:'0.04em'}}>{t.label.toUpperCase()}</span>
                </div>
              );})()}
              <div style={{display:'flex', gap:-6, marginLeft:'auto'}}>
                {involved.map((c,i) => <div key={c.id} style={{marginLeft: i>0 ? -8 : 0}}><Avatar char={c} size={26}/></div>)}
              </div>
            </div>

            {/* Scenario */}
            <div style={{marginBottom:16}}>
              <p style={{color:C.text, fontSize:15, lineHeight:1.65, fontWeight:500}}>{currentEvent.scenario}</p>
            </div>

            {/* XP + reroll row */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:16}}>
              <button onClick={reroll} style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:10, width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, cursor:'pointer', flexShrink:0}} title="Reroll">🎲</button>
              <div style={{flex:1, background:C.card2, borderRadius:10, padding:'8px 12px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                <span style={{color:C.muted, fontSize:12}}>XP reward</span>
                <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>+{currentEvent.xp[0]}–{currentEvent.xp[1]} ✦</span>
              </div>
            </div>

            {/* Input */}
            <textarea value={input} onChange={e => setInput(e.target.value)}
              placeholder="What do you do?"
              style={{width:'100%', background:C.card2, border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`, borderRadius:14, padding:'12px 14px', color:C.text, fontSize:14, outline:'none', resize:'none', minHeight:100, marginBottom:14, transition:'border-color 0.2s'}}
            />

            <button onClick={handleSubmit} disabled={!input.trim() || loading} style={{
              width:'100%', background: input.trim() ? C.text : C.card2, color: input.trim() ? C.bg : C.muted,
              border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
              cursor: input.trim() ? 'pointer' : 'default', transition:'background 0.2s, color 0.2s',
            }}>{loading ? 'Playing out…' : 'Submit'}</button>
          </>
        ) : (
          <div>
            {/* Outcome header */}
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700}}>OUTCOME</span>
                </div>
              );})()}
            </div>

            {/* Quoted action */}
            <div style={{borderLeft:`3px solid ${C.border}`, paddingLeft:12, marginBottom:14}}>
              <p style={{color:C.muted, fontSize:12, marginBottom:4}}>YOUR MOVE</p>
              <p style={{color:C.text, fontSize:13, lineHeight:1.5, fontStyle:'italic'}}>"{input}"</p>
            </div>

            <div style={{background:C.card2, borderRadius:14, padding:'14px', marginBottom:14}}>
              <p style={{color:C.text, fontSize:14, lineHeight:1.75}}>{result}</p>
            </div>

            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:`${C.yellow}12`, border:`1px solid ${C.yellow}33`, borderRadius:12, padding:'12px 16px', marginBottom:18}}>
              <span style={{color:C.muted, fontSize:13}}>XP earned</span>
              <span style={{color:C.yellow, fontWeight:700, fontSize:16}}>+{xp} ✦</span>
            </div>

            <button onClick={onClose} style={{width:'100%', background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>Back to Feed</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Activity Log helpers (shared by Activity > Log tab) ─────────
function LogScoreRow({ ch, allChars }) {
  const isNumeric = typeof ch.value === 'number';
  const positive = isNumeric ? ch.value > 0 : String(ch.value).startsWith('+');
  const color = positive ? C.green : C.red;
  const displayVal = isNumeric
    ? `${ch.value > 0 ? '+':''}${ch.value}${ch.unit||''}`
    : `${ch.value}${ch.unit||''}`;
  const relChar = ch.avatar ? allChars.find(c => c.id === ch.avatar) : null;
  return (
    <div style={{paddingBottom:12, marginBottom:12, borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        {relChar
          ? <Avatar char={relChar} size={24}/>
          : <span style={{fontSize:18, width:24, textAlign:'center'}}>{ch.icon}</span>
        }
        <span style={{color:C.text, fontWeight:700, fontSize:14, flex:1}}>
          {relChar ? `@${relChar.handle}` : ch.label}
        </span>
        <span style={{color, fontWeight:800, fontSize:15}}>{displayVal}</span>
      </div>
      {ch.flavor && <p style={{color:C.muted, fontSize:12, marginTop:4, marginLeft:32, lineHeight:1.4}}>{ch.flavor}</p>}
    </div>
  );
}

function LogEntryCard({ entry, idx, allChars, collapsed, toggle }) {
  const outcomeKey = `out-${idx}`;
  const scoreKey   = `score-${idx}`;
  const evType     = entry.eventType || entry.type;
  const typeInfo   = EVENT_TYPES[evType] || { label:'Action', color:C.blue, emoji:'✦' };

  const headerMap = {
    reply:     { color:C.blue,   emoji:'💬', label:'You replied:' },
    dm:        { color:C.purple, emoji:'✉️',  label:'DM sent' },
    milestone: { color:C.green,  emoji:'🏆', label:'Milestone completed:' },
    autopost:  { color:C.muted,  emoji:'📝', label:'Posted to feed' },
  };
  const header = entry.type === 'event'
    ? { color: typeInfo.color, emoji: typeInfo.emoji, label: typeInfo.label + ' event' }
    : (headerMap[entry.type] || { color:C.blue, emoji:'✦', label:'Action' });

  const char = allChars.find(c => c.id === entry.charId);
  const outCollapsed   = collapsed[outcomeKey] ?? false;
  const scoreCollapsed = collapsed[scoreKey]   ?? false;

  return (
    <div style={{marginBottom:16}}>
      <div style={{background:`${header.color}10`, border:`1px solid ${header.color}30`, borderRadius:16, padding:'14px 16px', marginBottom:6}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:10}}>
          <span style={{fontSize:15}}>{header.emoji}</span>
          <span style={{color:header.color, fontWeight:700, fontSize:13}}>{header.label.toUpperCase()}</span>
        </div>
        {entry.type === 'event' && <>
          <p style={{color:C.muted, fontSize:12, lineHeight:1.4, marginBottom:10}}>{entry.scenario}</p>
          <div style={{borderLeft:`2px solid ${header.color}60`, paddingLeft:10}}>
            <p style={{color:C.text, fontSize:14, lineHeight:1.55, fontStyle:'italic'}}>"{entry.action}"</p>
          </div>
        </>}
        {entry.type === 'reply' && char && (
          <div style={{display:'flex', gap:10, alignItems:'flex-start'}}>
            <Avatar char={char} size={36}/>
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
                <Verified/>
                <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
              </div>
              <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{entry.text}</p>
            </div>
          </div>
        )}
        {entry.type === 'dm' && char && (
          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            <Avatar char={char} size={32}/>
            <div style={{flex:1}}>
              <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
              <p style={{color:C.muted, fontSize:12, marginTop:2}}>{(entry.text||'').slice(0,80)}…</p>
            </div>
          </div>
        )}
        {entry.type === 'milestone' && (
          <p style={{color:C.text, fontSize:14, lineHeight:1.6, fontWeight:500}}>{entry.text}</p>
        )}
      </div>

      {entry.outcome && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px', marginBottom:6}}>
          <button onClick={() => toggle(outcomeKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: outCollapsed ? 0 : 10}}>
            <span style={{color:C.blue, fontWeight:700, fontSize:13}}>Outcome</span>
            <span style={{color:C.muted, fontSize:12}}>{outCollapsed ? '▼' : '▲'}</span>
          </button>
          {!outCollapsed && <p style={{color:C.text, fontSize:13, lineHeight:1.75}}>{entry.outcome}</p>}
        </div>
      )}

      {entry.scoreChanges?.length > 0 && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px'}}>
          <button onClick={() => toggle(scoreKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: scoreCollapsed ? 0 : 14}}>
            <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>Score Changes</span>
            <span style={{color:C.muted, fontSize:12}}>{scoreCollapsed ? '▼' : '▲'}</span>
          </button>
          {!scoreCollapsed && (
            <div>
              {entry.scoreChanges.map((ch, i) => (
                <LogScoreRow key={i} ch={ch} allChars={allChars}/>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ActivityScreen({ chars, player, onEvent, feed, dms, eventLog, onOpenChat, onOpenThread, section, setSection }) {
  const allChars = [...chars, player];
  const currentEvent = EVENT_POOL[Math.floor(Date.now()/1000) % EVENT_POOL.length];
  const activeSection = section || 'posts';
  const setActiveSection = setSection || (() => {});

  // My posts — anything posted by player
  const myPosts = feed.filter(p => p.charId === 'player');

  // Recent DM previews — only convos with messages (include GMZ if active)
  const charsForDms = (dms[GMZ_CHAR.id]||[]).length > 0 ? [GMZ_CHAR, ...chars] : chars;
  const activeDMs = charsForDms.filter(c => (dms[c.id]||[]).length > 0);

  function timeAgo(ts) {
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }

  const tabs = [
    { id:'posts', label:'My Posts' },
    { id:'events', label:'Events' },
    { id:'dms', label:'DMs' },
    { id:'log', label:'Log' },
  ];

  // Log tab state
  const [logCollapsed, setLogCollapsed] = useState({});
  const [logShowDMs, setLogShowDMs] = useState(false);
  const toggleLog = (key) => setLogCollapsed(c => ({...c, [key]: !c[key]}));
  const filteredLog = logShowDMs ? eventLog : eventLog.filter(e => e.type !== 'dm');

  return (
    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'16px 16px 0', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:5}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
          <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Activity</h1>
          <button onClick={() => onEvent(currentEvent)} style={{
            background:C.blue, color:'#fff', border:'none', borderRadius:20,
            padding:'7px 16px', fontSize:13, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6,
          }}>📣 Event</button>
        </div>
        {/* Section tabs */}
        <div style={{display:'flex', gap:0, borderBottom:`1px solid ${C.border}`}}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveSection(t.id)} style={{
              flex:1, background:'none', border:'none', color: activeSection===t.id ? C.text : C.muted,
              fontWeight: activeSection===t.id ? 700 : 400, fontSize:14, padding:'10px 0', cursor:'pointer',
              borderBottom: activeSection===t.id ? `2px solid ${C.blue}` : '2px solid transparent',
              transition:'all 0.2s',
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* MY POSTS */}
      {activeSection === 'posts' && (
        <div>
          {myPosts.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>✍️</div>
              <p style={{color:C.muted, fontSize:14}}>You haven't posted yet.</p>
              <p style={{color:C.muted, fontSize:13, marginTop:4}}>Hit + on the feed to post something.</p>
            </div>
          ) : myPosts.map(post => (
            <div key={post.id} onClick={() => onOpenThread && onOpenThread(post)} style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, cursor:'pointer'}}>
              <div style={{display:'flex', gap:10}}>
                <Avatar char={player} size={38} />
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                    <span style={{fontWeight:700, fontSize:14, color:C.text}}>{player.name}</span>
                    <CharBadge char={player} />
                    <span style={{color:C.muted, fontSize:12}}>· {timeAgo(post.timestamp)}</span>
                  </div>

                  {post.photo && <img src={post.photo} alt="" style={{width:'100%', borderRadius:10, marginTop:6, maxHeight:160, objectFit:'cover'}}/>}
                  <div style={{display:'flex', gap:16, marginTop:8}}>
                    <span style={{color:C.muted, fontSize:12, display:'inline-flex', alignItems:'center', gap:3}}><ReplyGlyph size={13} /> {post.comments}</span>

                  </div>

              </div>
            </div>
          ))}
        </div>
      )}

      {activeSection === 'events' && (

            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>📣</div>

                <div style={{flex:1}}>

                      <Verified/>
                      <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
                    </div>
                    {/* Last 2 messages preview */}
                    <div style={{display:'flex', flexDirection:'column', gap:4}}>
                      {[prevMsg, lastMsg].filter(Boolean).map((m,i) => {
                        const isMe = m.role === 'user';
                        return (
                          <div key={i} style={{display:'flex', alignItems:'flex-start', gap:6}}>
                            <div style={{width:22, height:22, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center'}}>
                              {isMe ? <Avatar char={player} size={20}/> : <Avatar char={char} size={20}/>}
                            </div>
                            <div style={{
                              background: isMe ? C.blue+'33' : C.card2,
                              borderRadius:10, padding:'6px 10px', flex:1,
                            }}>
                              <p style={{color: isMe ? C.blue : C.text, fontSize:13, lineHeight:1.4}}>{m.text}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <p style={{color:C.muted, fontSize:11, marginTop:6}}>{msgs.length} messages total</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* LOG */}
      {activeSection === 'log' && (
        <div>
          {/* DM filter toggle */}
          {eventLog.length > 0 && (
            <div style={{display:'flex', justifyContent:'flex-end', padding:'10px 16px 0'}}>
              <button onClick={() => setLogShowDMs(s=>!s)} style={{background:C.card2, border:`1px solid ${C.border}`, color:logShowDMs ? C.blue : C.muted, borderRadius:10, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>
                {logShowDMs ? 'Hide DMs' : 'Show DMs'}
              </button>
            </div>
          )}

          {/* Rewind bar */}
          {filteredLog.length > 0 && (
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', margin:'10px 14px 4px', padding:'10px 14px', background:`${C.yellow}0a`, border:`1px solid ${C.yellow}22`, borderRadius:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <div style={{width:32, height:32, borderRadius:'50%', background:C.card2, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16}}>↩</div>
                <div>
                  <p style={{color:C.text, fontSize:13, fontWeight:700}}>Rewind</p>
                  <p style={{color:C.muted, fontSize:11}}>Undo last action</p>
                </div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:6, background:`${C.yellow}18`, border:`1px solid ${C.yellow}44`, borderRadius:20, padding:'5px 12px'}}>
                <span style={{fontSize:14}}>💜</span>
                <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>14</span>
              </div>
            </div>
          )}

          <div style={{padding:'10px 14px'}}>
            {filteredLog.length === 0 ? (
              <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:60}}>
                <div style={{fontSize:44, marginBottom:14}}>📋</div>
                <p style={{fontWeight:600, color:C.text}}>No activity yet</p>
                <p style={{fontSize:12, marginTop:6}}>Respond to events, reply to posts, or slide into DMs.</p>
              </div>
            ) : (
              [...filteredLog].reverse().map((entry, i) => (
                <LogEntryCard key={i} entry={entry} idx={i} allChars={allChars} collapsed={logCollapsed} toggle={toggleLog}/>
              ))
            )}
          </div>
        </div>
      )}
      <div style={{height:24}}/>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweakState] = useState(TWEAK_DEFAULTS);
  C = buildTheme(tweaks);
  const { tweaksVisible, setTweak } = useTweaks(TWEAK_DEFAULTS, setTweakState);

  // ── Server-side persistence ───────────────────────────────────
  const _saveTimer = useRef(null);

  function isFileMode() {
    return window.location.protocol === 'file:';
  }

  function saveLocalState(state) {
    try {
      window.localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  function loadLocalState() {
    try {
      return JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || '{}');
    } catch(e) {
      return {};
    }
  }

  function isCurrentSave(saved) {
    return saved && saved.stateVersion === SAVE_STATE_VERSION;
  }

  function withStateVersion(state) {
    return { ...state, stateVersion: SAVE_STATE_VERSION, savedAt: Date.now() };
  }

  function applySavedState(saved) {
    if (saved.chars)      setCharsRaw(saved.chars);
    if (saved.player)     setPlayerRaw(saved.player);
    if (saved.feed)       setFeedRaw(saved.feed);
    if (saved.dms)        setDmsRaw(saved.dms);
    if (saved.groupChats) setGroupChatsRaw(saved.groupChats);
    if (saved.eventLog)   setEventLogRaw(saved.eventLog);
    if (typeof saved.day === 'number') setDayRaw(saved.day);
    if (saved.socialPresence) setSocialPresenceRaw(saved.socialPresence);
  }

  function chooseSavedState(serverState, localState) {
    const serverCurrent = isCurrentSave(serverState);
    const localCurrent = isCurrentSave(localState);
    if (serverCurrent && localCurrent) {
      return (Number(localState.savedAt || 0) > Number(serverState.savedAt || 0)) ? localState : serverState;
    }
    if (localCurrent) return localState;
    if (serverCurrent) return serverState;
    return null;
  }

  function serverSave(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    _saveTimer.current = setTimeout(() => {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(versionedState),
      }).catch(() => {});
    }, 1500);
  }

  function serverSaveNow(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(versionedState),
    }).catch(() => {});
  }

  const [chars, setCharsRaw] = useState(DEFAULT_CHARS);
  const [player, setPlayerRaw] = useState(DEFAULT_PLAYER);
  const [feed, setFeedRaw] = useState(DEFAULT_FEED);
  const [dms, setDmsRaw] = useState({});
  const [groupChats, setGroupChatsRaw] = useState(DEFAULT_GROUP_CHATS);
  const [eventLog, setEventLogRaw] = useState([]);
  const [day, setDayRaw] = useState(DEFAULT_DAY);
  const [socialPresence, setSocialPresenceRaw] = useState(DEFAULT_SOCIAL_PRESENCE);
  const [stateLoaded, setStateLoaded] = useState(false);

  function cloneDefault(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function clearPlayerRelationships(list) {
    return list.map(char => {
      if (!char.relationships || !Object.prototype.hasOwnProperty.call(char.relationships, 'player')) return char;
      const { player: _playerRelationship, ...relationships } = char.relationships;
      return { ...char, relationships };
    });
  }

  function freshGameState({ preserveProfiles = false } = {}) {
    const freshChars = preserveProfiles ? clearPlayerRelationships(cloneDefault(chars)) : cloneDefault(DEFAULT_CHARS);
    return {
      chars: freshChars,
      player: preserveProfiles ? cloneDefault(player) : cloneDefault(DEFAULT_PLAYER),
      feed: cloneDefault(DEFAULT_FEED),
      dms: {},
      groupChats: cloneDefault(DEFAULT_GROUP_CHATS),
      eventLog: [],
      day: DEFAULT_DAY,
      socialPresence: preserveProfiles ? cloneDefault(FRESH_SOCIAL_PRESENCE) : cloneDefault(DEFAULT_SOCIAL_PRESENCE),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now(),
    };
  }

  // Load saved state from server on startup
  useEffect(() => {
    const localSaved = loadLocalState();
    if (isFileMode()) {
      if (isCurrentSave(localSaved)) {
        applySavedState(localSaved);
      } else {
        window.localStorage.removeItem(LOCAL_STATE_KEY);
      }
      setStateLoaded(true);
      return;
    }
    fetch('/api/state').then(r => r.json()).then(saved => {
      const bestSaved = chooseSavedState(saved, localSaved);
      if (bestSaved) {
        applySavedState(bestSaved);
        if (bestSaved === localSaved) serverSaveNow(bestSaved);
      } else if (saved && Object.keys(saved).length) {
        serverSaveNow(freshGameState());
      }
      setStateLoaded(true);
    }).catch(() => setStateLoaded(true));
  }, []);

  // Wrapped setters — update state and schedule a server save
  function setChars(v)      { setCharsRaw(prev      => { const next = typeof v==='function'?v(prev):v;                    serverSave({chars:next,player,feed,dms,groupChats,eventLog,day,socialPresence}); return next; }); }
  function setPlayer(v)     { setPlayerRaw(prev     => { const next = typeof v==='function'?v(prev):v;                    serverSave({chars,player:next,feed,dms,groupChats,eventLog,day,socialPresence}); return next; }); }
  function setFeed(v)       { setFeedRaw(prev       => { const next = (typeof v==='function'?v(prev):v).slice(0,60);      serverSave({chars,player,feed:next,dms,groupChats,eventLog,day,socialPresence}); return next; }); }
  function setDms(v)        { setDmsRaw(prev        => { const next = typeof v==='function'?v(prev):v;                    serverSave({chars,player,feed,dms:next,groupChats,eventLog,day,socialPresence}); return next; }); }
  function setGroupChats(v) { setGroupChatsRaw(prev => { const next = typeof v==='function'?v(prev):v;                    serverSave({chars,player,feed,dms,groupChats:next,eventLog,day,socialPresence}); return next; }); }
  function setEventLog(v)   { setEventLogRaw(prev   => { const next = (typeof v==='function'?v(prev):v).slice(0,30);      serverSave({chars,player,feed,dms,groupChats,eventLog:next,day,socialPresence}); return next; }); }
  function setDay(v)        { setDayRaw(prev        => { const next = typeof v==='function'?v(prev):v;                    serverSave({chars,player,feed,dms,groupChats,eventLog,day:next,socialPresence}); return next; }); }
  function setSocialPresence(v) { setSocialPresenceRaw(prev => { const next = typeof v==='function'?v(prev):v;             serverSave({chars,player,feed,dms,groupChats,eventLog,day,socialPresence:next}); return next; }); }

  function addSocialPresence(gains) {
    setSocialPresence(prev => ({
      humor: Math.min(300, +(Number(prev?.humor || 0) + Number(gains?.humor || 0)).toFixed(2)),
      aura: Math.min(300, +(Number(prev?.aura || 0) + Number(gains?.aura || 0)).toFixed(2)),
      drama: Math.min(300, +(Number(prev?.drama || 0) + Number(gains?.drama || 0)).toFixed(2)),
    }));
  }
  const [activeGroupChat, setActiveGroupChat] = useState(null);
  const [tab, setTab] = useState('feed');
  const [chatChar, setChatChar] = useState(null);
  const [viewChar, setViewChar] = useState(null);
  const [editChar, setEditChar] = useState(null);
  const [activeEvent, setActiveEvent] = useState(null);
  const [composing, setComposing] = useState(false);
  const [threadPost, setThreadPost] = useState(null);
  const [dmNotifs, setDmNotifs] = useState({});
  const [activeMatch, setActiveMatch] = useState(null);
  const [activitySection, setActivitySection] = useState('posts');
  const currentMatch = MATCH_SCHEDULE.find(m => m.day === day && m.status !== 'played');
  const [navStack, setNavStack] = useState([]); // navigation history for back buttons

  function handleResetGame() {
    const ok = window.confirm('Start fresh? This clears the saved feed, DMs, activity log, social presence, and current relationships. Your profile and character edits stay.');
    if (!ok) return;
    const next = freshGameState({ preserveProfiles: true });
    setCharsRaw(next.chars);
    setPlayerRaw(next.player);
    setFeedRaw(next.feed);
    setDmsRaw(next.dms);
    setGroupChatsRaw(next.groupChats);
    setEventLogRaw(next.eventLog);
    setDayRaw(next.day);
    setSocialPresenceRaw(next.socialPresence);
    setActiveGroupChat(null);
    setChatChar(null);
    setViewChar(null);
    setEditChar(null);
    setActiveEvent(null);
    setComposing(false);
    setThreadPost(null);
    setDmNotifs({});
    setActiveMatch(null);
    setActivitySection('posts');
    setTab('profile');
    setNavStack([]);
    serverSaveNow(next);
  }

  async function handleRefreshFeed() {
    if (!chars.length) return;
    const weights = chars.map(c => ['chaotic','bold','loud','shameless','provocative'].some(w => (c.personality||'').includes(w)) ? 3 : 1);
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let char = chars[0];
    for (let i = 0; i < chars.length; i++) { r -= weights[i]; if (r <= 0) { char = chars[i]; break; } }
    const otherHandles = chars.filter(c => c.id !== char.id).map(c => `@${c.handle}`).join(', ');
    const recentContext = feed.slice(0,6).map(p => {
      const poster = [...chars, player, GMZ_CHAR].find(c => c.id === p.charId);
      return `@${poster?.handle || '?'}: "${p.text?.slice(0,80)}"`;
    }).join('\n');

    try {
      const raw = await window.claude.complete({ messages:[{ role:'user', content:
        `You are ${char.name} (@${char.handle}), a ${char.personality} college student at Merlin's College of Magic.
Description: ${char.description}
Other campus accounts: ${otherHandles}

Recent campus feed posts:
${recentContext}

Write ONE fresh social media post from ${char.name}'s perspective. Rules:
- Stay completely in character
- 1-2 sentences max, punchy
- Optionally tag 0-2 handles if natural
- Can reference Quidditch, classes, campus drama, spells, dorms, the Great Hall, professors, etc.
- NO hashtags, NO quotes around the post, JUST the post text
${BANNED_PHRASES_RULE}` }] });
      const cleanText = raw.trim().replace(/^["']|["']$/g,'');
      setFeed(f => [{
        id: `pull-${Date.now()}-${char.id}`,
        charId: char.id,
        text: cleanText,
        likes: Math.floor(Math.random()*180000),
        reposts: Math.floor(Math.random()*9000),
        comments: Math.floor(Math.random()*160),
        timestamp: Date.now(),
        reply: null,
        botComments: [],
        isPullGenerated: true,
      }, ...f]);
    } catch(e) {
      const fallback = chars[Math.floor(Math.random()*chars.length)];
      setFeed(f => [{
        id: `pull-${Date.now()}-${fallback.id}`,
        charId: fallback.id,
        text: '...still thinking about what just happened.',
        likes: Math.floor(Math.random()*80000),
        reposts: Math.floor(Math.random()*4000),
        comments: Math.floor(Math.random()*100),
        timestamp: Date.now(),
        reply: null,
        botComments: [],
        isPullGenerated: true,
      }, ...f]);
    }
  }

  // ── Navigation helpers ────────────────────────────────────────
  function getNavState() {
    return { editChar, activeGroupChat, chatChar, viewChar, threadPost, tab };
  }
  function pushNav() {
    setNavStack(s => [...s, getNavState()]);
  }
  function goBack() {
    setNavStack(s => {
      if (!s.length) return s;
      const prev = s[s.length - 1];
      setEditChar(prev.editChar);
      setActiveGroupChat(prev.activeGroupChat);
      setChatChar(prev.chatChar);
      setViewChar(prev.viewChar);
      setThreadPost(prev.threadPost);
      setTab(prev.tab);
      return s.slice(0, -1);
    });
  }
  function handleOpenChat(char) { pushNav(); setChatChar(char); setTab('messages'); }
  function handleViewChar(char) { pushNav(); setViewChar(char); }
  function handleEditChar(char) { pushNav(); setEditChar(char); }
  function handleCreateChar() { pushNav(); setEditChar({ name:'', handle:'', pronouns:'', house:'', bio:'', description:'', personality:'', followers:1000000 }); }

  // Proactive DM: char slides into DMs after hot events
  async function triggerProactiveDM(triggerChar, context) {
    try {
      const allChars = [...chars, player];
      const sysPrompt = buildSystemPrompt(triggerChar, player, allChars, feed, dms);
      const msg = await window.claude.complete({
        messages: [
          { role:'user', content: sysPrompt },
          { role:'assistant', content: `Understood. I'm ${triggerChar.name}.` },
          { role:'user', content: `You just saw something happen (${context}). Slide into ${player.name}'s DMs with a short, in-character opening message — something you'd actually say given your personality. 1-2 sentences max.` }
        ]
      });
      const dmMsg = { role:'char', text: msg, id: Date.now() };
      setDms(d => ({ ...d, [triggerChar.id]: [...(d[triggerChar.id]||[]), dmMsg] }));
      setDmNotifs(n => ({ ...n, [triggerChar.id]: (n[triggerChar.id]||0) + 1 }));
    } catch(e) {}
  }

  // ── Auto-post system ──────────────────────────────────────────
  useEffect(() => {
    let active = true;
    let nextTimer = null;
    const canAutoPost = tab === 'feed' && !threadPost && !viewChar && !chatChar && !activeGroupChat && !editChar && !activeEvent && !activeMatch && !composing;
    if (!canAutoPost) return () => { active = false; };

    async function generatePost() {
      if (!active || chars.length === 0) return;
      // Pick a random char, weighted toward more active personalities
      const weights = chars.map(c => c.personality?.includes('chaotic') || c.personality?.includes('bold') ? 3 : 1);
      const total = weights.reduce((a,b) => a+b, 0);
      let r = Math.random() * total;
      let char = chars[0];
      for (let i = 0; i < chars.length; i++) { r -= weights[i]; if (r <= 0) { char = chars[i]; break; } }

      const otherHandles = chars.filter(c => c.id !== char.id).map(c => `@${c.handle}`).join(', ');
      const promptPeople = [char, player, ...chars];
      const recentContext = feed.slice(0,6).map(p => {
        const poster = [...chars, player].find(c => c.id === p.charId);
        return `@${poster?.handle || '?'}: "${p.text?.slice(0,80)}"`;
      }).join('\n');

      // 35% chance: directed callout at another character (weighted toward rivals)
      const others = chars.filter(c => c.id !== char.id);
      const doCallout = Math.random() < 0.35 && others.length > 0;
      const target = doCallout ? (() => {
        // Weight toward characters with negative or low relationships
        const weights = others.map(o => {
          const rel = char.relationships?.[o.id] ?? 50;
          return Math.max(1, 100 - rel); // lower relationship = higher weight
        });
        const total = weights.reduce((a,b)=>a+b,0);
        let r = Math.random()*total;
        for (let i=0; i<others.length; i++) { r-=weights[i]; if(r<=0) return others[i]; }
        return others[0];
      })() : null;

      try {
        const prompt = doCallout && target
          ? `You are ${char.name} (@${char.handle}; pronouns: ${pronounsFor(char)}), a ${char.personality} college student at Merlin's College of Magic.
Description: ${char.description}
${pronounRule([char, target, player])}
Your relationship with @${target.handle} (${target.name}): ${char.relationships?.[target.id] < 30 ? 'rivals/bad blood' : char.relationships?.[target.id] < 60 ? 'complicated' : 'decent but complicated'}.

Recent campus feed:\n${recentContext}

Write ONE social media post that is specifically directed at or about @${target.handle}. Rules:
- Stay in character (personality: ${char.personality})
- Use the pronouns listed above exactly. Do not misgender anyone.
- 1-2 sentences, punchy — can be shade, a callout, backhanded, passive-aggressive, or surprisingly warm depending on your relationship
- MUST tag @${target.handle} naturally in the text
- NO hashtags, NO quotes around the post, just the post text`
          : `You are ${char.name} (@${char.handle}; pronouns: ${pronounsFor(char)}), a ${char.personality} college student at Merlin's College of Magic (wizarding university, HP-inspired, college-aged).
Description: ${char.description}
${pronounRule(promptPeople)}
Other people on campus: ${otherHandles}

Recent campus feed posts:\n${recentContext}

Write ONE authentic social media post from ${char.name}'s perspective. Rules:
- Stay completely in character (personality: ${char.personality})
- Use the pronouns listed above exactly. Do not misgender anyone.
- 1-2 sentences max, punchy
- Optionally tag 0-2 of the other handles if it's natural — do NOT force it
- Can reference Quidditch, classes, campus drama, spells, dorms, the Great Hall, professors, etc.
- NO hashtags, NO quotes around the post, JUST the post text
- Make it feel real and casual, like they just typed it
${BANNED_PHRASES_RULE}`;

        const raw = await window.claude.complete({ messages:[{ role:'user', content: prompt }] });
        if (!active) return;
        const cleanText = raw.trim().replace(/^["']|["']$/g,'');
        const newPost = {
          id: `auto-${Date.now()}-${char.id}`,
          charId: char.id,
          text: cleanText,
          likes: Math.floor(Math.random()*500000),
          reposts: Math.floor(Math.random()*20000),
          comments: Math.floor(Math.random()*300),
          timestamp: Date.now(),
          reply: null,
          botComments: [],
          isAutoGenerated: true,
        };
        setFeed(f => [newPost, ...f]);

        // 15% chance a second char replies after a short beat
        if (Math.random() < 0.15) {
          const others = chars.filter(c => c.id !== char.id);
          if (others.length) {
            const replier = others[Math.floor(Math.random()*others.length)];
            setTimeout(async () => {
              if (!active) return;
              try {
                const replyRaw = await window.claude.complete({
                  messages:[{ role:'user', content:
                    `You are ${replier.name} (@${replier.handle}; pronouns: ${pronounsFor(replier)}), personality: ${replier.personality}.
${pronounRule([replier, char, player])}
@${char.handle} just posted: "${cleanText}"
Write ONE short reply (1 sentence, in character). Use the pronouns listed above exactly. Tag @${char.handle} if natural. No quotes, just the reply text.` }]
                });
                const replyText = replyRaw.trim().replace(/^["']|["']$/g,'');
                setFeed(f => f.map(p => p.id === newPost.id ? {...p, reply:{ charId: replier.id, text: replyText }} : p));
              } catch(e) {}
            }, 12000 + Math.random()*13000);
          }
        }
      } catch(e) {}
    }

    function scheduleNext(delay) {
      nextTimer = setTimeout(async () => {
        await generatePost();
        if (active) scheduleNext(180000 + Math.random()*180000);
      }, delay);
    }

    // First post after 60s, then every 3-6 minutes while the main feed is open.
    scheduleNext(60000);

    // ── GMZ auto-posts ──────────────────────────────────────────
    // GMZ posts only reactively — see triggerGMZPost called from events/hot threads
    return () => { active = false; clearTimeout(nextTimer); };
  }, [chars.length, tab, threadPost, viewChar, chatChar, activeGroupChat, editChar, activeEvent, activeMatch, composing]); // pause while the user is focused elsewhere

  function handleSaveChar(data) {
    const isNew = !chars.find(c => c.id === data.id) && data.id !== player.id;
    if (data.id === player.id) {
      setPlayer(p => ({...p, ...data}));
    } else if (isNew) {
      setChars(c => [...c, data]);
    } else {
      setChars(c => c.map(ch => ch.id === data.id ? {...ch, ...data} : ch));
    }
    setEditChar(null);
  }

  function handleWatchMatch() { setActiveMatch(currentMatch); }

  function handleMatchPost(text, charId) {
    const newPost = {
      id: `match-${Date.now()}-${Math.random()}`,
      charId: charId || '__gmz__',
      text,
      likes: Math.floor(Math.random()*60000 + 5000),
      reposts: Math.floor(Math.random()*5000),
      comments: Math.floor(Math.random()*100),
      timestamp: Date.now(),
      reply: null,
      botComments: [],
    };
    setFeed(f => [newPost, ...f]);
  }

  async function handleMatchEnd(score) {
    // Mark match as played
    // Trigger character reactions
    const slyWon = currentMatch && (
      (currentMatch.home === 'Slytherin' && score.home > score.away) ||
      (currentMatch.away === 'Slytherin' && score.away > score.home)
    );
    const reactionChars = chars.filter(c => isQuidditchPlayer(c)).slice(0,2);
    for (const char of reactionChars) {
      try {
        const won = ((char.bio+''+(char.description||'')).toLowerCase().includes('slytherin')) === slyWon;
        const raw = await window.claude.complete({ messages:[{ role:'user', content:
          `You are ${char.name} (@${char.handle}; pronouns: ${pronounsFor(char)}), personality: ${char.personality}. Your team just ${won ? 'won' : 'lost'} a Quidditch match against ${won ? 'Gryffindor' : 'Slytherin'} ${score.home}–${score.away}.
${pronounRule([char, player, ...chars])}
Write ONE punchy social media post reaction. Use the pronouns listed above exactly. In character. No hashtags. 1 sentence.`
        }]});
        handleMatchPost(raw.trim().replace(/^["']|["']$/g,''), char.id);
      } catch(e) {}
    }
    // GMZ post-game
    setTimeout(() => triggerGMZPost(`The match just ended: ${currentMatch?.home} ${score.home} – ${score.away} ${currentMatch?.away}`), 3000);
    setActiveMatch(null);
  }

  function handleEvent(ev) {
    setActiveEvent(ev);
  }

  async function triggerGMZPost(context) {
    const recentContext = feed.slice(0,8).map(p => {
      const poster = [...chars, player, GMZ_CHAR].find(c => c.id === p.charId);
      return `@${poster?.handle || '?'}: "${p.text?.slice(0,80)}"`;
    }).join('\n');
    const handles = [...chars, player].map(c => `@${c.handle}`).join(', ');
    try {
      const raw = await window.claude.complete({
        messages:[{ role:'user', content:
          `You are GMZ (@gmz), the most chaotic student gossip account at Merlin's College of Magic. You cover campus drama, Quidditch scandals, relationship gossip, and anything controversial. You write in breathless tabloid style.

Campus accounts: ${handles}
${pronounRule([GMZ_CHAR, player, ...chars])}
${context ? `Breaking context: ${context}` : ''}
Recent campus posts:\n${recentContext}

Write ONE GMZ gossip post. Rules:
- 1-2 sentences, punchy tabloid energy  
- Must reference at least one campus account by @handle
- Use the pronouns listed above exactly. Do not misgender anyone.
- Start with a hook ("BREAKING:", "SOURCES CONFIRM:", "EXCLUSIVE:", "WITNESSES SAY:", etc.)
- No hashtags, no quotes, just the post text` }]
      });
      const cleanText = raw.trim().replace(/^["']|["']$/g,'');
      const newPost = {
        id: `gmz-${Date.now()}`,
        charId: '__gmz__',
        text: cleanText,
        likes: Math.floor(Math.random()*80000 + 5000),
        reposts: Math.floor(Math.random()*8000 + 500),
        comments: Math.floor(Math.random()*200 + 20),
        timestamp: Date.now(),
        reply: null,
        botComments: [],
        isGMZ: true,
      };
      setFeed(f => [newPost, ...f]);
    } catch(e) {}
  }

  // GMZ slides into player's DMs after dramatic events
  async function triggerGMZDM(context) {
    try {
      const raw = await window.claude.complete({
        messages:[{ role:'user', content:
          `You are GMZ (@gmz), the most chaotic student gossip account at Merlin's College of Magic. You cover campus drama and you are not above DMing students directly to fish for quotes, dirt, or exclusive angles.

You're DMing ${player.name} (@${player.handle}) right now. Context: ${context}
${pronounRule([GMZ_CHAR, player, ...chars])}

Write ONE short DM (1-2 sentences max). Pick ONE angle:
- fishing for an exclusive quote ("our sources say... care to confirm?")
- offering to "tell their side" before posting something damaging
- asking who they're rooting for / what really happened
- light pressure ("we're going to post in 20 min, last chance to comment")
- conspiratorial gossip ("between us... [theory]")

Tone: tabloid, breathless, slightly menacing in a fun way, lowercase casual mixed with ALL CAPS for emphasis. Use the pronouns listed above exactly. No greeting, no signoff, just the message itself. No quotes around it.
${BANNED_PHRASES_RULE}` }]
      });
      const text = raw.trim().replace(/^["']|["']$/g,'');
      const dmMsg = { role:'char', text, id: Date.now() };
      setDms(d => ({ ...d, [GMZ_CHAR.id]: [...(d[GMZ_CHAR.id]||[]), dmMsg] }));
      setDmNotifs(n => ({ ...n, [GMZ_CHAR.id]: (n[GMZ_CHAR.id]||0) + 1 }));
    } catch(e) {}
  }

  function handleEventSubmit() {
    const ev = activeEvent;
    const involved = chars.filter(c => ev.chars.includes(c.id));
    const newPosts = involved.map(char => ({
      id: `gen-${Date.now()}-${char.id}`,
      charId: char.id,
      text: `...still thinking about what just happened.`,
      likes: Math.floor(Math.random()*100000),
      reposts: Math.floor(Math.random()*5000),
      comments: Math.floor(Math.random()*200),
      timestamp: Date.now(),
      reply: null,
      botComments: [],
    }));
    setFeed(f => [...newPosts, ...f]);
    setActiveEvent(null);
    // Proactive DM: 40% chance a reactive char slides in
    const reactiveChars = chars.filter(c => !['reserved','quiet'].some(q => (c.personality||'').includes(q)));
    if (reactiveChars.length && Math.random() < 0.4) {
      const pick = reactiveChars[Math.floor(Math.random()*reactiveChars.length)];
      setTimeout(() => triggerProactiveDM(pick, `the event: ${ev.scenario.slice(0,60)}`), 3000);
    }
    // GMZ: 50% chance to cover a completed event after a short delay
    if (Math.random() < 0.5) {
      setTimeout(() => triggerGMZPost(`A dramatic event just unfolded involving ${ev.chars.map(id => chars.find(c=>c.id===id)?.handle || id).join(' and ')}: "${ev.scenario.slice(0,100)}"`), 8000 + Math.random()*10000);
    }
    // GMZ DM: 35% chance for scandals, 25% for opportunities, 15% otherwise — they want a quote
    const dmChance = ev.type === 'scandal' ? 0.35 : ev.type === 'opportunity' ? 0.25 : 0.15;
    if (Math.random() < dmChance) {
      const ctx = `${player.name} just got involved in this situation: "${ev.scenario.slice(0,160)}". The other people involved: ${ev.chars.map(id => chars.find(c=>c.id===id)?.handle || id).join(', ')}.`;
      setTimeout(() => triggerGMZDM(ctx), 14000 + Math.random()*16000);
    }
  }

  // Show loading screen until save file is read
  if (!stateLoaded) return (
    <div style={{background:'#111', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontSize:16, fontFamily:'-apple-system, sans-serif'}}>
      ✦ Loading...
    </div>
  );

  // Determine what to show
  let screenContent;
  if (editChar !== null) {
    screenContent = <EditCharScreen char={editChar} onBack={goBack} onSave={handleSaveChar} />;
  } else if (activeGroupChat) {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <GroupChatScreen group={activeGroupChat} chars={chars} player={player} allChars={[...chars, player]} feed={feed} dms={dms} setGroupChats={setGroupChats} onBack={goBack} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setActiveGroupChat(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (chatChar && tab === 'messages') {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <ChatScreen char={chatChar} player={player} allChars={[...chars, player, GMZ_CHAR]} feed={feed} dms={dms} setDms={setDms} onBack={goBack} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setChatChar(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (viewChar) {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <CharProfileScreen char={viewChar} player={player} onBack={goBack} onDM={(c) => { handleOpenChat(c); setViewChar(null); }} feed={feed} allChars={[...chars, player]} onOpenThread={post => { pushNav(); setThreadPost(post); setViewChar(null); }} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setViewChar(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else if (threadPost) {
    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <PostThreadView post={threadPost} chars={chars} player={player} onBack={goBack} onCharClick={handleViewChar} feed={feed} />
        <BottomNav tab={tab} setTab={t => { setTab(t); setThreadPost(null); setNavStack([]); }} dmNotifs={dmNotifs} />
      </div>
    );
  } else {
    const mainScreen = (() => {
      switch(tab) {
        case 'feed': return <FeedScreen chars={chars} player={player} feed={feed} setFeed={setFeed} day={day} onCharClick={handleViewChar} onEvent={handleEvent} setTab={setTab} onCompose={() => setComposing(true)} onOpenThread={post => { pushNav(); setThreadPost(post); }} onWatchMatch={handleWatchMatch} currentMatch={currentMatch} onRefreshFeed={handleRefreshFeed} />;
        case 'activity': return <ActivityScreen chars={chars} player={player} onEvent={handleEvent} feed={feed} dms={dms} eventLog={eventLog} onOpenChat={c => { handleOpenChat(c); setTab('messages'); }} onOpenThread={post => { pushNav(); setThreadPost(post); }} section={activitySection} setSection={setActivitySection} />;
        case 'messages': return <MessagesScreen chars={chars} dms={dms} onOpenChat={handleOpenChat} dmNotifs={dmNotifs} setDmNotifs={setDmNotifs} groupChats={groupChats} onOpenGroup={gc => { pushNav(); setActiveGroupChat(gc); }} />;
        case 'notifications': return <NotificationsScreen chars={chars} feed={feed} />;
        case 'profile': return <ProfileScreen player={player} chars={chars} socialPresence={socialPresence} onEditChar={handleEditChar} onCreateChar={handleCreateChar} onCharClick={handleViewChar} onShowLog={() => { setActivitySection('log'); setTab('activity'); }} onResetGame={handleResetGame} />;
        default: return null;
      }
    })();

    screenContent = (
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {mainScreen}
        <BottomNav tab={tab} setTab={setTab} dmNotifs={dmNotifs} />
      </div>
    );
  }

  const isMobile = window.innerWidth <= 480;
  const appContent = (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:C.bg, position:'relative', overflow:'hidden'}}>
      {screenContent}
        {activeMatch && (
          <LiveMatchModal match={activeMatch} chars={chars} player={player} onClose={() => setActiveMatch(null)} onPostToFeed={handleMatchPost} onMatchEnd={handleMatchEnd} />
        )}
        {activeEvent && (
          <EventModal event={activeEvent} chars={chars} player={player} feed={feed} onClose={() => setActiveEvent(null)} onSubmit={handleEventSubmit} onLog={(entry) => setEventLog(l => [entry, ...l])} onSocialPresenceGain={addSocialPresence} />
        )}
        {composing && (
          <ComposeModal chars={chars} player={player} onClose={() => setComposing(false)} onPost={post => {
            setFeed(f => [post, ...f]);
            setComposing(false);
            // Player posts: simulate growing engagement
            if (post.charId === 'player') {
              const ticks = [
                { delay: 1500,  l: 240,  r: 8,   c: 1 },
                { delay: 4000,  l: 1200, r: 22,  c: 3 },
                { delay: 8500,  l: 4800, r: 64,  c: 7 },
                { delay: 14000, l: 12400,r: 180, c: 14 },
                { delay: 22000, l: 28000,r: 410, c: 24 },
                { delay: 34000, l: 56000,r: 820, c: 38 },
              ];
              ticks.forEach(t => setTimeout(() => {
                const jitter = (n) => Math.max(0, Math.round(n * (0.85 + Math.random()*0.3)));
                setFeed(f => f.map(p => p.id === post.id
                  ? {...p, likes: jitter(t.l), reposts: jitter(t.r), comments: jitter(t.c)}
                  : p));
              }, t.delay));
            }
          }} />
        )}
      </div>
  );

  return (
    <>
    {isMobile ? (
      <div style={{
        width: '100vw', height: '100dvh',
        background: C.bg, display: 'flex', flexDirection: 'column',
        paddingTop: 'env(safe-area-inset-top)',
        paddingBottom: 0,
        overflow: 'hidden',
      }}>
        {appContent}
      </div>
    ) : (
      <IOSDevice dark={tweaks.darkMode}>{appContent}</IOSDevice>
    )}
    {tweaksVisible && (
      <TweaksPanel>
        <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
        <TweakSection label="Accent color" />
        <TweakColor label="Accent" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakSection label="Feed" />
        <TweakSlider label="Font size" value={tweaks.fontSize} min={12} max={18} step={1} onChange={v => setTweak('fontSize', v)} />
        <TweakToggle label="Compact feed" value={tweaks.compactFeed} onChange={v => setTweak('compactFeed', v)} />
      </TweaksPanel>
    )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
<style>
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</body>
</html>
