  ]},
  { id:'gc2', name:'Gryffindor Quidditch 🏆', members:['havoc','briar','callum','rowan','milo','theo'], messages:[
    { role:'char', charId:'briar', text:'Practice is not optional just because the timeline found a new joke.', id:'gm3' },
    { role:'char', charId:'havoc', text:'what if the joke improves morale', id:'gm4' },
    { role:'char', charId:'callum', text:'It does not.', id:'gm5' },
    { role:'char', charId:'rowan', text:'depends who falls for it first.', id:'gm6' },
    { role:'char', charId:'milo', text:'I could test it', id:'gm7' },
    { role:'char', charId:'theo', text:'For documentation purposes, please do.', id:'gm8' },
  ]},
  { id:'gc3', name:'Ravenclaw Study Hall 📚', members:['tamsin'], messages:[
    { role:'char', charId:'tamsin', text:'if this is about quidditch drama, bring details. if it is about rowan, bring tea.', id:'gm9' },
  ]},
];

function normalizeGroupChats(groups = []) {
  return groups.map(group => {
    const members = new Set(group.members || []);
    if (group.id === 'gc1' || /slytherin/i.test(group.name || '')) members.add('player');
    if (group.id === 'gc2' || /gryffindor/i.test(group.name || '')) members.delete('player');
    return { ...group, members: Array.from(members) };
  });
}

function GroupChatScreen({ group, chars, player, allChars, feed, dms, eventLog = [], groupChats = [], setGroupChats, onBack }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [msgs, setMsgs] = useState(group.messages || []);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const members = group.members.map(id => allChars.find(c => c.id === id)).filter(Boolean);
  const aiMembers = members.filter(m => m.id !== player.id);

  useEffect(() => { if (bottomRef.current) bottomRef.current.scrollTop = 9999; }, [msgs]);

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', charId:'player', text: input.trim(), id: Date.now(), ts: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs);
    setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: newMsgs} : g));
    setInput('');
    setLoading(true);

    // Each member may respond, with some chance of silence
    const recentFeed = feed.slice(0,5).map(p => {
      const poster = allChars.find(c => c.id === p.charId);
      return `@${poster?.handle}: "${p.text?.slice(0,60)}"`;
    }).join('\n');

    const historyStr = newMsgs.slice(-8).map(m => {
      const sender = m.role === 'user' ? player : allChars.find(c => c.id === m.charId);
      return `${sender?.name || 'Someone'}: "${m.text}"`;
    }).join('\n');
    const appMemory = recentMemoryContext({ feed, eventLog, groupChats, dms, player, allChars, channel:'group', audienceIds: group.members || [] });

    let updatedMsgs = [...newMsgs];
    for (const member of aiMembers) {
      const quietTypes = ['reserved','quiet','deadpan','minimal'];
      const isQuiet = quietTypes.some(q => (member.personality||'').includes(q));
      if (Math.random() < (isQuiet ? 0.4 : 0.15)) continue; // sometimes they don't respond

      try {
        const otherMembers = members.filter(m => m.id !== member.id).map(m => `${identityFactsFor(m)}; ${m.personality || m.bio}`).join('; ');
        const generatedThisTurn = updatedMsgs
          .slice(newMsgs.length)
          .map(m => {
            const speaker = allChars.find(c => c.id === m.charId);
            return speaker?.handle ? `@${speaker.handle}: "${m.text}"` : `"${m.text}"`;
          })
          .join('\n');
        const groupAvoidTexts = [historyStr, input, generatedThisTurn].filter(Boolean);
        const reply = await window.claude.complete({ messages:[{ role:'user', content:
          `Write as ${member.name} in a group chat called "${group.name}".
${identityPromptFor(member)}
Voice cues: ${member.personality}. ${member.description?.slice(0,200)}
Other people currently present in this chat: ${otherMembers}.
${pronounRule([member, player, ...members])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(member, 'group chat')}
${multiSpeakerDialogueSeparationRule(aiMembers, 'group chat')}
${playerStance(member, player)}
${recentMemoryContext({ feed, eventLog, groupChats, dms, char: member, player, allChars, channel:'group', audienceIds: group.members || [] })}
Recent campus feed:\n${recentFeed}
Chat history:\n${historyStr}
Wider memory available to everyone here:
${appMemory}
${generatedThisTurn ? `Other characters already answered this turn:\n${generatedThisTurn}\nDo not echo their key verb, punchline scaffold, or social move. Answer from your own dialogue contract.` : ''}
${threadPatternVarietyGuard(groupAvoidTexts)}
${player.name} just said: "${input}"
Group chat tone: house and team sniping is normal social fuel. If this chat is Slytherins talking about Gryffindor, they can enjoy the rival mess, pile on, or joke that their own mess is funnier while Gryffindor's is easier. Do not turn rival trash talk into noble defensiveness unless someone hits a real personal wound. Teammate loyalty still matters: if someone outside the team swings at one of your people, the usual move is to back your teammate first, then roast them privately or as "our mess."
Write your response (1-2 sentences, in character). Use the pronouns listed above exactly. Everyone listed as present can see this message. If you mean someone in the chat, talk to them directly with @handle, "you", or a nickname/title that makes sense. Do not talk about a present member like they are not in the room. Sometimes ignore the question and say something tangential. Be natural.
Output ONLY the chat message. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
${BANNED_PHRASES_RULE}` }]
        });
        const charMsg = { role:'char', charId: member.id, text: cleanChatText(reply, member, player, true, { avoidTexts: groupAvoidTexts }), id: Date.now() + Math.random(), ts: Date.now() };
        updatedMsgs = [...updatedMsgs, charMsg];
        setMsgs([...updatedMsgs]);
        setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: [...updatedMsgs]} : g));
        await new Promise(r => setTimeout(r, 800 + Math.random()*1200));
      } catch(e) {}
    }
    setLoading(false);
  }

  const getChar = id => id === 'player' ? player : allChars.find(c => c.id === id);

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg}}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
          <div style={{display:'flex', marginRight:8}}>
            {members.slice(0,3).map((m,i) => <div key={m.id} style={{marginLeft: i>0?-10:0, zIndex:3-i}}><Avatar char={m} size={32}/></div>)}
          </div>
          <div>
            <div style={{color:C.text, fontWeight:700, fontSize:15}}>{group.name}</div>
            <div style={{color:C.muted, fontSize:12}}>{members.map(m=>m.name.split(' ')[0]).join(', ')}</div>
          </div>
        </div>
      </div>
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8}}>
        {msgs.map(m => {
          const sender = getChar(m.charId || (m.role === 'user' ? 'player' : null));
          const isMe = m.role === 'user';
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={sender} size={26}/>}
              <div style={{maxWidth:'78%'}}>
                {!isMe && <div style={{color:C.muted, fontSize:11, marginBottom:3, paddingLeft:4}}>{sender?.name?.split(' ')[0]}</div>}
                <div style={{
                  padding:'9px 13px', borderRadius: isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',
                  background: isMe ? C.blue : C.card2, color:'#fff', fontSize:13, lineHeight:1.5,
                }}>{renderLinkedText(m.text, allChars)}</div>
              </div>
            </div>
          );
        })}
        {loading && <div style={{color:C.muted, fontSize:13, paddingLeft:8}}>Someone is typing...</div>}
      </div>
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder="Message the group..."
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim()||loading} style={{
          background:input.trim()?C.blue:C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor:input.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>
  );
}

// ─── Compose Post Modal ───────────────────────────────────────────
function ComposeModal({ chars, player, onClose, onPost }) {
  const [text, setText] = useState('');
  const [photo, setPhoto] = useState(null);
  const [selectedChar, setSelectedChar] = useState(player);
  const allChars = [player, ...chars];
  const fileRef = useRef(null);

  async function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImageFile(file, { maxSize: 900, quality: 0.78 });
    setPhoto(dataUrl);
    e.target.value = '';
  }

  function submit() {
    if (!text.trim() && !photo) return;
    onPost({
      id: `post-${Date.now()}`,
      charId: selectedChar.id,
      text: text.trim(),
      photo,
      likes: 0, reposts: 0, comments: 0,
      timestamp: Date.now(),
      reply: null,
    });
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.8)', zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end'}}>
      <div style={{background:C.card, borderRadius:'20px 20px 0 0', padding:'16px', maxHeight:'85%', display:'flex', flexDirection:'column'}}>
        {/* Header */}
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
          <button onClick={onClose} style={{background:'none', border:'none', color:C.muted, fontSize:15, cursor:'pointer'}}>Cancel</button>
          <span style={{color:C.text, fontWeight:700, fontSize:15}}>New Post</span>
          <button onClick={submit} disabled={!text.trim() && !photo} style={{
            background: (text.trim() || photo) ? C.blue : '#333', color:'#fff', border:'none',
            borderRadius:20, padding:'6px 16px', fontSize:14, fontWeight:700, cursor:(text.trim()||photo)?'pointer':'default',
          }}>Post</button>
        </div>

        {/* Post as */}
        <div style={{marginBottom:12}}>
          <p style={{color:C.muted, fontSize:11, marginBottom:6}}>POST AS</p>
          <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4}}>
            {allChars.map(c => (
              <button key={c.id} onClick={() => setSelectedChar(c)} style={{
                display:'flex', alignItems:'center', gap:6, background: selectedChar.id === c.id ? C.blue+'22' : C.card2,
                border:`1.5px solid ${selectedChar.id === c.id ? C.blue : C.border}`,
                borderRadius:20, padding:'5px 12px', cursor:'pointer', flexShrink:0,
              }}>
                <Avatar char={c} size={20} />
                <span style={{color: selectedChar.id === c.id ? C.blue : C.text, fontSize:12, fontWeight:600}}>{c.name.split(' ')[0]}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Text input */}
        <div style={{display:'flex', gap:10, flex:1}}>
          <Avatar char={selectedChar} size={38} />
          <div style={{flex:1}}>
            <textarea value={text} onChange={e => setText(e.target.value)}
              placeholder="What's happening?"
              style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:80, lineHeight:1.6}}
            />
            <MentionSuggestions text={text} allChars={allChars} onPick={handle => setText(t => applyMentionToText(t, handle))} />
            {/* Photo preview */}
            {photo && (
              <div style={{position:'relative', marginTop:8}}>
                <img src={photo} alt="" style={{width:'100%', borderRadius:12, maxHeight:200, objectFit:'cover'}} />
                <button onClick={() => setPhoto(null)} style={{position:'absolute', top:6, right:6, background:'rgba(0,0,0,0.7)', border:'none', color:'#fff', borderRadius:'50%', width:26, height:26, cursor:'pointer', fontSize:14}}>×</button>
              </div>
            )}
          </div>
        </div>

        {/* Toolbar */}
        <div style={{borderTop:`1px solid ${C.border}`, paddingTop:12, marginTop:8, display:'flex', gap:16, alignItems:'center'}}>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto} />
          <button onClick={() => fileRef.current.click()} style={{background:'none', border:'none', color:C.blue, cursor:'pointer', display:'flex', alignItems:'center', gap:4, fontSize:13}}>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Photo
          </button>
          <div style={{marginLeft:'auto', color:C.muted, fontSize:12}}>{280 - text.length}</div>
        </div>
      </div>
    </div>
  );
}

// ─── Event Modal ──────────────────────────────────────────────────
function EventModal({ event, chars, player, feed, eventLog = [], dms = {}, groupChats = [], onClose, onSubmit, onLog, onSocialPresenceGain }) {
  const [input, setInput] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [currentEvent, setCurrentEvent] = useState(event);
  const [xp, setXp] = useState(() => rollEventXp(event?.xp));
  const [customOpen, setCustomOpen] = useState(false);
  const [customScenario, setCustomScenario] = useState('');
  const [customType, setCustomType] = useState('gossip');
  const [customChars, setCustomChars] = useState([]);
  const [submittedEvent, setSubmittedEvent] = useState(null);
  const [generatedEvents, setGeneratedEvents] = useState([]);
  const [pulseLoading, setPulseLoading] = useState(false);
  const [pulseError, setPulseError] = useState('');
  const eventSelectionRef = useRef(event?.id);
  const resultVisibleRef = useRef(false);
  const currentEventCharIds = Array.isArray(currentEvent?.chars) ? currentEvent.chars : [];
  const involved = chars.filter(c => currentEventCharIds.includes(c.id));

  useEffect(() => {
    resultVisibleRef.current = !!result;
  }, [result]);

  useEffect(() => {
    setXp(rollEventXp(currentEvent?.xp));
  }, [currentEvent?.id]);

  useEffect(() => {
    generateCampusPulse({ auto: true });
  }, []);

  function selectEvent(nextEvent) {
    if (!nextEvent) return;
    eventSelectionRef.current = nextEvent.id;
    setCurrentEvent(nextEvent);
    setInput('');
    setResult(null);
    setSubmittedEvent(null);
    setCustomOpen(false);
  }

  async function generateCampusPulse({ auto = false } = {}) {
    if (pulseLoading) return;
    const selectionAtStart = eventSelectionRef.current;
    setPulseLoading(true);
    setPulseError('');
    try {
      const allChars = [...chars, player, GMZ_CHAR].filter(Boolean);
      const roster = chars.map(c =>
        `${c.id}: ${identityFactsFor(c)}. Voice cues: ${c.personality}. ${String(c.description || c.bio || '').slice(0, 180)}`
      ).join('\n');
      const recentEvents = (eventLog || [])
        .filter(e => e?.scenario || e?.outcome || e?.action)
        .slice(0, 8)
        .map(e => `- ${e.scenario || e.title || 'Event'}${e.outcome ? ` Outcome: ${e.outcome}` : ''}`)
        .join('\n');
      const appMemory = recentMemoryContext({ feed, eventLog, groupChats, dms, player, allChars, channel:'public' });
      const recentFeed = (feed || []).slice(0, 8).map(p => {
        const poster = allChars.find(c => c.id === p.charId);
        return poster?.handle ? `@${poster.handle}: "${String(p.text || '').slice(0, 160)}"` : '';
      }).filter(Boolean).join('\n');
      const raw = await window.claude.complete({ messages:[{ role:'user', content:
        `Generate fresh in-universe campus events for a fictional wizarding university social app.

This is NOT real-world news. Do not mention real politicians, celebrities, brands, countries, tragedies, current events, or the outside internet. The event must come from Merlin's College social life: GMZ gossip, Quidditch practice, house rivalry, prefect/professor trouble, common-room politics, screenshots, anonymous tips, lineup rumors, parties, curfew, clubs, school logistics, old posts resurfacing, or teammate/friend/ex fallout.

PLAYER:
${identityFactsFor(player)}. @${player.handle} is the playable main character. Events can involve or tag her, but do not center every event on her. Often she is reacting to a mess that started without her.

ROSTER IDS TO USE IN "chars":
${roster}

${pronounRule([player, ...chars])}
${CHARACTER_TONE_RULE}
${appMemory}

RECENT VISIBLE FEED:
${recentFeed || 'No recent visible feed.'}

RECENT EVENTS TO AVOID REPEATING:
${recentEvents || 'No recent event log yet.'}

Create 3 different event candidates. Each should be a live social spark with an obvious opening for the player to respond, exploit, ignore, or make worse. Keep the roles clear: if a character is included in the rumor, they are inside it, not narrating from outside. Avoid "both of you" if one of the involved characters would be speaking from inside the event later. Use @handles in the scenario when clarity helps.

Allowed types: scandal, gossip, tag, opportunity.
Return ONLY a JSON array of 3 objects:
[
  {"type":"gossip","scenario":"A 25-55 word campus event written in natural feed/event-card style.","chars":["exactCharacterId"],"xp":[80,170]}
]

Rules:
- "chars" must use exact roster ids, never handles, never "player".
- Use 1-3 involved characters per event.
- At least one event should not be directly about @${player.handle}.
- No death, serious injury, sexual coercion, real-world news, or apocalypse stakes.
- Do not explain the JSON.`
      }]});
      const parsed = parseJsonArrayFromText(raw);
      const normalized = parsed
        .map((item, idx) => normalizeCampusEvent(item, idx, chars))
        .filter(Boolean)
        .slice(0, 3);
      if (!normalized.length) throw new Error('No usable events generated');
      setGeneratedEvents(normalized);
      if (!resultVisibleRef.current && (!auto || eventSelectionRef.current === selectionAtStart)) selectEvent(normalized[0]);
    } catch(e) {
      setPulseError('Could not generate fresh campus pulse. Built-in events are still available.');
    }
    setPulseLoading(false);
  }

  function reroll() {
    const source = generatedEvents.length ? generatedEvents : EVENT_POOL;
    const others = source.filter(e => e.id !== currentEvent.id);
    const pool = others.length ? others : EVENT_POOL.filter(e => e.id !== currentEvent.id);
    selectEvent(pool[Math.floor(Math.random() * pool.length)]);
  }

  function applyCustomEvent() {
    if (!customScenario.trim()) return;
    const fallbackChars = chars.slice(0, Math.min(3, chars.length)).map(c => c.id);
    selectEvent({
      id: `custom-${Date.now()}`,
      type: customType,
      scenario: customScenario.trim(),
      chars: customChars.length ? customChars : fallbackChars,
      xp: [80, 200],
      custom: true,
    });
  }

  async function handleSubmit() {
    if (!input.trim() || loading) return;
    setLoading(true);
    try {
      const charDescs = involved.map(c => `${identityFactsFor(c)}. Voice cues: ${c.personality}. ${c.description}`).join('\n');
      const recentFeedContext = feed ? [...feed].slice(0,8).map(p => {
        const poster = [...(chars||[]), player].find(c=>c.id===p.charId);
        return `@${poster?.handle||p.charId}: "${p.text}"`;
      }).join('\n') : '';
      const response = await window.claude.complete({
        messages: [{
          role:'user',
          content: `Narrate a social media event like a dramatic story beat.

CHARACTERS INVOLVED:
${charDescs}

PLAYER: ${player.name} (@${player.handle}) — ${player.personality}

${pronounRule([player, ...involved])}
Treat house/team/player status like fixed identity. Do not write non-players as Quidditch players. Do not invent game attendance, wins, dodging, fouls, or match results unless the event explicitly says so.

RECENT FEED CONTEXT:
${recentFeedContext}

EVENT: "${currentEvent.scenario}"
PLAYER'S ACTION: "${input}"

Write a punchy 2-3 sentence outcome. Be dramatic, entertaining, and true to each character's personality. Reference @handles. Use the pronouns and identities listed above exactly. Show consequences. Make it feel like something that would blow up on social media. Plain prose only — no headers, no bullet points, no markdown formatting. Do not explain rules or prompts.`
        }]
      });
      const cleaned = response
        .replace(/^#+\s+.*/gm, '')       // strip # headers
        .replace(/\*\*(.*?)\*\*/g, '$1') // strip bold
        .replace(/\*(.*?)\*/g, '$1')     // strip italic
        .replace(/_{1,2}(.*?)_{1,2}/g, '$1')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      setResult(cleaned);
      setSubmittedEvent({
        ...currentEvent,
        playerAction: input,
        outcome: cleaned,
        submittedAt: Date.now(),
      });
      // Generate score changes
      const followerGain = Math.floor(xp * (1800 + Math.random() * 1200));
      const statGain = +(Math.random() * 0.3 + 0.1).toFixed(2);
      const evType = currentEvent.type || 'gossip';
      const socialGain = {
        humor: +(statGain * (evType === 'tag' ? 1.2 : evType === 'opportunity' ? 0.9 : 1)).toFixed(2),
        aura: +(statGain * (evType === 'opportunity' ? 1.3 : 0.8)).toFixed(2),
        drama: +(statGain * (evType === 'scandal' ? 1.6 : evType === 'gossip' ? 1.2 : 0.7)).toFixed(2),
      };
      const scoreChanges = [
        { icon:'✨', label:'Experience', value: xp, unit:'', flavor: evType === 'scandal' ? 'Chaos is a ladder, apparently.' : evType === 'tag' ? 'You answered the call.' : evType === 'opportunity' ? 'The window was open. You flew through it.' : 'Drama points well spent.' },
        { icon:'👥', label:'Followers', value: `+${(followerGain >= 1000 ? (followerGain/1000).toFixed(0)+'K' : followerGain)}`, unit:'', flavor: evType === 'scandal' ? 'Everyone loves a scandal.' : 'Word travels fast on campus.' },
        { icon:'😂', label:'Humor', value: `+${socialGain.humor}`, unit:'%', flavor: 'Your wit is showing.' },
        { icon:'⭐', label:'Aura', value: `+${socialGain.aura}`, unit:'%', flavor: 'Presence confirmed.' },
        { icon:'🔥', label:'Drama', value: `+${socialGain.drama}`, unit:'%', flavor: evType === 'scandal' ? 'Mess travels beautifully.' : 'The timeline noticed.' },
        ...currentEventCharIds.map(cid => {
          const delta = +(Math.random() * 1.2 - 0.3).toFixed(2);
          const flavorMap = { scandal: delta > 0 ? 'Impressed by the chaos.' : 'Not thrilled about this.', gossip: 'Taking notes.', tag: delta > 0 ? 'Appreciated the response.' : 'Was not expecting that.', opportunity: delta > 0 ? 'Respects the move.' : 'Saw what you did there.' };
          return { avatar: cid, label: `@${cid}`, value: delta, unit:'%', flavor: flavorMap[evType] || 'Watching closely.' };
        }),
      ];
      onSocialPresenceGain && onSocialPresenceGain(socialGain);
      onLog && onLog({
        type: 'event',
        visibility: 'public',
        eventType: evType,
        scenario: currentEvent.scenario,
        action: input,
        outcome: cleaned,
        chars: currentEventCharIds,
        participants: ['player', ...currentEventCharIds],
        xp,
        scoreChanges,
        timestamp: Date.now(),
      });
    } catch(e) {
      setResult('The drama unfolds... and everyone is watching.');
    }
    setLoading(false);
  }

  function finishEvent() {
    onSubmit && onSubmit(submittedEvent || currentEvent);
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', zIndex:100, background:C.bg}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10, flexShrink:0}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, width:34, height:34, cursor:'pointer', fontSize:24, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>‹</button>
        <div style={{flex:1, minWidth:0}}>
          <div style={{color:C.text, fontSize:18, fontWeight:800, lineHeight:1.1}}>Event</div>
          <div style={{color:C.muted, fontSize:12, marginTop:2}}>Campus Pulse</div>
        </div>
        <button onClick={() => generateCampusPulse()} disabled={pulseLoading || loading} style={{
          background: pulseLoading ? C.card2 : C.blue,
          color: pulseLoading ? C.muted : '#fff',
          border:'none',
          borderRadius:18,
          padding:'8px 13px',
          fontSize:13,
          fontWeight:800,
          cursor:pulseLoading || loading ? 'default' : 'pointer',
          flexShrink:0,
        }}>{pulseLoading ? 'Scanning...' : 'Fresh'}</button>
      </div>

      <div style={{flex:1, overflowY:'auto', padding:'16px 16px 20px'}}>
        {!result ? (
          <>
            {/* Type badge + involved chars */}
            <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:16, padding:16, marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700, letterSpacing:'0.04em'}}>{t.label.toUpperCase()}</span>
                </div>
              );})()}
              <div style={{display:'flex', gap:-6, marginLeft:'auto'}}>
                {involved.map((c,i) => <div key={c.id} style={{marginLeft: i>0 ? -8 : 0}}><Avatar char={c} size={26}/></div>)}
              </div>
              </div>
              <p style={{color:C.text, fontSize:16, lineHeight:1.62, fontWeight:550}}>{currentEvent.scenario}</p>
            </div>

            {/* XP + reroll row */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:16}}>
              <button onClick={reroll} style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:10, width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, cursor:'pointer', flexShrink:0}} title="Reroll">🎲</button>
              <button onClick={() => setCustomOpen(o => !o)} style={{background: customOpen || currentEvent.custom ? `${C.blue}18` : C.card2, color: customOpen || currentEvent.custom ? C.blue : C.text, border:`1px solid ${customOpen || currentEvent.custom ? C.blue : C.border}`, borderRadius:10, padding:'0 12px', minHeight:36, fontSize:13, fontWeight:700, cursor:'pointer', flexShrink:0}}>
                Custom
              </button>
              <div style={{flex:1, background:C.card2, borderRadius:10, padding:'8px 12px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                <span style={{color:C.muted, fontSize:12}}>XP reward</span>
                <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>+{currentEvent?.xp?.[0] || 80}–{currentEvent?.xp?.[1] || 180} ✦</span>
              </div>
            </div>

            {(generatedEvents.length > 0 || pulseLoading || pulseError) && (
              <div style={{marginBottom:16}}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
                  <span style={{color:C.muted, fontSize:12, fontWeight:800, letterSpacing:'0.04em'}}>CAMPUS PULSE</span>
                  {pulseError && <span style={{color:C.orange, fontSize:11, textAlign:'right', maxWidth:210}}>{pulseError}</span>}
                </div>
                {pulseLoading && generatedEvents.length === 0 ? (
                  <div style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:14, padding:'13px 14px', color:C.muted, fontSize:13}}>Scanning campus...</div>
                ) : (
                  <div style={{display:'flex', flexDirection:'column', gap:8}}>
                    {generatedEvents.map(ev => {
                      const active = ev.id === currentEvent.id;
                      const t = EVENT_TYPES[ev.type] || EVENT_TYPES.gossip;
                      const evChars = (ev.chars || []).map(id => chars.find(c => c.id === id)).filter(Boolean);
                      return (
                        <button key={ev.id} onClick={() => selectEvent(ev)} style={{
                          width:'100%',
                          textAlign:'left',
                          background: active ? `${t.color}12` : C.card2,
                          border:`1px solid ${active ? t.color : C.border}`,
                          borderRadius:14,
                          padding:'11px 12px',
                          cursor:'pointer',
                        }}>
                          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6}}>
                            <span style={{fontSize:13}}>{t.emoji}</span>
                            <span style={{color:active ? t.color : C.muted, fontSize:11, fontWeight:800, letterSpacing:'0.04em'}}>{t.label.toUpperCase()}</span>
                            <div style={{display:'flex', marginLeft:'auto'}}>
                              {evChars.map((c,i) => <div key={c.id} style={{marginLeft:i>0?-7:0}}><Avatar char={c} size={22}/></div>)}
                            </div>
                          </div>
                          <p style={{color:C.text, fontSize:13, lineHeight:1.45}}>{ev.scenario}</p>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {customOpen && (
              <div style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:14, padding:12, marginBottom:16}}>
                <label style={{color:C.muted, fontSize:12, marginBottom:6, display:'block'}}>CUSTOM EVENT</label>
                <textarea
                  value={customScenario}
                  onChange={e => setCustomScenario(e.target.value)}
                  placeholder="GMZ posts that a new Slytherin transfer was seen at the pitch before official tryouts..."
                  style={{width:'100%', background:C.bg, border:`1px solid ${C.border}`, borderRadius:12, padding:'10px 12px', color:C.text, fontSize:13, outline:'none', resize:'none', minHeight:84, lineHeight:1.5, marginBottom:10}}
                />
                <div style={{display:'flex', gap:8, overflowX:'auto', marginBottom:10}}>
                  {Object.entries(EVENT_TYPES).map(([id,t]) => (
                    <button key={id} onClick={() => setCustomType(id)} style={{
                      background: customType === id ? `${t.color}20` : C.bg,
                      color: customType === id ? t.color : C.muted,
                      border:`1px solid ${customType === id ? t.color : C.border}`,
                      borderRadius:18, padding:'7px 10px', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap',
                    }}>{t.emoji} {t.label}</button>
                  ))}
                </div>
                <p style={{color:C.muted, fontSize:12, marginBottom:8}}>Involved characters</p>
                <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4, marginBottom:12}}>
                  {chars.map(c => {
                    const active = customChars.includes(c.id);
                    return (
                      <button key={c.id} onClick={() => setCustomChars(ids => active ? ids.filter(id => id !== c.id) : [...ids, c.id])} style={{
                        display:'flex', alignItems:'center', gap:6, background: active ? C.blue+'22' : C.bg,
                        border:`1px solid ${active ? C.blue : C.border}`, borderRadius:18, padding:'6px 10px', cursor:'pointer', flexShrink:0,
                      }}>
                        <Avatar char={c} size={20}/>
                        <span style={{color: active ? C.blue : C.text, fontSize:12, fontWeight:700}}>{c.name.split(' ')[0]}</span>
                      </button>
                    );
                  })}
                </div>
                <button onClick={applyCustomEvent} disabled={!customScenario.trim()} style={{
                  width:'100%', background: customScenario.trim() ? C.blue : C.bg, color: customScenario.trim() ? '#fff' : C.muted,
                  border:'none', borderRadius:12, padding:'11px', fontSize:14, fontWeight:800, cursor:customScenario.trim() ? 'pointer' : 'default',
                }}>Use Custom Event</button>
              </div>
            )}

            {/* Input */}
            <textarea value={input} onChange={e => setInput(e.target.value)}
              placeholder="What do you do?"
              style={{width:'100%', background:C.card2, border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`, borderRadius:14, padding:'12px 14px', color:C.text, fontSize:14, outline:'none', resize:'none', minHeight:100, marginBottom:14, transition:'border-color 0.2s'}}
            />

            <button onClick={handleSubmit} disabled={!input.trim() || loading} style={{
              width:'100%', background: input.trim() ? C.text : C.card2, color: input.trim() ? C.bg : C.muted,
              border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
              cursor: input.trim() ? 'pointer' : 'default', transition:'background 0.2s, color 0.2s',
            }}>{loading ? 'Playing out…' : 'Submit'}</button>
          </>
        ) : (
          <div>
            {/* Outcome header */}
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700}}>OUTCOME</span>
                </div>
              );})()}
            </div>

            {/* Quoted action */}
            <div style={{borderLeft:`3px solid ${C.border}`, paddingLeft:12, marginBottom:14}}>
              <p style={{color:C.muted, fontSize:12, marginBottom:4}}>YOUR MOVE</p>
              <p style={{color:C.text, fontSize:13, lineHeight:1.5, fontStyle:'italic'}}>"{input}"</p>
            </div>

            <div style={{background:C.card2, borderRadius:14, padding:'14px', marginBottom:14}}>
              <p style={{color:C.text, fontSize:14, lineHeight:1.75}}>{result}</p>
            </div>

            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:`${C.yellow}12`, border:`1px solid ${C.yellow}33`, borderRadius:12, padding:'12px 16px', marginBottom:18}}>
              <span style={{color:C.muted, fontSize:13}}>XP earned</span>
              <span style={{color:C.yellow, fontWeight:700, fontSize:16}}>+{xp} ✦</span>

            <button onClick={finishEvent} style={{width:'100%', background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>Back to Feed</button>
          </div>
        )}
      </div>
    </div>
  );
}

function LogScoreRow({ ch, allChars }) {
  const isNumeric = typeof ch.value === 'number';
  const positive = isNumeric ? ch.value > 0 : String(ch.value).startsWith('+');
  const color = positive ? C.green : C.red;
  const displayVal = isNumeric
    ? `${ch.value > 0 ? '+':''}${ch.value}${ch.unit||''}`
    : `${ch.value}${ch.unit||''}`;
  const relChar = ch.avatar ? allChars.find(c => c.id === ch.avatar) : null;
  return (
    <div style={{paddingBottom:12, marginBottom:12, borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        {relChar
          ? <Avatar char={relChar} size={24}/>
          : <span style={{fontSize:18, width:24, textAlign:'center'}}>{ch.icon}</span>
        }
        <span style={{color:C.text, fontWeight:700, fontSize:14, flex:1}}>
          {relChar ? `@${relChar.handle}` : ch.label}
        </span>
        <span style={{color, fontWeight:800, fontSize:15}}>{displayVal}</span>
      </div>
      {ch.flavor && <p style={{color:C.muted, fontSize:12, marginTop:4, marginLeft:32, lineHeight:1.4}}>{ch.flavor}</p>}
    </div>
  );
}

        )}

      {entry.outcome && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px', marginBottom:6}}>
          <button onClick={() => toggle(outcomeKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: outCollapsed ? 0 : 10}}>

function NotificationsScreen({ chars, player, feed, onOpenThread, onCharClick }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const playerHandle = (player.handle || '').toLowerCase();
  const mentionRe = new RegExp(`@${playerHandle}\\b`, 'i');
  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - (ts || Date.now())) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }
  const notifs = feed.flatMap(post => {
    const items = [];
    const poster = allChars.find(c => c.id === post.charId);
    if (post.charId !== player.id && mentionRe.test(post.text || '')) {
      items.push({ id:`mention-${post.id}`, type:'mention', char:poster, text:'mentioned you in a post', preview: poster ? cleanSocialPostText(post.text, poster, player) : post.text, timestamp:post.timestamp, post });
    }
    if (post.reply?.charId && post.reply.charId !== player.id && (post.charId === player.id || mentionRe.test(post.reply.text || ''))) {
      const replier = allChars.find(c => c.id === post.reply.charId);
      items.push({ id:`reply-${post.id}`, type:'reply', char:replier, text: post.charId === player.id ? 'replied to your post' : 'mentioned you in a reply', preview: replier ? cleanSocialReplyText(post.reply.text, replier, player) : post.reply.text, timestamp:(post.timestamp || Date.now()) + 1, post });
    }
    (post.charComments || []).forEach((cc, i) => {
      if (cc.charId === player.id) return;
      const replier = allChars.find(c => c.id === cc.charId);
      const isForPlayer = post.charId === player.id || cc.replyTo === player.handle || mentionRe.test(cc.text || '');
      if (!isForPlayer) return;
      items.push({
        id:`char-comment-${post.id}-${i}`,
        type:'reply',
        char:replier,
        text: post.charId === player.id ? 'replied to your post' : 'replied to you',
        preview: replier ? cleanSocialReplyText(cc.text, replier, player) : cc.text,
        timestamp:cc.timestamp || post.timestamp,
        post,
      });
    });
    (post.botComments || []).forEach((bc, i) => {
      if (bc.isPlayer) return;
      const isForPlayer = post.charId === player.id || bc.replyTo === player.handle || mentionRe.test(bc.text || '');
      if (!isForPlayer) return;
      const bot = RECURRING_BOTS.find(b => b.id === bc.bot);
      items.push({
        id:`bot-comment-${post.id}-${i}`,
        type:'reply',
        bot,
        text: post.charId === player.id ? 'reacted to your post' : 'reacted to you',
        preview:cleanSocialReplyText(bc.text, null, player, { bot }),
        timestamp:bc.timestamp || post.timestamp,
        post,
      });
    });
    return items;
  }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 40);
  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Notifications</h1>
      </div>
      {notifs.length === 0 && (
        <div style={{padding:28, textAlign:'center', color:C.muted, fontSize:14, lineHeight:1.5}}>
          No replies or mentions yet.
        </div>
      )}
      {notifs.map(n => (
        <div key={n.id} onClick={() => onOpenThread && onOpenThread(n.post)} style={{display:'flex', gap:10, padding:'14px 16px', borderBottom:`1px solid ${C.border}`, alignItems:'center', cursor:'pointer'}}>
          <div style={{position:'relative'}}>
            {n.bot ? <BotAvatar bot={n.bot} size={42} /> : <Avatar char={n.char} size={42} onClick={(e) => { e?.stopPropagation?.(); n.char && onCharClick && onCharClick(n.char); }} />}
            <div style={{position:'absolute', bottom:-2, right:-2, width:18, height:18, borderRadius:'50%', background: n.type==='like'?'#e91e8c':n.type==='mention'?C.blue:n.type==='reply'?C.purple:C.green, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, border:`2px solid ${C.bg}`}}>
              {n.type==='like'?'♥':n.type==='mention'?'@':n.type==='reply'?'↩':'➕'}
            </div>
          </div>
          <div style={{flex:1}}>
            <span style={{fontWeight:700, color:C.text, fontSize:14}}>{n.bot?.name || n.char?.name} </span>
            <span style={{color:C.muted, fontSize:14}}>{n.text}</span>
            <p style={{color:C.text, fontSize:13, marginTop:4, lineHeight:1.35}}>{renderLinkedText((n.preview || '').slice(0,120), allChars, onCharClick)}</p>
            <p style={{color:C.muted, fontSize:12, marginTop:3}}>{timeAgo(n.timestamp)} ago</p>
          </div>
        </div>
      ))}
    </div>
  );
}

function ActivityScreen({ chars, player, onEvent, feed, dms, eventLog, onOpenChat, onOpenThread, section, setSection }) {
  const allChars = [...chars, player];
  const currentEvent = EVENT_POOL[Math.floor(Date.now()/1000) % EVENT_POOL.length];
  const activeSection = section || 'posts';
  const setActiveSection = setSection || (() => {});

  // My posts — anything posted by player
  const myPosts = feed.filter(p => p.charId === 'player');

  // Recent DM previews — only convos with messages (include GMZ if active)
  const charsForDms = (dms[GMZ_CHAR.id]||[]).length > 0 ? [GMZ_CHAR, ...chars] : chars;
  const activeDMs = charsForDms.filter(c => (dms[c.id]||[]).length > 0);

  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - ts) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }

  const tabs = [
    { id:'posts', label:'My Posts' },
    { id:'events', label:'Events' },
    { id:'dms', label:'DMs' },
    { id:'log', label:'Log' },
  ];

  // Log tab state
  const [logCollapsed, setLogCollapsed] = useState({});
  const [logShowDMs, setLogShowDMs] = useState(false);
  const toggleLog = (key) => setLogCollapsed(c => ({...c, [key]: !c[key]}));
  const filteredLog = logShowDMs ? eventLog : eventLog.filter(e => e.type !== 'dm');
  const eventEntries = (eventLog || []).filter(e => e?.type === 'event' || e?.scenario || e?.action || e?.outcome || typeof e?.xp === 'number');

  return (
    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'16px 16px 0', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:5}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
          <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Activity</h1>
          <button onClick={() => onEvent(currentEvent)} style={{
            background:C.blue, color:'#fff', border:'none', borderRadius:20,
            padding:'7px 16px', fontSize:13, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6,
          }}>📣 Event</button>
        </div>
        {/* Section tabs */}
        <div style={{display:'flex', gap:0, borderBottom:`1px solid ${C.border}`}}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveSection(t.id)} style={{
              flex:1, background:'none', border:'none', color: activeSection===t.id ? C.text : C.muted,
              fontWeight: activeSection===t.id ? 700 : 400, fontSize:14, padding:'10px 0', cursor:'pointer',
              borderBottom: activeSection===t.id ? `2px solid ${C.blue}` : '2px solid transparent',
              transition:'all 0.2s',
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* MY POSTS */}
      {activeSection === 'posts' && (
        <div>
          {myPosts.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>✍️</div>
              <p style={{color:C.muted, fontSize:14}}>You haven't posted yet.</p>

                              borderRadius:10, padding:'6px 10px', flex:1,
                            }}>
                              <p style={{color: isMe ? C.blue : C.text, fontSize:13, lineHeight:1.4}}>{m.text}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <p style={{color:C.muted, fontSize:11, marginTop:6}}>{msgs.length} messages total</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* LOG */}
      {activeSection === 'log' && (
        <div>
          {/* DM filter toggle */}
          {eventLog.length > 0 && (
            <div style={{display:'flex', justifyContent:'flex-end', padding:'10px 16px 0'}}>
              <button onClick={() => setLogShowDMs(s=>!s)} style={{background:C.card2, border:`1px solid ${C.border}`, color:logShowDMs ? C.blue : C.muted, borderRadius:10, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>
                {logShowDMs ? 'Hide DMs' : 'Show DMs'}
              </button>
            </div>
          )}

          <div style={{padding:'10px 14px'}}>
            {filteredLog.length === 0 ? (
              <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:60}}>
                <div style={{fontSize:44, marginBottom:14}}>📋</div>
                <p style={{fontWeight:600, color:C.text}}>No activity yet</p>
                <p style={{fontSize:12, marginTop:6}}>Respond to events, reply to posts, or slide into DMs.</p>
              </div>
            ) : (
              [...filteredLog].reverse().map((entry, i) => (
                <LogEntryCard key={i} entry={entry} idx={i} allChars={allChars} collapsed={logCollapsed} toggle={toggleLog}/>
              ))
            )}
          </div>
        </div>
      )}
      <div style={{height:24}}/>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  C = buildTheme(tweaks);

  // ── Server-side persistence ───────────────────────────────────
  const _saveTimer = useRef(null);

  function isFileMode() {
    return window.location.protocol === 'file:';
  }

  function saveLocalState(state) {
    try {
      window.localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
    } catch(e) {
      console.warn('Could not save local game state. Uploaded images may be too large.', e);
    }
  }

  function loadLocalState() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || '{}');
      if (saved && Object.keys(saved).length) return saved;
      for (const key of LEGACY_LOCAL_STATE_KEYS) {
        const legacy = JSON.parse(window.localStorage.getItem(key) || '{}');
        if (legacy && Object.keys(legacy).length) return legacy;
      }
      return {};
    } catch(e) {
      return {};
    }
  }

  function isCurrentSave(saved) {
    return saved && saved.stateVersion === SAVE_STATE_VERSION;
  }

  function withStateVersion(state) {
    return {
      ...state,
      chars: normalizeCharactersIdentity(state.chars || []),
      player: normalizeCharacterIdentity(state.player || DEFAULT_PLAYER),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now()
    };
  }

  function applySavedState(saved) {
    const savedChars = normalizeCharactersIdentity(saved.chars || chars);
    const savedPlayer = normalizeCharacterIdentity(saved.player || player);
    if (saved.chars)      setCharsRaw(savedChars);
    if (saved.player)     setPlayerRaw(savedPlayer);
    if (saved.feed)       setFeedRaw(repairPromptLeakPosts(saved.feed, savedChars, savedPlayer));
    if (saved.dms)        setDmsRaw(repairPromptLeakDms(saved.dms, savedChars, savedPlayer));
    if (saved.groupChats) setGroupChatsRaw(normalizeGroupChats(repairPromptLeakGroupChats(saved.groupChats, savedChars, savedPlayer)));
    if (saved.eventLog)   setEventLogRaw(saved.eventLog);
    if (typeof saved.day === 'number') setDayRaw(saved.day);
    if (saved.socialPresence) setSocialPresenceRaw(saved.socialPresence);
  }

  function chooseSavedState(serverState, localState) {
    const serverCurrent = isCurrentSave(serverState);
    const localCurrent = isCurrentSave(localState);
    if (serverCurrent && localCurrent) {
      return (Number(localState.savedAt || 0) > Number(serverState.savedAt || 0)) ? localState : serverState;
    }
    if (localCurrent) return localState;
    if (serverCurrent) return serverState;
    return null;
  }

  function serverSave(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    _saveTimer.current = setTimeout(() => {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(versionedState),
      }).catch(() => {});
    }, 1500);
  }

  function serverSaveNow(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(versionedState),
    }).catch(() => {});
  }

  const [chars, setCharsRaw] = useState(DEFAULT_CHARS);
  const [player, setPlayerRaw] = useState(DEFAULT_PLAYER);
  const [feed, setFeedRaw] = useState(DEFAULT_FEED);
  const [dms, setDmsRaw] = useState({});
  const [groupChats, setGroupChatsRaw] = useState(DEFAULT_GROUP_CHATS);
  const [eventLog, setEventLogRaw] = useState([]);
  const [day, setDayRaw] = useState(DEFAULT_DAY);
  const [socialPresence, setSocialPresenceRaw] = useState(DEFAULT_SOCIAL_PRESENCE);
  const [stateLoaded, setStateLoaded] = useState(false);

  function cloneDefault(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function clearPlayerRelationships(list) {
    return list.map(char => {
      if (!char.relationships || !Object.prototype.hasOwnProperty.call(char.relationships, 'player')) return char;
      const { player: _playerRelationship, ...relationships } = char.relationships;
      return { ...char, relationships };
    });
  }

  function freshGameState({ preserveProfiles = false } = {}) {
    const freshChars = normalizeCharactersIdentity(preserveProfiles ? clearPlayerRelationships(cloneDefault(chars)) : cloneDefault(DEFAULT_CHARS));
    return {
      chars: freshChars,
      player: normalizeCharacterIdentity(preserveProfiles ? cloneDefault(player) : cloneDefault(DEFAULT_PLAYER)),
      feed: cloneDefault(DEFAULT_FEED),
      dms: {},
      groupChats: normalizeGroupChats(cloneDefault(DEFAULT_GROUP_CHATS)),
      eventLog: [],
      day: DEFAULT_DAY,
      socialPresence: preserveProfiles ? cloneDefault(FRESH_SOCIAL_PRESENCE) : cloneDefault(DEFAULT_SOCIAL_PRESENCE),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now(),
    };
  }

  // Load saved state from server on startup
  useEffect(() => {
    const localSaved = loadLocalState();
    if (isFileMode()) {
      if (isCurrentSave(localSaved)) {
        applySavedState(localSaved);
      } else {
        window.localStorage.removeItem(LOCAL_STATE_KEY);
      }
      setStateLoaded(true);
      return;
    }
    fetch('/api/state').then(r => r.json()).then(saved => {
      const bestSaved = chooseSavedState(saved, localSaved);
      if (bestSaved) {
        applySavedState(bestSaved);
        if (bestSaved === localSaved) serverSaveNow(bestSaved);
      } else if (saved && Object.keys(saved).length) {
        serverSaveNow(freshGameState());
      }
      setStateLoaded(true);
    }).catch(() => setStateLoaded(true));
  }, []);

  // Wrapped setters normalize and trim state only. Persistence runs from the
  // assembled current state after React applies all updates.
  function setChars(v)      { setCharsRaw(prev      => normalizeCharactersIdentity(typeof v==='function'?v(prev):v)); }
  function setPlayer(v)     { setPlayerRaw(prev     => normalizeCharacterIdentity(typeof v==='function'?v(prev):v)); }
  function setFeed(v)       { setFeedRaw(prev       => (typeof v==='function'?v(prev):v).slice(0,60)); }
  function setDms(v)        { setDmsRaw(prev        => typeof v==='function'?v(prev):v); }
  function setGroupChats(v) { setGroupChatsRaw(prev => typeof v==='function'?v(prev):v); }
  function setEventLog(v)   { setEventLogRaw(prev   => (typeof v==='function'?v(prev):v).slice(0,30)); }
  function setDay(v)        { setDayRaw(prev        => typeof v==='function'?v(prev):v); }
  function setSocialPresence(v) { setSocialPresenceRaw(prev => typeof v==='function'?v(prev):v); }

  useEffect(() => {
    if (!stateLoaded) return;
    serverSave({ chars, player, feed, dms, groupChats, eventLog, day, socialPresence });
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day, socialPresence]);

  useEffect(() => {
    if (!stateLoaded) return;
    const flushSave = () => serverSaveNow({ chars, player, feed, dms, groupChats, eventLog, day, socialPresence });
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('beforeunload', flushSave);
    return () => {
      window.removeEventListener('pagehide', flushSave);
      window.removeEventListener('beforeunload', flushSave);
    };
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day, socialPresence]);

  function addSocialPresence(gains) {
    setSocialPresence(prev => ({
      humor: Math.min(300, +(Number(prev?.humor || 0) + Number(gains?.humor || 0)).toFixed(2)),
      aura: Math.min(300, +(Number(prev?.aura || 0) + Number(gains?.aura || 0)).toFixed(2)),
      drama: Math.min(300, +(Number(prev?.drama || 0) + Number(gains?.drama || 0)).toFixed(2)),
    }));
  }

  function getCharsWithRelationshipLogChanges(list, scoreChanges = []) {
    const relChanges = scoreChanges
      .filter(ch => ch?.avatar && typeof ch.value === 'number')
      .map(ch => ({ id: ch.avatar, value: Number(ch.value || 0) }));
    if (!relChanges.length) return list;
    return list.map(char => {
      const change = relChanges.find(ch => ch.id === char.id);
      if (!change) return char;
      const current = Number(char.relationships?.player || 0);
      const next = Math.max(-100, Math.min(100, +(current + change.value).toFixed(2)));
      return {
        ...char,
        relationships: {
          ...(char.relationships || {}),
          player: next,
        },
      };
    });
  }

  function handleEventLog(entry) {
    const nextChars = getCharsWithRelationshipLogChanges(chars, entry?.scoreChanges || []);
    const loggedEntry = entry ? { ...entry, relationshipApplied: true } : entry;
    const nextLog = [loggedEntry, ...eventLog].slice(0, 30);
    setCharsRaw(nextChars);
    setEventLogRaw(nextLog);
  }
  const [activeGroupChat, setActiveGroupChat] = useState(null);
  const [tab, setTab] = useState('feed');
  const [chatChar, setChatChar] = useState(null);
  const [viewChar, setViewChar] = useState(null);
  const [editChar, setEditChar] = useState(null);
  const [activeEvent, setActiveEvent] = useState(null);
  const [composing, setComposing] = useState(false);
  const [threadPost, setThreadPost] = useState(null);
  const [dmNotifs, setDmNotifs] = useState({});
  const [activeMatch, setActiveMatch] = useState(null);
  const [activitySection, setActivitySection] = useState('posts');
  const currentMatch = MATCH_SCHEDULE.find(m => m.day === day && m.status !== 'played');
  const [navStack, setNavStack] = useState([]); // navigation history for back buttons

  function handleResetGame() {
    const ok = window.confirm('Start fresh? This clears the saved feed, DMs, activity log, social presence, and current relationships. Your profile and character edits stay.');
    if (!ok) return;
    const next = freshGameState({ preserveProfiles: true });
    setCharsRaw(next.chars);
    setPlayerRaw(next.player);
    setFeedRaw(next.feed);
    setDmsRaw(next.dms);
    setGroupChatsRaw(next.groupChats);
    setEventLogRaw(next.eventLog);
    setDayRaw(next.day);
    setSocialPresenceRaw(next.socialPresence);
    setActiveGroupChat(null);
    setChatChar(null);
    setViewChar(null);
    setEditChar(null);
    setActiveEvent(null);
    setComposing(false);
    setThreadPost(null);
    setDmNotifs({});
    setActiveMatch(null);
    setActivitySection('posts');
    setTab('profile');
    setNavStack([]);
    serverSaveNow(next);
  }

  async function handleRefreshFeed() {
    if (!chars.length) return;
    const weights = chars.map(c => ['chaotic','bold','loud','shameless','provocative'].some(w => (c.personality||'').includes(w)) ? 3 : 1);
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let char = chars[0];
    for (let i = 0; i < chars.length; i++) { r -= weights[i]; if (r <= 0) { char = chars[i]; break; } }
    const otherHandles = chars.filter(c => c.id !== char.id).map(c => `@${c.handle}`).join(', ');
    const recentContext = feed.slice(0,6).map(p => {
      const poster = [...chars, player, GMZ_CHAR].find(c => c.id === p.charId);
      return `@${poster?.handle || '?'}: "${p.text?.slice(0,80)}"`;
    }).join('\n');
    const repeatGuard = phraseRepetitionGuard(feed, recentContext);
    const tamsinPressureNote = char.id === 'tamsin' && tamsinRowanHavocKeresConcernSignal(recentContext, player)
      ? `\n${tamsinKeresConcernNote(recentContext, player)}`
      : '';

    try {
      const raw = await window.claude.complete({ messages:[{ role:'user', content:
        `Write as ${char.name} on a campus social app.
${identityPromptFor(char)}
Voice cues: ${char.personality}.
Profile context: ${char.description}
${pronounRule([char, player, ...chars])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(char, 'public feed post')}
${playerStance(char, player)}
${recentMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars:[...chars, player, GMZ_CHAR] })}
${tamsinPressureNote}
Other campus accounts: ${otherHandles}

Recent campus feed posts:
${recentContext}
${repeatGuard}
${threadPatternVarietyGuard([recentContext])}

Write ONE fresh social media post from ${char.name}'s perspective. Rules:
- Stay completely in character
- 1-2 sentences max, punchy
- Optionally tag 0-2 handles if natural
- Can reference Quidditch, classes, campus drama, spells, dorms, the Great Hall, professors, etc.
- NO hashtags, NO quotes around the post, JUST the post text
- Do not introduce yourself, list identity facts, summarize rules, or mention prompts/context.
${BANNED_PHRASES_RULE}` }] });
      const cleanText = cleanSocialPostText(raw, char, player, { avoidTexts: [recentContext] });
      setFeed(f => [{
        id: `pull-${Date.now()}-${char.id}`,
        charId: char.id,
        text: cleanText,
        likes: Math.floor(Math.random()*180000),
        reposts: Math.floor(Math.random()*9000),
        comments: Math.floor(Math.random()*160),
        timestamp: Date.now(),
        reply: null,
        botComments: [],
        isPullGenerated: true,
      }, ...f]);
    } catch(e) {
      const fallback = chars[Math.floor(Math.random()*chars.length)];
      setFeed(f => [{
        id: `pull-${Date.now()}-${fallback.id}`,
        charId: fallback.id,
        text: '...still thinking about what just happened.',
        likes: Math.floor(Math.random()*80000),
        reposts: Math.floor(Math.random()*4000),
        comments: Math.floor(Math.random()*100),
        timestamp: Date.now(),
        reply: null,
        botComments: [],
        isPullGenerated: true,
      }, ...f]);
    }
  }

  // ── Navigation helpers ────────────────────────────────────────
  function getNavState() {
    return { editChar, activeGroupChat, chatChar, viewChar, threadPost, tab };
  }
  function pushNav() {
    setNavStack(s => [...s, getNavState()]);
  }
  function goBack() {
    setNavStack(s => {
      if (!s.length) return s;
      const prev = s[s.length - 1];
      setEditChar(prev.editChar);
      setActiveGroupChat(prev.activeGroupChat);
      setChatChar(prev.chatChar);
      setViewChar(prev.viewChar);
      setThreadPost(prev.threadPost);
      setTab(prev.tab);
      return s.slice(0, -1);
    });
  }
  function handleOpenChat(char) {
    pushNav();
    setChatChar(char);
    setTab('messages');
    setDmNotifs(n => ({ ...n, [char.id]: 0 }));
  }
  function handleViewChar(char) { pushNav(); setViewChar(char); }
  function handleEditChar(char) { pushNav(); setEditChar(char); }
  function handleCreateChar() { pushNav(); setEditChar({ name:'', handle:'', pronouns:'', house:'', bio:'', description:'', personality:'', followers:1000000 }); }
  function handleThreadPostUpdate(postId, patch) {
    setFeed(f => f.map(p => p.id === postId ? { ...p, ...patch } : p));
    setThreadPost(p => p && p.id === postId ? { ...p, ...patch } : p);
  }

  function handleSceneEnd(participants = [], messages = [], vibe = null) {
    const changes = participants
      .filter(c => c?.id && c.id !== 'player' && c.id !== '__gmz__')
      .map(c => ({ id: c.id, value: scoreSceneRelationshipForChar(c, messages, vibe) }))
      .filter(ch => ch.value !== 0);
    const label = participants.map(c => c.name).join(', ');
    const speakerName = (msg) => {
      if (msg?.role === 'user') return player.name;
      const found = participants.find(c => c.id === msg?.charId);
      return found?.name || 'Scene';
    };
    const sceneMemory = (messages || []).slice(-6).map(m => {
      const clean = cleanGeneratedText(m?.text || '').replace(/\s+/g, ' ').trim().slice(0, 140);
      return clean ? `${speakerName(m)}: ${clean}` : '';
    }).filter(Boolean).join(' / ');
    if (changes.length) {
      setChars(list => list.map(char => {
        const change = changes.find(ch => ch.id === char.id);
        if (!change) return char;
        const current = Number(char.relationships?.player || 0);
        return {
          ...char,
          relationships: {
            ...(char.relationships || {}),
            player: +clamp(current + change.value, -100, 100).toFixed(2),
          },
        };
      }));
    }
    setEventLog(log => [{
      id: `scene-${Date.now()}`,
      type: 'scene',
      visibility: 'private_scene',
      participants: ['player', ...participants.map(c => c.id).filter(Boolean)],
      title: `Scene ended: ${label}`,
      text: `${vibe?.label || 'Scene'} with ${label}. ${changes.length ? 'Relationship shifts were applied.' : 'No relationship shift, but the scene was saved.'}${sceneMemory ? ` Last beat: ${sceneMemory}` : ''}`,
      relationshipApplied: true,
      sceneMemory,
      scoreChanges: changes.map(ch => ({ avatar: ch.id, value: ch.value })),
      timestamp: Date.now(),
    }, ...log]);
  }

  // Proactive DM: char slides into DMs after hot events
  async function triggerProactiveDM(triggerChar, context) {
    try {
      const allChars = [...chars, player];
      const sysPrompt = buildSystemPrompt(triggerChar, player, allChars, feed, dms, eventLog, groupChats);
      const msg = await window.claude.complete({
        messages: [
          { role:'user', content: sysPrompt },
          { role:'user', content: `You just saw something happen (${context}). Slide into ${player.name}'s DMs with a short, in-character opening message. Something you'd actually say given your personality. Do not default to anger; teasing, flirting, checking in, joking, or being nosy can fit better. 1-2 sentences max.
Output ONLY the DM message. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
${CHARACTER_TONE_RULE}
${BANNED_PHRASES_RULE}` }
        ]
      });
      const dmMsg = { role:'char', text: cleanChatText(msg, triggerChar, player), id: Date.now() };
      setDms(d => ({ ...d, [triggerChar.id]: [...(d[triggerChar.id]||[]), dmMsg] }));
      setDmNotifs(n => ({ ...n, [triggerChar.id]: (n[triggerChar.id]||0) + 1 }));
    } catch(e) {}
  }

  function maybeTriggerDMsFromPlayerPost(post) {
    if (!post?.text) return;
    const mentionedHandles = new Set(
      Array.from(post.text.matchAll(/@([a-z0-9_]+)/gi)).map(m => m[1].toLowerCase())
    );
    const mentionedByName = mentionedCharactersInText(post.text, chars);
    const mentionedChars = chars.filter(c =>
      mentionedHandles.has((c.handle || '').toLowerCase()) ||
      mentionedByName.some(m => m.id === c.id)
    );
    const isHotOrMessy = /transfer|tryout|record|disciplinary|rumor|date|kiss|fight|foul|gmz|photo|sorry|explain|meet me|after dark/i.test(post.text);
    let candidates = mentionedChars;
    if (candidates.length === 0 && isHotOrMessy && Math.random() < 0.35) {
      candidates = [...chars]
        .sort((a,b) => (Math.abs((b.relationships?.player ?? 50) - 50)) - (Math.abs((a.relationships?.player ?? 50) - 50)))
        .slice(0, 1);
    }
    candidates.slice(0, 2).forEach((char, idx) => {
      const relationship = char.relationships?.player ?? 50;
      const wasDirectlyMentioned = mentionedChars.some(c => c.id === char.id);
      const shouldDm = wasDirectlyMentioned
        ? Math.random() < (relationship < 30 ? 0.72 : 0.52)
        : true;
      if (!shouldDm) return;
      setTimeout(() => {
        triggerProactiveDM(char, `@${player.handle} posted publicly: "${post.text.slice(0,140)}"${wasDirectlyMentioned ? ` and mentioned ${char.name}` : ''}`);
      }, 9000 + idx * 7000 + Math.random()*8000);
    });
  }

  async function triggerGroupChatPopIn(group, context = 'the group chat has gone quiet') {
    if (!group || !(group.members || []).includes('player')) return;
    const allChars = [...chars, player];
    const members = (group.members || []).map(id => allChars.find(c => c.id === id)).filter(Boolean);
    const aiMembers = members.filter(m => m.id !== player.id);
    if (!aiMembers.length) return;

    const recentMessages = (group.messages || []).slice(-10);
    const lastMsg = recentMessages[recentMessages.length - 1];
    const lastSpeakerId = lastMsg?.role === 'user' ? 'player' : lastMsg?.charId;
    const candidates = aiMembers.filter(m => m.id !== lastSpeakerId);
    const pool = candidates.length ? candidates : aiMembers;
    const weighted = pool.map(member => {
      let w = 1 + Math.random();
      if (/chaotic|shameless|loud|nosy|restless|funny|provocative|reactive|opportunistic/i.test(member.personality || '')) w += 1.2;
      if (/quiet|composed|controlled|disciplined|reserved/i.test(member.personality || '')) w -= 0.35;
      return { member, w };
    }).sort((a,b) => b.w - a.w);
    const member = weighted[0]?.member;
    if (!member) return;

    const recentFeed = feed.slice(0,5).map(p => {
      const poster = allChars.find(c => c.id === p.charId) || GMZ_CHAR;
      return `@${poster?.handle || '?'}: "${p.text?.slice(0,80)}"`;
    }).join('\n');
    const historyStr = recentMessages.map(m => {
      const sender = m.role === 'user' ? player : allChars.find(c => c.id === m.charId);
      return `${sender?.name || 'Someone'}: "${m.text}"`;
    }).join('\n');
    const otherMembers = members.filter(m => m.id !== member.id).map(m => identityFactsFor(m)).join('; ');
    const popInAvoidTexts = [recentFeed, historyStr, context].filter(Boolean);

    try {
      const reply = await window.claude.complete({ messages:[{ role:'user', content:
        `Write as ${member.name} in a group chat called "${group.name}".
${identityPromptFor(member)}
Voice cues: ${member.personality}. ${member.description?.slice(0,220)}
Other people currently present in this chat: ${otherMembers}.
${pronounRule([member, player, ...members])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(member, 'group chat pop-in')}
${multiSpeakerDialogueSeparationRule(members.filter(m => m.id !== player.id), 'group chat pop-in')}
${playerStance(member, player)}
${recentMemoryContext({ feed, eventLog, groupChats, dms, char: member, player, allChars, channel:'group', audienceIds: group.members || [] })}
Recent campus feed:
${recentFeed || '(quiet feed)'}
${phraseRepetitionGuard(feed, recentFeed)}
Recent group chat history:
${historyStr || '(new group chat)'}
