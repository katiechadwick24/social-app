// ─── Feed Screen ──────────────────────────────────────────────────
function FeedScreen({ chars, player, feed, setFeed, day, onCharClick, onEvent, setTab, onCompose, onOpenThread, onWatchMatch, currentMatch, onRefreshFeed, tweaks = TWEAK_DEFAULTS, onOpenTweaks }) {
  const [showEvent, setShowEvent] = useState(false);
  const [pullStart, setPullStart] = useState(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);

  function beginPull(e) {
    if (e.currentTarget.scrollTop <= 0) setPullStart(e.touches[0].clientY);
  }

  function movePull(e) {
    if (pullStart === null || e.currentTarget.scrollTop > 0 || refreshing) return;
    const distance = Math.max(0, e.touches[0].clientY - pullStart);
    setPullDistance(Math.min(distance, 92));
  }

  async function endPull() {
    if (pullDistance > 68 && onRefreshFeed) {
      setRefreshing(true);
      await onRefreshFeed();
      setRefreshing(false);
    }
    setPullStart(null);
    setPullDistance(0);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', minHeight:0}}>
      <div
        onTouchStart={beginPull}
        onTouchMove={movePull}
        onTouchEnd={endPull}
        onTouchCancel={endPull}
        style={{flex:1, overflowY:'auto', position:'relative'}}
      >
        {/* Header */}
        <div style={{padding:'10px 16px', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:10}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <span style={{fontSize:16}}>☀️</span>
              <span style={{color:C.text, fontWeight:700}}>Day {day}</span>
            </div>
            <div style={{display:'flex', gap:8}}>
              <button
                onClick={onOpenTweaks}
                title="Tweaks"
                style={{width:42, height:42, background:C.card2, border:'none', color:C.muted, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}
              >
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <path d="M4 7h10" />
                  <path d="M18 7h2" />
                  <path d="M4 17h2" />
                  <path d="M10 17h10" />
                  <circle cx="16" cy="7" r="2" />
                  <circle cx="8" cy="17" r="2" />
                </svg>
              </button>
              <div style={{width:42, height:42, background:C.card2, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}} onClick={() => setTab('profile')}>
                <svg viewBox="0 0 24 24" width="24" height="24" fill={C.muted}><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
              </div>
            </div>
          </div>

        </div>

        {(pullDistance > 0 || refreshing) && (
          <div style={{height:refreshing ? 42 : Math.max(26, pullDistance * 0.55), display:'flex', alignItems:'center', justifyContent:'center', color:C.muted, fontSize:12, transition:refreshing?'height 0.18s ease':'none'}}>
            {refreshing ? 'Loading new posts...' : pullDistance > 68 ? 'Release to refresh' : 'Pull for new posts'}
          </div>
        )}

        {/* Match day banner */}
        <MatchDayBanner match={currentMatch} day={day} onWatch={onWatchMatch} />

        {/* Posts */}
        {feed.map(post => (
          <PostCard key={post.id} post={post} chars={chars} player={player} onCharClick={onCharClick} onOpenThread={onOpenThread} tweaks={tweaks} />
        ))}

        {/* Spacer */}
        <div style={{height:18}}/>
      </div>

      {/* Feed actions */}
      <div style={{display:'flex', justifyContent:'center', gap:12, padding:'10px 16px 12px', background:C.bg, borderTop:`1px solid ${C.border}`, flexShrink:0}}>
        <button onClick={() => onEvent()} style={{
          background:'linear-gradient(135deg, #4dabf7, #2280d2)', color:'#fff', border:'none',
          borderRadius:28, padding:'13px 28px', fontSize:16, fontWeight:700, cursor:'pointer',
          display:'flex', alignItems:'center', gap:8, boxShadow:'0 3px 14px rgba(77,171,247,0.28)',
        }}>
          📣 Custom Event
        </button>
        <button onClick={onCompose} style={{
          background:C.blue, color:'#fff', border:'none',
          borderRadius:'50%', width:50, height:50, fontSize:28, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 3px 14px rgba(77,171,247,0.28)',
        }}>+</button>
      </div>
    </div>
  );
}

// ─── Messages Screen ──────────────────────────────────────────────
function MessagesScreen({ chars, player, dms, onOpenChat, dmNotifs = {}, setDmNotifs, groupChats = [], onOpenGroup, setGroupChats }) {
  const totalDmNotifs = Object.values(dmNotifs).reduce((a,b) => a+b, 0);
  const [creatingGroup, setCreatingGroup] = useState(false);
  const [groupName, setGroupName] = useState('');
  const [selectedMembers, setSelectedMembers] = useState([]);
  // GMZ can always receive tips, even before they have opened a DM thread.
  const charsWithGmz = [GMZ_CHAR, ...chars.filter(c => c.id !== GMZ_CHAR.id)];
  const visibleGroupChats = groupChats.filter(gc => (gc.members || []).includes('player'));

  function toggleMember(id) {
    setSelectedMembers(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function createGroupChat() {
    const members = ['player', ...selectedMembers.filter(Boolean)];
    if (members.length < 2) return;
    const memberNames = selectedMembers.map(id => chars.find(c => c.id === id)?.name.split(' ')[0]).filter(Boolean);
    const next = {
      id: `gc-custom-${Date.now()}`,
      name: groupName.trim() || memberNames.join(', ') || 'New Group Chat',
      members,
      messages: [],
      custom: true,
    };
    setGroupChats(gs => [next, ...gs]);
    setCreatingGroup(false);
    setGroupName('');
    setSelectedMembers([]);
    onOpenGroup(next);
  }

  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Messages</h1>
        <button onClick={() => setCreatingGroup(v => !v)} style={{background:C.blue, color:'#fff', border:'none', borderRadius:12, minWidth:44, height:40, fontSize:24, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>+</button>
      </div>

      {creatingGroup && (
        <div style={{margin:'10px 12px', padding:14, background:C.card2, border:`1px solid ${C.border}`, borderRadius:14}}>
          <input
            value={groupName}
            onChange={e => setGroupName(e.target.value)}
            placeholder="Group chat name"
            style={{width:'100%', background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:10, padding:'11px 12px', fontSize:14, outline:'none', marginBottom:12}}
          />
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:12}}>
            {chars.map(char => {
              const selected = selectedMembers.includes(char.id);
              return (
                <button key={char.id} onClick={() => toggleMember(char.id)} style={{display:'flex', alignItems:'center', gap:7, background:selected ? C.blue+'22' : C.card, color:selected ? C.blue : C.text, border:`1px solid ${selected ? C.blue : C.border}`, borderRadius:999, padding:'7px 10px', fontSize:13, cursor:'pointer'}}>
                  <Avatar char={char} size={22}/>
                  {char.name.split(' ')[0]}
                </button>
              );
            })}
          </div>
          <button onClick={createGroupChat} disabled={!selectedMembers.length} style={{width:'100%', background:selectedMembers.length ? C.blue : C.card, color:selectedMembers.length ? '#fff' : C.muted, border:'none', borderRadius:12, padding:'12px', fontSize:14, fontWeight:700, cursor:selectedMembers.length ? 'pointer' : 'default'}}>
            Create Chat
          </button>
        </div>
      )}

      {/* Group chats */}
      {visibleGroupChats.length > 0 && (
        <>
          <div style={{padding:'10px 16px 4px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Group Chats</span>
          </div>
          {visibleGroupChats.map(gc => {
            const memberChars = gc.members.map(id => id === 'player' ? player : chars.find(c => c.id === id)).filter(Boolean);
            const lastMsg = gc.messages[gc.messages.length - 1];
            const lastSender = lastMsg ? (lastMsg.charId === 'player' ? player : chars.find(c=>c.id===lastMsg.charId) || null) : null;
            const groupNotifKey = `group:${gc.id}`;
            const notifCount = dmNotifs[groupNotifKey] || 0;
            const hasUnread = notifCount > 0;
            return (
              <div key={gc.id} onClick={() => { setDmNotifs && setDmNotifs(n => ({...n, [groupNotifKey]: 0})); onOpenGroup(gc); }} style={{
                display:'flex', gap:12, padding:'12px 16px', borderBottom:`1px solid ${C.border}`,
                cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
              }}>
                <div style={{position:'relative', width:48, height:48, flexShrink:0}}>
                  {memberChars.slice(0,2).map((m,i) => (
                    <div key={m.id} style={{position:'absolute', top: i===0?0:'auto', bottom: i===1?0:'auto', left: i===0?0:'auto', right: i===1?0:'auto'}}>
                      <Avatar char={m} size={28}/>
                    </div>
                  ))}
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <span style={{fontWeight:700, fontSize:15, color:C.text}}>{gc.name}</span>
                  <p style={{color:C.muted, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                    {lastMsg ? `${lastSender?.name?.split(' ')[0] || 'Someone'}: ${lastMsg.text}` : 'Start the conversation'}
                  </p>
                </div>
                {hasUnread && (
                  <div style={{background:C.blue, color:'#fff', minWidth:22, height:22, borderRadius:999, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, padding:'0 6px'}}>
                    {notifCount}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{padding:'10px 16px 4px'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Direct Messages</span>
          </div>
        </>
      )}

      {/* DMs */}
      {charsWithGmz.map(char => {
        const msgs = dms[char.id] || [];
        const last = msgs[msgs.length - 1];
        const notifCount = dmNotifs[char.id] || 0;
        const hasUnread = notifCount > 0;
        return (
          <div key={char.id} onClick={() => { onOpenChat(char); setDmNotifs && setDmNotifs(n => ({...n, [char.id]: 0})); }} style={{
            display:'flex', gap:12, padding:'14px 16px', borderBottom:`1px solid ${C.border}`,
            cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
          }}>
            <div style={{position:'relative'}}>
              <Avatar char={char} size={48} />
              <div style={{position:'absolute', bottom:0, right:0, background:C.purple, borderRadius:'50%', width:16, height:16, display:'flex', alignItems:'center', justifyContent:'center', border:`2px solid ${C.bg}`}}>
                <span style={{fontSize:8}}>✦</span>
              </div>
            </div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{display:'flex', alignItems:'center', gap:4}}>
                <span style={{fontWeight: hasUnread ? 800 : 700, fontSize:15, color:C.text}}>{char.name}</span>
                <CharBadge char={char} />
              </div>
              <p style={{color: hasUnread ? C.text : C.muted, fontWeight: hasUnread ? 600 : 400, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                {last ? (last.role === 'char' ? last.text : `You: ${last.text}`) : (char.id === GMZ_CHAR.id ? 'Send an anonymous tip...' : `Say hi to ${char.name.split(' ')[0]}...`)}
              </p>
            </div>
            {hasUnread && (
              <div style={{background:'#e91e8c', borderRadius:'50%', width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#fff', flexShrink:0}}>
                {notifCount}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Chat Screen ──────────────────────────────────────────────────
// Stable, cacheable character context. Sent as a separate user message with
// cache_control: ephemeral so subsequent calls in the same conversation hit
// the cache. Variable content (feed, memory, current relationships, scene
// state) stays in buildSystemPrompt and is NOT cached.
function buildStableCharacterPreamble(char, allChars, player) {
  const includePrivateCanon = shouldIncludeKeresHavocRowanCanon('dm', [player, char]);
  return `You are writing a private DM as this character.

SPEAKER: ${compactCharacterCard(char, player)}
PLAYER: ${compactPlayerCard(player)}
VOICE LANE: ${dialogueContractSummaryFor(char)}
${relationshipLogicFor(char)}
${buildDmRules(includePrivateCanon)}

The conversation that follows provides relevant recent context, then the DM history. Stay in character and output only the message.`;
}

function dmConversationOwnershipNote(char, player, dms = {}, latestUserText = '') {
  const thread = Array.isArray(dms?.[char?.id]) ? dms[char.id].filter(m => m?.role === 'user' || m?.role === 'char') : [];
  const first = thread[0];
  const last = thread[thread.length - 1];
  if (first?.role === 'char') {
    const origin = first?.originContext ? ` Your opening context was: ${first.originContext}` : '';
    const replyFrame = latestUserText
      ? ` ${player.name}'s latest message is a reply to your DM, not a new intrusion.`
      : '';
    return `DM CONVERSATION OWNERSHIP:
- You opened this DM thread first. Your earlier message was your own outreach.${origin}
-${replyFrame || ` ${player.name} did not start this conversation unless a later message explicitly says she did.`}
- Do not act annoyed that ${player.name} "DM'd you first", "came into your DMs", or demanded your attention when she is answering a thread you started.
- If you feel defensive, be defensive about the topic, not about who initiated the DM.`;
  }
  if (first?.role === 'user') {
    return `DM CONVERSATION OWNERSHIP:
- ${player.name} opened this DM thread. You may react to being contacted if it fits your character, but track what she actually said.
- Do not pretend you started this thread unless your own prior message in the visible DM history did that.`;
  }
  if (!thread.length && latestUserText) {
    return `DM CONVERSATION OWNERSHIP:
- This is the first message in this DM thread, so ${player.name} is opening the conversation.
- React to her actual message, not to an invented earlier argument.`;
  }
  if (last?.role === 'char' && latestUserText) {
    return `DM CONVERSATION OWNERSHIP:
- ${player.name} is replying to your previous DM. Do not treat her reply as if she started a new fight out of nowhere.`;
  }
  return '';
}

function buildSystemPrompt(char, player, allChars, feed, dms, eventLog = [], groupChats = [], latestUserText = '', dmIntent = '', dmSituation = '') {
  const involvedHandles = [char?.handle, player?.handle].filter(Boolean).map(h => String(h).toLowerCase());
  const recentPosts = [...feed].filter(p => {
    const text = `${p.text || ''} ${p.reply?.text || ''}`.toLowerCase();
    return involvedHandles.some(handle => text.includes(`@${handle}`));
  }).slice(0, 3).map(p => {
    const poster = allChars.find(c => c.id === p.charId);
    const lines = [`@${poster?.handle || p.charId}: "${p.text}"`];
    if (p.reply) {
      const replier = allChars.find(c => c.id === p.reply.charId);
      lines.push(`  ↳ @${replier?.handle || p.reply.charId} replied: "${p.reply.text}"`);
    }
    return lines.join('\n');
  }).join('\n');

  const effectiveRel = effectivePlayerRelationship(char, eventLog, dms, groupChats).value;
  const effectiveRelMode = relationshipBehaviorMode(effectiveRel);
  const situationLine = dmSituation || dmSituationRulesFor(char, player, latestUserText);
  const ownershipNote = dmConversationOwnershipNote(char, player, dms, latestUserText);

  const appMemory = recentCompactMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars, channel:'dm', limit: 5 });
  const sceneContinuity = recentSceneContinuityForDM(char, player, eventLog);
  const privateOrbitRule = privateOrbitRelationshipRule(char, player, effectiveRel, 'private DM');
  const recentCharLines = (char?.id && dms?.[char.id] ? dms[char.id] : [])
    .filter(m => m?.role === 'char')
    .slice(-4)
    .map(m => String(m?.text || '').replace(/\s+/g, ' ').trim())
    .filter(Boolean);

  return `${dmIntent}
${situationLine}
${ownershipNote}
${compactPlayerStance(char, player, effectiveRel)}
Relationship behavior mode with ${player.name}: ${effectiveRelMode.label}. Behavioral mode: ${effectiveRelMode.behavioral}
Current effective relationship with ${player.name}, including this DM history: ${effectiveRel > 0 ? '+' : ''}${effectiveRel}%. Keep that relationship level consistent without mentioning the number.
${privateOrbitRule}
${sceneContinuity}
${appMemory}
${recentCharLines.length ? `\nRECENT LINES YOU ALREADY USED IN THIS DM:\n${recentCharLines.map((line, i) => `${i + 1}. "${line.slice(0, 160)}"`).join('\n')}\nDo not repeat, paraphrase, or echo these sentence shapes. If ${player.name} repeats a message, acknowledge the repeat or answer a different part instead of producing another generic correction.` : ''}
${recentPosts ? `\nRECENT PUBLIC POSTS THAT DIRECTLY MENTION THIS DM:\n${recentPosts}` : ''}

DM-SPECIFIC BEHAVIOR (your character preamble has the general rules; these handle situations particular to this private conversation with ${player.name}):
- Treat recent feed posts as visible evidence and rumor, not omniscient truth. If a post says "someone" liked, unliked, deleted, rewrote, screenshotted, or reposted something, do not decide that "someone" was ${player.name} unless she was explicitly named/tagged or she says so.
- Do not claim ${player.name} liked, unliked, deleted, rewrote, screenshotted, reposted, or performed any other app action unless it appears in the current prompt, app memory, visible feed with her handle/name, or her own DM message.
- If ${player.name} denies doing a concrete action, asks what evidence exists, or says everyone else is reacting, accept that correction and pivot. Do not restate the accusation as if repetition makes it true.
- Do not scold ${player.name} for someone else's attraction, attention, likes, screenshots, jealousy, or audience reaction. You can tease her effect on the room, but the other person still owns their reaction.
- Do not borrow another character's concerns, priorities, or relationships as your own.
- If ${player.name} tells you what happened in a completed scene, accept it as the current shared reality and move forward from it. Do not remain in a pre-scene "are you okay / what happened" mentality after she has recapped the scene.
- Do not ask whether you should understand an obvious relationship consequence. If someone mentions your sister, best friend, ex, captain, or teammate reacting to gossip about you, reason from what you know about that person only if that relationship is actually yours.
- If ${player.name} makes a playful private bid like "I can fix that" or "I can be more annoying", treat it as banter. Do not turn it into "prove it", "do it on the feed", or a public challenge unless she explicitly asks for one.
- Avoid public-commentary cleanup language in DMs: no "wrong target", "bad evidence", "vibes wearing a hat", "still chaotic. i am learning", "convenient for no one", or "if they guessed wrong" unless ${player.name} directly asks for a public-facing line.
- Do not answer private teasing with a detachable catchphrase. React to the latest wording, the relationship, and the emotional/social pressure in this DM.
${char?.id === 'rowan' ? `\n- ROWAN-SPECIFIC DM RULE: If ${player.name} asks why you are in a mood, what got you worked up, or who you are jealous of, answer the emotional pressure point directly. Do not repeat "jealous is a strong word", "accurate is under review", or "correcting the angle" once the conversation has moved past that dodge.` : ''}`;
}

// Compact identity block injected right before the latest user message so the
// character anchor stays prominent regardless of how long the DM history is.
function buildDMCharacterAnchor(char) {
  return `[CHARACTER ANCHOR — respond as this person only: ${char.name} (@${char.handle}). Voice: ${(char.personality || '').slice(0, 160)}. Your personality drives tone, vocabulary, and what you care about. Stay completely in character.]`;
}

function gmzTipReceiptText() {
  const receipts = [
    'tip received. if this makes the feed, your name stays out of it.',
    'received. source protected, chaos pending.',
    'noted. gmz is reviewing this with extremely unserious professionalism.',
    'tip logged. if anyone asks, this arrived by owl from nowhere.',
  ];
  return receipts[Math.floor(Math.random() * receipts.length)];
}

const DM_MAX_MESSAGES = 50;
const FEED_VISIBLE_CAP = 80;
const PLAYER_POST_ARCHIVE_CAP = 50;

function trimFeedPreservingPlayerPosts(nextFeed = []) {
  const feed = Array.isArray(nextFeed) ? nextFeed.filter(Boolean) : [];
  const head = feed.slice(0, FEED_VISIBLE_CAP);
  const headIds = new Set(head.map(p => p?.id).filter(Boolean));
  const olderPlayerPosts = feed
    .slice(FEED_VISIBLE_CAP)
    .filter(p => (p?.charId === 'player' || p?.isPlayerPost) && p?.id && !headIds.has(p.id))
    .slice(0, PLAYER_POST_ARCHIVE_CAP);
  return [...head, ...olderPlayerPosts];
}

function recentSceneContinuityForDM(char, player, eventLog = []) {
  if (!char?.id) return '';
  const scenes = (eventLog || [])
    .filter(entry => (entry?.type === 'scene' || entry?.sceneMemory) && canUseMemoryEntry(entry, char, player, { channel:'dm' }))
    .slice(0, 3);
  if (!scenes.length) return '';
  const lines = scenes.map((entry, idx) => {
    const title = entry.title || 'Completed scene';
    const text = String(entry.sceneMemory || entry.text || entry.outcome || '').replace(/\s+/g, ' ').slice(0, 360);
    const changes = (entry.scoreChanges || [])
      .filter(ch => ch?.avatar === char.id)
      .map(ch => `${ch.value > 0 ? '+' : ''}${ch.value}`)
      .join(', ');
    return `${idx + 1}. ${title}: ${text}${changes ? ` (relationship shift with you: ${changes})` : ''}`;
  }).join('\n');
  return `RECENT COMPLETED SCENE WITH ${char.name.toUpperCase()}:
${lines}
Scene continuity is high priority in this DM. Treat these scenes as already happened between you and ${player.name}; do not ask what happened, do not behave like you are still before the scene, and do not wait for ${player.name} to recap it before acting on the emotional fallout. If you were involved, you remember your own words, the last beat, and the relationship shift.`;
}

function privateOrbitRelationshipRule(char, player, rel = 0, mode = 'private chat') {
  if (!['havoc','rowan'].includes(char?.id)) return '';
  const label = rel >= 65 ? 'close orbit' : rel >= 45 ? 'warm interest' : rel >= 25 ? 'interested' : 'developing interest';
  const flavor = char.id === 'havoc'
    ? 'Havoc can still be blunt, stupid, smug, and physical, but with Keres at this relationship level his private baseline is protective warmth under the bite. His teasing should feel like rough affection, not contempt. In intimate or post-intimate moments, do not write him as endlessly aggressive or untouched by what is happening. Let him be affected too: breathless, amused, careful, impatient, caught off guard, or saying the soft thing badly. Do not open with where-are-you location pressure every time — he can lead with something real. Do not default to covering her mouth; his physical range includes going still, pulling her close, slowing down when something actually gets to him, speaking low. Dare framing is not required — he can give genuine praise, be the one who is wrecked, or let something honest slip that he cannot quite recover from. If he got the premise wrong, he should own it fast and redirect into backing her, checking exits, warning someone off, or making the situation safer/messier for her side.'
    : 'Rowan is not Havoc. His flavor is attention and precision, not blunt physicality. With Keres at this relationship level his private baseline is warm focus: he watches her, reads her pace, names what he notices. In intimate moments he does not need to be bossy or forceful — his version of intensity is knowing exactly what she wants and making her feel it. Do not default to covering her mouth; Rowan leans in and says something instead. Dare framing is not required — he can be honest, give real praise, or get a little undone when the smartness slips. If he got the premise wrong, he should correct the read, show he is listening, and turn the charm toward reassurance or a useful next move.';
  return `PRIVATE ORBIT RELATIONSHIP RULE (${mode}, ${label}, ${rel > 0 ? '+' : ''}${rel}% with ${player?.name || 'Keres'}):
${flavor}
- Do not write them like a hostile public commenter in private. Snark is seasoning, not the meal.
- Big corrections, fear, vulnerability, or "you hurt/annoyed me" moments require a real response. Do not leave her on read, do not answer with one-word coolness, and do not keep accusing her after she corrects the premise.
- If using "help", name the concrete help or make the intent obvious. Avoid vague threats like "before I start helping."`;
}

function ChatScreen({ char, player, allChars, feed, dms, eventLog = [], groupChats = [], setDms, onBack, onGMZTipSubmit }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const msgs = dms[char.id] || [];
  const messagesRef = useRef(null);
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const isGMZChat = char.id === GMZ_CHAR.id;

  useEffect(() => {
    scrollToLatest(messagesRef, endRef);
  }, [char.id, msgs.length, loading]);

  async function send() {
    if (!input.trim() || loading) return;
    const outgoingText = input.trim();
    const userMsg = { role:'user', text: outgoingText, id: Date.now() };
    const newMsgs = [...msgs, userMsg].slice(-DM_MAX_MESSAGES);
    setDms(d => ({ ...d, [char.id]: newMsgs, [`${char.id}_seen`]: false }));
    setInput('');
    setLoading(true);
    if (isGMZChat) {
      setTimeout(() => {
        const charMsg = { role:'char', text: gmzTipReceiptText(), id: Date.now()+1, tipReceipt: true };
        setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg], [`${char.id}_seen`]: false }));
        setLoading(false);
      }, 650);
      if (onGMZTipSubmit) {
        setTimeout(() => onGMZTipSubmit(outgoingText), 1600);
      }
      return;
    }
    try {
      // Smart silence: reserved/quiet chars sometimes don't reply
      const quietPersonalities = ['reserved', 'quiet', 'deadpan', 'minimal'];
      const isQuiet = quietPersonalities.some(q => (char.personality||'').toLowerCase().includes(q));
      const silenceChance = isQuiet ? 0.25 : 0.08;
      const mustAnswer = dmNeedsReply(outgoingText, char, eventLog, player);
      if (!mustAnswer && Math.random() < silenceChance && msgs.length > 0) {
        // Show "seen" indicator after a delay
        setTimeout(() => {
          setDms(d => ({ ...d, [`${char.id}_seen`]: true }));
          setLoading(false);
        }, 1800);
        return;
      }
      const dmIntent = dmIntentLine(outgoingText);
      const dmSituation = dmSituationRulesFor(char, player, outgoingText);
      const systemPrompt = buildSystemPrompt(char, player, allChars, feed, dms, eventLog, groupChats, outgoingText, dmIntent, dmSituation);
      // All history except the current message, then re-inject anchor + current message
      // so the character identity stays prominent at the bottom of the context window.
      const priorHistory = newMsgs.slice(0, -1).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
      const anchoredMessage = buildDMCharacterAnchor(char) + '\n\n' + outgoingText;
      const stablePreamble = buildStableCharacterPreamble(char, allChars, player);
      const reply = await window.claude.complete({
        label: 'DM reply',
        messages: [
          {
            role: 'user',
            content: [{
              type: 'text',
              text: stablePreamble,
              cache_control: { type: 'ephemeral' }
            }]
          },
          { role:'user', content: systemPrompt },
          ...priorHistory,
          { role:'user', content: anchoredMessage },
        ]
      });
      const dmAvoidTexts = newMsgs
        .filter(m => m?.role === 'char')
        .slice(-6)
        .map(m => m?.text)
        .filter(Boolean);
      const charMsg = { role:'char', text: cleanChatText(reply, char, player, false, { feed, latestUserText: outgoingText, avoidTexts: dmAvoidTexts, recentMessages: newMsgs, channel:'dm' }), id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg].slice(-DM_MAX_MESSAGES) }));
    } catch(e) {
      const errMsg = { role:'char', text: '...', id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), errMsg].slice(-DM_MAX_MESSAGES) }));
    }
    setLoading(false);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{background:'none', border:'none', color:C.blue, fontSize:16, cursor:'pointer', padding:'0 4px 0 0'}}>‹</button>
        <Avatar char={char} size={36} />
        <div>
          <div style={{display:'flex', alignItems:'center', gap:4}}>
            <span style={{fontWeight:700, color:C.text}}>{char.name}</span>
            <CharBadge char={char} />
          </div>
          <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
        </div>
      </div>
      {/* Messages */}
      <div ref={messagesRef} style={{flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10}}>
        {msgs.length === 0 && (
          <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:40}}>
            <div style={{fontSize:40, marginBottom:8}}><Avatar char={char} size={60} /></div>
            <p style={{marginTop:8}}><strong style={{color:C.text}}>{char.name}</strong></p>
            <p style={{marginTop:4, fontSize:13}}>{char.bio}</p>
            <p style={{marginTop:12, fontSize:12}}>{isGMZChat ? 'Submit an anonymous tip' : 'Start a conversation'}</p>
          </div>
        )}
        {msgs.map(m => (
          <div key={m.id} style={{display:'flex', flexDirection: m.role === 'user' ? 'row-reverse' : 'row', gap:8, alignItems:'flex-end'}}>
            {m.role !== 'user' && <Avatar char={char} size={28} />}
            <div style={{
              maxWidth:'75%', padding:'10px 14px', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              background: m.role === 'user' ? C.blue : C.card2, color:'#fff', fontSize:14, lineHeight:1.5,
            }}>{renderLinkedText(m.text, allChars)}</div>
          </div>
        ))}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28} />
            <div style={{padding:'10px 16px', borderRadius:'18px 18px 18px 4px', background:C.card2, color:C.muted, fontSize:14}}>
              <span style={{animation:'blink 1s infinite'}}>···</span>
            </div>
          </div>
        )}
        {!loading && dms[`${char.id}_seen`] && msgs.length > 0 && msgs[msgs.length-1].role === 'user' && (
          <div style={{textAlign:'right', color:C.muted, fontSize:11, padding:'0 4px'}}>Seen ✓</div>
        )}
        <div ref={endRef}/>
      </div>
      {/* Input */}
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder={isGMZChat ? 'Submit a tip...' : `Message ${char.name.split(' ')[0]}...`}
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? C.blue : C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor: input.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>
  );
}

function topicMentionsPlayer(topic = '', player = null) {
  const lower = String(topic || '').toLowerCase();
  const handle = String(player?.handle || '').toLowerCase();
  const name = String(player?.name || '').toLowerCase();
  return /\bkeres\b|@keresvalen|\bplayer\b/.test(lower)
    || (handle && lower.includes(`@${handle}`))
    || (name && lower.includes(name));
}

function buildFlyOnWallTimelineContext({
  presentChars = [],
  topic = '',
  location = '',
  tone = '',
  player = null,
  feed = [],
  dms = {},
  groupChats = [],
  eventLog = []
} = {}) {
  const chars = (presentChars || []).filter(Boolean);
  const presentIds = new Set(chars.map(c => c.id).filter(Boolean));
  const presentHandles = new Set(chars.map(c => String(c.handle || '').toLowerCase()).filter(Boolean));
  const topicHandles = new Set((String(topic || '').match(/@([a-z0-9_]+)/gi) || []).map(h => h.replace(/^@/, '').toLowerCase()));
  const playerRelevant = topicMentionsPlayer(topic, player) || topicHandles.has(String(player?.handle || '').toLowerCase());
  const relevantIds = new Set([...presentIds]);
  const relevantHandles = new Set([...presentHandles, ...topicHandles]);
  const relevantAliases = new Set();
  chars.forEach(c => {
    [c.id, c.handle, c.name].filter(Boolean).forEach(value => relevantAliases.add(String(value).toLowerCase()));
  });
  topicHandles.forEach(handle => relevantAliases.add(handle));
  if (playerRelevant && player) {
    relevantIds.add(player.id || 'player');
    relevantIds.add('player');
    if (player.handle) relevantHandles.add(String(player.handle).toLowerCase());
    [player.id || 'player', 'player', 'keres', player.handle, player.name].filter(Boolean).forEach(value => relevantAliases.add(String(value).toLowerCase()));
  }

  const normalizeId = id => id === player?.id ? 'player' : id;
  const charById = id => {
    const clean = normalizeId(id);
    if (clean === 'player') return player;
    return chars.find(c => c.id === clean);
  };
  const speakerLabel = id => {
    const speaker = charById(id);
    return speaker?.handle ? `@${speaker.handle}` : (id ? `@${id}` : '@someone');
  };
  const escapeForRegex = value => String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const relevantText = text => {
    const lower = String(text || '').toLowerCase();
    return [...relevantHandles].some(handle => handle && lower.includes(`@${handle}`))
      || [...relevantAliases].some(alias => alias && new RegExp(`\\b${escapeForRegex(alias)}\\b`, 'i').test(lower));
  };
  const relevantActor = id => relevantIds.has(normalizeId(id));

  const lines = [];
  const identityLine = [
    `Present: ${chars.map(c => `@${c.handle || c.id}`).join(', ') || 'none'}`,
    playerRelevant && player ? `Keres/player is an absent topic: @${player.handle || 'keresvalen'}` : '',
    topicHandles.size ? `Topic @mentions: ${[...topicHandles].map(h => `@${h}`).join(', ')}` : '',
    location ? `Location cue: ${truncateText(location, 80)}` : '',
    tone ? `Tone cue: ${truncateText(tone, 80)}` : '',
  ].filter(Boolean).join(' | ');
  if (identityLine) lines.push(`INVOLVED HANDLES: ${identityLine}`);

  const relationshipLines = [];
  chars.forEach(source => {
    chars.forEach(target => {
      if (source.id === target.id) return;
      const line = relationshipLine(source, target);
      if (line) relationshipLines.push(`@${source.handle} -> @${target.handle}: ${line.replace(/^Relationship to @[^:]+:\s*/i, '')}`);
    });
    if (playerRelevant && player) {
      const line = relationshipLine(source, player);
      if (line) relationshipLines.push(`@${source.handle} -> @${player.handle}: ${line.replace(/^Relationship to @[^:]+:\s*/i, '')}`);
    }
  });
  if (relationshipLines.length) lines.push(`RELATIONSHIPS: ${relationshipLines.slice(0, 10).join(' / ')}`);

  const feedItems = [];
  (feed || []).slice(0, 18).forEach(post => {
    if (feedItems.length >= 6 || !post) return;
    const postRelevant = relevantActor(post.charId) || relevantText(post.text);
    if (postRelevant) feedItems.push(compactPostForPrompt(post, chars, player));
    if (feedItems.length >= 6) return;
    if (post?.reply && (relevantActor(post.reply.charId) || relevantText(post.reply.text))) {
      feedItems.push(`Reply on visible feed: ${compactCommentForPrompt(post.reply, chars, player)}`);
    }
    (post?.charComments || []).forEach(cc => {
      if (feedItems.length >= 6) return;
      if (relevantActor(cc?.charId) || relevantText(cc?.text) || relevantText(cc?.replyTo)) {
        feedItems.push(`Comment on visible feed: ${compactCommentForPrompt(cc, chars, player)}`);
      }
    });
    (post?.botComments || []).forEach(bc => {
      if (feedItems.length >= 6) return;
      if (relevantText(bc?.text) || relevantText(bc?.replyTo) || (bc?.isPlayer && playerRelevant)) {
        feedItems.push(`Public rumor/speculation: ${compactCommentForPrompt({ bot: bc?.bot || 'student', text: bc?.text || '' }, chars, player)}`);
      }
    });
  });
  if (feedItems.length) {
    lines.push(`RECENT PUBLIC FEED:\n${feedItems.slice(0, 6).map((item, i) => `${i + 1}. ${truncateText(item, 260)}`).join('\n')}`);
  }

  const eventLines = [];
  (eventLog || []).slice(0, 18).forEach(entry => {
    if (eventLines.length >= 6 || !entry) return;
    const participants = memoryParticipantIds(entry, player);
    const visibility = memoryVisibilityForEntry(entry);
    const involvesRelevant = [...participants].some(id => relevantIds.has(normalizeId(id)))
      || relevantText(`${entry.title || ''} ${entry.text || ''} ${entry.outcome || ''} ${entry.scenario || ''} ${entry.action || ''}`);
    if (!involvesRelevant) return;
    const presentWhoKnow = chars.filter(c => participants.has(c.id));
    if (visibility !== 'public' && !presentWhoKnow.length) return;
    const participantLine = [...participants].map(speakerLabel).filter(Boolean).join(', ');
    const text = [entry.text, entry.outcome, entry.scenario, entry.action].filter(Boolean).join(' ');
    const scope = visibility === 'public' ? 'Public event' : `Private event known only to ${presentWhoKnow.map(c => `@${c.handle}`).join(', ')}`;
    eventLines.push(`${scope}: ${truncateText(entry.title || entry.type || 'Event', 80)}${participantLine ? ` [${participantLine}]` : ''}: ${truncateText(text, 180)}`);
  });
  if (eventLines.length) lines.push(`RECENT EVENT LOG:\n${eventLines.map((item, i) => `${i + 1}. ${item}`).join('\n')}`);

  const dmLines = [];
  chars.forEach(char => {
    const thread = dms?.[char.id] || [];
    if (!thread.length) return;
    const recent = thread.slice(-6).map(m => {
      const who = m.role === 'user' ? `@${player?.handle || 'keresvalen'}` : `@${char.handle || char.id}`;
      return `${who}: "${truncateText(m.text || '', 90)}"`;
    }).join(' / ');
    if (recent) dmLines.push(`Private context known to @${char.handle}: ${recent}`);
  });
  if (dmLines.length) lines.push(`RELEVANT DMS:\n${dmLines.slice(0, 4).join('\n')}`);

  const groupLines = [];
  (groupChats || []).forEach(group => {
    if (groupLines.length >= 3 || !group) return;
    const members = group.members || [];
    const presentMembers = chars.filter(c => members.includes(c.id));
    if (!presentMembers.length) return;
    const recent = (group.messages || []).slice(-8).map(m => {
      const who = m.role === 'user' ? `@${player?.handle || 'keresvalen'}` : speakerLabel(m.charId);
      return `${who}: "${truncateText(m.text || '', 80)}"`;
    }).join(' / ');
    if (recent) groupLines.push(`Group chat "${group.name || group.id || 'unnamed'}" known to ${presentMembers.map(c => `@${c.handle}`).join(', ')}: ${recent}`);
  });
  if (groupLines.length) lines.push(`RELEVANT GROUP CHATS:\n${groupLines.join('\n')}`);

  lines.push(`KNOWLEDGE BOUNDARIES: Public feed and public eventLog can be known by anyone. DMs are only knowledge for the labeled character. Group chat context is only knowledge for members of that group. Private scenes/events are only knowledge for the labeled present participants. Rumor/speculation labels stay uncertain.`);

  return lines.length
    ? truncateText(lines.join('\n\n'), 6200)
    : 'TIMELINE CONTEXT: No directly relevant saved timeline context. Do not invent established history.';
}

function buildFlyOnWallScenePrompt({ presentChars, topic, userContext = '', location, tone, length, canonImpact, player, feed = [], dms = {}, groupChats = [], eventLog = [] }) {
  const chars = (presentChars || []).filter(c => c && c.id !== 'player' && c.id !== '__gmz__');
  const promptTopic = String(topic || '').trim();
  const promptContext = String(userContext || '').trim();
  const combinedPromptContext = [promptTopic, promptContext].filter(Boolean).join('\n');
  const playerRelevant = topicMentionsPlayer(combinedPromptContext, player);
  const roster = chars.map(c => `${compactCharacterCard(c)}\nVoice lane: ${dialogueContractSummaryFor(c)}`).join('\n\n');
  const lengthConfig = FLY_ON_WALL_LENGTHS.find(l => l.id === length) || FLY_ON_WALL_LENGTHS[1];
  const lengthSpec = lengthConfig.instruction;
  const privateCanonAllowed = playerRelevant && chars.length > 0 && chars.every(c => ['havoc', 'rowan'].includes(c.id));
  const includePrivateCanon = privateCanonAllowed && shouldIncludeKeresHavocRowanCanon('scene', [...chars, player]);
  const timelineContext = buildFlyOnWallTimelineContext({ presentChars: chars, topic: combinedPromptContext, location, tone, player, feed, dms, groupChats, eventLog });
  return `Write a private character cutaway scene.

${buildCoreRules()}
${buildSceneRules(includePrivateCanon)}

PRESENT CHARACTERS ONLY:
${roster}

${playerRelevant ? `ABSENT TOPIC PERSON:\n${compactPlayerCard(player)}` : `ABSENT PLAYER:\n${player?.name || 'Keres'} (@${player?.handle || 'keresvalen'}) is not present and should not be centered unless the topic naturally calls for it.`}

MEANWHILE CUTAWAY MODE:
- This is a story-camera cutaway to the present characters, like a show moving elsewhere for a private scene.
- The player/Keres is absent and cannot speak.
- Do not write "you".
- Do not address the user.
- Do not frame Keres/the user as spying, listening from a hallway, overhearing, watching through a door, or physically present.
- Do not describe hidden observation, surveillance, eavesdropping, or anyone noticing they are being watched.
- Write in third-person limited/neutral scene narration.
- Only present characters can speak.
- Present characters can discuss absent people, including Keres, if relevant.
- Characters cannot know private information they were not present for.
- Public knowledge, public rumors/speculation, visible feed posts, team dynamics, and established relationships may influence the conversation.
- The user's topic and context are the spine of the scene. Use those details before generic app memory.
- For this requested length, incorporate at least ${lengthConfig.contextDetails} concrete details from USER TOPIC / USER CONTEXT across the scene. Do not dump them all in one recap; let characters argue about, dodge, weaponize, misunderstand, or react to them.
- Keep dialogue character-specific and socially alive.
- Reveal dynamics through jokes, dodges, disagreement, silence, and what they refuse to say.
- Do not invent major canon unless the user specifically asks or canon impact is full.
- Keres/player must not appear, answer, interrupt, narrate, or be addressed directly except as a quoted/hypothetical joke.
- Use scene-chat formatting: small physical actions in [brackets], then dialogue as plain text.
- No quote marks around dialogue. No asterisks.
- Each beat should be one speaker taking one small action, saying one line, or both.
- The requested length below is a required beat count, not a word count. Do not stop after a short exchange if "Long" was selected.

LOCATION: ${truncateText(location || 'A private campus location', 220)}
TONE: ${truncateText(tone || 'private, tense, character-driven', 160)}
LENGTH: ${lengthSpec}. Return between ${lengthConfig.minBeats} and ${lengthConfig.maxBeats} beat objects.
CANON IMPACT REQUESTED: ${canonImpact || 'none'}
USER TOPIC: ${truncateText(promptTopic || 'Let the present characters talk privately about what is on their minds.', 900)}
USER CONTEXT: ${truncateText(promptContext || 'No extra user context supplied.', length === 'long' ? 2600 : 1700)}

RELEVANT RECENT CONTEXT:
${timelineContext}

Return ONLY a JSON array of beat objects like:
[{"handle":"havocfang","action":"His jaw works once.","dialogue":"say the actual thing, rowan."}]

Use exact handles from the present-character roster. No notes. No explanations. No second-person narration. No spying/listening frame.`;
}

function scoreSceneRelationshipForChar(char, sceneMessages = [], vibe) {
  if (!char) return 0;
  const relevant = (sceneMessages || []).filter(m => m.role === 'user' || m.charId === char.id);
  if (relevant.length < 2) return 0;
  const text = relevant.map(m => m.text || '').join(' ');
  const warm = /(trust|honest|honesty|respect|appreciate|soft|care|close|stay|wanted|miss|like you|good|beautiful|hot|flirt|kiss|touch|smile|laugh|safe|alliance|ally|thank|yes|please)/i;
  const sharp = /(hate|leave|back off|shut up|idiot|stupid|threat|angry|hurt|liar|fight|fucked|fuck you|don't touch|do not touch|no)/i;
  const vibeBase = {
    catchup: 0.7,
    drama: 0.45,
    flirty: 1.1,
    fight: -0.15,
    more: 1.25,
  }[vibe?.id] ?? 0.45;
  let score = vibeBase + Math.min(1.4, relevant.length * 0.12);
  if (warm.test(text)) score += 0.75;
  if (sharp.test(text)) score -= 0.65;
  return +clamp(score, -2.5, 3.5).toFixed(2);
}

                <select value={flyLength} onChange={e => setFlyLength(e.target.value)} style={{width:'100%', background:C.card2, color:C.text, border:`1.5px solid ${C.border}`, borderRadius:12, padding:'10px', fontSize:13, outline:'none'}}>
                  {FLY_ON_WALL_LENGTHS.map(l => <option key={l.id} value={l.id}>{l.label}</option>)}
                </select>
              </div>
              <div>
                <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:8}}>CANON</p>
                <select value={canonImpact} onChange={e => setCanonImpact(e.target.value)} style={{width:'100%', background:C.card2, color:C.text, border:`1.5px solid ${C.border}`, borderRadius:12, padding:'10px', fontSize:13, outline:'none'}}>
                  {FLY_ON_WALL_CANON_IMPACTS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
            </div>
          </>
        )}

        {!isFlyOnWall && (
          <>
            <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:8}}>CUSTOM SCENARIO <span style={{color:C.muted, fontWeight:400, textTransform:'none', letterSpacing:0}}>(optional — skips preset pickers)</span></p>
            <textarea
              value={customScenario}
              onChange={e => setCustomScenario(e.target.value)}
              placeholder="Describe what's happening — the situation, what you want to play out, any setup details that matter. If filled, you can skip the WHERE and TONE grids below."
              rows={3}
              style={{
                width:'100%', background:C.card2, border:`1.5px solid ${hasCustomScenario ? C.blue : C.border}`, borderRadius:12,
                padding:'10px 12px', color:C.text, fontSize:13, resize:'vertical', outline:'none',
                fontFamily:'inherit', lineHeight:1.5, marginBottom:18, boxSizing:'border-box',
              }}
            />
          </>
        )}

        <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>{hasCustomScenario && !isFlyOnWall ? 'WHERE (optional)' : 'WHERE'}</p>
        <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:18}}>
          {SCENE_SETTINGS.map(s => (
            <button key={s.id} onClick={() => setSetting(s === setting ? null : s)} style={{
              display:'flex', alignItems:'center', gap:12, background: setting?.id===s.id ? `${C.blue}18` : C.card2,
              border:`1.5px solid ${setting?.id===s.id ? C.blue : C.border}`, borderRadius:12,
              padding:'10px 14px', cursor:'pointer', textAlign:'left', transition:'all 0.15s',
            }}>
              <span style={{fontSize:20}}>{s.emoji}</span>
              <div>
                <p style={{color:C.text, fontSize:13, fontWeight:600}}>{s.label}</p>
                <p style={{color:C.muted, fontSize:11}}>{s.sub}</p>
              </div>
            </button>
          ))}
        </div>

        <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>{hasCustomScenario && !isFlyOnWall ? 'TONE (optional)' : 'TONE'}</p>
        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:20}}>
          {SCENE_VIBES.map(v => (
            <button key={v.id} onClick={() => setVibe(vibe?.id === v.id ? null : v)} style={{
              display:'flex', alignItems:'center', gap:6,
              background: vibe?.id===v.id ? `${v.color}20` : C.card2,
              border:`1.5px solid ${vibe?.id===v.id ? v.color : C.border}`,
              borderRadius:20, padding:'7px 14px', cursor:'pointer', transition:'all 0.15s',
            }}>
              <span style={{fontSize:14}}>{v.emoji}</span>
              <span style={{color: vibe?.id===v.id ? v.color : C.text, fontSize:13, fontWeight:600}}>{v.label}</span>
            </button>
          ))}
        </div>

        <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>WHO</p>
        <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:20}}>
          {sceneChoices.map(c => {
            const active = selectedIds.includes(c.id);
            const locked = c.id === char.id;
            return (
              <button key={c.id} onClick={() => toggleSceneChar(c.id)} style={{
                display:'flex', alignItems:'center', gap:10,
                background: active ? `${C.blue}18` : C.card2,
                border:`1.5px solid ${active ? C.blue : C.border}`,
                borderRadius:12, padding:'9px 12px', cursor: locked && !isFlyOnWall ? 'default' : 'pointer',
                textAlign:'left',
              }}>
                <Avatar char={c} size={30}/>
                <div style={{flex:1, minWidth:0}}>
                  <p style={{color:C.text, fontSize:13, fontWeight:700}}>{c.name}</p>
                  <p style={{color:C.muted, fontSize:11}}>@{c.handle}</p>
                </div>
                <span style={{color:active ? C.blue : C.muted, fontSize:18}}>{active ? '✓' : '+'}</span>
              </button>
            );
          })}
        </div>

        <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:8}}>CONTEXT <span style={{color:C.muted, fontWeight:400, textTransform:'none', letterSpacing:0}}>(optional)</span></p>
        <textarea
          value={context}
          onChange={e => setContext(e.target.value)}
          placeholder="What's already happened, what's the mood, any details that matter…"
          rows={3}
          style={{
            width:'100%', background:C.card2, border:`1.5px solid ${C.border}`, borderRadius:12,
            padding:'10px 12px', color:C.text, fontSize:13, resize:'vertical', outline:'none',
            fontFamily:'inherit', lineHeight:1.5, marginBottom:20, boxSizing:'border-box',
          }}
        />

        <button onClick={startScene} disabled={!canStart} style={{
          width:'100%', background: canStart ? C.text : C.card2,
          color: canStart ? C.bg : C.muted,
          border:'none', borderRadius:14, padding:'14px', fontSize:15, fontWeight:700,
          cursor: canStart ? 'pointer' : 'default', transition:'all 0.2s',
        }}>{isFlyOnWall ? 'Start meanwhile' : 'Start scene'}</button>
      </div>
    </div>
  );
}

function SceneChatScreen({ char, sceneChars, player, setting, vibe, context = '', sceneMode = 'participant', topic = '', location = '', tone = '', length = 'medium', canonImpact = 'none', feed = [], dms = {}, groupChats = [], eventLog = [], onClose, onEnd }) {
  const participants = (sceneChars && sceneChars.length ? sceneChars : [char]).filter(Boolean);
  const primaryChar = participants[0];
  const isFlyOnWall = sceneMode === 'fly_on_wall';
  const displaySetting = setting || { label: location || 'Private scene', sub: isFlyOnWall ? 'Private character cutaway' : '', emoji: isFlyOnWall ? '👁️' : '🎭' };
  const displayVibe = vibe || { label: tone || 'Private tension', emoji: isFlyOnWall ? '👁️' : '💬', color:C.purple };
  const SCENE_MAX_MESSAGES = 60;
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [flyError, setFlyError] = useState('');
  const messagesRef = useRef(null);
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const getSceneChar = id => participants.find(c => c.id === id) || primaryChar;

  useEffect(() => {
    scrollToLatest(messagesRef, endRef);
  }, [msgs.length, loading]);

  // Opening line from character, or full private cutaway for meanwhile mode.
  useEffect(() => {
    async function openingLine() {
      setLoading(true);
      setFlyError('');
      if (isFlyOnWall) {
        console.log('[Meanwhile] start', {
          presentChars: participants.map(c => ({ id: c.id, handle: c.handle, name: c.name })),
          topic: topic || context,
          location: location || displaySetting.label,
          tone: tone || displayVibe.label,
          length,
          canonImpact,
        });
      }
      // Short delay before first line — feels like they just arrived
      await new Promise(res => setTimeout(res, 2000 + Math.random()*3000));
      try {
        if (isFlyOnWall) {
          const messages = [{ role:'user', content: buildFlyOnWallScenePrompt({
            presentChars: participants,
            topic,
            userContext: context,
            location: location || displaySetting.label,
            tone: tone || displayVibe.label,
            length,
            canonImpact,
            player,
            feed,
            dms,
            groupChats,
            eventLog,
          }) }];
          const lengthConfig = FLY_ON_WALL_LENGTHS.find(l => l.id === length) || FLY_ON_WALL_LENGTHS[1];
          const meanwhileOutputTokens = length === 'long' ? 2400 : length === 'medium' ? 1600 : 1000;
          warnPromptBudget("meanwhile cutaway scene", messages, 8000);
          console.log('[Meanwhile] before API call', {
            label: 'meanwhile cutaway scene',
            messageCount: messages.length,
            promptChars: String(messages[0]?.content || '').length,
            maxOutputTokens: meanwhileOutputTokens,
          });
          const res = await window.claude.complete({
            label: 'meanwhile cutaway scene',
            messages,
            maxOutputTokens: meanwhileOutputTokens,
          });
          console.log('[Meanwhile] AI returned', res);
          let normalized = normalizeFlyOnWallBeats(res, participants);
          if (normalized.length > 0 && normalized.length < lengthConfig.minBeats) {
            const priorBeats = normalized.map(m => {
              const speaker = participants.find(c => c.id === m.charId);
              return `${speaker?.handle || 'scene'}: ${m.text}`;
            }).join('\n');
            const continuationMessages = [{
              role:'user',
              content: `${messages[0].content}

The first pass only produced ${normalized.length} beats. Continue the same cutaway from the last beat below and add ${lengthConfig.minBeats - normalized.length} to ${Math.max(lengthConfig.minBeats - normalized.length, lengthConfig.maxBeats - normalized.length)} additional beat objects. Keep using USER TOPIC and USER CONTEXT, and bring in concrete details that have not appeared yet.

ALREADY WRITTEN BEATS:
${priorBeats}

Return ONLY a JSON array of additional beat objects.`
            }];
            const continuation = await window.claude.complete({
              label: 'meanwhile cutaway scene',
              messages: continuationMessages,
              maxOutputTokens: Math.max(900, Math.floor(meanwhileOutputTokens * 0.75)),
            });
            normalized = [...normalized, ...normalizeFlyOnWallBeats(continuation, participants)].slice(0, lengthConfig.maxBeats);
          }
          console.log('[Meanwhile] normalized messages', normalized);
          setMsgs(prev => {
            const next = [...prev, ...normalized].slice(-SCENE_MAX_MESSAGES);
            console.log('[Meanwhile] appended', { added: normalized.length, total: next.length });
            return next;
          });
          setLoading(false);
          console.log('[Meanwhile] loading false');
          return;
        }
        let openers = [];
        for (let attempt = 0; attempt < 2 && !openers.length; attempt++) {
          const res = await window.claude.complete({
            label: 'scene opening',
            messages:[{ role:'user', content: buildScenePrompt('') + `\n\nOpen the scene with 1-2 short lines from the invited character(s). Return ONLY a JSON array of objects like [{"handle":"havocfang","text":"You picked a dramatic spot."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. No narration. Avoid placeholder reaction beats like leaning back, raising eyebrows, almost smiling, watching, looking over, pausing, waiting, or saying nothing unless attached to a specific spoken choice. If nobody has a grounded opening move, return [].${attempt ? '\nThe previous attempt failed because it used a generic non-response. Regenerate with a specific grounded line or return [].' : ''}` }]
          });
          const parsed = parseJsonArrayFromText(res);
          const usedSceneTexts = msgs.map(m => m.text || '').filter(Boolean);
          openers = parsed.slice(0,2).map((m, i) => {
            const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
            const text = cleanSceneReply(m.text || '', speaker, usedSceneTexts);
            if (text) usedSceneTexts.push(text);
            return { role:'char', charId:speaker.id, text, id: Date.now() + i, ts: Date.now() };
          }).filter(m => m.text);
        }
        setMsgs(openers);
      } catch(e) {
        if (isFlyOnWall) {
          console.error('[Meanwhile] error', e);
          setFlyError('Could not load the scene. Try starting it again.');
          const t = Date.now();
          setMsgs(prev => [...prev, {
            role: 'scene',
            charId: null,
            text: 'The cutaway stalls. Something failed before the scene could settle.',
            isNarration: true,
            mode: 'fly_on_wall',
            id: t,
            timestamp: t,
            ts: t,
          }].slice(-SCENE_MAX_MESSAGES));
          setLoading(false);
          console.log('[Meanwhile] loading false');
          return;
        }
        setMsgs([]);
      }
      setLoading(false);
    }
    openingLine();
  }, []);

  function buildScenePrompt(history, latestText = '') {
    const includePrivateCanon = shouldIncludeKeresHavocRowanCanon('scene', [player, ...participants]);
    const roster = participants.map(c => `${compactCharacterCard(c, player)}\nVoice lane: ${dialogueContractSummaryFor(c)}`).join('\n');
    return `Write a live scene with these characters:
${roster}

Player: ${compactPlayerCard(player)}
${buildSceneRules(includePrivateCanon)}
${multiSpeakerDialogueSeparationRule(participants, 'live scene')}
${threadPatternVarietyGuard(history ? [history] : [])}
${latestText ? directResponseRoutingLine(latestText, participants, player) : ''}

SCENE: ${displaySetting.label} — ${displaySetting.sub}
TONE: ${displayVibe.label} ${displayVibe.emoji}
${topic ? `SCENARIO: ${topic}` : ''}
${context ? `SCENE CONTEXT: ${context}` : ''}

RESPONSE FORMAT — follow this exactly:
- Actions go in italics asterisks, third person: *She glances up slowly, saying nothing at first.*
- Dialogue is plain text with NO quote marks. Never wrap spoken words in " " or curly quotes.
- Thoughts are NEVER stated directly. At most a very brief physical tell that hints at them: *something flickers across her face* — not "she thinks" or "she wonders".
- A response might be just dialogue, just an action, or both — whatever feels natural.
- Keep it SHORT: 1-2 lines total. This is live conversation, not a story. No paragraph blocks.
- Do not write stage-play beats like "Pauses." or long narrated reactions. Use one small physical action at most.
- Stay completely in character for whoever is speaking. Let the group chemistry matter.
- Use the pronouns listed above exactly. Do not misgender anyone.
- Treat house/team/player status like fixed identity. If someone is not on a Quidditch team, do not write them as a player. If someone mentions their own house or team, they use we/us/our.
- The vibe is ${displayVibe.label}. Honor it.
- If the player writes [something in brackets], treat it as a physical action and react naturally.
${history ? `\nCONVERSATION SO FAR:\n${history}` : ''}
`;
  }

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', charId:'player', text: input.trim(), id: Date.now(), ts: Date.now() };
    setMsgs(prev => [...prev, userMsg].slice(-SCENE_MAX_MESSAGES));
    setInput('');
    setLoading(true);
    // Realistic typing delay: 4-8 seconds
    const typingDelay = 4000 + Math.random() * 4000;
    await new Promise(res => setTimeout(res, typingDelay));
    try {
      const history = [...msgs, userMsg].map(m =>
        m.role === 'user' ? `${player.name}: ${m.text}` : `${getSceneChar(m.charId)?.name}: ${m.text}`
      ).join('\n');
      let replies = [];
      for (let attempt = 0; attempt < 2 && !replies.length; attempt++) {
        const res = await window.claude.complete({
          label: 'scene reply',
          messages:[{ role:'user', content: buildScenePrompt(history, userMsg.text) + `\n\nRespond to: ${userMsg.text}\nChoose the character or characters who would naturally answer. In a group scene, not everyone needs to speak every turn, but if the player directly names one participant, that participant answers first. More than one may jump in only if the moment invites it.\nReturn ONLY a JSON array of 0-3 objects like [{"handle":"rowancade","text":"..."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. No narration. No inner monologue spelled out. Avoid placeholder reaction beats like leaning back, raising eyebrows, almost smiling, watching, looking over, pausing, waiting, or saying nothing unless attached to a specific spoken choice. If no one has a grounded response to this exact moment, return [].${attempt ? '\nThe previous attempt failed because it used a generic non-response. Regenerate with a specific grounded reply or return [].' : ''}` }]
        });
        const parsed = parseJsonArrayFromText(res);
        const usedSceneTexts = msgs.map(m => m.text || '').filter(Boolean);
        replies = parsed.slice(0,3).map((m, i) => {
          const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
          const text = cleanSceneReply(m.text || '', speaker, usedSceneTexts);
          if (text) usedSceneTexts.push(text);
          return { role:'char', charId:speaker.id, text, id: Date.now()+1+i, ts: Date.now() };
        }).filter(m => m.text);
      }
      if (replies.length) setMsgs(prev => [...prev, ...replies].slice(-SCENE_MAX_MESSAGES));
    } catch(e) {}
    setLoading(false);
  }

  function endScene() {
    if (onEnd) onEnd(participants, msgs, displayVibe, { sceneMode, canonImpact, topic, location: location || displaySetting.label, tone: tone || displayVibe.label, length });
    onClose();
  }

  const vibeColor = displayVibe.color || C.purple;

  return (
    <div style={{
      position:'fixed',
      inset:0,
      zIndex:500,
      height:'100dvh',
      maxHeight:'100dvh',
      overflow:'hidden',
      display:'flex',
      flexDirection:'column',
      background:C.bg,
    }}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer', lineHeight:1}}>‹</button>
        <div style={{display:'flex'}}>
          {participants.slice(0,3).map((c,i) => <div key={c.id} style={{marginLeft:i ? -9 : 0}}><Avatar char={c} size={34}/></div>)}
        </div>
        <div style={{flex:1}}>
          <p style={{color:C.text, fontWeight:700, fontSize:14}}>{participants.map(c => c.name.split(' ')[0]).join(', ')}</p>
          <p style={{color:C.muted, fontSize:11}}>{displaySetting.emoji} {displaySetting.label}</p>
        </div>
        <div style={{background:`${vibeColor}18`, border:`1px solid ${vibeColor}44`, borderRadius:20, padding:'4px 10px', display:'flex', alignItems:'center', gap:4}}>
          <span style={{fontSize:12}}>{displayVibe.emoji}</span>
          <span style={{color:vibeColor, fontSize:11, fontWeight:600}}>{isFlyOnWall ? 'Meanwhile' : displayVibe.label}</span>
        </div>
        <button onClick={endScene} style={{background:C.card2, color:C.text, border:`1px solid ${C.border}`, borderRadius:18, padding:'7px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>End</button>
      </div>

      {/* Scene setting banner */}
      <div style={{padding:'10px 16px', background:C.card2, borderBottom:`1px solid ${C.border}`}}>
        <p style={{color:C.muted, fontSize:12, textAlign:'center'}}>{isFlyOnWall ? `${displayVibe.label} cutaway · canon impact: ${canonImpact}` : displaySetting.sub}</p>
      </div>

      {/* Messages */}
      <div ref={messagesRef} style={{flex:1, overflowY:'auto', padding:`16px 14px ${bottomSafe(92)}`, display:'flex', flexDirection:'column', gap:12}}>
        {isFlyOnWall && flyError && (
          <div style={{background:'#3a1f1f', border:'1px solid #6b2c2c', borderRadius:12, padding:'10px 12px', color:'#ffb4b4', fontSize:12, lineHeight:1.5}}>
            {flyError}
          </div>
        )}
        {msgs.map(m => {
          if (isFlyOnWall) {
            if (m.role === 'scene' || m.isNarration) {
              return (
                <div key={m.id || m.timestamp || m.ts} style={{alignSelf:'stretch', background:C.card2, border:`1px solid ${C.border}`, borderRadius:12, padding:'14px 15px', color:C.text, fontSize:14, lineHeight:1.75, whiteSpace:'pre-wrap'}}>
                  {cleanSceneActionDialogueText(cleanFlyOnWallSceneText(m.text, player) || m.text)}
                </div>
              );
            }
            const speaker = getSceneChar(m.charId);
            const displayText = cleanSceneActionDialogueText(m.text);
            return (
              <div key={m.id || m.timestamp || m.ts} style={{display:'flex', gap:8, alignItems:'flex-end'}}>
                <Avatar char={speaker} size={28}/>
                <div style={{maxWidth:'82%', padding:'10px 14px', borderRadius:'18px 18px 18px 4px', background:C.card2, color:C.text, fontSize:14, lineHeight:1.7}}>
                  <div style={{color:C.muted, fontSize:11, fontWeight:700, marginBottom:3}}>@{speaker?.handle || 'scene'}</div>
                  {renderSceneParts(displayText)}
                </div>
              </div>
            );
          }
          const isMe = m.role === 'user';
          const displayText = isMe ? m.text : cleanSceneText(m.text);
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={getSceneChar(m.charId)} size={28}/>}
              {isMe && <Avatar char={player} size={28}/>}
              <div style={{
                maxWidth:'76%', padding:'10px 14px',
                borderRadius: isMe ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                background: isMe ? C.blue : C.card2,
                color: isMe ? '#fff' : C.text,
                fontSize:14, lineHeight:1.7,
              }}>
                {isMe ? displayText : renderSceneParts(displayText)}
              </div>
            </div>
          );
        })}
        {loading && (
          isFlyOnWall ? (
            <div style={{alignSelf:'stretch', background:C.card2, border:`1px solid ${C.border}`, borderRadius:12, padding:'13px 15px', color:C.muted, fontSize:13, lineHeight:1.5}}>
              Cutting away...
            </div>
          ) : (
            <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
              <Avatar char={primaryChar || char} size={28}/>
              <div style={{background:C.card2, borderRadius:'18px 18px 18px 4px', padding:'10px 16px'}}>
                <div style={{display:'flex', gap:4, alignItems:'center'}}>
                  {[0,1,2].map(i => <div key={i} style={{width:6, height:6, borderRadius:'50%', background:C.muted, opacity:0.6, animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
                </div>
              </div>
            </div>
          )
        )}
        <div ref={endRef}/>
      </div>

      {/* Input */}
      {!isFlyOnWall && (
        <div style={{padding:`10px 12px ${bottomSafe(10)}`, borderTop:`1px solid ${C.border}`, background:C.bg, display:'flex', gap:8, alignItems:'flex-end'}}>
          <div style={{flex:1, background:C.card2, borderRadius:22, border:`1px solid ${input.trim() ? vibeColor+'66' : C.border}`, padding:'11px 14px', transition:'border-color 0.2s'}}>
            <textarea ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onFocus={() => scrollToLatest(messagesRef, endRef)}
              placeholder="Say something... or [do something]"
              rows={2}
              style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:16, outline:'none', resize:'none', lineHeight:1.35, maxHeight:96}}
            />
          </div>
          <button onClick={send} disabled={!input.trim() || loading} style={{
            background: input.trim() ? vibeColor : C.card2, color:'#fff', border:'none',
            borderRadius:'50%', width:46, height:46, cursor: input.trim() ? 'pointer' : 'default',
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:18,
            transition:'background 0.2s',
          }}>→</button>
        </div>
      )}
      <style>{`@keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }`}</style>
    </div>
  );
}

// ─── Character Profile Screen ─────────────────────────────────────
const CHEMISTRY_LABELS = {
  default: 'Chaos Co-Conspirators',
  rivals: 'Sworn Rivals with Unresolved Tension',
  spicy: 'Spicy Situationship Energy',
  lovers: 'Star-Crossed Lovers',
  enemies: 'Enemies with Very Bad Ideas',
  friends: 'Ride-or-Die Friends',
};
const CHEMISTRY_CHIPS = [
  {id:'rivals', icon:'⚔️', label:'Rivals'},
  {id:'spicy', icon:'🌶️', label:'Spicy'},
  {id:'lovers', icon:'💕', label:'Lovers'},
  {id:'enemies', icon:'😈', label:'Enemies'},
  {id:'friends', icon:'🤝', label:'Friends'},
];

function relationshipStageLabel(value) {
  if (value >= 60) return 'Close Orbit';
  if (value >= 25) return 'Warm Interest';
  if (value > 0) return 'Something Brewing';
  if (value === 0) return 'Neutral';
  if (value > -25) return 'Complicated';
  return 'Bad Blood';
}

function fallbackProfileFeeling(char, rel = 0) {
  const positive = rel > 8;
  const warm = rel > 0;
  const guarded = rel < 0;
  const pool = {
    tamsin: positive
      ? ['I trust her more than I planned to, which is inconvenient but not unpleasant.']
      : guarded
        ? ['I am watching the pattern before I decide how worried to be.']
        : ['She is interesting enough to keep watching. I mean that neutrally, mostly.'],
    havoc: warm
      ? ['She is trouble in a way that makes standing still feel stupid.']
      : ['She hits back fast. Obviously I noticed.'],
    rowan: warm
      ? ['She keeps changing the room before anyone admits they are watching.']
      : ['She is either a problem or the point, which is inconveniently funny.'],
    silas: warm
      ? ['She is useful, sharp, and far too aware of it.', 'She and Jude are loud proof that attention is not the same thing as leverage. irritatingly effective proof.']
      : ['She has talent. Whether she has discipline remains the question.', 'She has talent. Jude encouraging the spectacle is not improving my confidence.'],
    callum: warm
      ? ['She is good, which is annoying because pretending otherwise would be sloppy.']
      : ['She talks like the scoreboard already belongs to her. It does not.'],
    jude: warm
      ? ['She makes the room worse in a way I respect professionally.', 'She understands that being vain and annoying is better as a team sport.']
      : ['She is loud enough to be useful and annoying enough to be fun.', 'She has public nuisance instincts. obviously useful.'],
  }[char?.id] || (warm
    ? ['I am paying attention, which is already more than most people get.']
    : guarded
      ? ['I am keeping my distance until the pattern gets clearer.']
      : ['I am watching the situation develop with terrible judgment.']);
  return pool[Math.floor(Math.random() * pool.length)];
}

function cleanProfileFeelingText(raw = '', char, rel = 0) {
  const clean = stripLeadingSelfMention(cleanSelfNarration(cleanGeneratedText(raw), char), char)
    .replace(/^current feeling:\s*/i, '')
    .replace(/^feeling:\s*/i, '')
    .replace(/^["']|["']$/g, '')
    .trim();
  if (!clean || looksLikePromptLeak(clean) || isSelfNarration(clean, char) || clean.length > 180) {
    return fallbackProfileFeeling(char, rel);
  }
  return clean;
}

      const existingDms = (dms[char.id] || []).slice(-3);

        ? existingDms.map(m => `${m.role === 'user' ? player.name : char.name}: "${String(m.text || '').slice(0, 100)}"`).join(' / ')
        : '';

      const effectiveRel = effectivePlayerRelationship(char, eventLog, dms, groupChats).value;
      const includePrivateCanon = shouldIncludeKeresHavocRowanCanon('dm', [char, player]);
      const privateOrbitRule = privateOrbitRelationshipRule(char, player, effectiveRel, 'private DM');
      const dmSituation = dmSituationRulesFor(char, player, '');

      const contextPrompt = [
        dmSituation,
        privateOrbitRule,
        includePrivateCanon ? `${KERES_HAVOC_ROWAN_CANON}\n${HAVOC_PRIVATE_INTIMACY_RULE}` : '',
        recentFeedContext ? `\nRECENT PUBLIC FEED:\n${recentFeedContext}` : '',
        recentEvents ? `\nRECENT EVENTS: ${recentEvents}` : '',
        recentDmSnippet ? `\nMOST RECENT DMs: ${recentDmSnippet}` : '',
        `\nWrite ONE opening DM from ${char.name} to ${player.name} initiating contact right now. Pull from the above context — react to something on the feed, follow up on a scene or event, want to hang out, or just feel like reaching out. Keep it short (1-2 sentences, occasionally 3). Do NOT open with asking where she is. Do NOT default to sexual. It can be easy, funny, a running joke, a genuine invitation, something on your mind. Sound exactly like yourself.`,
      ].filter(Boolean).join('\n');

        });

        const relevantProfilePost = p => {

        const recentContext = feed.filter(relevantProfilePost).slice(0,3).map(p => {

        }).join('\n');
        const dmContext = (dms[char.id] || []).slice(-4).map(m => `${m.role === 'user' ? player.name : char.name}: "${truncateText(m.text, 140)}"`).join('\n');
        const filteredLogV = (eventLog || []).filter(e => e && e.type !== 'dm' && canUseMemoryEntry(e, char, player, { channel:'profile' }));
        const sceneContextV = filteredLogV
          .filter(e => e.type === 'scene' || !!e.sceneMemory)

          .map(e => `Scene — ${e.title || 'Completed scene'}: ${truncateText(e.sceneMemory || e.text || e.outcome || '', 220)}`)

        const eventContextV = filteredLogV
          .filter(e => e.type !== 'scene' && !e.sceneMemory)
