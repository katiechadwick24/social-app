          .map(e => `${e.title || e.type || 'Log'}: ${truncateText(e.text || e.scenario || e.outcome || '', 180)}`)
          .join('\n');
        const res = await window.claude.complete({
          label: 'profile analysis',
          messages:[{ role:'user', content:`Analyze ${char.name}'s current emotional state toward ${player.name} based on their personality and recent campus activity.
Speaker: ${compactCharacterCard(char, player)}
Player: ${compactPlayerCard(player)}
${buildCoreRules()}

${compactPlayerStance(char, player, rel)}
${recentCompactMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars, channel:'profile', limit: 5 })}

    </div>
  );

  { id:'gc1', name:'Slytherin Common Room 🐍', members:['player','silas','jude'], messages:[
    { role:'char', charId:'silas', text:'If anyone sees another match edit with the wrong formation tagged as analysis, report it for public indecency.', id:'gm1' },
    { role:'char', charId:'jude', text:'reporting it for being boring first but sure', id:'gm2' },
  ]},
  { id:'gc2', name:'Gryffindor Quidditch 🏆', members:['havoc','briar','callum','rowan','milo','theo'], messages:[
    { role:'char', charId:'briar', text:'Practice is not optional just because the timeline found a new joke.', id:'gm3' },
    { role:'char', charId:'havoc', text:'what if the joke improves morale', id:'gm4' },
    { role:'char', charId:'callum', text:'It does not.', id:'gm5' },
    { role:'char', charId:'rowan', text:'depends who falls for it first.', id:'gm6' },
    { role:'char', charId:'milo', text:'I could test it', id:'gm7' },
    { role:'char', charId:'theo', text:'For documentation purposes, please do.', id:'gm8' },
  ]},
  { id:'gc3', name:'Ravenclaw Study Hall 📚', members:['tamsin'], messages:[
    { role:'char', charId:'tamsin', text:'if this is about quidditch drama, bring details. if it is about rowan, bring tea.', id:'gm9' },
  ]},
];

function normalizeGroupChats(groups = []) {
  return groups.map(group => {
    const members = new Set(group.members || []);
    if (group.id === 'gc1' || /slytherin/i.test(group.name || '')) members.add('player');
    if (group.id === 'gc2' || /gryffindor/i.test(group.name || '')) members.delete('player');
    return { ...group, members: Array.from(members) };
  });
}

function GroupChatScreen({ group, chars, player, allChars, feed, dms, eventLog = [], groupChats = [], setGroupChats, onBack }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [msgs, setMsgs] = useState(group.messages || []);
  const bottomRef = useRef(null);
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const members = group.members.map(id => allChars.find(c => c.id === id)).filter(Boolean);
  const aiMembers = members.filter(m => m.id !== player.id);

  useEffect(() => { scrollToLatest(bottomRef, endRef); }, [group.id, msgs.length, loading]);

  async function send() {
    if (!input.trim() || loading) return;
    const outgoingText = input.trim();
    const userMsg = { role:'user', charId:'player', text: outgoingText, id: Date.now(), ts: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs);
    setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: newMsgs} : g));
    setInput('');
    setLoading(true);

    // Each member may respond, with some chance of silence
    const historyStr = newMsgs.slice(-8).map(m => {
      const sender = m.role === 'user' ? player : allChars.find(c => c.id === m.charId);
      return `${sender?.name || 'Someone'}: "${m.text}"`;
    }).join('\n');
    const groupIntentLine = dmIntentLine(outgoingText);
    const directTargets = directlyAddressedMembers(outgoingText, members, player);
    const directTargetIds = new Set(directTargets.map(c => c.id));
    const isHavocRowanKeresChat = (group.members || []).includes('player') && (group.members || []).includes('havoc') && (group.members || []).includes('rowan');
    const seriousKeresDrop = isHavocRowanKeresChat && looksLikeSeriousKeresGroupDrop(outgoingText);
    const responderOrder = orderedGroupResponders(aiMembers, outgoingText, members, player);

    let updatedMsgs = [...newMsgs];
    const sharedMoveLog = { usedMoves: new Set(), usedShapes: new Set() };
    for (const member of responderOrder) {
      const quietTypes = ['reserved','quiet','deadpan','minimal'];
      const isQuiet = quietTypes.some(q => (member.personality||'').includes(q));
      const isDirectTarget = directTargetIds.has(member.id);
      const mustAnswerSeriousDrop = seriousKeresDrop && ['havoc','rowan'].includes(member.id);
      const silenceChance = mustAnswerSeriousDrop ? 0 : isDirectTarget ? 0 : directTargets.length ? (isQuiet ? 0.65 : 0.45) : (isQuiet ? 0.4 : 0.15);
      if (Math.random() < silenceChance) continue; // sometimes they don't respond

      try {
        const otherMembers = members.filter(m => m.id !== member.id).map(m => compactCharacterCard(m, member)).join('\n');
        const generatedThisTurn = updatedMsgs
          .slice(newMsgs.length)
          .map(m => {
            const speaker = allChars.find(c => c.id === m.charId);
            return speaker?.handle ? `@${speaker.handle}: "${m.text}"` : `"${m.text}"`;
          })
          .join('\n');
        const moveBan = sharedMoveLog.usedMoves.size
          ? 'MOVES ALREADY USED THIS TURN BY OTHER MEMBERS: ' +
            [...sharedMoveLog.usedMoves].join(', ') +
            '. Do not use these. Choose a different social action from your character\'s lane.'
          : '';
        const groupAvoidTexts = [historyStr, outgoingText, generatedThisTurn].filter(Boolean);
        const groundingLine = groupConversationGroundingLine(outgoingText, member, members, player);
        const memberEffectiveRel = effectivePlayerRelationship(member, eventLog, dms, groupChats).value;
        const privateOrbitRule = isHavocRowanKeresChat ? privateOrbitRelationshipRule(member, player, memberEffectiveRel, 'private group chat') : '';
        const reply = await window.claude.complete({ label: 'group chat reply', messages:[{ role:'user', content:
          `Write as ${member.name} in a group chat called "${group.name}".
Speaker: ${compactCharacterCard(member, player)}
Other people currently present in this chat: ${otherMembers}.
${buildGroupChatRules()}
Voice lane: ${dialogueContractSummaryFor(member)}
${multiSpeakerDialogueSeparationRule(aiMembers, 'group chat')}
${compactPlayerStance(member, player)}
${privateOrbitRule}
${recentCompactMemoryContext({ feed, eventLog, groupChats, dms, char: member, player, allChars, channel:'group', audienceIds: group.members || [], limit: 4 })}
Chat history:\n${historyStr}
${groundingLine}
${generatedThisTurn ? `Other characters already answered this turn:\n${generatedThisTurn}\nDo not echo their key verb, punchline scaffold, or social move. Answer from your own dialogue contract.` : ''}
${moveBan}
${threadPatternVarietyGuard(groupAvoidTexts)}
${player.name} just said: "${outgoingText}"
Group chat tone: house and team sniping is normal social fuel. If this chat is Slytherins talking about Gryffindor, they can enjoy the rival mess, pile on, or joke that their own mess is funnier while Gryffindor's is easier. Do not turn rival trash talk into noble defensiveness unless someone hits a real personal wound. Teammate loyalty still matters: if someone outside the team swings at one of your people, the usual move is to back your teammate first, then roast them privately or as "our mess."
${groupIntentLine}
Write your response (1-2 sentences, in character). Use the pronouns listed above exactly. Everyone listed as present can see this message. If the latest message directly asks you something, answer the actual question before any tangent. If ${player.name} corrects your premise or says she did not do something, accept that correction before joking; do not double down unless there is visible evidence in chat. If it directly asks someone else something, do not answer for them. If you mean someone in the chat, talk to them directly with @handle, "you", or a nickname/title that makes sense. Do not talk about a present member like they are not in the room. Be natural.
Output ONLY the chat message. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
` }]
        });
        const charMsg = { role:'char', charId: member.id, text: cleanChatText(reply, member, player, true, { feed, avoidTexts: groupAvoidTexts, latestUserText: outgoingText, directlyAddressed: isDirectTarget }), id: Date.now() + Math.random(), ts: Date.now() };
        const replyFlags = dialoguePatternFlags(charMsg.text);
        replyFlags.forEach(f => sharedMoveLog.usedMoves.add(f));
        if (/\?$/.test((charMsg.text || '').trim())) sharedMoveLog.usedShapes.add('question');
        if (/@\w+/.test(charMsg.text || '')) sharedMoveLog.usedShapes.add('direct-tag');
        if (/^[A-Za-z]+[.!]$/.test((charMsg.text || '').trim())) sharedMoveLog.usedShapes.add('clipped-verdict');
        updatedMsgs = [...updatedMsgs, charMsg];
        setMsgs([...updatedMsgs]);
        setGroupChats(gs => gs.map(g => g.id === group.id ? {...g, messages: [...updatedMsgs]} : g));
        await new Promise(r => setTimeout(r, 800 + Math.random()*1200));
      } catch(e) {}
    }
    setLoading(false);
  }

  const getChar = id => id === 'player' ? player : allChars.find(c => c.id === id);

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg}}>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
          <div style={{display:'flex', marginRight:8}}>
            {members.slice(0,3).map((m,i) => <div key={m.id} style={{marginLeft: i>0?-10:0, zIndex:3-i}}><Avatar char={m} size={32}/></div>)}
          </div>
          <div>
            <div style={{color:C.text, fontWeight:700, fontSize:15}}>{group.name}</div>
            <div style={{color:C.muted, fontSize:12}}>{members.map(m=>m.name.split(' ')[0]).join(', ')}</div>
          </div>
        </div>
      </div>
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8}}>
        {msgs.map(m => {
          const sender = getChar(m.charId || (m.role === 'user' ? 'player' : null));
          const isMe = m.role === 'user';
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={sender} size={26}/>}
              <div style={{maxWidth:'78%'}}>
                {!isMe && <div style={{color:C.muted, fontSize:11, marginBottom:3, paddingLeft:4}}>{sender?.name?.split(' ')[0]}</div>}
                <div style={{
                  padding:'9px 13px', borderRadius: isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',
                  background: isMe ? C.blue : C.card2, color:'#fff', fontSize:13, lineHeight:1.5,
                }}>{renderLinkedText(m.text, allChars)}</div>
              </div>
            </div>
          );
        })}
        {loading && <div style={{color:C.muted, fontSize:13, paddingLeft:8}}>Someone is typing...</div>}
        <div ref={endRef}/>
      </div>
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder="Message the group..."
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim()||loading} style={{
          background:input.trim()?C.blue:C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor:input.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>
  );
}

// ─── Compose Post Modal ───────────────────────────────────────────
function ComposeModal({ chars, player, onClose, onPost }) {
  const [text, setText] = useState('');
  const [photo, setPhoto] = useState(null);
  const [selectedChar, setSelectedChar] = useState(player);
  const allChars = [player, ...chars];
  const fileRef = useRef(null);
  const submittingRef = useRef(false);

  async function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const dataUrl = await compressImageFile(file, { maxSize: 900, quality: 0.78, square: true });
    setPhoto(dataUrl);
    e.target.value = '';
  }

  function submit() {
    if (submittingRef.current) return;
    if (!text.trim() && !photo) return;
    submittingRef.current = true;
    const postedAt = Date.now();
    onPost({
      id: `post-${postedAt}-${Math.random().toString(36).slice(2, 8)}`,
      charId: selectedChar.id,
      text: text.trim(),
      photo,
      likes: 0, reposts: 0, comments: 0,
      timestamp: postedAt,
      reply: null,
    });
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, background:C.bg, zIndex:200, display:'flex', flexDirection:'column'}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10, flexShrink:0}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, width:34, height:34, cursor:'pointer', fontSize:24, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>‹</button>
        <div style={{flex:1, minWidth:0}}>
          <div style={{color:C.text, fontSize:18, fontWeight:800, lineHeight:1.1}}>New Post</div>
          <div style={{color:C.muted, fontSize:12, marginTop:2}}>Create a timeline post</div>
        </div>
        <button onClick={submit} disabled={submittingRef.current || (!text.trim() && !photo)} style={{
          background: (!submittingRef.current && (text.trim() || photo)) ? C.blue : C.card2, color:(!submittingRef.current && (text.trim() || photo)) ? '#fff' : C.muted, border:'none',
          borderRadius:12, padding:'8px 14px', minHeight:36, fontSize:14, fontWeight:800, cursor:(!submittingRef.current && (text.trim()||photo))?'pointer':'default',
        }}>Post</button>
      </div>

      <div style={{flex:1, overflowY:'auto', padding:'16px 16px 20px', display:'flex', flexDirection:'column'}}>
        <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:16, padding:16, marginBottom:14}}>
          <p style={{color:C.muted, fontSize:11, marginBottom:6}}>POST AS</p>
          <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4}}>
            {allChars.map(c => (
              <button key={c.id} onClick={() => setSelectedChar(c)} style={{
                display:'flex', alignItems:'center', gap:6, background: selectedChar.id === c.id ? C.blue+'22' : C.card2,
                border:`1.5px solid ${selectedChar.id === c.id ? C.blue : C.border}`,
                borderRadius:20, padding:'5px 12px', cursor:'pointer', flexShrink:0,
              }}>
                <Avatar char={c} size={20} />
                <span style={{color: selectedChar.id === c.id ? C.blue : C.text, fontSize:12, fontWeight:600}}>{c.name.split(' ')[0]}</span>
              </button>
            ))}
          </div>
        </div>

        <div style={{display:'flex', gap:12, flex:1, minHeight:0}}>
          <Avatar char={selectedChar} size={38} />
          <div style={{flex:1, minWidth:0, display:'flex', flexDirection:'column'}}>
            <textarea value={text} onChange={e => setText(e.target.value)}
              placeholder="What's happening?"
              maxLength={280}
              style={{width:'100%', background:C.card2, border:`1px solid ${text.trim() ? C.blue+'66' : C.border}`, borderRadius:14, padding:'12px 14px', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:150, lineHeight:1.55, flexShrink:0}}
            />
            <MentionSuggestions text={text} allChars={allChars} onPick={handle => setText(t => applyMentionToText(t, handle))} />
            {photo && (
              <div style={{position:'relative', marginTop:12}}>
                <img src={photo} alt="" style={{width:'100%', aspectRatio:'1 / 1', borderRadius:14, objectFit:'cover', display:'block'}} />
                <button onClick={() => setPhoto(null)} style={{position:'absolute', top:6, right:6, background:'rgba(0,0,0,0.7)', border:'none', color:'#fff', borderRadius:'50%', width:26, height:26, cursor:'pointer', fontSize:14}}>×</button>
              </div>
            )}
          </div>
        </div>

        <div style={{borderTop:`1px solid ${C.border}`, paddingTop:12, marginTop:16, display:'flex', gap:16, alignItems:'center', flexShrink:0}}>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto} />
          <button onClick={() => fileRef.current.click()} style={{background:'none', border:'none', color:C.blue, cursor:'pointer', display:'flex', alignItems:'center', gap:4, fontSize:13}}>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Photo
          </button>
          <div style={{marginLeft:'auto', color:C.muted, fontSize:12}}>{280 - text.length}</div>
        </div>
      </div>
    </div>
  );
}

// ─── Event Modal ──────────────────────────────────────────────────
function EventModal({ event, chars, player, feed, eventLog = [], dms = {}, groupChats = [], onClose, onSubmit, onLog }) {
  const [input, setInput] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const draftEvent = !event?.scenario || event?.draft;
  const [currentEvent, setCurrentEvent] = useState(draftEvent ? null : event);
  const [xp, setXp] = useState(() => rollEventXp(event?.xp || [80, 200]));
  const [customOpen, setCustomOpen] = useState(true);
  const [customScenario, setCustomScenario] = useState(draftEvent ? '' : (event?.scenario || ''));
  const [customType, setCustomType] = useState(event?.type || 'gossip');
  const [customChars, setCustomChars] = useState(Array.isArray(event?.chars) ? event.chars : []);
  const [customVisibility, setCustomVisibility] = useState(event?.privateIntel || event?.visibility === 'private_intel' ? 'private_intel' : 'public');
  const [submittedEvent, setSubmittedEvent] = useState(null);
  const currentEventCharIds = Array.isArray(currentEvent?.chars) ? currentEvent.chars : [];
  const involved = chars.filter(c => currentEventCharIds.includes(c.id));

  useEffect(() => {
    setXp(rollEventXp(currentEvent?.xp || [80, 200]));
  }, [currentEvent?.id]);

  function selectEvent(nextEvent) {
    if (!nextEvent) return;
    setCurrentEvent(nextEvent);
    setInput('');
    setResult(null);
    setSubmittedEvent(null);
    setCustomOpen(false);
  }

  function applyCustomEvent() {
    if (!customScenario.trim()) return;
    const inferredChars = mentionedCharactersInText(customScenario, chars).map(c => c.id);
    const selectedChars = (customChars.length ? customChars : inferredChars).slice(0, 3);
    selectEvent({
      id: `custom-${Date.now()}`,
      type: customType,
      scenario: customScenario.trim(),
      chars: selectedChars,
      xp: EVENT_XP_DEFAULTS[customType] || [80, 200],
      visibility: customVisibility,
      privateIntel: customVisibility === 'private_intel',
      custom: true,
      canon: true,
    });
  }

  async function handleSubmit(actionOverride = null) {
    const actionText = typeof actionOverride === 'string' ? actionOverride.trim() : input.trim();
    const isDoingNothing = actionText === 'Do nothing.';
    if (!currentEvent?.scenario || !actionText || loading) return;
    setLoading(true);
    try {
      const charDescs = involved.map(c => `${compactCharacterCard(c, player)}\nVoice lane: ${dialogueContractSummaryFor(c)}`).join('\n\n');
      const involvedHandles = new Set([player, ...involved].map(c => String(c?.handle || '').toLowerCase()).filter(Boolean));
      const recentFeedContext = feed ? [...feed].slice(0,8).map(p => {
        const poster = [...(chars||[]), player].find(c=>c.id===p.charId);
        const text = String(p.text || '');
        return Array.from(involvedHandles).some(handle => text.toLowerCase().includes(`@${handle}`))
          ? `@${poster?.handle||p.charId}: "${truncateText(text, 160)}"`
          : '';
      }).filter(Boolean).slice(0, 3).join('\n') : '';
      const privateIntelMode = currentEvent.privateIntel || currentEvent.visibility === 'private_intel';
      const visibilityInstruction = privateIntelMode
        ? `PRIVATE INTEL MODE: The involved characters learn this as intel: something they witnessed, overheard, inferred, were tipped about, or heard in whispers. Do not frame it as ${player.name} telling them unless the player's action explicitly says she does. Do not make them wait for ${player.name} to explain or respond. Do not narrate a public timeline blow-up unless the player's action explicitly makes it public. Show private consequences, leverage, tension, a self-directed reaction, or the involved character deciding what to do next.`
        : `PUBLIC EVENT MODE: Make it feel like something that would blow up on social media.`;
      const actionInstruction = isDoingNothing
        ? `${player.name} explicitly chooses to do nothing: she does not post, reply, intervene, explain, chase, confess, deny, or make a move. Resolve what happens because she stays silent/absent/passive, and let other people fill the space if that fits. Do not secretly turn this into her taking action.`
        : '';
      const response = await window.claude.complete({
        label: 'event outcome',
        messages: [{
          role:'user',
          content: `Narrate a social media event like a dramatic story beat.

CHARACTERS INVOLVED:
${charDescs}

PLAYER:
${compactPlayerCard(player)}

${buildSceneRules(false)}
Treat house/team/player status like fixed identity. Do not write non-players as Quidditch players. Do not invent game attendance, wins, dodging, fouls, or match results unless the event explicitly says so.

RECENT FEED CONTEXT:
${recentFeedContext}

EVENT: "${currentEvent.scenario}"
PLAYER'S ACTION: "${actionText}"
${visibilityInstruction}
${actionInstruction}

Write a punchy 2-3 sentence outcome. Be dramatic, entertaining, and true to each character's personality. Reference @handles only if that makes sense for the visibility mode. Use the pronouns and identities listed above exactly. Show consequences. Plain prose only — no headers, no bullet points, no markdown formatting. Do not explain rules or prompts.`
        }]
      });
      const cleaned = response
        .replace(/^#+\s+.*/gm, '')       // strip # headers
        .replace(/\*\*(.*?)\*\*/g, '$1') // strip bold
        .replace(/\*(.*?)\*/g, '$1')     // strip italic
        .replace(/_{1,2}(.*?)_{1,2}/g, '$1')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      setResult(cleaned);
      setSubmittedEvent({
        ...currentEvent,
        playerAction: actionText,
        outcome: cleaned,
        visibility: privateIntelMode ? 'private_intel' : 'public',
        privateIntel: privateIntelMode,
        custom: true,
        canon: true,
        submittedAt: Date.now(),
      });
      // Generate score changes
      const followerGain = Math.floor(xp * (1800 + Math.random() * 1200));
      const evType = currentEvent.type || 'gossip';
      const scoreChanges = [
        { icon:'✨', label:'Experience', value: xp, unit:'', flavor: evType === 'scandal' ? 'Chaos is a ladder, apparently.' : evType === 'tag' ? 'You answered the call.' : evType === 'opportunity' ? 'The window was open. You flew through it.' : 'Drama points well spent.' },
        { icon:'👥', label:'Followers', value: `+${(followerGain >= 1000 ? (followerGain/1000).toFixed(0)+'K' : followerGain)}`, unit:'', flavor: evType === 'scandal' ? 'Everyone loves a scandal.' : 'Word travels fast on campus.' },
      ];
      onLog && onLog({
        type: 'event',
        visibility: privateIntelMode ? 'private_intel' : 'public',
        eventType: evType,
        scenario: currentEvent.scenario,
        action: actionText,
        outcome: cleaned,
        chars: currentEventCharIds,
        participants: ['player', ...currentEventCharIds],
        privateIntel: privateIntelMode,
        custom: true,
        canon: true,
        xp,
        scoreChanges,
        timestamp: Date.now(),
      });
    } catch(e) {
      setResult('The drama unfolds... and everyone is watching.');
    }
    setLoading(false);
  }

  function finishEvent() {
    onSubmit && onSubmit(submittedEvent || currentEvent);
    onClose();
  }

  return (
    <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', zIndex:100, background:C.bg}}>
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10, flexShrink:0}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, width:34, height:34, cursor:'pointer', fontSize:24, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>‹</button>
        <div style={{flex:1, minWidth:0}}>
          <div style={{color:C.text, fontSize:18, fontWeight:800, lineHeight:1.1}}>Event</div>
          <div style={{color:C.muted, fontSize:12, marginTop:2}}>Custom canon event</div>
        </div>
      </div>

      <div style={{flex:1, overflowY:'auto', padding:'16px 16px 20px'}}>
        {!result ? (
          <>
            {/* Type badge + involved chars */}
            {currentEvent?.scenario && <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:16, padding:16, marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700, letterSpacing:'0.04em'}}>{t.label.toUpperCase()}</span>
                </div>
              );})()}
              <div style={{display:'flex', gap:-6, marginLeft:'auto'}}>
                {involved.map((c,i) => <div key={c.id} style={{marginLeft: i>0 ? -8 : 0}}><Avatar char={c} size={26}/></div>)}
              </div>
              </div>
              <p style={{color:C.text, fontSize:16, lineHeight:1.62, fontWeight:550}}>{currentEvent.scenario}</p>
            </div>}

            {/* XP + custom row */}
            <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:16}}>
              <button onClick={() => setCustomOpen(o => !o)} style={{background: customOpen || currentEvent?.custom ? `${C.blue}18` : C.card2, color: customOpen || currentEvent?.custom ? C.blue : C.text, border:`1px solid ${customOpen || currentEvent?.custom ? C.blue : C.border}`, borderRadius:10, padding:'0 12px', minHeight:36, fontSize:13, fontWeight:700, cursor:'pointer', flexShrink:0}}>
                {customOpen ? 'Hide Custom' : currentEvent?.scenario ? 'Edit Custom' : 'Custom'}
              </button>
              <div style={{flex:1, background:C.card2, borderRadius:10, padding:'8px 12px', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                <span style={{color:C.muted, fontSize:12}}>XP reward</span>
                <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>+{currentEvent?.xp?.[0] || 80}–{currentEvent?.xp?.[1] || 180} ✦</span>
              </div>
            </div>

            {(customOpen || !currentEvent?.scenario) && (
              <div style={{background:C.card2, border:`1px solid ${C.border}`, borderRadius:14, padding:12, marginBottom:16}}>
                <label style={{color:C.muted, fontSize:12, marginBottom:6, display:'block'}}>CUSTOM EVENT</label>
                <textarea
                  value={customScenario}
                  onChange={e => setCustomScenario(e.target.value)}
                  placeholder="GMZ posts that a new Slytherin transfer was seen at the pitch before official tryouts..."
                  style={{width:'100%', background:C.bg, border:`1px solid ${C.border}`, borderRadius:12, padding:'10px 12px', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:84, lineHeight:1.5, marginBottom:10}}
                />
                <div style={{display:'flex', gap:8, overflowX:'auto', marginBottom:10}}>
                  {Object.entries(EVENT_TYPES).map(([id,t]) => (
                    <button key={id} onClick={() => setCustomType(id)} style={{
                      background: customType === id ? `${t.color}20` : C.bg,
                      color: customType === id ? t.color : C.muted,
                      border:`1px solid ${customType === id ? t.color : C.border}`,
                      borderRadius:18, padding:'7px 10px', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap',
                    }}>{t.emoji} {t.label}</button>
                  ))}
                </div>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:10}}>
                  {[
                    { id:'public', label:'Public canon', desc:'Timeline reacts' },
                    { id:'private_intel', label:'Private intel', desc:'Only selected know' },
                  ].map(opt => {
                    const active = customVisibility === opt.id;
                    return (
                      <button key={opt.id} onClick={() => setCustomVisibility(opt.id)} style={{
                        background: active ? `${C.blue}18` : C.bg,
                        border:`1px solid ${active ? C.blue : C.border}`,
                        borderRadius:12,
                        padding:'9px 10px',
                        cursor:'pointer',
                        textAlign:'left',
                      }}>
                        <div style={{color: active ? C.blue : C.text, fontSize:12, fontWeight:800}}>{opt.label}</div>
                        <div style={{color:C.muted, fontSize:11, marginTop:2}}>{opt.desc}</div>
                      </button>
                    );
                  })}
                </div>
                <p style={{color:C.muted, fontSize:12, marginBottom:8}}>Involved characters</p>
                <div style={{display:'flex', gap:8, overflowX:'auto', paddingBottom:4, marginBottom:12}}>
                  {chars.map(c => {
                    const active = customChars.includes(c.id);
                    return (
                      <button key={c.id} onClick={() => setCustomChars(ids => active ? ids.filter(id => id !== c.id) : [...ids, c.id])} style={{
                        display:'flex', alignItems:'center', gap:6, background: active ? C.blue+'22' : C.bg,
                        border:`1px solid ${active ? C.blue : C.border}`, borderRadius:18, padding:'6px 10px', cursor:'pointer', flexShrink:0,
                      }}>
                        <Avatar char={c} size={20}/>
                        <span style={{color: active ? C.blue : C.text, fontSize:12, fontWeight:700}}>{c.name.split(' ')[0]}</span>
                      </button>
                    );
                  })}
                </div>
                <button onClick={applyCustomEvent} disabled={!customScenario.trim()} style={{
                  width:'100%', background: customScenario.trim() ? C.blue : C.bg, color: customScenario.trim() ? '#fff' : C.muted,
                  border:'none', borderRadius:12, padding:'11px', fontSize:14, fontWeight:800, cursor:customScenario.trim() ? 'pointer' : 'default',
                }}>{currentEvent?.scenario ? 'Update Custom Event' : 'Use Custom Event'}</button>
              </div>
            )}

            {currentEvent?.scenario && <>
              {/* Input */}
              <textarea value={input} onChange={e => setInput(e.target.value)}
                placeholder="What do you do?"
                style={{width:'100%', background:C.card2, border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`, borderRadius:14, padding:'12px 14px', color:C.text, fontSize:16, outline:'none', resize:'none', minHeight:100, marginBottom:14, transition:'border-color 0.2s'}}
              />

              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                <button onClick={() => handleSubmit('Do nothing.')} disabled={loading} style={{
                  width:'100%', background:C.card2, color:C.text,
                  border:`1px solid ${C.border}`, borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
                  cursor: loading ? 'default' : 'pointer', transition:'background 0.2s, color 0.2s',
                }}>{loading ? 'Playing out…' : 'Do Nothing'}</button>
                <button onClick={() => handleSubmit()} disabled={!input.trim() || loading} style={{
                  width:'100%', background: input.trim() ? C.text : C.card2, color: input.trim() ? C.bg : C.muted,
                  border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700,
                  cursor: input.trim() ? 'pointer' : 'default', transition:'background 0.2s, color 0.2s',
                }}>{loading ? 'Playing out…' : 'Submit'}</button>
              </div>
            </>}
          </>
        ) : (
          <div>
            {/* Outcome header */}
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {(() => { const t = EVENT_TYPES[currentEvent.type] || EVENT_TYPES.gossip; return (
                <div style={{display:'flex', alignItems:'center', gap:5, background:`${t.color}18`, border:`1px solid ${t.color}44`, borderRadius:20, padding:'4px 10px'}}>
                  <span style={{fontSize:13}}>{t.emoji}</span>
                  <span style={{color:t.color, fontSize:12, fontWeight:700}}>OUTCOME</span>
                </div>
              );})()}
            </div>

            {/* Quoted action */}
            <div style={{borderLeft:`3px solid ${C.border}`, paddingLeft:12, marginBottom:14}}>
              <p style={{color:C.muted, fontSize:12, marginBottom:4}}>YOUR MOVE</p>
              <p style={{color:C.text, fontSize:14, lineHeight:1.5, fontStyle:'italic'}}>"{submittedEvent?.playerAction || input}"</p>
            </div>

            <div style={{background:C.card2, borderRadius:14, padding:'14px', marginBottom:14}}>
              <p style={{color:C.text, fontSize:14, lineHeight:1.75}}>{result}</p>
            </div>

            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:`${C.yellow}12`, border:`1px solid ${C.yellow}33`, borderRadius:12, padding:'12px 16px', marginBottom:18}}>
              <span style={{color:C.muted, fontSize:13}}>XP earned</span>
              <span style={{color:C.yellow, fontWeight:700, fontSize:16}}>+{xp} ✦</span>
            </div>

            <button onClick={finishEvent} style={{width:'100%', background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>Back to Feed</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Activity Log helpers (shared by Activity > Log tab) ─────────
function LogScoreRow({ ch, allChars }) {
  const isNumeric = typeof ch.value === 'number';
  const positive = isNumeric ? ch.value > 0 : String(ch.value).startsWith('+');
  const color = positive ? C.green : C.red;
  const displayVal = isNumeric
    ? `${ch.value > 0 ? '+':''}${ch.value}${ch.unit||''}`
    : `${ch.value}${ch.unit||''}`;
  const relChar = ch.avatar ? allChars.find(c => c.id === ch.avatar) : null;
  return (
    <div style={{paddingBottom:12, marginBottom:12, borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        {relChar
          ? <Avatar char={relChar} size={24}/>
          : <span style={{fontSize:18, width:24, textAlign:'center'}}>{ch.icon}</span>
        }
        <span style={{color:C.text, fontWeight:700, fontSize:14, flex:1}}>
          {relChar ? (ch.label || `@${relChar.handle}`) : ch.label}
        </span>
        <span style={{color, fontWeight:800, fontSize:15}}>{displayVal}</span>
      </div>
      {ch.flavor && <p style={{color:C.muted, fontSize:12, marginTop:4, marginLeft:32, lineHeight:1.4}}>{ch.flavor}</p>}
    </div>
  );
}

function LogEntryCard({ entry, idx, allChars, collapsed, toggle }) {
  const outcomeKey = `out-${idx}`;
  const scoreKey   = `score-${idx}`;
  const evType     = entry.eventType || entry.type;
  const typeInfo   = EVENT_TYPES[evType] || { label:'Action', color:C.blue, emoji:'✦' };

  const headerMap = {
    reply:     { color:C.blue,   emoji:'💬', label:'You replied:' },
    dm:        { color:C.purple, emoji:'✉️',  label:'DM sent' },
    milestone: { color:C.green,  emoji:'🏆', label:'Milestone completed:' },
    autopost:  { color:C.muted,  emoji:'📝', label:'Posted to feed' },
  };
  const header = entry.type === 'scene'
    ? { color: C.purple, emoji: '🎭', label: 'Scene saved' }
    : entry.type === 'event'
    ? { color: typeInfo.color, emoji: typeInfo.emoji, label: typeInfo.label + ' event' }
    : (headerMap[entry.type] || { color:C.blue, emoji:'✦', label:'Action' });

  const char = allChars.find(c => c.id === entry.charId);
  const outCollapsed   = collapsed[outcomeKey] ?? false;
  const scoreCollapsed = collapsed[scoreKey]   ?? false;

  return (
    <div style={{marginBottom:16}}>
      <div style={{background:`${header.color}10`, border:`1px solid ${header.color}30`, borderRadius:16, padding:'14px 16px', marginBottom:6}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:10}}>
          <span style={{fontSize:15}}>{header.emoji}</span>
          <span style={{color:header.color, fontWeight:700, fontSize:13}}>{header.label.toUpperCase()}</span>
        </div>
        {entry.type === 'event' && <>
          <p style={{color:C.muted, fontSize:12, lineHeight:1.4, marginBottom:10}}>{entry.scenario}</p>
          <div style={{borderLeft:`2px solid ${header.color}60`, paddingLeft:10}}>
            <p style={{color:C.text, fontSize:14, lineHeight:1.55, fontStyle:'italic'}}>"{entry.action}"</p>
          </div>
        </>}
        {entry.type === 'scene' && (
          <p style={{color:C.text, fontSize:13, lineHeight:1.6}}>{entry.text || entry.sceneMemory || entry.title || 'Scene saved.'}</p>
        )}
        {entry.type === 'reply' && char && (
          <div style={{display:'flex', gap:10, alignItems:'flex-start'}}>
            <Avatar char={char} size={36}/>
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
                <Verified/>
                <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
              </div>
              <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{entry.text}</p>
            </div>
          </div>
        )}
        {entry.type === 'dm' && char && (
          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            <Avatar char={char} size={32}/>
            <div style={{flex:1}}>
              <span style={{fontWeight:700, color:C.text, fontSize:13}}>{char.name}</span>
              <p style={{color:C.muted, fontSize:12, marginTop:2}}>{(entry.text||'').slice(0,80)}…</p>
            </div>
          </div>
        )}
        {entry.type === 'milestone' && (
          <p style={{color:C.text, fontSize:14, lineHeight:1.6, fontWeight:500}}>{entry.text}</p>
        )}
      </div>

      {entry.outcome && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px', marginBottom:6}}>
          <button onClick={() => toggle(outcomeKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: outCollapsed ? 0 : 10}}>
            <span style={{color:C.blue, fontWeight:700, fontSize:13}}>Outcome</span>
            <span style={{color:C.muted, fontSize:12}}>{outCollapsed ? '▼' : '▲'}</span>
          </button>
          {!outCollapsed && <p style={{color:C.text, fontSize:13, lineHeight:1.75}}>{entry.outcome}</p>}
        </div>
      )}

      {entry.type === 'event' && entry.scoreChanges?.length > 0 && (
        <div style={{background:C.card2, borderRadius:12, padding:'12px 14px'}}>
          <button onClick={() => toggle(scoreKey)} style={{background:'none', border:'none', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%', padding:0, marginBottom: scoreCollapsed ? 0 : 14}}>
            <span style={{color:C.yellow, fontWeight:700, fontSize:13}}>Score Changes</span>
            <span style={{color:C.muted, fontSize:12}}>{scoreCollapsed ? '▼' : '▲'}</span>
          </button>
          {!scoreCollapsed && (
            <div>
              {entry.scoreChanges.map((ch, i) => (
                <LogScoreRow key={i} ch={ch} allChars={allChars}/>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const MILESTONES_DATA = [
  { id:'m1', label:'First viral post', xp:50, done:true },
  { id:'m2', label:'Win a public roast', xp:80, done:true },
  { id:'m3', label:'Make a rival look foolish', xp:120, done:true },
  { id:'m4', label:'Start a campus-wide rumor', xp:150, done:false },
  { id:'m5', label:'Get quoted by GMZ', xp:200, done:false },
];

const SIDE_QUESTS = [
  { id:'sq1', label:'Engage in a public "friendly" debate about potion safety with a rival.', xp:55 },
  { id:'sq2', label:'Start a cryptic post and let the bots speculate for 24hrs.', xp:112 },
  { id:'sq3', label:'Get a Gryffindor to publicly agree with you about something.', xp:88 },
];

function NotificationsScreen({ chars, player, feed, onOpenThread, onCharClick }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const playerHandle = (player.handle || '').toLowerCase();
  const mentionRe = new RegExp(`@${playerHandle}\\b`, 'i');
  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - (ts || Date.now())) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }
  const notifs = feed.flatMap(post => {
    const items = [];
    const poster = allChars.find(c => c.id === post.charId);
    if (post.charId !== player.id && mentionRe.test(post.text || '')) {
      items.push({ id:`mention-${post.id}`, type:'mention', char:poster, text:'mentioned you in a post', preview: post.text, timestamp:post.timestamp, post });
    }
    if (post.reply?.charId && post.reply.charId !== player.id && (post.charId === player.id || mentionRe.test(post.reply.text || ''))) {
      const replier = allChars.find(c => c.id === post.reply.charId);
      items.push({ id:`reply-${post.id}`, type:'reply', char:replier, text: post.charId === player.id ? 'replied to your post' : 'mentioned you in a reply', preview: post.reply.text, timestamp:(post.timestamp || Date.now()) + 1, post });
    }
    (post.charComments || []).forEach((cc, i) => {
      if (cc.charId === player.id) return;
      const replier = allChars.find(c => c.id === cc.charId);
      const isForPlayer = post.charId === player.id || cc.replyTo === player.handle || mentionRe.test(cc.text || '');
      if (!isForPlayer) return;
      items.push({
        id:`char-comment-${post.id}-${i}`,
        type:'reply',
        char:replier,
        text: post.charId === player.id ? 'replied to your post' : 'replied to you',
        preview: replier ? cleanSocialReplyText(cc.text, replier, player) : cc.text,
        timestamp:cc.timestamp || post.timestamp,
        post,
      });
    });
    (post.botComments || []).forEach((bc, i) => {
      if (bc.isPlayer) return;
      const isForPlayer = post.charId === player.id || bc.replyTo === player.handle || mentionRe.test(bc.text || '');
      if (!isForPlayer) return;
      const bot = RECURRING_BOTS.find(b => b.id === bc.bot);
      items.push({
        id:`bot-comment-${post.id}-${i}`,
        type:'reply',
        bot,
        text: post.charId === player.id ? 'reacted to your post' : 'reacted to you',
        preview:cleanSocialReplyText(bc.text, null, player, { bot }),
        timestamp:bc.timestamp || post.timestamp,
        post,
      });
    });
    return items;
  }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 40);
  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Notifications</h1>
      </div>
      {notifs.length === 0 && (
        <div style={{padding:28, textAlign:'center', color:C.muted, fontSize:14, lineHeight:1.5}}>
          No replies or mentions yet.
        </div>
      )}
      {notifs.map(n => (
        <div key={n.id} onClick={() => onOpenThread && onOpenThread(n.post)} style={{display:'flex', gap:10, padding:'14px 16px', borderBottom:`1px solid ${C.border}`, alignItems:'center', cursor:'pointer'}}>
          <div style={{position:'relative'}}>
            {n.bot ? <BotAvatar bot={n.bot} size={42} /> : <Avatar char={n.char} size={42} onClick={(e) => { e?.stopPropagation?.(); n.char && onCharClick && onCharClick(n.char); }} />}
            <div style={{position:'absolute', bottom:-2, right:-2, width:18, height:18, borderRadius:'50%', background: n.type==='like'?'#e91e8c':n.type==='mention'?C.blue:n.type==='reply'?C.purple:C.green, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, border:`2px solid ${C.bg}`}}>
              {n.type==='like'?'♥':n.type==='mention'?'@':n.type==='reply'?'↩':'➕'}
            </div>
          </div>
          <div style={{flex:1}}>
            <span style={{fontWeight:700, color:C.text, fontSize:14}}>{n.bot?.name || n.char?.name} </span>
            <span style={{color:C.muted, fontSize:14}}>{n.text}</span>
            <p style={{color:C.text, fontSize:13, marginTop:4, lineHeight:1.35}}>{renderLinkedText((n.preview || '').slice(0,120), allChars, onCharClick)}</p>
            <p style={{color:C.muted, fontSize:12, marginTop:3}}>{timeAgo(n.timestamp)} ago</p>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Activity Screen ──────────────────────────────────────────────
function ActivityScreen({ chars, player, onEvent, feed, dms, eventLog, onOpenChat, onOpenThread, section, setSection }) {
  const allChars = [...chars, player];
  const rawSection = section || 'posts';
  const activeSection = ['posts', 'events', 'log'].includes(rawSection) ? rawSection : 'posts';
  const setActiveSection = setSection || (() => {});

  // My posts — anything posted by player
  const myPosts = feed.filter(p => p.charId === 'player');

  function timeAgo(ts) {
    const d = Math.max(0, (Date.now() - ts) / 1000);
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }

  const tabs = [
    { id:'posts', label:'My Posts' },
    { id:'events', label:'Events & Scenes' },
    { id:'log', label:'Log' },
  ];

  // Log tab state
  const [logCollapsed, setLogCollapsed] = useState({});
  const toggleLog = (key) => setLogCollapsed(c => ({...c, [key]: !c[key]}));
  const isEventOrSceneEntry = (e) => e?.type === 'event' || e?.type === 'scene';
  const filteredLog = (eventLog || []).filter(isEventOrSceneEntry);
  const eventEntries = filteredLog;

  return (
    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'16px 16px 0', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:5}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
          <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Activity</h1>
          <button onClick={() => onEvent()} style={{
            background:C.blue, color:'#fff', border:'none', borderRadius:20,
            padding:'7px 16px', fontSize:13, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6,
          }}>📣 Event</button>
        </div>
        {/* Section tabs */}
        <div style={{display:'flex', gap:0, borderBottom:`1px solid ${C.border}`}}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveSection(t.id)} style={{
              flex:1, background:'none', border:'none', color: activeSection===t.id ? C.text : C.muted,
              fontWeight: activeSection===t.id ? 700 : 400, fontSize:14, padding:'10px 0', cursor:'pointer',
              borderBottom: activeSection===t.id ? `2px solid ${C.blue}` : '2px solid transparent',
              transition:'all 0.2s',
            }}>{t.label}</button>
          ))}
        </div>
      </div>

      {/* MY POSTS */}
      {activeSection === 'posts' && (
        <div>
          {myPosts.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>✍️</div>
              <p style={{color:C.muted, fontSize:14}}>You haven't posted yet.</p>
              <p style={{color:C.muted, fontSize:13, marginTop:4}}>Hit + on the feed to post something.</p>
            </div>
          ) : myPosts.map(post => (
            <div key={post.id} onClick={() => onOpenThread && onOpenThread(post)} style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, cursor:'pointer'}}>
              <div style={{display:'flex', gap:10}}>
                <Avatar char={player} size={38} />
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                    <span style={{fontWeight:700, fontSize:14, color:C.text}}>{player.name}</span>
                    <CharBadge char={player} />
                    <span style={{color:C.muted, fontSize:12}}>· {timeAgo(post.timestamp)}</span>
                  </div>
                  {post.text && <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{post.text}</p>}
                  {post.photo && <img src={post.photo} alt="" style={{width:'100%', aspectRatio:'1 / 1', borderRadius:10, marginTop:6, objectFit:'cover', display:'block'}}/>}
                  <div style={{display:'flex', gap:16, marginTop:8}}>
                    <span style={{color:C.muted, fontSize:12, display:'inline-flex', alignItems:'center', gap:3}}><ReplyGlyph size={13} /> {post.comments}</span>
                    <span style={{color:C.muted, fontSize:12}}>🔁 {fmt(post.reposts)}</span>
                    <span style={{color:C.muted, fontSize:12}}>♥ {fmt(post.likes)}</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* EVENTS */}
      {activeSection === 'events' && (
        <div>
          {eventEntries.length === 0 ? (
            <div style={{padding:'40px 16px', textAlign:'center'}}>
              <div style={{fontSize:36, marginBottom:12}}>📣</div>
              <p style={{color:C.muted, fontSize:14}}>No events yet.</p>
              <button onClick={() => onEvent()} style={{marginTop:12, background:C.blue, color:'#fff', border:'none', borderRadius:20, padding:'10px 24px', fontSize:14, fontWeight:700, cursor:'pointer'}}>
                Trigger your first event
              </button>
            </div>
          ) : eventEntries.map((ev, i) => (
            <div key={i} style={{padding:'16px', borderBottom:`1px solid ${C.border}`}}>
              <div style={{display:'flex', gap:10, alignItems:'flex-start'}}>
                <div style={{width:38, height:38, borderRadius:'50%', background:'#1a1a3a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}>{ev.type === 'scene' ? '🎭' : '📣'}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <span style={{color:C.muted, fontSize:12}}>{ev.type === 'scene' ? 'Scene' : 'Event'} · {timeAgo(ev.timestamp || Date.now())}</span>
                    {ev.type === 'event' && <span style={{color:C.yellow, fontSize:12, fontWeight:700}}>+{Number(ev.xp || 0)} XP</span>}
                  </div>
                  <p style={{color:C.muted, fontSize:13, lineHeight:1.5, marginBottom:8}}>{ev.scenario || ev.title || (ev.type === 'scene' ? 'Completed scene' : 'Custom event')}</p>
                  {ev.type === 'event' && (
                    <div style={{background:C.card2, borderRadius:10, padding:'10px 12px', marginBottom:6}}>
                      <p style={{color:C.muted, fontSize:11, marginBottom:4}}>KERES' ACTION</p>
                      <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{ev.action || 'Action logged.'}</p>
                    </div>
                  )}
                  {ev.type === 'scene' && (
                    <div style={{background:C.card2, borderRadius:10, padding:'10px 12px', marginBottom:6}}>
                      <p style={{color:C.muted, fontSize:11, marginBottom:4}}>SCENE MEMORY</p>
                      <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{ev.sceneMemory || ev.text || 'Scene saved.'}</p>
                    </div>
                  )}
                  {ev.type === 'event' && ev.outcome && (
                    <div style={{background:'#1a2e1a', borderRadius:10, padding:'10px 12px'}}>
                      <p style={{color:C.muted, fontSize:11, marginBottom:4}}>KERES' OUTCOME</p>
                      <p style={{color:C.green, fontSize:13, lineHeight:1.5}}>{ev.outcome}</p>
                    </div>
                  )}
                  {/* involved chars */}
                  <div style={{display:'flex', gap:6, marginTop:10}}>
                    {(ev.chars || []).map(cid => {
                      const c = allChars.find(x => x.id === cid);
                      return c ? <Avatar key={cid} char={c} size={24}/> : null;
                    })}
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* LOG */}
      {activeSection === 'log' && (
        <div>
          <div style={{padding:'10px 14px'}}>
            {filteredLog.length === 0 ? (
              <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:60}}>
                <div style={{fontSize:44, marginBottom:14}}>📋</div>
                <p style={{fontWeight:600, color:C.text}}>No activity yet</p>
                <p style={{fontSize:12, marginTop:6}}>Run events or finish scenes to build Keres' story log.</p>
              </div>
            ) : (
              [...filteredLog].reverse().map((entry, i) => (
                <LogEntryCard key={i} entry={entry} idx={i} allChars={allChars} collapsed={logCollapsed} toggle={toggleLog}/>
              ))
            )}
          </div>
        </div>
      )}
      <div style={{height:24}}/>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  C = buildTheme(tweaks);

  // ── Server-side persistence ───────────────────────────────────
  const _saveTimer = useRef(null);

  function isFileMode() {
    return window.location.protocol === 'file:';
  }

  function saveLocalState(state) {
    try {
      window.localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
    } catch(e) {
      console.warn('Could not save local game state. Uploaded images may be too large.', e);
    }
  }

  function loadLocalState() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || '{}');
      if (saved && Object.keys(saved).length) return saved;
      for (const key of LEGACY_LOCAL_STATE_KEYS) {
        const legacy = JSON.parse(window.localStorage.getItem(key) || '{}');
        if (legacy && Object.keys(legacy).length) return legacy;
      }
      return {};
    } catch(e) {
      return {};
    }
  }

  function isCurrentSave(saved) {
    return saved && saved.stateVersion === SAVE_STATE_VERSION;
  }

  function playerPostSignature(post) {
    if (!post || post.charId !== 'player') return '';
    const text = String(post.text || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const photoKey = post.photo ? String(post.photo).slice(0, 80) : '';
    return `${text}|${photoKey}`;
  }

  function playerPostSignatureSet(saved) {
    return new Set((saved?.feed || [])
      .map(playerPostSignature)
      .filter(Boolean));
  }

  function withStateVersion(state) {
    return {
      ...state,
      chars: normalizeCharactersIdentity(state.chars || []),
      player: normalizeCharacterIdentity(state.player || DEFAULT_PLAYER),
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now()
    };
  }

  function applySavedState(saved) {
    const savedChars = normalizeCharactersIdentity(saved.chars || chars).filter(c => c?.id !== 'theo');
    const savedPlayer = normalizeCharacterIdentity(saved.player || player);
    if (saved.chars)      setCharsRaw(savedChars);
    if (saved.player)     setPlayerRaw(savedPlayer);
    if (saved.feed) {
      const repaired = repairPromptLeakPosts(saved.feed, savedChars, savedPlayer);
      const seenTexts = new Set();
      const deduped = repaired.filter(p => {
        if (!p?.text) return true;
        const key = p.text.trim().toLowerCase();
        if (seenTexts.has(key)) return false;
        seenTexts.add(key);
        return true;
      });
      setFeedRaw(trimFeedPreservingPlayerPosts(deduped));
    }
    if (saved.dms)        setDmsRaw(repairPromptLeakDms(saved.dms, savedChars, savedPlayer));
    if (saved.groupChats) setGroupChatsRaw(normalizeGroupChats(repairPromptLeakGroupChats(saved.groupChats, savedChars, savedPlayer)));
    setEventLogRaw(ensureCanonEventLog(saved.eventLog || []));
    if (typeof saved.day === 'number') setDayRaw(saved.day);
  }

  function chooseSavedState(serverState, localState) {
    const serverCurrent = isCurrentSave(serverState);
    const localCurrent = isCurrentSave(localState);
    if (serverCurrent && localCurrent) {
      const serverSavedAt = Number(serverState.savedAt || 0);
      const localSavedAt = Number(localState.savedAt || 0);
      const serverPlayerPosts = playerPostSignatureSet(serverState);
      const localPlayerPosts = playerPostSignatureSet(localState);
      const localHasPlayerPostMissingOnServer = [...localPlayerPosts].some(sig => !serverPlayerPosts.has(sig));
      const localIsNotClearlyStale = !serverSavedAt || !localSavedAt || (serverSavedAt - localSavedAt) < 24 * 60 * 60 * 1000;
      if (localHasPlayerPostMissingOnServer && localIsNotClearlyStale) {
        return localState;
      }
      return (localSavedAt > serverSavedAt) ? localState : serverState;
    }
    if (localCurrent) return localState;
    if (serverCurrent) return serverState;
    return null;
  }

  function serverSave(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    _saveTimer.current = setTimeout(() => {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(versionedState),
      }).catch(() => {});
    }, 1500);
  }

  function serverSaveNow(state) {
    const versionedState = withStateVersion(state);
    saveLocalState(versionedState);
    if (isFileMode()) {
      return;
    }
    clearTimeout(_saveTimer.current);
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(versionedState),
    }).catch(() => {});
  }

  const [chars, setCharsRaw] = useState(DEFAULT_CHARS);
  const [player, setPlayerRaw] = useState(DEFAULT_PLAYER);
  const [feed, setFeedRaw] = useState(DEFAULT_FEED);
  const [dms, setDmsRaw] = useState({});
  const [groupChats, setGroupChatsRaw] = useState(DEFAULT_GROUP_CHATS);
  const [eventLog, setEventLogRaw] = useState([]);
  const [day, setDayRaw] = useState(DEFAULT_DAY);
  const [stateLoaded, setStateLoaded] = useState(false);
  const feedRelationshipKeysRef = useRef(new Set());
  const prevRelTiersRef = useRef({});
  const feedRef = useRef([]);
  useEffect(() => { feedRef.current = feed; }, [feed]);
  const gmzStateRef = useRef({ chars: [], player: null, eventLog: [] });
  useEffect(() => { gmzStateRef.current = { chars, player, eventLog }; }, [chars, player, eventLog]);

  function cloneDefault(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function clearPlayerRelationships(list) {
    return list.map(char => {
      if (!char.relationships || !Object.prototype.hasOwnProperty.call(char.relationships, 'player')) return char;
      const { player: _playerRelationship, ...relationships } = char.relationships;
      return { ...char, relationships };
    });
  }

  function freshGameState({ preserveProfiles = false } = {}) {
    const freshChars = normalizeCharactersIdentity(preserveProfiles ? clearPlayerRelationships(cloneDefault(chars)) : cloneDefault(DEFAULT_CHARS));
    return {
      chars: freshChars,
      player: normalizeCharacterIdentity(preserveProfiles ? cloneDefault(player) : cloneDefault(DEFAULT_PLAYER)),
      feed: cloneDefault(DEFAULT_FEED),
      dms: {},
      groupChats: normalizeGroupChats(cloneDefault(DEFAULT_GROUP_CHATS)),
      eventLog: ensureCanonEventLog([]),
      day: DEFAULT_DAY,
      stateVersion: SAVE_STATE_VERSION,
      savedAt: Date.now(),
    };
  }

  // Load saved state from server on startup
  useEffect(() => {
    const localSaved = loadLocalState();
    if (isFileMode()) {
      if (isCurrentSave(localSaved)) {
        applySavedState(localSaved);
      } else {
        window.localStorage.removeItem(LOCAL_STATE_KEY);
      }
      setStateLoaded(true);
      return;
    }
    fetch('/api/state').then(r => r.json()).then(saved => {
      const bestSaved = chooseSavedState(saved, localSaved);
      if (bestSaved) {
        applySavedState(bestSaved);
        if (bestSaved === localSaved) serverSaveNow(bestSaved);
      } else if (saved && Object.keys(saved).length) {
        serverSaveNow(freshGameState());
      }
      setStateLoaded(true);
    }).catch(() => setStateLoaded(true));
  }, []);

  // Wrapped setters normalize and trim state only. Persistence runs from the
  // assembled current state after React applies all updates.
  function setChars(v)      { setCharsRaw(prev      => normalizeCharactersIdentity(typeof v==='function'?v(prev):v)); }
  function setPlayer(v)     { setPlayerRaw(prev     => normalizeCharacterIdentity(typeof v==='function'?v(prev):v)); }
  function setFeed(v)       { setFeedRaw(prev       => trimFeedPreservingPlayerPosts(typeof v==='function'?v(prev):v)); }
  function setDms(v)        { setDmsRaw(prev        => typeof v==='function'?v(prev):v); }
  function setGroupChats(v) { setGroupChatsRaw(prev => typeof v==='function'?v(prev):v); }
  function setEventLog(v)   { setEventLogRaw(prev   => (typeof v==='function'?v(prev):v).slice(0,30)); }
  function setDay(v)        { setDayRaw(prev        => typeof v==='function'?v(prev):v); }

  useEffect(() => {
    if (!stateLoaded) return;
    serverSave({ chars, player, feed, dms, groupChats, eventLog, day });
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day]);

  useEffect(() => {
    if (!stateLoaded) return;
    const flushSave = () => serverSaveNow({ chars, player, feed, dms, groupChats, eventLog, day });
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('beforeunload', flushSave);
    return () => {
      window.removeEventListener('pagehide', flushSave);
      window.removeEventListener('beforeunload', flushSave);
    };
  }, [stateLoaded, chars, player, feed, dms, groupChats, eventLog, day]);

  useEffect(() => {
    if (!stateLoaded || !feed?.length) return;
    const scan = scanFeedRelationshipInteractions(feed, chars, player, feedRelationshipKeysRef.current);
    if (!scan.changedFeed && !scan.changes.length) return;
    scan.trackedKeys.forEach(key => feedRelationshipKeysRef.current.add(key));
    if (scan.changedFeed) setFeedRaw(trimFeedPreservingPlayerPosts(scan.feed));
    if (scan.changes.length) {
      const cascade = computeCascadeChanges(scan.changes, chars, player);
      const allChanges = cascade.length
        ? aggregateFeedRelationshipChanges([...scan.changes, ...cascade])
        : scan.changes;
      setCharsRaw(prev => applyFeedRelationshipChanges(prev, allChanges, player));
    }
  }, [stateLoaded, feed, chars, player]);

  // Relationship milestone DMs: fire triggerProactiveDM when a char crosses a tier boundary.
  // prevRelTiersRef stores each char's last known tier label; first render just initialises.
  useEffect(() => {
    if (!stateLoaded) return;
    chars.forEach(char => {
      const rel = char.relationships?.player ?? defaultPlayerRelationshipFor(char);
      const currentLabel = relationshipBehaviorMode(rel).label;
      const prevLabel = prevRelTiersRef.current[char.id];
      if (prevLabel !== undefined && prevLabel !== currentLabel) {
        const improved = tierRank(currentLabel) > tierRank(prevLabel);
        const ctx = improved

  function buildGMZTipPost(cleanTip) {
    const raw = String(cleanTip || '').replace(/\s+/g, ' ').trim();
    const roster = [player, ...chars].filter(Boolean);
    const named = roster.filter(c => characterMentionedInText(raw, c));
    const firstNamed = named[0];
    let body = raw
      .replace(/^anonymous\s+tip\s*(?:submitted)?\s*(?:through\s+gmz\s+dms?)?[:.\-\s]*/i, '')
      .replace(/^raw\s+tip[:.\-\s]*/i, '')
      .replace(/\bI\s+(saw|heard|caught|found|watched|noticed|spotted)\b/gi, 'sources $1')
      .replace(/\bmy\s+(friend|roommate|teammate|source)\b/gi, 'a $1')
      .trim();
    if (firstNamed?.handle && !new RegExp(`@${escapeRegExp(firstNamed.handle)}\\b`, 'i').test(body)) {
      const first = String(firstNamed.name || '').split(/\s+/)[0];
      const full = String(firstNamed.name || '').trim();
      if (full) body = body.replace(new RegExp(`\\b${escapeRegExp(full)}\\b`, 'i'), `@${firstNamed.handle}`);
      if (first && !new RegExp(`@${escapeRegExp(firstNamed.handle)}\\b`, 'i').test(body)) {
        body = body.replace(new RegExp(`\\b${escapeRegExp(first)}\\b`, 'i'), `@${firstNamed.handle}`);
      }
    }
    const hasKnownHandle = /@[a-z0-9_]+\b/i.test(body);
    const hook = /\b(?:saw|heard|caught|found|watched|noticed|spotted|witness|source|common room|dorm|locker|pitch|match|kiss|bite|dm|photo|receipt)\b/i.test(body)
      ? 'WITNESSES SAY:'
      : 'ANONYMOUS TIP:';
    const post = `${hook} ${body}`.replace(/\s+/g, ' ').trim();
    if (hasKnownHandle || !firstNamed?.handle) return post.slice(0, 280);
    return `${hook} @${firstNamed.handle} ${body}`.replace(/\s+/g, ' ').trim().slice(0, 280);
  }

    )}
    <TweaksPanel open={tweaksOpen} onOpenChange={setTweaksOpen}>
      <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
      <TweakSection label="Accent color" />
      <TweakColor label="Accent" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
      <TweakSection label="Feed" />
      <TweakSlider label="Font size" value={tweaks.fontSize} min={12} max={18} step={1} unit="px" onChange={v => setTweak('fontSize', v)} />
      <TweakToggle label="Compact feed" value={tweaks.compactFeed} onChange={v => setTweak('compactFeed', v)} />
    </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<style>
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</body>
</html>
