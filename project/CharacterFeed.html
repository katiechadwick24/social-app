<script type="text/babel">

// ─── Theme builder ────────────────────────────────────────────────
function buildTheme(tweaks) {
  const dark = tweaks.darkMode;
  return {
    bg:    dark ? '#111'     : '#f5f5f0',
    card:  dark ? '#1c1c1c'  : '#ffffff',
    card2: dark ? '#252525'  : '#eeede8',
    border:dark ? '#2a2a2a'  : '#ddddd8',
    text:  dark ? '#f0f0f0'  : '#111111',

    blue:  tweaks.accentColor,
    purple:'#9d5cff',
    green: '#22c55e',
    orange:'#f97316',
    yellow:'#f5c842',
    red:   '#ef4444',
    isDark: dark,
  };
}

// C is set globally and updated when tweaks change
let C = buildTheme(TWEAK_DEFAULTS);

// ─── House ring colors ────────────────────────────────────────────
const HOUSE_COLORS = {
  gryffindor: '#c41e3a',
  slytherin:  '#2a8a4a',
  ravenclaw:  '#4169c8',
  hufflepuff: '#f0c75e',
};
function getHouseColor(char) {
  if (!char) return null;
  if (char.house && HOUSE_COLORS[char.house]) return HOUSE_COLORS[char.house];
  // Legacy fallback: scan bio/description
  const text = ((char.bio || '') + ' ' + (char.description || '')).toLowerCase();
  if (text.includes('slytherin'))  return HOUSE_COLORS.slytherin;
  if (text.includes('gryffindor')) return HOUSE_COLORS.gryffindor;
  if (text.includes('ravenclaw'))  return HOUSE_COLORS.ravenclaw;
  if (text.includes('hufflepuff')) return HOUSE_COLORS.hufflepuff;
  return null;
}

// ─── Avatar component ─────────────────────────────────────────────
const AVATAR_COLORS = [
  ['#1a1a2e','#4dabf7'], ['#1a2e1a','#22c55e'], ['#2e1a1a','#ef4444'],
  ['#2a1a2e','#9d5cff'], ['#2e2a1a','#f5c842'], ['#1a2e2a','#22c55e'],
  ['#2e1a2a','#f97316'], ['#1a1a1a','#fff'],
];
function getAvatarColors(id) {
  const i = (id || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % AVATAR_COLORS.length;
  return AVATAR_COLORS[i];
}
function Avatar({ char, size = 42, onClick }) {
  const [bg, fg] = getAvatarColors(char?.id);
  const initials = (char?.name || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const houseColor = getHouseColor(char);
  const ringWidth = Math.max(1, size * 0.022);
  const ringGap = Math.max(0.5, size * 0.015);
  const profilePhoto = char?.profilePhoto || char?.avatar || char?.photo;
  const photoPosition = char?.profilePhotoPosition || { x:50, y:50 };
  return (
    <div onClick={onClick} style={{
      width: size, height: size, borderRadius: '50%', flexShrink: 0, cursor: onClick ? 'pointer' : 'default',
      padding: houseColor ? ringWidth + ringGap : 0,
      background: houseColor || 'transparent',

      <div style={{
        width: '100%', height: '100%', borderRadius: '50%', background: bg, overflow:'hidden',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: (size - (houseColor ? (ringWidth + ringGap) * 2 : 0)) * 0.36,
        fontWeight: 700, color: fg,
      }}>
        {profilePhoto
          ? <img src={profilePhoto} alt="" style={{width:'100%', height:'100%', objectFit:'cover', objectPosition:`${photoPosition.x ?? 50}% ${photoPosition.y ?? 50}%`, display:'block'}} />
          : initials}
      </div>

  );
}

// ─── Verified / Quidditch badge ──────────────────────────────────
function isQuidditchPlayer(char) {
  const text = ((char.bio||'') + ' ' + (char.description||'')).toLowerCase();
  return ['beater','chaser','keeper','seeker','quidditch'].some(w => text.includes(w));

function CharBadge({ char }) {

  return null;
}

function Verified() {
  return <svg width="14" height="14" viewBox="0 0 24 24" fill={C.blue} style={{flexShrink:0}}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>;
}

// ─── Number formatter ─────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

function findCharByHandle(handle, allChars = []) {
  const clean = (handle || '').replace('@','').toLowerCase();
  return allChars.find(c => (c.handle || '').toLowerCase() === clean);
}

function renderLinkedText(text = '', allChars = [], onCharClick) {
  return text.split(/(@\w+)/g).map((part, i) => {
    if (!part.startsWith('@')) return part;
    const mentioned = findCharByHandle(part, allChars);
    return (
      <span
        key={i}
        onClick={e => {
          if (!mentioned || !onCharClick) return;
          e.stopPropagation();
          onCharClick(mentioned);
        }}
        style={{color:C.blue, cursor: mentioned && onCharClick ? 'pointer' : 'default', fontWeight:500}}
      >
        {part}
      </span>
    );
  });
}

function pronounRoster(chars = []) {

  { id:'silas', name:'Silas Montague', handle:'silasmontague', pronouns:'he/him', house:'slytherin', team:'Slytherin', position:'Quidditch captain', bio:'Slytherin captain. Control issue with teeth.', followers:3900000, description:`Silas Montague is Slytherin VII and the Slytherin Quidditch captain, which means he treats the team like a war machine with uniforms and a comment section. He is rude, competitive, controlled, and allergic to wasted talent. He cares about winning, discipline, leverage, and making Gryffindor look stupid in public.

function RelBar({ value }) {
  const isNeg = value < 0;
  const pct = Math.min(Math.abs(value), 100);
  return (
    <div style={{display:'flex', alignItems:'center', gap:8, marginTop:4}}>
      <div style={{flex:1, height:6, background:'#333', borderRadius:3, overflow:'hidden'}}>
        <div style={{width:`${pct}%`, height:'100%', background: isNeg ? C.orange : C.green, borderRadius:3, transition:'width 0.5s'}}/>
      </div>
      <span style={{color: isNeg ? C.orange : C.green, fontSize:12, minWidth:45, textAlign:'right'}}>{value > 0 ? '+':''}{value.toFixed(1)}%</span>
    </div>
  );
}

function PostCard({ post, chars, player, onCharClick, onLike, onOpenThread }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const char = allChars.find(c => c.id === post.charId);
  const replyChar = post.reply ? allChars.find(c => c.id === post.reply.charId) : null;
  const [liked, setLiked] = useState(false);

  function timeAgo(ts) {
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return `${Math.floor(d)}s`;
    if (d < 3600) return `${Math.floor(d/60)}m`;
    if (d < 86400) return `${Math.floor(d/3600)}h`;
    return `${Math.floor(d/86400)}d`;
  }

  if (!char) return null;

  const renderText = (text) => renderLinkedText(text, allChars, onCharClick);

  return (
    <div style={{padding:'16px 16px', borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:'flex', gap:12}}>
        <Avatar char={char} size={52} onClick={() => char.id !== '__gmz__' && onCharClick(char)} />

              <span style={{color:C.muted, fontSize:13}}>@{char.handle}</span>
              <span style={{color:C.muted, fontSize:13}}>· {timeAgo(post.timestamp)}</span>

            <span style={{color:C.muted, fontSize:18, cursor:'pointer', padding:'0 4px'}}>···</span>
          </div>
          <p style={{color:C.text, fontSize:14, lineHeight:1.5, marginTop:4, cursor:'pointer'}} onClick={() => onOpenThread && onOpenThread(post)}>{renderText(post.text)}</p>
          {post.photo && <img src={post.photo} alt="" onClick={() => onOpenThread && onOpenThread(post)} style={{width:'100%', borderRadius:12, marginTop:8, maxHeight:220, objectFit:'cover', cursor:'pointer'}} />}
          <div style={{display:'flex', gap:20, marginTop:10, alignItems:'center'}}>
            <button onClick={() => onOpenThread && onOpenThread(post)} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>

              <svg viewBox="0 0 24 24" width="16" height="16" fill={liked ? '#e91e8c' : 'none'} stroke={liked ? '#e91e8c' : 'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

            </button>
            <button style={{background:'none',border:'none',color:C.muted,cursor:'pointer',marginLeft:'auto'}}>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2v-2h-2V9h2zm-4 10H4V5h14v14z"/></svg>
            </button>
          </div>
        </div>
      </div>
      {replyChar && (
        <div style={{marginLeft:50, marginTop:10, padding:'10px 12px', background:C.card2, borderRadius:12, borderLeft:`3px solid ${C.border}`}}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
            <Avatar char={replyChar} size={32} />
            <span style={{fontWeight:700, fontSize:13, color:C.text}}>{replyChar.name}</span>
            <CharBadge char={replyChar} />
            <span style={{color:C.muted, fontSize:12}}>@{replyChar.handle}</span>
          </div>
          <p style={{color:C.text, fontSize:13, lineHeight:1.5}}>{renderText(post.reply.text)}</p>
          <div style={{display:'flex', alignItems:'center', gap:4, marginTop:6}}>
            <svg viewBox="0 0 24 24" width="13" height="13" fill={liked ? '#e91e8c' : C.muted}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span style={{color:C.muted, fontSize:12}}>{fmt(post.likes * 62)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Post Thread View ─────────────────────────────────────────────
function PostThreadView({ post, chars, player, onBack, onCharClick, feed }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const char = allChars.find(c => c.id === post.charId);
  const replyChar = post.reply ? allChars.find(c => c.id === post.reply.charId) : null;
  const [liked, setLiked] = useState(false);
  const [replyText, setReplyText] = useState('');
  const [replyOpen, setReplyOpen] = useState(false);
  const replyInputRef = useRef(null);
  const [botComments, setBotComments] = useState(post.botComments || []);
  const [charComments, setCharComments] = useState(post.charComments || []);
  const [likedBots, setLikedBots] = useState({});
  const [likedCharComments, setLikedCharComments] = useState({});
  const [replyingToBot, setReplyingToBot] = useState(null); // bot comment index
  const [botReplyText, setBotReplyText] = useState('');
  const [botReplyLoading, setBotReplyLoading] = useState(false);
  const [loadingBots, setLoadingBots] = useState(false);
  const [loadingChars, setLoadingChars] = useState(false);

  // Generate the full thread (chars + bots, multi-round, tension-aware)
  useEffect(() => {
    if ((botComments.length > 0 || charComments.length > 0) || !post.text) return;
    if (loadingBots || loadingChars) return;
    let cancelled = false;
    setLoadingBots(true);
    setLoadingChars(true);

    const isPlayerPost = post.charId === 'player';
    const author = allChars.find(c => c.id === post.charId);
    const baseTs = post.timestamp || Date.now();

    // ─── ROUND 1: characters react ────────────────────────────────
    // Eligible: anyone but the author. Weight by emotional charge — strong relationship (+ or -)
    // means more likely to comment. Neutral relationships are passed over more often.
    const eligible = chars.filter(c => c.id !== post.charId);
    if (eligible.length === 0) { setLoadingChars(false); setLoadingBots(false); return; }

    const charge = (c) => {
      const r = c.relationships?.[post.charId] ?? c.relationships?.player;
      if (r === undefined) return 25; // neutral default
      return Math.abs(r - 50) + 10; // distance from neutral, min 10
    };
    const weighted = eligible.map(c => ({ c, w: charge(c) + Math.random()*30 }));
    weighted.sort((a,b) => b.w - a.w);

    // Pick 2-4 chars. More if engagement is high.
    const picked = weighted.slice(0, 2 + Math.floor(Math.random()*3)).map(x => x.c);

    const charRoster = picked.map((c,i) => {
      const rel = c.relationships?.[post.charId] ?? c.relationships?.player;
      const feel = rel === undefined ? 'neutral' :
        rel > 70 ? 'best friends with the poster' :
        rel > 40 ? 'on good terms with the poster' :
        rel > 10 ? 'tolerates the poster' :
        rel > -20 ? 'tense / complicated with the poster' :
        'genuinely dislikes the poster';
      return `${i+1}. ${c.name} (@${c.handle}; pronouns: ${pronounsFor(c)}) — ${c.house || ''}. ${c.personality}. relationship to poster: ${feel} (${rel ?? 'unknown'}).`;
    }).join('\n');

    const intro = isPlayerPost
      ? `${player.name} (@${player.handle}, the main character everyone watches) posted: "${post.text}"`
      : `${author?.name} (@${author?.handle}) posted: "${post.text}"`;

    (async () => {
      let charR1 = [];
      try {
        const res = await window.claude.complete({
          messages:[{ role:'user', content:
            `${intro}\n\n${pronounRule([author, player, ...picked])}\n\nWrite ${picked.length} replies to this post, one from each of these students at a wizarding university. Each reply MUST sound exactly like that character — match their personality, vocabulary, and how they'd react to THIS poster specifically based on their relationship.\n\nCharacters (in order):\n${charRoster}\n\nLength: 6-30 words each. Lowercase casual texting / lowkey ranting / dragging is encouraged. They might pile on, defend, deflect, sub-tweet, or escalate. People with bad blood should NOT be polite. People who are friends should be supportive but in their own voice. NO hashtags. NO quotes around replies.\n${BANNED_PHRASES_RULE}\nReturn ONLY a JSON array of ${picked.length} strings (one per character, in order). No other text.`
          }]
        });
        const cleaned = res.trim().replace(/^```json\n?|\n?```$/g,'');
        const parsed = JSON.parse(cleaned);
        charR1 = picked.map((c,i) => ({
          charId: c.id,
          text: (parsed[i]||'').trim().replace(/^["']|["']$/g,''),
          likes: Math.floor(Math.random()*8000),
          timestamp: baseTs + 60000 + i*30000 + Math.floor(Math.random()*120000),
        })).filter(c => c.text);
      } catch(e) {}

      if (cancelled) return;
      // Stagger reveal: drop char comments in over a few seconds
      for (let i = 0; i < charR1.length; i++) {
        setTimeout(() => {
          if (cancelled) return;
          setCharComments(prev => [...prev, charR1[i]]);
        }, 400 + i*(600 + Math.random()*500));
      }

      // ─── ROUND 2: bots react as audience ──────────────────────
      // They've now seen the post AND the character drama
      const transcript = [
        `${author?.name || player.name} (@${author?.handle || player.handle}): "${post.text}"`,
        ...charR1.map(cc => {
          const c = allChars.find(x => x.id === cc.charId);
          return `${c?.name} (@${c?.handle}): "${cc.text}"`;
        })
      ].join('\n');

      const pool = RECURRING_BOTS.filter(b => b.id !== 'gmz');
      const botCount = 3 + Math.floor(Math.random()*4); // 3-6
      const botsPicked = [...pool].sort(() => Math.random()-0.5).slice(0, botCount);
      const botRoster = botsPicked.map((b,i) => `${i+1}. @${b.handle} — ${b.vibe}`).join('\n');

      let bots = [];
      try {
        const res = await window.claude.complete({
          messages:[{ role:'user', content:
            `Below is a thread on a college social media app. ${charR1.length > 0 ? "It's gotten spicy — characters have piled on." : ''}

${transcript}

You are writing reactions from random anonymous student accounts watching this play out. They're an AUDIENCE. They:
- pick teams ("team @whoever", "@xxx ATE this")
- quote-laugh by repeating the funniest line back ("the way she said '${charR1[0]?.text?.split(/[.,!?]/)[0]?.trim()?.slice(0,40) || 'X'}' I AM CRYING")
- use slang heavily: lmfaooo, not him saying X, the way, I cant, screaming, deceased, oop, bestie no, etc.
- dunk, escalate, drag, or take sides — never neutral
- can call out specific @handles
- are NOT polite

Accounts (in order):
${botRoster}

Each comment 5-30 words. Match each account's voice — ${botsPicked.map(b => `@${b.handle} = ${b.vibe}`).join('; ')}. Mix CAPS/lowercase naturally. NO hashtags.
${BANNED_PHRASES_RULE}
Return ONLY a JSON array of ${botCount} strings, in order. No other text.`
          }]
        });
        const cleaned = res.trim().replace(/^```json\n?|\n?```$/g,'');
        const parsed = JSON.parse(cleaned);
        bots = botsPicked.map((b,i) => ({
          bot: b.id,
          text: (parsed[i]||'').trim().replace(/^["']|["']$/g,''),
          likes: Math.floor(Math.random()*15000),
          timestamp: baseTs + 240000 + i*45000 + Math.floor(Math.random()*180000),
        })).filter(b => b.text);
      } catch(e) {}

      if (cancelled) return;
      const botStartDelay = 400 + charR1.length*(600 + 250); // after chars finish
      for (let i = 0; i < bots.length; i++) {
        setTimeout(() => {
          if (cancelled) return;
          setBotComments(prev => [...prev, bots[i]]);
        }, botStartDelay + i*(500 + Math.random()*400));
      }
      if (!cancelled) setLoadingChars(false);

      // ─── ROUND 3: char-vs-char clapback ───────────────────────
      // Only fires if there are 2+ char replies AND at least one pair has bad blood
      const pairs = [];
      for (let i = 0; i < charR1.length; i++) {
        for (let j = 0; j < charR1.length; j++) {
          if (i === j) continue;
          const ci = allChars.find(x => x.id === charR1[i].charId);
          const cj = allChars.find(x => x.id === charR1[j].charId);
          const rel = ci?.relationships?.[cj?.id];
          if (rel !== undefined && rel < 30) {
            pairs.push({ replier: ci, target: cj, targetReply: charR1[j], rel });
          }
        }
      }

      if (pairs.length > 0) {
        // Pick the most charged pair (lowest rel)
        pairs.sort((a,b) => a.rel - b.rel);
        const fight = pairs[0];
        try {
          const res = await window.claude.complete({
            messages:[{ role:'user', content:
              `On a college social media thread, ${fight.target.name} (@${fight.target.handle}) just replied: "${fight.targetReply.text}"

Original post by ${author?.name || player.name}: "${post.text}"

${pronounRule([author, player, fight.replier, fight.target])}

You are ${fight.replier.name} (@${fight.replier.handle}; pronouns: ${pronounsFor(fight.replier)}). Your relationship with @${fight.target.handle} is bad (${fight.rel}/100). You see what they just said and you can't help yourself — you reply to THEM, not to the original post. Personality: ${fight.replier.personality}. ${(fight.replier.description||'').slice(0,200)}

Write ONE clapback (8-30 words). It should clearly be a reply to @${fight.target.handle} — quote their wording back at them, drag them, expose them, escalate. Lowercase casual is fine. NO hashtags. NO quotes around the reply.
${BANNED_PHRASES_RULE}
Return ONLY the reply text. No other text.`
            }]
          });
          if (cancelled) return;
          const clapback = {
            charId: fight.replier.id,
            text: res.trim().replace(/^["']|["']$/g,''),
            likes: Math.floor(Math.random()*20000) + 2000, // clapbacks pop off
            timestamp: baseTs + 480000 + Math.floor(Math.random()*240000),
            replyTo: fight.target.handle,
          };
          // Drop it after the bot wave finishes, plus a beat
          setTimeout(() => {
            if (cancelled) return;
            setCharComments(prev => [...prev, clapback]);
          }, botStartDelay + bots.length*600 + 1200);

          // ─── ROUND 4: bots react to the clapback ────────────
          const clapTranscript = `${author?.name || player.name}: "${post.text}"\n${fight.target.name}: "${fight.targetReply.text}"\n${fight.replier.name}: "${clapback.text}"`;
          const reactBots = [...pool].sort(() => Math.random()-0.5).slice(0, 2 + Math.floor(Math.random()*3));
          const reactRoster = reactBots.map((b,i) => `${i+1}. @${b.handle} — ${b.vibe}`).join('\n');
          try {
            const res2 = await window.claude.complete({
              messages:[{ role:'user', content:
                `Thread escalated. Latest exchange:\n${clapTranscript}\n\nWrite ${reactBots.length} reactions from anonymous audience accounts who just watched @${fight.replier.handle} clap back at @${fight.target.handle}. They should:\n- pick a winner (CLEARLY — "team @${fight.replier.handle}" or "@${fight.target.handle} did NOT deserve that")\n- quote-laugh the funniest part back\n- use heavy slang (lmfaooo, not the way she said X, screaming, OOP, deceased, etc.)\n- be UNHINGED about it\n\nAccounts (in order):\n${reactRoster}\n\nEach 5-25 words. Match each voice. NO hashtags.\n${BANNED_PHRASES_RULE}\nReturn ONLY a JSON array of ${reactBots.length} strings.` }]
            });
            if (cancelled) return;
            const cleaned2 = res2.trim().replace(/^```json\n?|\n?```$/g,'');
            const parsed2 = JSON.parse(cleaned2);
            const reactComments = reactBots.map((b,i) => ({
              bot: b.id,
              text: (parsed2[i]||'').trim().replace(/^["']|["']$/g,''),
              likes: Math.floor(Math.random()*25000) + 3000,
              timestamp: baseTs + 600000 + i*30000,
            })).filter(b => b.text);
            const reactStart = botStartDelay + bots.length*600 + 2400;
            for (let i = 0; i < reactComments.length; i++) {
              setTimeout(() => {
                if (cancelled) return;
                setBotComments(prev => [...prev, reactComments[i]]);
              }, reactStart + i*(500 + Math.random()*400));
            }

            // ─── ROUND 5: optional counterpunch ────────────────
            // Heated threads can keep moving, but the target may also decide silence is meaner.
            const counterChance = fight.rel < 0 ? 0.62 : fight.rel < 15 ? 0.46 : 0.28;
            if (Math.random() < counterChance) {
              try {
                const res3 = await window.claude.complete({
                  messages:[{ role:'user', content:
                    `A social media thread is turning into a fight.

Original post by ${author?.name || player.name}: "${post.text}"
${fight.target.name} (@${fight.target.handle}) said: "${fight.targetReply.text}"
${fight.replier.name} (@${fight.replier.handle}) fired back: "${clapback.text}"

${pronounRule([author, player, fight.target, fight.replier])}

You are ${fight.target.name} (@${fight.target.handle}; pronouns: ${pronounsFor(fight.target)}). Personality: ${fight.target.personality}. Your relationship with @${fight.replier.handle} is bad (${fight.rel}/100).

Decide if you would answer or leave it on read. If silence is more in-character, return exactly: SILENCE
Otherwise write ONE counter-reply (8-28 words) directly to @${fight.replier.handle}. It should escalate, dismiss, expose, or twist the knife. No hashtags. No quotes around the reply.
${BANNED_PHRASES_RULE}
Return ONLY SILENCE or the reply text.`
                  }]
                });
                const counterText = res3.trim().replace(/^["']|["']$/g,'');
                if (!cancelled && counterText && counterText.toUpperCase() !== 'SILENCE') {
                  const counter = {
                    charId: fight.target.id,
                    text: counterText,
                    likes: Math.floor(Math.random()*26000) + 4000,
                    timestamp: baseTs + 720000 + Math.floor(Math.random()*180000),
                    replyTo: fight.replier.handle,
                  };
                  setTimeout(() => {
                    if (cancelled) return;
                    setCharComments(prev => [...prev, counter]);
                  }, reactStart + reactComments.length*650 + 1600);
                }
              } catch(e) {}
            }
          } catch(e) {}
        } catch(e) {}
      }

      if (!cancelled) setLoadingBots(false);
    })();

    return () => { cancelled = true; };
  }, []);

  function timeAgo(ts) {
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return `${Math.floor(d)}s ago`;
    if (d < 3600) return `${Math.floor(d/60)}m ago`;
    if (d < 86400) return `${Math.floor(d/3600)}h ago`;
    return `${Math.floor(d/86400)}d ago`;
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) + ' · ' + new Date(ts).toLocaleDateString([],{month:'numeric',day:'numeric',year:'2-digit'});
  }

  const renderText = (text) => renderLinkedText(text, allChars, onCharClick);

  const getBotById = id => RECURRING_BOTS.find(b => b.id === id) || RECURRING_BOTS[0];

  // Merge char + bot comments into a single chronological feed.
  // Falls back to insertion order (using array index baked into ts) if timestamps tie.
  const mergedReplies = React.useMemo(() => {
    const items = [
      ...charComments.map((cc, i) => ({ kind:'char', data: cc, idx: i, ts: cc.timestamp || 0 })),
      ...botComments.map((bc, i) => ({ kind:'bot', data: bc, idx: i, ts: bc.timestamp || 0 })),
    ];
    items.sort((a,b) => (a.ts||0) - (b.ts||0));
    return items;
  }, [charComments, botComments]);

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
    <div style={{flex:1, overflowY:'auto'}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12, position:'sticky', top:0, background:C.bg, zIndex:5}}>
        <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
        <span style={{color:C.text, fontWeight:700, fontSize:16}}>Post</span>
      </div>

      {/* Main post */}
      <div style={{padding:'16px'}}>
        <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:14}}>
          <Avatar char={char} size={44} onClick={() => onCharClick(char)} />
          <div style={{flex:1}}>
            <div style={{display:'flex', alignItems:'center', gap:4}}>
              <span style={{fontWeight:700, fontSize:15, color:C.text, cursor:'pointer'}} onClick={() => onCharClick(char)}>{char?.name}</span>
              <CharBadge char={char} />
            </div>
            <span style={{color:C.muted, fontSize:13}}>@{char?.handle}</span>
          </div>
          <span style={{color:C.muted, fontSize:20}}>···</span>
        </div>
        <p style={{color:C.text, fontSize:17, lineHeight:1.6, marginBottom:12}}>{renderText(post.text)}</p>
        {post.photo && <img src={post.photo} alt="" style={{width:'100%', borderRadius:14, marginBottom:12, maxHeight:260, objectFit:'cover'}}/>}
        <p style={{color:C.muted, fontSize:13, marginBottom:12}}>{fmtTime(post.timestamp)} · <strong style={{color:C.text}}>{fmt(post.likes * 7.2 | 0)}</strong> Views</p>
        <div style={{borderTop:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`, padding:'10px 0', display:'flex', gap:16, alignItems:'center'}}>
          <button onClick={() => { setReplyOpen(true); setTimeout(() => replyInputRef.current?.focus(), 50); }} style={{background:C.blue+'22', color:C.blue, border:'none', borderRadius:22, padding:'9px 18px', fontSize:14, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:7}}>
            <ReplyGlyph size={17} /> Reply
          </button>
          <div style={{display:'flex', alignItems:'center', gap:6, color:C.muted, fontSize:13}}>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            {fmt(post.reposts)}
          </div>
          <button onClick={() => setLiked(l=>!l)} style={{display:'flex', alignItems:'center', gap:6, color: liked ? '#e91e8c' : C.muted, background:'none', border:'none', fontSize:13, cursor:'pointer'}}>
            <svg viewBox="0 0 24 24" width="16" height="16" fill={liked?'#e91e8c':'none'} stroke={liked?'#e91e8c':'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            {fmt(post.likes + (liked?1:0))}
          </button>
        </div>
      </div>

      {/* Character reply if exists */}
      {post.reply && replyChar && (
        <div style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
          <div style={{display:'flex', gap:10}}>
            <Avatar char={replyChar} size={38} onClick={() => onCharClick(replyChar)} />
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                <span style={{fontWeight:700, fontSize:14, color:C.text}}>{replyChar.name}</span>
                <CharBadge char={replyChar} />
                <span style={{color:C.muted, fontSize:13}}>@{replyChar.handle}</span>
              </div>
              <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{renderText(post.reply.text)}</p>
              <div style={{display:'flex', gap:16, marginTop:8, alignItems:'center'}}>
                <span style={{color:C.muted, fontSize:12, display:'flex', alignItems:'center', gap:4}}>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  {fmt(post.likes * 62)}
                </span>
                <span style={{color:C.muted, fontSize:12}}>Reply</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Comments — chars + bots, chronological */}
      {(loadingChars || loadingBots) && mergedReplies.length === 0 && (
        <p style={{color:C.muted, fontSize:13, padding:'14px 16px'}}>Loading comments...</p>
      )}
      {mergedReplies.map((item, mi) => {
        if (item.kind === 'char') {
          const cc = item.data;
          const i = item.idx;
          const cChar = allChars.find(c => c.id === cc.charId);
          if (!cChar) return null;
          const isLiked = !!likedCharComments[i];
          return (
            <div key={`char-${i}`} style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
              <div style={{display:'flex', gap:10}}>
                <Avatar char={cChar} size={38} onClick={() => onCharClick(cChar)}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:2, flexWrap:'wrap'}}>
                    <span style={{fontWeight:700, fontSize:14, color:C.text, cursor:'pointer'}} onClick={() => onCharClick(cChar)}>{cChar.name}</span>
                    <CharBadge char={cChar} />
                    <span style={{color:C.muted, fontSize:13}}>@{cChar.handle}</span>
                    <span style={{color:C.muted, fontSize:13}}>·</span>
                    <span style={{color:C.muted, fontSize:13}}>{timeAgo(cc.timestamp || post.timestamp)}</span>
                  </div>
                  {cc.replyTo && (
                    <p style={{color:C.muted, fontSize:12, margin:'2px 0 6px'}}>
                      Replying to <span style={{color:C.blue}}>@{cc.replyTo}</span>
                    </p>
                  )}
                  <p style={{color:C.text, fontSize:14, lineHeight:1.5, margin:0}}>{renderText(cc.text)}</p>
                  <div style={{display:'flex', gap:24, marginTop:10, alignItems:'center'}}>
                    <button onClick={() => setLikedCharComments(p => ({...p, [i]: !p[i]}))}
                      style={{background:'none', border:'none', color: isLiked ? C.red : C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4}}>
                      <svg viewBox="0 0 24 24" width="14" height="14" fill={isLiked?C.red:'none'} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                      {fmt((cc.likes||0) + (isLiked?1:0))}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }
        // bot
        const bc = item.data;
        const i = item.idx;
        const bot = getBotById(bc.bot);
        const isLiked = !!likedBots[i];
        const isReplying = replyingToBot === i;

        async function handleBotReply() {
          if (!botReplyText.trim() || botReplyLoading) return;
          setBotReplyLoading(true);
          const playerReply = botReplyText;
          setBotReplyText('');
          setReplyingToBot(null);
          // Optimistically add player reply
          const playerEntry = { bot: '__player__', text: playerReply, likes: 0, isPlayer: true };
          setBotComments(prev => {
            const next = [...prev];
            next.splice(i + 1, 0, playerEntry);
            return next;
          });
          try {
            const res = await window.claude.complete({
              messages: [{ role:'user', content:
                `You are ${bot.name} (@${bot.handle}), a ${bot.type} social media account at a wizarding university. Your personality: ${bot.bio || bot.type}.
Original post: "${post.text}"
Your comment: "${bc.text}"
${player.name} just replied to your comment: "${playerReply}"
Write a short, punchy reply (1-2 sentences max) in your voice. Stay in character. Be reactive and entertaining.`
              }]
            });
            setBotComments(prev => {
              const next = [...prev];
              const insertAt = next.findIndex(c => c === playerEntry) + 1;
              next.splice(insertAt, 0, { bot: bc.bot, text: res.trim(), likes: Math.floor(Math.random()*3000) });
              return next;
            });
          } catch(e) {}
          setBotReplyLoading(false);
        }

        if (bc.isPlayer) {
          return (
            <div key={i} style={{borderBottom:`1px solid ${C.border}`, padding:'12px 16px', paddingLeft:64}}>
              <div style={{display:'flex', gap:10}}>
                <Avatar char={player} size={32}/>
                <div style={{flex:1}}>
                  <span style={{fontWeight:700, fontSize:13, color:C.text}}>{player.name}</span>
                  <span style={{color:C.muted, fontSize:12, marginLeft:6}}>@{player.handle}</span>
                  <p style={{color:C.text, fontSize:13, lineHeight:1.5, marginTop:4}}>{renderText(bc.text)}</p>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div key={i} style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
            <div style={{display:'flex', gap:10}}>
              <BotAvatar bot={bot} size={38}/>
              <div style={{flex:1}}>
                <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4, flexWrap:'wrap'}}>
                  <span style={{fontWeight:700, fontSize:14, color:C.text}}>{bot.name}</span>
                  <span style={{color:C.muted, fontSize:13}}>@{bot.handle}</span>
                </div>
                <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{renderText(bc.text)}</p>
                <div style={{display:'flex', gap:20, marginTop:10, alignItems:'center'}}>
                  <button
                    onClick={() => setReplyingToBot(isReplying ? null : i)}
                    style={{background:'none', border:'none', color: isReplying ? C.blue : C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4}}>
                    <ReplyGlyph size={14} />
                    Reply
                  </button>
                  <button
                    onClick={() => setLikedBots(prev => ({...prev, [i]: !prev[i]}))}
                    style={{background:'none', border:'none', color: isLiked ? '#e91e8c' : C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4}}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill={isLiked ? '#e91e8c' : 'none'} stroke={isLiked ? '#e91e8c' : 'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    {fmt(bc.likes + (isLiked ? 1 : 0))}
                  </button>
                </div>
                {isReplying && (
                  <div style={{marginTop:10, display:'flex', gap:8, alignItems:'flex-end'}}>
                    <Avatar char={player} size={28}/>
                    <div style={{flex:1, background:C.card2, borderRadius:12, border:`1px solid ${botReplyText.trim() ? C.blue+'66' : C.border}`, padding:'8px 12px', transition:'border-color 0.2s'}}>
                      <input
                        value={botReplyText}
                        onChange={e => setBotReplyText(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleBotReply()}
                        placeholder={`Reply to @${bot.handle}…`}
                        style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:13, outline:'none'}}
                        autoFocus
                      />
                    </div>
                    <button
                      onClick={handleBotReply}
                      disabled={!botReplyText.trim() || botReplyLoading}
                      style={{background: botReplyText.trim() ? C.blue : C.card2, color: botReplyText.trim() ? '#fff' : C.muted, border:'none', borderRadius:22, padding:'8px 16px', fontSize:14, fontWeight:700, cursor: botReplyText.trim() ? 'pointer' : 'default', whiteSpace:'nowrap'}}>
                      {botReplyLoading ? '…' : 'Send'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}
      {(loadingChars || loadingBots) && mergedReplies.length > 0 && (
        <p style={{color:C.muted, fontSize:12, padding:'10px 16px', textAlign:'center', fontStyle:'italic'}}>more replies coming in...</p>
      )}
      <div style={{height: replyOpen ? 80 : 20}}/>
    </div>

    {/* Reply input bar */}    {replyOpen && (
      <div style={{borderTop:`1px solid ${C.border}`, background:C.bg, padding:'10px 12px', display:'flex', gap:8, alignItems:'flex-end'}}>
        <Avatar char={player} size={30}/>
        <div style={{flex:1, background:C.card2, borderRadius:20, border:`1px solid ${replyText.trim() ? C.blue+'66' : C.border}`, padding:'9px 14px', transition:'border-color 0.2s'}}>
          <input
            ref={replyInputRef}
            value={replyText}
            onChange={e => setReplyText(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Escape') { setReplyOpen(false); setReplyText(''); }
              if (e.key === 'Enter' && replyText.trim()) {
                setBotComments(prev => [...prev, { bot:'__player__', text: replyText.trim(), likes:0, isPlayer:true }]);
                setReplyText(''); setReplyOpen(false);
              }
            }}
            placeholder={`Reply to @${char?.handle}…`}
            style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:14, outline:'none'}}
          />
        </div>
        <button
          onClick={() => {
            if (!replyText.trim()) return;
            setBotComments(prev => [...prev, { bot:'__player__', text: replyText.trim(), likes:0, isPlayer:true }]);
            setReplyText(''); setReplyOpen(false);
          }}
          disabled={!replyText.trim()}
          style={{background: replyText.trim() ? C.blue : C.card2, color:'#fff', border:'none', borderRadius:'50%', width:42, height:42, cursor: replyText.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}>
          →
        </button>
      </div>
    )}
    </div>
  );
}

// ─── Live Match Modal ─────────────────────────────────────────────
function LiveMatchModal({ match, chars, player, onClose, onPostToFeed, onMatchEnd }) {
  const [phase, setPhase] = useState('kickoff'); // kickoff | live | postgame
  const [events, setEvents] = useState([]);
  const [visibleIdx, setVisibleIdx] = useState(-1);
  const [score, setScore] = useState({ home:0, away:0 });
  const [loading, setLoading] = useState(false);
  const slyColor = '#2a8a4a';
  const gryfColor = '#c41e3a';
  const homeColor = match.home === 'Slytherin' ? slyColor : gryfColor;
  const awayColor = match.away === 'Slytherin' ? slyColor : gryfColor;

  function startMatch() {
    const evts = generateMatchEvents(match, chars, player);
    setEvents(evts);
    setPhase('live');
    setVisibleIdx(0);
    // Post kickoff to feed
    onPostToFeed(`KICKOFF: ${match.home} vs ${match.away} — ${match.location}. It's on.`, '__gmz__');
  }

  function nextEvent() {
    const ev = events[visibleIdx];
    if (!ev) return;
    // Update score
    if (ev.type === 'goal') {
      const isHome = ev.text(match.home, match.away, player).includes(match.home + ' scores') || ev.text(match.home, match.away, player).startsWith(match.home);
      setScore(s => isHome ? {...s, home: s.home+10} : {...s, away: s.away+10});
    }
    if (ev.type === 'snitch') {
      // Snitch caught — random team catches, +150
      const slyWins = Math.random() > 0.45;
      setScore(s => slyWins
        ? (match.home==='Slytherin' ? {...s, home:s.home+150} : {...s, away:s.away+150})
        : (match.home==='Gryffindor' ? {...s, home:s.home+150} : {...s, away:s.away+150})
      );
      // Post to feed
      onPostToFeed(ev.text, '__gmz__');
      setTimeout(() => setPhase('postgame'), 600);
      return;
    }
    // Post event to feed
    onPostToFeed(ev.text, '__gmz__');
    if (visibleIdx < events.length - 1) setVisibleIdx(i => i+1);
  }

  const currentEv = events[visibleIdx];
  const homeWon = score.home > score.away;

  return (
    <div style={{position:'absolute', inset:0, zIndex:200, background:C.bg, display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer'}}>×</button>
        <span style={{color:C.text, fontWeight:700, fontSize:16, flex:1}}>🏆 {match.home} vs {match.away}</span>
        {phase === 'live' && (
          <div style={{display:'flex', gap:12, alignItems:'center'}}>
            <span style={{color:homeColor, fontWeight:800, fontSize:18}}>{score.home}</span>
            <span style={{color:C.muted, fontSize:14}}>–</span>
            <span style={{color:awayColor, fontWeight:800, fontSize:18}}>{score.away}</span>
          </div>
        )}
      </div>

      <div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px 20px'}}>

        {phase === 'kickoff' && (
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:60, marginBottom:20}}>🏟️</div>
            <div style={{display:'flex', alignItems:'center', gap:16, marginBottom:24, justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:homeColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, margin:'0 auto 6px'}}>🐍</div>
                <p style={{color:homeColor, fontWeight:800, fontSize:15}}>{match.home}</p>
              </div>
              <span style={{color:C.muted, fontSize:24, fontWeight:700}}>vs</span>
              <div style={{textAlign:'center'}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:awayColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, margin:'0 auto 6px'}}>🦁</div>
                <p style={{color:awayColor, fontWeight:800, fontSize:15}}>{match.away}</p>
              </div>
            </div>
            <p style={{color:C.muted, fontSize:13, marginBottom:24}}>{match.location}</p>
            <button onClick={startMatch} style={{background:C.blue, color:'#fff', border:'none', borderRadius:20, padding:'14px 40px', fontSize:16, fontWeight:700, cursor:'pointer'}}>
              Kick off →
            </button>
          </div>
        )}

        {phase === 'live' && currentEv && (
          <div style={{width:'100%', maxWidth:360}}>
            {/* Current event card */}
            <div style={{background:C.card2, borderRadius:20, padding:'24px 20px', marginBottom:20, textAlign:'center', minHeight:160, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12}}>
              <span style={{fontSize:44}}>{currentEv.icon}</span>
              <p style={{color:C.text, fontSize:15, lineHeight:1.65, fontWeight:500}}>{currentEv.text}</p>
            </div>

            {/* Score */}
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', background:C.card2, borderRadius:14, padding:'12px 20px', marginBottom:20}}>
              <span style={{color:homeColor, fontWeight:800, fontSize:22}}>{score.home}</span>
              <span style={{color:C.muted, fontSize:12, fontWeight:600}}>{match.home.toUpperCase()} · {match.away.toUpperCase()}</span>
              <span style={{color:awayColor, fontWeight:800, fontSize:22}}>{score.away}</span>
            </div>

            {/* Event counter */}
            <div style={{display:'flex', gap:4, justifyContent:'center', marginBottom:20}}>
              {events.map((e,i) => (
                <div key={i} style={{width: i===visibleIdx ? 20 : 6, height:6, borderRadius:3, background: i<=visibleIdx ? C.blue : C.border, transition:'all 0.3s'}}/>
              ))}
            </div>

            <button onClick={nextEvent} style={{width:'100%', background:C.text, color:C.bg, border:'none', borderRadius:14, padding:'14px', fontSize:15, fontWeight:700, cursor:'pointer'}}>
              {currentEv.type === 'snitch' ? '🌟 Catch the Snitch' : 'Next →'}
            </button>
          </div>
        )}

        {phase === 'postgame' && (
          <div style={{textAlign:'center', width:'100%', maxWidth:360}}>
            <div style={{fontSize:52, marginBottom:12}}>{homeWon === (match.home==='Slytherin') ? '🐍' : '🦁'}</div>
            <h2 style={{color:C.text, fontSize:22, fontWeight:800, marginBottom:4}}>
              {score.home === score.away ? 'Draw' : `${score.home > score.away ? match.home : match.away} wins`}
            </h2>
            <div style={{display:'flex', justifyContent:'center', gap:20, marginBottom:24}}>
              <div style={{textAlign:'center'}}>
                <p style={{color:homeColor, fontWeight:800, fontSize:32}}>{score.home}</p>
                <p style={{color:C.muted, fontSize:12}}>{match.home}</p>
              </div>
              <div style={{textAlign:'center'}}>
                <p style={{color:awayColor, fontWeight:800, fontSize:32}}>{score.away}</p>
                <p style={{color:C.muted, fontSize:12}}>{match.away}</p>
              </div>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <button onClick={() => { onMatchEnd(score); onClose(); }} style={{background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>
                Back to feed →
              </button>
              <button onClick={() => { onMatchEnd(score); onClose(); /* TODO: locker room */ }} style={{background:C.card2, color:C.text, border:`1px solid ${C.border}`, borderRadius:14, padding:'13px', fontSize:14, fontWeight:600, cursor:'pointer'}}>
                🚿 Locker room scene
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Feed Screen ──────────────────────────────────────────────────
function FeedScreen({ chars, player, feed, setFeed, day, onCharClick, onEvent, setTab, onCompose, onOpenThread, onWatchMatch, currentMatch, onRefreshFeed }) {
  const [showEvent, setShowEvent] = useState(false);
  const [pullStart, setPullStart] = useState(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const currentEvent = EVENT_POOL[day % EVENT_POOL.length];

  function beginPull(e) {
    if (e.currentTarget.scrollTop <= 0) setPullStart(e.touches[0].clientY);
  }

  function movePull(e) {
    if (pullStart === null || e.currentTarget.scrollTop > 0 || refreshing) return;
    const distance = Math.max(0, e.touches[0].clientY - pullStart);
    setPullDistance(Math.min(distance, 92));
  }

  async function endPull() {
    if (pullDistance > 68 && onRefreshFeed) {
      setRefreshing(true);
      await onRefreshFeed();
      setRefreshing(false);
    }
    setPullStart(null);
    setPullDistance(0);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', minHeight:0}}>
      <div
        onTouchStart={beginPull}
        onTouchMove={movePull}
        onTouchEnd={endPull}
        onTouchCancel={endPull}
        style={{flex:1, overflowY:'auto', position:'relative'}}
      >
        {/* Header */}
        <div style={{padding:'10px 16px', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:10}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <span style={{fontSize:16}}>☀️</span>
              <span style={{color:C.text, fontWeight:700}}>Day {day}</span>
            </div>
            <div style={{display:'flex', gap:8}}>
              <div style={{width:42, height:42, background:C.card2, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}} onClick={() => setTab('profile')}>
                <svg viewBox="0 0 24 24" width="24" height="24" fill={C.muted}><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
              </div>
            </div>
          </div>

        </div>

        {(pullDistance > 0 || refreshing) && (
          <div style={{height:refreshing ? 42 : Math.max(26, pullDistance * 0.55), display:'flex', alignItems:'center', justifyContent:'center', color:C.muted, fontSize:12, transition:refreshing?'height 0.18s ease':'none'}}>
            {refreshing ? 'Loading new posts...' : pullDistance > 68 ? 'Release to refresh' : 'Pull for new posts'}
          </div>
        )}

        {/* Match day banner */}
        <MatchDayBanner match={currentMatch} day={day} onWatch={onWatchMatch} />

        {/* Posts */}
        {feed.map(post => (
          <PostCard key={post.id} post={post} chars={chars} player={player} onCharClick={onCharClick} onOpenThread={onOpenThread} />
        ))}

        {/* Spacer */}
        <div style={{height:18}}/>
      </div>

      {/* Feed actions */}
      <div style={{display:'flex', justifyContent:'center', gap:12, padding:'10px 16px 12px', background:C.bg, borderTop:`1px solid ${C.border}`, flexShrink:0}}>
        <button onClick={() => onEvent(currentEvent)} style={{
          background:'linear-gradient(135deg, #4dabf7, #2280d2)', color:'#fff', border:'none',
          borderRadius:28, padding:'13px 28px', fontSize:16, fontWeight:700, cursor:'pointer',
          display:'flex', alignItems:'center', gap:8, boxShadow:'0 3px 14px rgba(77,171,247,0.28)',
        }}>
          📣 Event <span style={{fontSize:13, fontWeight:500, opacity:0.9}}>up to +{currentEvent.xp[1]} xp</span>
        </button>
        <button onClick={onCompose} style={{
          background:C.blue, color:'#fff', border:'none',
          borderRadius:'50%', width:50, height:50, fontSize:28, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 3px 14px rgba(77,171,247,0.28)',
        }}>+</button>
      </div>
    </div>
  );
}

function buildSystemPrompt(char, player, allChars, feed, dms) {
  // Recent feed posts (last 12, newest first)
  const recentPosts = [...feed].slice(0, 12).map(p => {
    const poster = allChars.find(c => c.id === p.charId);
    const lines = [`@${poster?.handle || p.charId}: "${p.text}"`];
    if (p.reply) {
      const replier = allChars.find(c => c.id === p.reply.charId);
      lines.push(`  ↳ @${replier?.handle || p.reply.charId} replied: "${p.reply.text}"`);
    }
    return lines.join('\n');
  }).join('\n');

  // Relationships with other chars
  const relLines = allChars
    .filter(c => c.id !== char.id)
    .map(c => {
      const val = char.relationships?.[c.id];
      const feel = val === undefined ? 'neutral' : val > 60 ? 'close friends / very positive' : val > 20 ? 'friendly' : val > 0 ? 'acquaintances' : val > -30 ? 'tense / complicated' : 'enemies / strongly negative';
      return `- ${c.name} (@${c.handle}; pronouns: ${pronounsFor(c)}): ${feel}${val !== undefined ? ` (${val > 0 ? '+':''}${val}%)` : ''}`;
    }).join('\n');

  // Past DM history summary (only if exists)
  const pastMsgs = (dms[char.id] || []);
  const historyNote = pastMsgs.length > 0
    ? `\nYou and ${player.name} have been talking. Here are your recent exchanges — reference them naturally if relevant:\n` +
      pastMsgs.slice(-10).map(m => `${m.role === 'user' ? player.name : char.name}: "${m.text}"`).join('\n')
    : '';

  return `You are ${char.name} (@${char.handle}), a real person with a social media presence.

PRONOUNS: ${pronounsFor(char)}
PERSONALITY: ${char.personality}
BIO: ${char.bio}
FULL DESCRIPTION: ${char.description}

${pronounRule(allChars)}

YOUR RELATIONSHIPS WITH OTHERS:
${relLines || 'No known relationships yet.'}

WHAT'S BEEN HAPPENING ON THE FEED RECENTLY:
${recentPosts || 'Nothing yet.'}
${historyNote}

You are now in a private DM with ${player.name} (@${player.handle}).

RULES:
- Stay completely in character. Never break the fourth wall or mention being an AI.
- Use the pronouns listed above exactly. Do not misgender anyone, including in gossip or third-person comments.
- Be brief: 1-3 sentences max unless pushed.
- Reference the feed naturally if it's relevant — bring up posts, gossip, what others did.
- Remember what ${player.name} has told you in this conversation.
- Your personality drives EVERYTHING: tone, vocabulary, what you care about, what you ignore.
- React to ${player.name}'s messages the way YOUR character would — not generically.
${BANNED_PHRASES_RULE}`;
}

function ChatScreen({ char, player, allChars, feed, dms, setDms, onBack }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const msgs = dms[char.id] || [];
  const bottomRef = useRef(null);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollTop = 9999;
  }, [msgs]);

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', text: input.trim(), id: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setDms(d => ({ ...d, [char.id]: newMsgs }));
    setInput('');
    setLoading(true);
    try {
      // Smart silence: reserved/quiet chars sometimes don't reply
      const quietPersonalities = ['reserved', 'quiet', 'deadpan', 'minimal'];
      const isQuiet = quietPersonalities.some(q => (char.personality||'').toLowerCase().includes(q));
      const silenceChance = isQuiet ? 0.25 : 0.08;
      if (Math.random() < silenceChance && msgs.length > 0) {
        // Show "seen" indicator after a delay
        setTimeout(() => {
          setDms(d => ({ ...d, [`${char.id}_seen`]: true }));
          setLoading(false);
        }, 1800);
        return;
      }
      const systemPrompt = buildSystemPrompt(char, player, allChars, feed, dms);
      const history = newMsgs.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
      const reply = await window.claude.complete({
        messages: [
          { role:'user', content: systemPrompt },
          { role:'assistant', content: `Understood. I'm ${char.name} and I'm fully in character.` },
          ...history,
        ]
      });
      const charMsg = { role:'char', text: reply, id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg] }));
    } catch(e) {
      const errMsg = { role:'char', text: '...', id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), errMsg] }));
    }
    setLoading(false);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{background:'none', border:'none', color:C.blue, fontSize:16, cursor:'pointer', padding:'0 4px 0 0'}}>‹</button>
        <Avatar char={char} size={36} />
        <div>
          <div style={{display:'flex', alignItems:'center', gap:4}}>
            <span style={{fontWeight:700, color:C.text}}>{char.name}</span>
            <CharBadge char={char} />
          </div>
          <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
        </div>
      </div>
      {/* Messages */}
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10}}>
        {msgs.length === 0 && (
          <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:40}}>
            <div style={{fontSize:40, marginBottom:8}}><Avatar char={char} size={60} /></div>
            <p style={{marginTop:8}}><strong style={{color:C.text}}>{char.name}</strong></p>
            <p style={{marginTop:4, fontSize:13}}>{char.bio}</p>
            <p style={{marginTop:12, fontSize:12}}>Start a conversation</p>
          </div>
        )}
        {msgs.map(m => (
          <div key={m.id} style={{display:'flex', flexDirection: m.role === 'user' ? 'row-reverse' : 'row', gap:8, alignItems:'flex-end'}}>
            {m.role !== 'user' && <Avatar char={char} size={28} />}
            <div style={{
              maxWidth:'75%', padding:'10px 14px', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              background: m.role === 'user' ? C.blue : C.card2, color:'#fff', fontSize:14, lineHeight:1.5,
            }}>{m.text}</div>
          </div>
        ))}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28} />
            <div style={{padding:'10px 16px', borderRadius:'18px 18px 18px 4px', background:C.card2, color:C.muted, fontSize:14}}>
              <span style={{animation:'blink 1s infinite'}}>···</span>
            </div>
          </div>
        )}
        {!loading && dms[`${char.id}_seen`] && msgs.length > 0 && msgs[msgs.length-1].role === 'user' && (
          <div style={{textAlign:'right', color:C.muted, fontSize:11, padding:'0 4px'}}>Seen ✓</div>
        )}
      </div>
      {/* Input */}
      <div style={{padding:'10px 12px', borderTop:`1px solid ${C.border}`, display:'flex', gap:8, alignItems:'flex-end'}}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()}
          placeholder={`Message ${char.name.split(' ')[0]}...`}
          style={{flex:1, background:C.card2, border:`1px solid ${C.border}`, borderRadius:20, padding:'10px 14px', color:C.text, fontSize:14, outline:'none'}} />
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? C.blue : '#333', border:'none', borderRadius:'50%', width:38, height:38,
          color:'#fff', cursor: input.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
        }}>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>
  );
}

function SceneSetupModal({ char, player, onClose, onStart }) {
  const [step, setStep] = useState('setup'); // setup | invite | declined
  const [setting, setSetting] = useState(null);
  const [vibe, setVibe] = useState(null);
  const [inviteLoading, setInviteLoading] = useState(false);
  const [inviteResponse, setInviteResponse] = useState(null);

  async function sendInvite() {
    if (!setting || !vibe) return;
    setInviteLoading(true);
    setStep('invite');
    try {
      const res = await window.claude.complete({
        messages:[{ role:'user', content:
          `You are ${char.name} (@${char.handle}; pronouns: ${pronounsFor(char)}). Personality: ${char.personality}. Description: ${char.description?.slice(0,200)||char.bio}.
${pronounRule([char, player])}
${player.name} (@${player.handle}) just invited you to: ${setting.label} — "${setting.sub}" — vibe: ${vibe.label}.
Respond in character to this invitation. Be natural, in-character, and specific. 1-2 sentences max. You can accept with enthusiasm, accept with attitude, be ambiguous/coy, or decline (but only if it really fits your personality). NO quotes around your response, just what you'd actually text back.` }]
      });
      setInviteResponse(res.trim().replace(/^["']|["']$/g,''));
      // Detect decline — if response contains "can't", "won't", "no", "not tonight", "busy" etc.
      const lower = res.toLowerCase();
      const declined = ['can\'t', 'won\'t', 'not tonight', 'busy', 'not interested', 'leave me', 'go away'].some(w => lower.includes(w)) && !lower.includes('can\'t wait') && !lower.includes('won\'t be late');
      if (declined) setStep('declined');
      else setStep('accepted');
    } catch(e) {
      setInviteResponse('...fine. But this doesn\'t mean anything.');
      setStep('accepted');
    }
    setInviteLoading(false);
  }

    <div style={{position:'absolute', inset:0, zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end'}}>

        {step === 'setup' && <>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:20}}>
            <Avatar char={char} size={36}/>
            <div>
              <p style={{color:C.text, fontWeight:700, fontSize:15}}>Invite {char.name.split(' ')[0]}</p>
              <p style={{color:C.muted, fontSize:12}}>Pick a setting and a vibe</p>
            </div>
          </div>

          <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>WHERE</p>
          <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:18}}>
            {SCENE_SETTINGS.map(s => (
              <button key={s.id} onClick={() => setSetting(s)} style={{
                display:'flex', alignItems:'center', gap:12, background: setting?.id===s.id ? `${C.blue}18` : C.card2,
                border:`1.5px solid ${setting?.id===s.id ? C.blue : C.border}`, borderRadius:12,
                padding:'10px 14px', cursor:'pointer', textAlign:'left', transition:'all 0.15s',
              }}>
                <span style={{fontSize:20}}>{s.emoji}</span>
                <div>
                  <p style={{color:C.text, fontSize:13, fontWeight:600}}>{s.label}</p>
                  <p style={{color:C.muted, fontSize:11}}>{s.sub}</p>
                </div>
              </button>
            ))}
          </div>

          <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>VIBE</p>
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:24}}>
            {SCENE_VIBES.map(v => (

            )}
          </div>
        )}
      </div>
    </div>
  );
}

function SceneChatScreen({ char, player, setting, vibe, onClose }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollTop = 9999;
  }, [msgs]);

  // Opening line from character
  useEffect(() => {
    async function openingLine() {
      setLoading(true);
      // Short delay before first line — feels like they just arrived
      await new Promise(res => setTimeout(res, 2000 + Math.random()*3000));
      try {
        const res = await window.claude.complete({
          messages:[{ role:'user', content: buildScenePrompt('') + '\n\nOpen the scene with a single line. Format: actions in *third person asterisks*, spoken words in "quotes". Hints at inner state through physical tells only — never state thoughts directly. Short and atmospheric.' }]
        });
        setMsgs([{ role:'char', text: res.trim().replace(/^["']|["']$/g,''), id: Date.now() }]);
      } catch(e) {
        setMsgs([{ role:'char', text: '*glances over, says nothing for a moment.*', id: Date.now() }]);
      }
      setLoading(false);
    }
    openingLine();
  }, []);

  function buildScenePrompt(history) {
    return `You are ${char.name} (@${char.handle}; pronouns: ${pronounsFor(char)}). Personality: ${char.personality}. ${char.description?.slice(0,200)||char.bio}

${pronounRule([char, player])}

SCENE: ${setting.label} — ${setting.sub}
VIBE: ${vibe.label} ${vibe.emoji}
OTHER PERSON: ${player.name} (@${player.handle}) — ${player.bio}

RESPONSE FORMAT — follow this exactly:
- Actions go in italics asterisks, third person: *She glances up slowly, saying nothing at first.*
- Spoken dialogue goes in double quotes: "You're late."
- Thoughts are NEVER stated directly. At most a very brief physical tell that hints at them: *something flickers across her face* — not "she thinks" or "she wonders".
- A response might be just dialogue, just an action, or both — whatever feels natural.
- Keep it SHORT: 1-3 lines total. This is live conversation, not a story.
- Stay completely in character — personality: ${char.personality}.
- Use the pronouns listed above exactly. Do not misgender anyone.
- The vibe is ${vibe.label}. Honor it.
- If the player writes [something in brackets], treat it as a physical action and react naturally.
${history ? `\nCONVERSATION SO FAR:\n${history}` : ''}
${BANNED_PHRASES_RULE}`;
  }

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', text: input.trim(), id: Date.now() };
    setMsgs(prev => [...prev, userMsg]);
    setInput('');
    setLoading(true);
    // Realistic typing delay: 4-8 seconds
    const typingDelay = 4000 + Math.random() * 4000;
    await new Promise(res => setTimeout(res, typingDelay));
    try {
      const history = [...msgs, userMsg].map(m =>
        m.role === 'user' ? `${player.name}: "${m.text}"` : `${char.name}: ${m.text}`
      ).join('\n');
      const res = await window.claude.complete({
        messages:[{ role:'user', content: buildScenePrompt(history) + `\n\nRespond to: "${userMsg.text}"\nFormat: actions in *third person asterisks*, dialogue in "quotes". No narration. No inner monologue spelled out.` }]
      });
      const cleaned = res.trim().replace(/^["']|["']$/g,'');
      setMsgs(prev => [...prev, { role:'char', text: cleaned, id: Date.now()+1 }]);
    } catch(e) {}
    setLoading(false);
  }

  const vibeColor = vibe.color;

  return (
    <div style={{position:'absolute', inset:0, zIndex:200, display:'flex', flexDirection:'column', background:C.bg}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer', lineHeight:1}}>×</button>
        <Avatar char={char} size={34}/>
        <div style={{flex:1}}>
          <p style={{color:C.text, fontWeight:700, fontSize:14}}>{char.name.split(' ')[0]}</p>
          <p style={{color:C.muted, fontSize:11}}>{setting.emoji} {setting.label}</p>
        </div>
        <div style={{background:`${vibeColor}18`, border:`1px solid ${vibeColor}44`, borderRadius:20, padding:'4px 10px', display:'flex', alignItems:'center', gap:4}}>
          <span style={{fontSize:12}}>{vibe.emoji}</span>
          <span style={{color:vibeColor, fontSize:11, fontWeight:600}}>{vibe.label}</span>
        </div>
      </div>

      {/* Scene setting banner */}
      <div style={{padding:'10px 16px', background:C.card2, borderBottom:`1px solid ${C.border}`}}>
        <p style={{color:C.muted, fontSize:12, textAlign:'center'}}>{setting.sub}</p>
      </div>

      {/* Messages */}
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'16px 14px', display:'flex', flexDirection:'column', gap:12}}>
        {msgs.map(m => {
          const isMe = m.role === 'user';
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={char} size={28}/>}
              {isMe && <Avatar char={player} size={28}/>}
              <div style={{
                maxWidth:'76%', padding:'10px 14px',
                borderRadius: isMe ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                background: isMe ? C.blue : C.card2,
                color: isMe ? '#fff' : C.text,
                fontSize:14, lineHeight:1.7,
              }}>
                {isMe ? m.text : m.text.split(/(\*[^*]+\*)/g).map((part, i) =>
                  part.startsWith('*') && part.endsWith('*')
                    ? <em key={i} style={{color:C.muted, fontStyle:'italic', fontSize:13}}>{part.slice(1,-1)}</em>
                    : <span key={i}>{part}</span>
                )}
              </div>
            </div>
          );
        })}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28}/>
            <div style={{background:C.card2, borderRadius:'18px 18px 18px 4px', padding:'10px 16px'}}>
              <div style={{display:'flex', gap:4, alignItems:'center'}}>
                {[0,1,2].map(i => <div key={i} style={{width:6, height:6, borderRadius:'50%', background:C.muted, opacity:0.6, animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Input */}
      <div style={{padding:'10px 12px', borderTop:`1px solid ${C.border}`, background:C.bg, display:'flex', gap:8, alignItems:'flex-end'}}>
        <div style={{flex:1, background:C.card2, borderRadius:20, border:`1px solid ${input.trim() ? vibeColor+'66' : C.border}`, padding:'10px 14px', transition:'border-color 0.2s'}}>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==='Enter' && send()}
            placeholder="Say something… or [do something]"
            style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:14, outline:'none'}}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? vibeColor : C.card2, color:'#fff', border:'none',
          borderRadius:'50%', width:40, height:40, cursor: input.trim() ? 'pointer' : 'default',
          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:18,
          transition:'background 0.2s',
        }}>→</button>
      </div>
      <style>{`@keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }`}</style>
    </div>
  );
}

function EditCharScreen({ char, onBack, onSave }) {
  const isNew = !char.id;
  const avatarFileRef = useRef(null);
  const avatarDragRef = useRef(null);
  const [form, setForm] = useState({
    name: char.name || '',
    handle: char.handle || '',
    pronouns: char.pronouns || DEFAULT_PRONOUNS_BY_ID[char.id] || '',
    house: char.house || '',
    bio: char.bio || '',
    description: char.description || '',
    personality: char.personality || '',
    profilePhoto: char.profilePhoto || '',
    profilePhotoPosition: char.profilePhotoPosition || { x:50, y:50 },
    followers: char.followers || 1000000,
    followerTier: '1mil+',
  });

  const tiers = ['100+','1k+','10k+','100k+','250k+','500k+','1mil+'];
  const tierValues = { '100+':500, '1k+':5000, '10k+':50000, '100k+':200000, '250k+':400000, '500k+':800000, '1mil+':2000000 };
  const houses = [
    { id:'slytherin',  label:'Slytherin',  emoji:'🐍' },
    { id:'gryffindor', label:'Gryffindor', emoji:'🦁' },
    { id:'ravenclaw',  label:'Ravenclaw',  emoji:'🦅' },
    { id:'hufflepuff', label:'Hufflepuff', emoji:'🦡' },
  ];
  const houseColor = form.house ? HOUSE_COLORS[form.house] : null;

  function up(k,v) { setForm(f => ({...f, [k]:v})); }

  function handleProfilePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setForm(f => ({...f, profilePhoto: ev.target.result, profilePhotoPosition: f.profilePhotoPosition || { x:50, y:50 }}));
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function updateProfilePhotoPosition(e) {
    if (!form.profilePhoto) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
    up('profilePhotoPosition', { x:+x.toFixed(1), y:+y.toFixed(1) });
  }

  function startProfilePhotoDrag(e) {
    if (!form.profilePhoto) return;
    e.preventDefault();
    e.currentTarget.setPointerCapture?.(e.pointerId);
    avatarDragRef.current = true;
    updateProfilePhotoPosition(e);
  }

  function dragProfilePhoto(e) {
    if (!avatarDragRef.current) return;
    updateProfilePhotoPosition(e);
  }

  function stopProfilePhotoDrag(e) {
    avatarDragRef.current = false;
    e.currentTarget.releasePointerCapture?.(e.pointerId);
  }

  return (

      <div style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12}}>
