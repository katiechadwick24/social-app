  const lower = String(text || '').toLowerCase().replace(/[’]/g, "'");
  if (!lower.trim()) return null;
  const flirt = /\b(?:hot|pretty|beautiful|gorgeous|cute|cheekbones|staring|looked\s+twice|can'?t\s+look\s+away|cannot\s+look\s+away|distract(?:ed|ing|ion)?|flirt(?:ing|ed)?|kiss(?:ing|ed)?|date|fine|type|trouble|dangerous)\b/i.test(lower);
  const support = /\b(?:got\s+your\s+back|i'?ve\s+got\s+you|backing|backed|defend(?:ing|ed)?|protect(?:ing|ed)?|stand(?:ing)?\s+up\s+for|leave\s+(?:her|him|them|@?\w+)\s+alone|not\s+wrong|you'?re\s+right|you\s+are\s+right|agree|on\s+your\s+side|team\s+@?\w+|my\s+team|our\s+team|our\s+mess|with\s+you|fair\s+point|good\s+point)\b/i.test(lower);
  const warm = /\b(?:thank|thanks|respect|proud|appreciate|impressed|good|useful|funny|laughed|saved|solid|clean\s+shot|nice\s+one)\b/i.test(lower);
  const playful = /\b(?:lmao|lmfao|lol|roast|ate|bold|unhinged|insane|fascinated|obsessed|beautifully\s+unhelpful|terrible\s+answer|excellent\s+timing)\b/i.test(lower);
  const hardConflict = /\b(?:hate|despise|can'?t\s+stand|cannot\s+stand|pathetic|shut\s+up|go\s+away|back\s+off|idiot|stupid|useless|trash|liability)\b/i.test(lower);
  const conflict = /\b(?:wrong|try\s+again|made\s+it\s+worse|made\s+this\s+worse|worse|mess|fumble|bad\s+look|problem|mistake|clean\s+up|fix\s+this|not\s+helping|terrible|awful|unhelpful|explain\s+yourself|embarrassing)\b/i.test(lower);
  let value = 0;
  let label = 'public interaction';
  if (support) { value += 0.7; label = 'public support'; }
  if (flirt) { value += 0.8; label = 'public flirting'; }
  if (warm) { value += 0.35; label = label === 'public interaction' ? 'public warmth' : label; }
  if (playful) { value += 0.2; label = label === 'public interaction' ? 'public banter' : label; }
  if (hardConflict) { value -= 0.9; label = 'public conflict'; }
  else if (conflict) { value -= 0.45; label = label === 'public interaction' ? 'public friction' : label; }
  if (support && conflict && value < 0.35) value = 0.35;
  if (flirt && conflict && value < 0.25) value = 0.25;
  value = +clamp(value, -1.15, 1.25).toFixed(2);
  if (Math.abs(value) < 0.15) return null;
  return { value, label };
}

function aggregateFeedRelationshipChanges(changes = []) {
  const grouped = new Map();
  changes.forEach(ch => {
    if (!ch || !ch.actorId || !ch.targetId || typeof ch.value !== 'number') return;
    const key = `${ch.actorId}->${ch.targetId}`;
    const current = grouped.get(key) || { ...ch, value: 0, count: 0, samples: [] };
    current.value += ch.value;
    current.count += 1;
    if (ch.sample && current.samples.length < 2) current.samples.push(ch.sample);
    grouped.set(key, current);
  });
  return [...grouped.values()]
    .map(ch => ({ ...ch, value: +clamp(ch.value, -3, 3).toFixed(2) }))
    .filter(ch => Math.abs(ch.value) >= 0.15);
}

// Derive secondary score shifts from primary feed changes.
// When A<->B interact publicly, third parties who care about that relationship
// get their own (smaller) score adjustment toward the player.
function computeCascadeChanges(changes = [], chars = [], player = {}) {
  const cascade = [];
  const hasChar = (id) => (chars || []).some(c => c.id === id);

  changes.forEach(ch => {
    const { actorId, targetId, value, label = '' } = ch;
    const isPositive = value > 0;
    const isFlirty   = /flirt/.test(label);
    const isWarm     = /warmth|support|banter/.test(label);
    const isConflict = value < -0.3;

    const playerHavoc = (actorId === 'player' && targetId === 'havoc') ||
                        (actorId === 'havoc'   && targetId === 'player');
    const playerRowan = (actorId === 'player' && targetId === 'rowan') ||
                        (actorId === 'rowan'   && targetId === 'player');

    // Player <-> Havoc warmth/flirt → Elara scores player negatively
    if (playerHavoc && isPositive && (isFlirty || isWarm) && hasChar('elara')) {
      cascade.push({
        actorId: 'elara', targetId: 'player',
        value: +(-Math.abs(value) * 0.55).toFixed(2),
        label: 'jealous observer',
      });
    }

    // Player <-> Havoc conflict → Elara is mildly pleased
    if (playerHavoc && isConflict && hasChar('elara')) {
      cascade.push({
        actorId: 'elara', targetId: 'player',
        value: +(Math.abs(value) * 0.3).toFixed(2),
        label: 'rival friction',
      });
    }

    // Player <-> Rowan warmth/flirt → Tamsin protective concern
    if (playerRowan && isPositive && (isFlirty || isWarm) && hasChar('tamsin')) {
      cascade.push({
        actorId: 'tamsin', targetId: 'player',
        value: +(-Math.abs(value) * 0.45).toFixed(2),
        label: 'protective concern',
      });
    }

    // Elara already scoring player negatively → Tamsin picks up the same vibe (Elara-Tamsin alliance)
    if (actorId === 'elara' && targetId === 'player' && value < -0.3 && hasChar('tamsin')) {
      cascade.push({
        actorId: 'tamsin', targetId: 'player',
        value: +(-Math.abs(value) * 0.25).toFixed(2),
        label: 'shared concern',
      });
    }

    // Player publicly backs Slytherin (Silas/Havoc) → Gryffindor chars tick down slightly
    if (actorId === 'player' && (targetId === 'silas' || targetId === 'havoc') && isPositive && isWarm) {
      ['briar', 'callum'].forEach(id => {
        if (hasChar(id)) {
          cascade.push({
            actorId: id, targetId: 'player',
            value: +(-Math.abs(value) * 0.3).toFixed(2),
            label: 'rival alliance',
          });
        }
      });
    }

    // Player publicly backs Gryffindor (Briar/Callum) → Slytherin chars tick down slightly
    if (actorId === 'player' && (targetId === 'briar' || targetId === 'callum') && isPositive && isWarm) {
      ['silas', 'havoc'].forEach(id => {
        if (hasChar(id)) {
          cascade.push({
            actorId: id, targetId: 'player',
            value: +(-Math.abs(value) * 0.25).toFixed(2),
            label: 'rival alliance',
          });
        }
      });
    }
  });

  return cascade.filter(ch => Math.abs(ch.value) >= 0.1);
}

function scanFeedRelationshipInteractions(feed = [], chars = [], player = {}, trackedKeys = new Set()) {
  const roster = [...(chars || []), player].filter(Boolean);
  const rawChanges = [];
  const trackedNow = [];
  let changedFeed = false;

  const nextFeed = (feed || []).map(post => {
    let nextPost = post;
    const postId = post?.id || post?.timestamp || Math.random();
    const addInteraction = ({ key, actorId, text, replyTo = '', targets = [], mark }) => {
      if (trackedKeys.has(key)) {
        mark();
        return;
      }
      trackedNow.push(key);
      const tone = scoreFeedRelationshipText(text);
      mark();
      if (!tone) return;
      targets.forEach(targetId => {
        rawChanges.push({
          key,
          actorId: normalizeRelationshipId(actorId, player),
          targetId: normalizeRelationshipId(targetId, player),
          value: tone.value,
          label: tone.label,
          replyTo,
          sample: String(text || '').replace(/\s+/g, ' ').trim().slice(0, 110),
        });
      });
    };

    const mainKey = `feedrel:${FEED_RELATIONSHIP_TRACKER_VERSION}:${postId}:post`;
    const mainTargets = feedRelationshipTargets({ actorId: post?.charId, text: post?.text || '', post, roster, player, includePostOwner: false });
    if (!post?.feedRelationshipTrackedVersion && mainTargets.length) {
      addInteraction({
        key: mainKey,
        actorId: post.charId,
        text: post.text || '',
        targets: mainTargets,
        mark: () => {
          if (nextPost === post) nextPost = { ...post };
          nextPost.feedRelationshipTrackedVersion = FEED_RELATIONSHIP_TRACKER_VERSION;
          changedFeed = true;
        },
      });
    }

    if (post?.reply && !post.reply.relationshipTrackedVersion) {
      const replyTargets = feedRelationshipTargets({ actorId: post.reply.charId, text: post.reply.text || '', post, roster, player, includePostOwner: true });
      if (replyTargets.length) {
        addInteraction({
          key: `feedrel:${FEED_RELATIONSHIP_TRACKER_VERSION}:${postId}:reply`,
          actorId: post.reply.charId,
          text: post.reply.text || '',
          targets: replyTargets,
          mark: () => {
            if (nextPost === post) nextPost = { ...post };
            nextPost.reply = { ...post.reply, relationshipTrackedVersion: FEED_RELATIONSHIP_TRACKER_VERSION };
            changedFeed = true;
          },
        });
      }
    }

    if (Array.isArray(post?.charComments)) {
      let commentsChanged = false;
      const nextComments = post.charComments.map((cc, idx) => {
        if (cc?.relationshipTrackedVersion) return cc;
        const targets = feedRelationshipTargets({ actorId: cc?.charId, text: cc?.text || '', replyTo: cc?.replyTo || '', post, roster, player, includePostOwner: true });
        if (!targets.length) return cc;
        let nextComment = cc;
        addInteraction({
          key: `feedrel:${FEED_RELATIONSHIP_TRACKER_VERSION}:${postId}:char:${idx}:${cc?.timestamp || ''}`,
          actorId: cc.charId,
          text: cc.text || '',
          replyTo: cc.replyTo || '',
          targets,
          mark: () => {
            nextComment = { ...cc, relationshipTrackedVersion: FEED_RELATIONSHIP_TRACKER_VERSION };
            commentsChanged = true;
            changedFeed = true;
          },
        });
        return nextComment;
      });
      if (commentsChanged) {
        if (nextPost === post) nextPost = { ...post };
        nextPost.charComments = nextComments;
      }
    }

    return nextPost;
  });

  return { feed: nextFeed, changedFeed, changes: aggregateFeedRelationshipChanges(rawChanges), trackedKeys: trackedNow };
}

function relationshipBaseForKey(char = {}, relKey = '') {
  const rels = char.relationships || {};
  if (Object.prototype.hasOwnProperty.call(rels, relKey)) {
    const saved = Number(rels[relKey]);
    return Number.isFinite(saved) ? saved : 0;
  }
  return relKey === 'player' ? defaultPlayerRelationshipFor(char) : 50;
}

function applyFeedRelationshipChanges(list = [], changes = [], player = {}) {
  if (!changes.length) return list;
  return (list || []).map(char => {
    let relationships = char.relationships || {};
    let changed = false;
    changes.forEach(ch => {
      const actor = normalizeRelationshipId(ch.actorId, player);
      const target = normalizeRelationshipId(ch.targetId, player);
      let relKey = null;
      if (actor === char.id) relKey = target === 'player' ? 'player' : target;
      if (actor === 'player' && target === char.id) relKey = 'player';
      if (!relKey || relKey === char.id || relKey === '__gmz__') return;
      const current = relationshipBaseForKey(char, relKey);
      relationships = {
        ...relationships,
        [relKey]: +clamp(current + ch.value, -100, 100).toFixed(2),
      };
      changed = true;
    });
    return changed ? { ...char, relationships } : char;
  });
}

function feedRelationshipLogEntry(changes = [], chars = [], player = {}) {
  if (!changes.length) return null;
  const all = [...(chars || []), player].filter(Boolean);
  const byId = (id) => all.find(c => normalizeRelationshipId(c.id, player) === normalizeRelationshipId(id, player));
  const scoreChanges = changes.map(ch => {
    const actor = byId(ch.actorId);
    const target = byId(ch.targetId);
    const avatarId = ch.actorId === 'player' ? ch.targetId : ch.actorId;
    const actorHandle = actor?.handle ? `@${actor.handle}` : ch.actorId;
    const targetHandle = target?.handle ? `@${target.handle}` : ch.targetId;
    return {
      avatar: avatarId === 'player' ? ch.targetId : avatarId,
      label: `${actorHandle} -> ${targetHandle}`,
      value: ch.value,
      unit: '%',
      flavor: `${ch.label}${ch.samples?.[0] ? `: "${ch.samples[0]}"` : ''}`,
    };
  });
  const summary = changes.map(ch => {
    const actor = byId(ch.actorId);
    const target = byId(ch.targetId);
    return `${actor?.handle ? `@${actor.handle}` : ch.actorId} ${ch.value > 0 ? '+' : ''}${ch.value} with ${target?.handle ? `@${target.handle}` : ch.targetId}`;
  }).join('; ');
  return {
    id: `feed-rel-${Date.now()}`,
    type: 'feed_relationship',
    visibility: 'public',
    title: 'Feed relationship shift',
    text: 'Public feed interactions changed relationship scores.',
    outcome: summary,
    participants: [...new Set(changes.flatMap(ch => [ch.actorId, ch.targetId]).map(id => normalizeRelationshipId(id, player)))],
    relationshipApplied: true,
    scoreChanges,
    timestamp: Date.now(),
  };
}

function effectivePlayerRelationship(char, eventLog = [], dms = {}, groupChats = []) {
  const loggedAdds = loggedRelationshipAddsByChar(eventLog);
  const dmAdds = dmRelationshipAddsByChar(dms);
  const groupAdds = groupRelationshipAddsByChar(groupChats);
  const hasSaved = !!char?.relationships && Object.prototype.hasOwnProperty.call(char.relationships, 'player');
  const hasDefault = Object.prototype.hasOwnProperty.call(DEFAULT_PLAYER_RELATIONSHIPS, char?.id);
  const hasLogged = Object.prototype.hasOwnProperty.call(loggedAdds, char?.id);
  const hasDm = Object.prototype.hasOwnProperty.call(dmAdds, char?.id);
  const hasGroup = Object.prototype.hasOwnProperty.call(groupAdds, char?.id);
  const base = hasSaved ? Number(char?.relationships?.player || 0) : defaultPlayerRelationshipFor(char);
  return {
    hasRelationship: hasSaved || hasDefault || hasLogged || hasDm || hasGroup,
    value: +((base + Number(loggedAdds[char?.id] || 0) + Number(dmAdds[char?.id] || 0) + Number(groupAdds[char?.id] || 0)).toFixed(2)),
  };
}

function memoryVisibilityForEntry(entry) {
  if (entry?.visibility) return entry.visibility;
  if (entry?.type === 'scene' || entry?.sceneMemory) return 'private_scene';
  if (entry?.type === 'dm') return 'private_dm';
  return 'public';
}

function memoryParticipantIds(entry, player = null) {
  const ids = new Set();
  const add = (id) => { if (id) ids.add(id); };
  (entry?.participants || entry?.participantIds || entry?.chars || []).forEach(add);
  (entry?.scoreChanges || []).forEach(ch => add(ch?.avatar));
  if (entry?.charId) add(entry.charId);
  if (entry?.type === 'scene' || entry?.sceneMemory) add(player?.id || 'player');
  return ids;
}

function canUseMemoryEntry(entry, char = null, player = null, { channel = 'public', audienceIds = [] } = {}) {
  const visibility = memoryVisibilityForEntry(entry);
  if (visibility === 'public') return true;
  if (!char?.id) return false;

  const participants = memoryParticipantIds(entry, player);
  const speakerId = char.id === player?.id ? 'player' : char.id;
  if (!participants.has(speakerId) && !(char.id === player?.id && participants.has('player'))) return false;

  if (channel === 'private' || channel === 'dm' || channel === 'profile' || channel === 'scene') return true;
  if (channel === 'group') {
    const audience = (audienceIds || []).filter(Boolean);
    return audience.length > 0 && audience.every(id => participants.has(id === player?.id ? 'player' : id));
  }
  return false;
}

function memoryScopeLabel(entry) {
  const visibility = memoryVisibilityForEntry(entry);
  if (visibility === 'private_scene') return 'Private scene';
  if (visibility === 'private_dm') return 'Private DM';
  if (visibility === 'private_intel') return 'Private intel';
  return 'Public memory';
}

function canIncludePrivateConversation(channel = 'public') {
  return channel === 'private' || channel === 'dm' || channel === 'profile' || channel === 'scene';
}

function groupAudienceMatches(groupMembers = [], audienceIds = [], player = null) {
  const normalize = (id) => id === player?.id ? 'player' : id;
  const groupSet = new Set((groupMembers || []).filter(Boolean).map(normalize));
  const audienceSet = new Set((audienceIds || []).filter(Boolean).map(normalize));
  return audienceSet.size > 0 && groupSet.size === audienceSet.size && [...audienceSet].every(id => groupSet.has(id));
}

function recentMemoryContext({ feed = [], eventLog = [], groupChats = [], dms = {}, char = null, player = null, allChars = [], channel = 'public', audienceIds = [] } = {}) {
  const roster = [...(allChars || []), GMZ_CHAR].filter(Boolean);
  const byId = (id) => roster.find(c => c.id === id) || (id === 'player' ? player : null);
  const memory = [];
  const allowPrivateConversation = canIncludePrivateConversation(channel);

  const filteredLog = (eventLog || []).filter(entry => entry && canUseMemoryEntry(entry, char, player, { channel, audienceIds }));

  function formatLogEntry(entry) {
    const isScene = entry.type === 'scene' || !!entry.sceneMemory;
    const title = isScene ? `Completed scene${entry.title ? `: ${entry.title}` : ''}` : (entry.title || entry.type || (entry.scenario ? 'Event' : 'Memory'));
    const text = entry.sceneMemory || entry.outcome || entry.action || entry.text || entry.scenario || '';
    const changes = (entry.scoreChanges || [])
      .map(ch => { const c = byId(ch.avatar); return c?.handle ? `@${c.handle} ${ch.value > 0 ? '+' : ''}${ch.value}` : ''; })
      .filter(Boolean).join(', ');
    return `${memoryScopeLabel(entry)} - ${title}: ${String(text).replace(/\s+/g, ' ').slice(0, 260)}${changes ? ` (${changes})` : ''}`;
  }

  // 1. Scenes first — highest priority for relationship continuity
  filteredLog
    .filter(e => e.type === 'scene' || !!e.sceneMemory)
    .slice(0, 4)
    .forEach(entry => { const line = formatLogEntry(entry); if (line.trim()) memory.push(line); });

  // 2. DMs — private relationship history
  if (allowPrivateConversation && char?.id && dms?.[char.id]?.length) {
    const recentDm = dms[char.id].slice(-5).map(m => `${m.role === 'user' ? player?.name || 'Player' : char.name}: "${String(m.text || '').slice(0, 120)}"`).join(' / ');
    if (recentDm) memory.push(`Private DM history with @${player?.handle || 'player'}: ${recentDm}`);
  }

  // 2b. Group chats — after DMs
  (groupChats || [])
    .filter(group => {
      const members = group.members || [];
      if (channel === 'group') return groupAudienceMatches(members, audienceIds, player);
      return allowPrivateConversation && char?.id && members.includes(char.id) && members.includes('player');
    })
    .slice(0, 2)
    .forEach(group => {
      const recent = (group.messages || []).slice(-5).map(m => {
        const speaker = m.role === 'user' ? player : byId(m.charId);
        return `@${speaker?.handle || speaker?.id || 'someone'}: "${String(m.text || '').slice(0, 100)}"`;
      }).join(' / ');
      if (recent) memory.push(`Recent group chat "${group.name}": ${recent}`);
    });

  // 3. Public feed / timeline behavior
  const recentPosts = collectRecentFeedDialogue(feed, { limit: 5 })
    .slice(0, 12)
    .map(entry => {
      const speaker = entry.kind === 'bot-comment'
        ? (entry.botId ? { handle: entry.botId } : null)
        : byId(entry.charId);
      const target = entry.kind.includes('comment') || entry.kind === 'reply' ? ' replied' : '';
      return speaker?.handle && entry.text ? `@${speaker.handle}${target}: "${String(entry.text).slice(0, 120)}"` : '';
    })
    .filter(Boolean);
  if (recentPosts.length) memory.push(`Recent visible feed: ${recentPosts.join(' / ')}`);

  // 4. Other events (non-scene log entries) — lowest priority
  filteredLog
    .filter(e => e.type !== 'scene' && !e.sceneMemory)
    .slice(0, 4)
    .forEach(entry => { const line = formatLogEntry(entry); if (line.trim()) memory.push(line); });

  const privacyRule = channel === 'public'
    ? 'Private DMs, private scenes, and group chats are intentionally omitted here. Do not imply knowledge of private context unless it appears in public feed memory.'
    : channel === 'group'
    ? 'Only use private scene memory if every person in this group could know it. Do not mention side DMs or other group chats here.'
    : 'Do not reveal private memories outside the current private relationship/context.';

  return memory.length
    ? `RECENT APP MEMORY (priority: scenes > DMs > public feed > events):
${memory.slice(0, 12).map((line, i) => `${i + 1}. ${line}`).join('\n')}
Use this as continuity only when it is visible to the current speaker and appropriate for this ${channel} context. ${privacyRule} Completed scenes shown here are already past-tense facts, not hypotheticals. Scenes and DMs outweigh public feed and events — if a scene or DM established something, do not contradict it with a vague public post. Do not reset relationships, forget scenes/events, invent details beyond it, or leak private memories into public/unrelated dialogue.`
    : 'RECENT APP MEMORY: no saved events yet. Do not pretend there is established history.';
}

function recentCompactMemoryContext({ feed = [], eventLog = [], groupChats = [], dms = {}, char = null, player = null, allChars = [], channel = 'public', audienceIds = [], limit = 5 } = {}) {
  const roster = [...(allChars || []), GMZ_CHAR].filter(Boolean);
  const byId = (id) => roster.find(c => c.id === id) || (id === 'player' ? player : null);
  const lines = [];
  const filteredLog = (eventLog || []).filter(entry => entry && canUseMemoryEntry(entry, char, player, { channel, audienceIds }));

  filteredLog
    .filter(e => e.type === 'scene' || !!e.sceneMemory)
    .slice(0, 2)
    .forEach(entry => {
      const text = entry.sceneMemory || entry.outcome || entry.text || entry.scenario || '';
      if (text) lines.push(`Scene: ${String(text).replace(/\s+/g, ' ').slice(0, 180)}`);
    });

  if ((channel === 'dm' || channel === 'private' || channel === 'scene') && char?.id && dms?.[char.id]?.length) {
    const recentDm = dms[char.id].slice(-3).map(m => `${m.role === 'user' ? player?.name || 'Player' : char.name}: "${String(m.text || '').slice(0, 90)}"`).join(' / ');
    if (recentDm) lines.push(`DM: ${recentDm}`);
  }

  if (channel === 'group') {
    (groupChats || [])
      .filter(group => groupAudienceMatches(group.members || [], audienceIds, player))
      .slice(0, 1)
      .forEach(group => {
        const recent = (group.messages || []).slice(-4).map(m => {
          const speaker = m.role === 'user' ? player : byId(m.charId);
          return `@${speaker?.handle || 'someone'}: "${String(m.text || '').slice(0, 80)}"`;
        }).join(' / ');
        if (recent) lines.push(`Group "${group.name}": ${recent}`);
      });
  }

  const handles = [char?.handle, player?.handle].filter(Boolean).map(h => String(h).toLowerCase());
  const publicPosts = collectRecentFeedDialogue(feed, { limit: 6 })
    .filter(entry => {
      const text = String(entry.text || '').toLowerCase();
      return handles.length > 0 && handles.some(handle => text.includes(`@${handle}`));
    })
    .slice(0, channel === 'public' ? 3 : 2)
    .map(entry => {
      const speaker = entry.kind === 'bot-comment'
        ? { handle: entry.botId || 'student' }
        : byId(entry.charId);
      return speaker?.handle && entry.text ? `@${speaker.handle}: "${String(entry.text).slice(0, 100)}"` : '';
    })
    .filter(Boolean);
  if (publicPosts.length) lines.push(`Visible feed: ${publicPosts.join(' / ')}`);

  filteredLog
    .filter(e => e.type !== 'scene' && !e.sceneMemory)
    .slice(0, 2)
    .forEach(entry => {
      const text = entry.outcome || entry.text || entry.scenario || '';
      if (text) lines.push(`Event: ${String(text).replace(/\s+/g, ' ').slice(0, 160)}`);
    });

  return lines.length
    ? `COMPACT MEMORY:\n${lines.slice(0, limit).map((line, i) => `${i + 1}. ${line}`).join('\n')}`
    : 'COMPACT MEMORY: none relevant.';
}

function relationshipLogicFor(char) {

- If Keres asks whether Tamsin has grilled him about GMZ, a makeout, Havoc, messed-up hair, photos, or salacious gossip, Rowan should NOT ask "should I be worried?" like he cannot infer it. He should assume yes, joke about how doomed he is, ask what exactly GMZ posted, or say Tamsin is probably already drafting questions.

function dmNeedsReply(userText = '', char = null, eventLog = [], player = null) {
  const text = String(userText || '').toLowerCase();
  const substantive = text.length > 80;
  const directQuestion = /\?|\b(?:why|what|how|has|did|do|are|is|should|can|will)\b/i.test(userText);
  const postScene = /\b(?:scene|debrief|made out|kissed|kiss|astrology tower|tower|hair|gmz|saw|posted|post|caught|havoc|tamsin|on read|left me on read|read huh)\b/i.test(userText);
  const seriousPrivateMoment = looksLikeSeriousKeresGroupDrop(userText) || /\b(?:hurt|scared|afraid|upset|angry|not okay|big deal|bombshell|serious|please don'?t|don'?t be mean|you were mean|that was mean)\b/i.test(text);
  const recentSceneWithChar = (eventLog || []).slice(0, 5).some(entry =>
    (entry?.type === 'scene' || entry?.sceneMemory) &&
    canUseMemoryEntry(entry, char, player, { channel:'dm' })
  );
  if (['havoc','rowan'].includes(char?.id) && seriousPrivateMoment) return true;
  return substantive || directQuestion || postScene || seriousPrivateMoment || recentSceneWithChar;
}

function parseJsonArrayFromText(text = '') {
  const withoutFence = String(text || '')
    .trim()
    .replace(/^```(?:json)?\s*/i, '')
    .replace(/\s*```$/i, '')
    .trim();
  const start = withoutFence.indexOf('[');
  const end = withoutFence.lastIndexOf(']');
  if (start === -1 || end === -1 || end <= start) return [];
  const parsed = JSON.parse(withoutFence.slice(start, end + 1));
  return Array.isArray(parsed) ? parsed : [];
}

}

  if (mentioned.length) return mentioned.slice(0, 3);
  const activePlayers = chars
    .filter(c => isQuidditchPlayer(c) || /captain|beater|chaser|keeper|seeker|gmz|gossip|mess|chaos|rival/i.test(`${c.position || ''} ${c.bio || ''} ${c.personality || ''}`))
    .slice(0, 3)
    .map(c => c.id);
  return (activePlayers.length ? activePlayers : chars.slice(0, 3).map(c => c.id)).slice(0, 3);
}

function normalizeCampusEvent(raw = {}, index = 0, chars = []) {
  const validTypes = Object.keys(EVENT_TYPES);
  const type = validTypes.includes(String(raw.type || '').toLowerCase())
    ? String(raw.type || '').toLowerCase()
    : 'gossip';
  const scenario = cleanGeneratedText(raw.scenario || raw.text || raw.title || '')
    .replace(/^scenario:\s*/i, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 420);
  if (!scenario || scenario.length < 24) return null;
  if (looksLikeVagueDeletedPostDrama(scenario, { contextText: 'generated campus event' })) return null;

  const listed = Array.isArray(raw.chars) ? raw.chars : Array.isArray(raw.characters) ? raw.characters : [];
  const listedIds = listed.map(id => normalizeEventCharId(id, chars)).filter(Boolean);
  const inferredIds = mentionedCharactersInText(scenario, chars).map(c => c.id);
  const charIds = [...new Set([...listedIds, ...inferredIds])].slice(0, 3);
  const xpRaw = Array.isArray(raw.xp) ? raw.xp : EVENT_XP_DEFAULTS[type];
  const minXp = Math.max(40, Number(xpRaw?.[0]) || EVENT_XP_DEFAULTS[type][0]);
  const maxXp = Math.max(minXp + 30, Number(xpRaw?.[1]) || EVENT_XP_DEFAULTS[type][1]);

  return {
    id: `pulse-${Date.now()}-${index}-${Math.floor(Math.random() * 10000)}`,
    type,
    scenario,
    chars: charIds.length ? charIds : fallbackEventCharIds(chars, scenario),
    xp: [minXp, maxXp],
    generated: true,
  };
}

// Deterministic per-post character like selection — no AI, pure relationship math.
// Uses a stable hash of post.id + char.id so likes don't flip on re-render.
function pickCharLikes(post, chars, player) {
  const authorId = post.charId;
  const seed = [...(post.id || '')].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const eligible = chars.filter(c => c.id !== authorId && c.id !== player?.id && c.id !== '__gmz__');
  if (!eligible.length) return [];
  const scored = eligible.map(c => {
    const rel = c.relationships?.[authorId] ?? 50;
    const charSeed = [...c.id].reduce((a, x) => (a * 17 + x.charCodeAt(0)) >>> 0, 3);
    const noise = ((seed ^ charSeed) % 1000) / 1000;
    const extro = /chaotic|social|flirty|gossip|nosy|shameless|funny|commentator/i.test(c.personality || '') ? 0.12 : 0;
    return { id: c.id, score: (rel / 100) * 0.55 + noise * 0.45 + extro };
  });
  scored.sort((a, b) => b.score - a.score);
  const count = 1 + (seed % 3);
  return scored.slice(0, count).filter(x => x.score > 0.3).map(x => x.id);
}

function hasPlayerAuthoredThreadReply(post = {}, player = {}) {
  return (post.charComments || []).some(cc => cc?.charId === player?.id)
    || (post.botComments || []).some(bc => bc?.isPlayer);

function PostThreadView({ post, chars, player, onBack, onCharClick, feed, onPostUpdate, dms = {}, groupChats = [], eventLog = [] }) {
  const allChars = [...chars, player, GMZ_CHAR];
  const char = allChars.find(c => c.id === post.charId);

  const playerRelFor = (c) => effectivePlayerRelationship(c, eventLog, dms, groupChats).value;
  const threadMemory = recentCompactMemoryContext({ feed, eventLog, groupChats, dms, player, allChars, channel:'public', limit: 4 });
  const compactOriginalPost = compactPostForPrompt(post, allChars, player);
  const threadPhraseGuard = phraseRepetitionGuard(feed, post?.text || '', { dms, groupChats });
  const isGMZThread = post?.charId === '__gmz__' || post?.isGMZ || /@?gmz|breaking:|sources confirm:|exclusive:|witnesses say:/i.test(post?.text || '');
  const isKeresThread = post?.charId === 'player' || post?.charId === player?.id || characterMentionedInText(post?.text || '', player);
  const gmzSpeculationRule = isGMZThread
    ? `GMZ THREAD SPECULATION:
- This is a gossip thread. Characters and anonymous accounts SHOULD speculate, ask messy questions, make theories, side-eye timing, compare alibis, and float "wait, does this mean..." reads.
- Speculation is allowed to be wrong, petty, funny, jealous, thirsty, or biased as long as it is framed as rumor, theory, suspicion, "allegedly", "if true", "sources", "witness math", or a question.
- Do not complain that GMZ failed to post enough details, do not ask GMZ to drop receipts, and do not scold the account for being vague. Speculate from what is visible, make an alibi theory, take a side, or spin your own public take instead.
- Do not flatten GMZ threads into cautious fact-checking. Keep hard canon separate from timeline gossip, but let people behave like a campus comment section.`
    : '';
  const [liked, setLiked] = useState(false);
  const [replyText, setReplyText] = useState('');
  const [replyOpen, setReplyOpen] = useState(false);
  const [replyTarget, setReplyTarget] = useState(null);
  const replyInputRef = useRef(null);
  const shouldRefreshGeneratedThread = !!post.threadGenerated
    && post.threadStyleVersion !== THREAD_STYLE_VERSION
    && !hasPlayerAuthoredThreadReply(post, player);
  const [botComments, setBotComments] = useState(shouldRefreshGeneratedThread ? [] : (post.botComments || []));
  const [charComments, setCharComments] = useState(shouldRefreshGeneratedThread ? [] : (post.charComments || []));
  const [likedBots, setLikedBots] = useState({});
  const [likedCharComments, setLikedCharComments] = useState({});
  const [replyingToBot, setReplyingToBot] = useState(null); // bot comment index
  const [replyingToChar, setReplyingToChar] = useState(null); // char comment index
  const [botReplyText, setBotReplyText] = useState('');
  const [botReplyLoading, setBotReplyLoading] = useState(false);
  const [charReplyText, setCharReplyText] = useState('');
  const [charReplyLoading, setCharReplyLoading] = useState(false);
  const [loadingBots, setLoadingBots] = useState(false);
  const [loadingChars, setLoadingChars] = useState(false);

  useEffect(() => {
    if (!onPostUpdate) return;
    const visibleCommentCount = botComments.length + charComments.length + (post.reply ? 1 : 0);
    onPostUpdate(post.id, {
      botComments,
      charComments,
      comments: Math.max(post.comments || 0, visibleCommentCount),
      threadGenerated: botComments.length > 0 || charComments.length > 0 || post.threadGenerated,
      threadStyleVersion: botComments.length > 0 || charComments.length > 0 ? THREAD_STYLE_VERSION : post.threadStyleVersion,
      threadUpdatedAt: Date.now(),
    });
  }, [botComments, charComments]);

  // Generate the full thread (chars + bots, multi-round, tension-aware)
  useEffect(() => {
    if ((botComments.length > 0 || charComments.length > 0) || !post.text) return;
    if (loadingBots || loadingChars) return;
    let cancelled = false;
    setLoadingBots(true);

    const isPlayerPost = post.charId === 'player';

    // ─── ROUND 1: characters react ────────────────────────────────
    // Eligible: anyone but the author. Weight by emotional charge — strong relationship (+ or -)

    const existingReplyCharId = post.reply?.charId || null;

    const miloFlirtingWithHavoc = miloFlirtingWithHavocSignal(postText, authorId, null, [player, ...chars, GMZ_CHAR]);

    const thirdPartyKeresFlirt = keresThirdPartyFlirtSignal(`${postText} ${isKeresPost ? `@${player.handle}` : ''}`, player, author, [player, ...chars, GMZ_CHAR])
      || (!!replyChar && !!post.reply?.text && keresThirdPartyFlirtSignal(`${post.reply.text || ''} ${(isKeresPost || keresRumorText) ? `@${player.handle}` : ''}`, player, replyChar, [player, ...chars, GMZ_CHAR]));

      (isKeresPost && havoc && (mentionedHandles.has((havoc.handle || '').toLowerCase()) || characterMentionedInText(postText, havoc)) && /flirt|kiss|snog|hot|pretty|photo|distract|attention|bad idea|gmz|rumou?r/i.test(postText))

                    <div style={{flex:1, background:C.card2, borderRadius:12, border:`1px solid ${botReplyText.trim() ? C.blue+'66' : C.border}`, padding:'8px 12px', transition:'border-color 0.2s'}}>
                      <input
                        value={botReplyText}
                        onChange={e => setBotReplyText(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleBotReply()}
                        placeholder="Write a reply…"
                        style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:13, outline:'none'}}
                        autoFocus
                      />
                    </div>
                    <button
                      onClick={handleBotReply}
                      disabled={!botReplyText.trim() || botReplyLoading}
                      style={{background: botReplyText.trim() ? C.blue : C.card2, color: botReplyText.trim() ? '#fff' : C.muted, border:'none', borderRadius:22, padding:'8px 16px', fontSize:14, fontWeight:700, cursor: botReplyText.trim() ? 'pointer' : 'default', whiteSpace:'nowrap'}}>
                      {botReplyLoading ? '…' : 'Send'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}
      {(loadingChars || loadingBots) && mergedReplies.length > 0 && (
        <p style={{color:C.muted, fontSize:12, padding:'10px 16px', textAlign:'center', fontStyle:'italic'}}>more replies coming in...</p>
      )}
      <div style={{height: replyOpen ? 170 : 130}}/>
    </div>

    {/* Reply input bar */}
    {replyOpen && (
      <div style={{
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.28)',
        flexShrink:0,
        zIndex:8,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${replyText.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={replyInputRef}
            value={replyText}
            onChange={e => setReplyText(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Escape') { setReplyOpen(false); setReplyText(''); setReplyTarget(null); }
              if (e.key === 'Enter' && !e.shiftKey && replyText.trim()) {
                e.preventDefault();
                submitPostReply();
              }
            }}
            placeholder="Write a reply…"
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={replyText}
            allChars={allChars}
            onPick={handle => {
              setReplyText(t => applyMentionToText(t, handle));
              setTimeout(() => replyInputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button
          onClick={submitPostReply}
          disabled={!replyText.trim()}
          style={{background: replyText.trim() ? C.blue : C.card2, color:'#fff', border:'none', borderRadius:'50%', width:48, height:48, minWidth:48, cursor: replyText.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0}}>
          →
        </button>
      </div>
    )}
    </div>
  );
}

// ─── Live Match Modal ─────────────────────────────────────────────
function LiveMatchModal({ match, chars, player, onClose, onPostToFeed, onMatchEnd }) {
  const [phase, setPhase] = useState('kickoff'); // kickoff | live | postgame
  const [events, setEvents] = useState([]);
  const [visibleIdx, setVisibleIdx] = useState(-1);
  const [score, setScore] = useState({ home:0, away:0 });
  const [loading, setLoading] = useState(false);
  const slyColor = '#2a8a4a';
  const gryfColor = '#c41e3a';
  const homeColor = match.home === 'Slytherin' ? slyColor : gryfColor;
  const awayColor = match.away === 'Slytherin' ? slyColor : gryfColor;

  function startMatch() {
    const evts = generateMatchEvents(match, chars, player);
    setEvents(evts);
    setPhase('live');
    setVisibleIdx(0);
    // Post kickoff to feed
    onPostToFeed(`KICKOFF: ${match.home} vs ${match.away} — ${match.location}. It's on.`, '__gmz__');
  }

  function nextEvent() {
    const ev = events[visibleIdx];
    if (!ev) return;
    // Update score
    if (ev.type === 'goal') {
      const isHome = ev.team !== 'away';
      setScore(s => isHome ? {...s, home: s.home+10} : {...s, away: s.away+10});
    }
    if (ev.type === 'snitch') {
      // Snitch caught — random team catches, +150
      const slyWins = Math.random() > 0.45;
      setScore(s => slyWins
        ? (match.home==='Slytherin' ? {...s, home:s.home+150} : {...s, away:s.away+150})
        : (match.home==='Gryffindor' ? {...s, home:s.home+150} : {...s, away:s.away+150})
      );
      // Post to feed
      onPostToFeed(ev.text, '__gmz__');
      setTimeout(() => setPhase('postgame'), 600);
      return;
    }
    // Post event to feed
    onPostToFeed(ev.text, '__gmz__');
    if (visibleIdx < events.length - 1) setVisibleIdx(i => i+1);
  }

  const currentEv = events[visibleIdx];
  const homeWon = score.home > score.away;

  return (
    <div style={{position:'absolute', inset:0, zIndex:200, background:C.bg, display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer'}}>×</button>
        <span style={{color:C.text, fontWeight:700, fontSize:16, flex:1}}>🏆 {match.home} vs {match.away}</span>
        {phase === 'live' && (
          <div style={{display:'flex', gap:12, alignItems:'center'}}>
            <span style={{color:homeColor, fontWeight:800, fontSize:18}}>{score.home}</span>
            <span style={{color:C.muted, fontSize:14}}>–</span>
            <span style={{color:awayColor, fontWeight:800, fontSize:18}}>{score.away}</span>
          </div>
        )}
      </div>

      <div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px 20px'}}>

        {phase === 'kickoff' && (
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:60, marginBottom:20}}>🏟️</div>
            <div style={{display:'flex', alignItems:'center', gap:16, marginBottom:24, justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:homeColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, margin:'0 auto 6px'}}>🐍</div>
                <p style={{color:homeColor, fontWeight:800, fontSize:15}}>{match.home}</p>
              </div>
              <span style={{color:C.muted, fontSize:24, fontWeight:700}}>vs</span>
              <div style={{textAlign:'center'}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:awayColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, margin:'0 auto 6px'}}>🦁</div>
                <p style={{color:awayColor, fontWeight:800, fontSize:15}}>{match.away}</p>
              </div>
            </div>
            <p style={{color:C.muted, fontSize:13, marginBottom:24}}>{match.location}</p>
            <button onClick={startMatch} style={{background:C.blue, color:'#fff', border:'none', borderRadius:20, padding:'14px 40px', fontSize:16, fontWeight:700, cursor:'pointer'}}>
              Kick off →
            </button>
          </div>
        )}

        {phase === 'live' && currentEv && (
          <div style={{width:'100%', maxWidth:360}}>
            {/* Current event card */}
            <div style={{background:C.card2, borderRadius:20, padding:'24px 20px', marginBottom:20, textAlign:'center', minHeight:160, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12}}>
              <span style={{fontSize:44}}>{currentEv.icon}</span>
              <p style={{color:C.text, fontSize:15, lineHeight:1.65, fontWeight:500}}>{currentEv.text}</p>
            </div>

            {/* Score */}
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', background:C.card2, borderRadius:14, padding:'12px 20px', marginBottom:20}}>
              <span style={{color:homeColor, fontWeight:800, fontSize:22}}>{score.home}</span>
              <span style={{color:C.muted, fontSize:12, fontWeight:600}}>{match.home.toUpperCase()} · {match.away.toUpperCase()}</span>
              <span style={{color:awayColor, fontWeight:800, fontSize:22}}>{score.away}</span>
            </div>

            {/* Event counter */}
            <div style={{display:'flex', gap:4, justifyContent:'center', marginBottom:20}}>
              {events.map((e,i) => (
                <div key={i} style={{width: i===visibleIdx ? 20 : 6, height:6, borderRadius:3, background: i<=visibleIdx ? C.blue : C.border, transition:'all 0.3s'}}/>
              ))}
            </div>

            <button onClick={nextEvent} style={{width:'100%', background:C.text, color:C.bg, border:'none', borderRadius:14, padding:'14px', fontSize:15, fontWeight:700, cursor:'pointer'}}>
              {currentEv.type === 'snitch' ? '🌟 Catch the Snitch' : 'Next →'}
            </button>
          </div>
        )}

        {phase === 'postgame' && (
          <div style={{textAlign:'center', width:'100%', maxWidth:360}}>
            <div style={{fontSize:52, marginBottom:12}}>{homeWon === (match.home==='Slytherin') ? '🐍' : '🦁'}</div>
            <h2 style={{color:C.text, fontSize:22, fontWeight:800, marginBottom:4}}>
              {score.home === score.away ? 'Draw' : `${score.home > score.away ? match.home : match.away} wins`}
            </h2>
            <div style={{display:'flex', justifyContent:'center', gap:20, marginBottom:24}}>
              <div style={{textAlign:'center'}}>
                <p style={{color:homeColor, fontWeight:800, fontSize:32}}>{score.home}</p>
                <p style={{color:C.muted, fontSize:12}}>{match.home}</p>
              </div>
              <div style={{textAlign:'center'}}>
                <p style={{color:awayColor, fontWeight:800, fontSize:32}}>{score.away}</p>
                <p style={{color:C.muted, fontSize:12}}>{match.away}</p>
              </div>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <button onClick={() => { onMatchEnd(score); onClose(); }} style={{background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>
                Back to feed →
              </button>
              <button onClick={() => { onMatchEnd(score); onClose(); /* TODO: locker room */ }} style={{background:C.card2, color:C.text, border:`1px solid ${C.border}`, borderRadius:14, padding:'13px', fontSize:14, fontWeight:600, cursor:'pointer'}}>
                🚿 Locker room scene
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
