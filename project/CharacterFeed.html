<script>
  function estimateTokensFromText(text) {
    return Math.ceil(String(text || '').length / 4);
  }

  function flattenAiMessageContent(value) {
    try {
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) {
        return value.map(item => {
          if (typeof item === 'string') return item;
          if (item && typeof item === 'object') {
            return item.text || item.output_text || JSON.stringify(item);
          }
          return String(item || '');
        }).join('\n');
      }
      if (value && typeof value === 'object') return JSON.stringify(value);
      return String(value || '');
    } catch (e) {
      return '';
    }
  }

  function summarizeAiRequest(label, messages, model) {
    try {
      const combined = (messages || []).map(m => {
        return `${m.role || 'unknown'}:\n${flattenAiMessageContent(m.content)}`;
      }).join('\n\n');

      const chars = combined.length;
      const estTokens = estimateTokensFromText(combined);

      console.log('[AI request]', {
        label,
        model: model || 'default',
        charactersSent: chars,
        estimatedInputTokens: estTokens,
      });

      if (estTokens > 15000) {
        console.warn(`[AI request BIG SPEND WARNING] ${label}: ~${estTokens} input tokens`);
      } else if (estTokens > 8000) {
        console.warn(`[AI request warning] ${label}: ~${estTokens} input tokens`);
      }
    } catch (e) {
      console.warn('[AI request] failed to summarize request', e);
    }
  }

  function warnPromptBudget(label, messages, targetTokens) {
    try {
      const combined = (messages || []).map(m => `${m.role || 'unknown'}:\n${flattenAiMessageContent(m.content)}`).join('\n\n');
      const estimated = estimateTokensFromText(combined);
      if (targetTokens && estimated > targetTokens) {
        console.warn(`[PROMPT BUDGET WARNING] ${label}: estimated ${estimated} input tokens, target ${targetTokens}`);
      }
      return estimated;
    } catch (e) {
      return 0;
    }
  }

  const PROMPT_BUDGET_TARGETS = {
    'bot comment': 2500,
    'feed post': 3500,
    'feed post reply': 4000,
    'character reply': 4000,
    'char-vs-char reply': 5000,
    'thread interruption answer': 5000,
    'DM reply': 5000,
    'group chat reply': 5000,
    'scene opening': 8000,
    'scene reply': 8000,
    'meanwhile cutaway scene': 8000,
    'repair/regeneration': 7000,
    'fallback rewrite': 4000,
    'profile feeling': 3000,
    'profile analysis': 4000,
    'event outcome': 7000,
  };

  // Wire up window.claude to the local server proxy
  window.claude = {
    complete: async function({ messages, model, label, maxOutputTokens }) {
      const requestLabel = label || 'unlabeled AI request';
      warnPromptBudget(requestLabel, messages, PROMPT_BUDGET_TARGETS[requestLabel] || 7000);
      summarizeAiRequest(requestLabel, messages, model);
      // /api/claude is a compatibility endpoint. The server now routes it to OpenAI.
      const res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, model, maxOutputTokens }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'AI API call failed');
      }
      const data = await res.json();
      return data.text;
    }
  };
</script>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": true,
  "accentColor": "#4dabf7",
  "fontSize": 14,
  "compactFeed": false
}/*EDITMODE-END*/;

const SESSION_FALLBACK_TRACKER = {};

function trackFallback(charId, text) {
  if (!charId || !text) return;
  if (!SESSION_FALLBACK_TRACKER[charId]) SESSION_FALLBACK_TRACKER[charId] = new Set();
  SESSION_FALLBACK_TRACKER[charId].add(String(text).trim().toLowerCase().slice(0, 60));
}

function fallbackWasUsed(charId, text) {
  if (!charId || !text) return false;
  return (SESSION_FALLBACK_TRACKER[charId] || new Set())
    .has(String(text).trim().toLowerCase().slice(0, 60));
}

function bottomSafe(extra = 0) {
  return `calc(env(safe-area-inset-bottom, 0px) + ${extra}px)`;
}

function scrollToLatest(containerRef, endRef = null) {
  const run = () => {
    if (containerRef?.current) {
      containerRef.current.scrollTop = containerRef.current.scrollHeight;
    }
    if (endRef?.current) {
      endRef.current.scrollIntoView({ behavior: 'auto', block: 'end' });
    }
  };
  run();
  requestAnimationFrame(run);
  setTimeout(run, 80);
  setTimeout(run, 260);
}

// ─── Theme builder ────────────────────────────────────────────────
function buildTheme(tweaks) {
  const dark = tweaks.darkMode;
  return {
    bg:    dark ? '#111'     : '#f5f5f0',
    card:  dark ? '#1c1c1c'  : '#ffffff',
    card2: dark ? '#252525'  : '#eeede8',
    border:dark ? '#2a2a2a'  : '#ddddd8',
    text:  dark ? '#f0f0f0'  : '#111111',
    muted: dark ? '#777'     : '#888',
    blue:  tweaks.accentColor,
    purple:'#9d5cff',
    green: '#22c55e',
    orange:'#f97316',
    yellow:'#f5c842',
    red:   '#ef4444',
    isDark: dark,
  };
}

// C is set globally and updated when tweaks change
let C = buildTheme(TWEAK_DEFAULTS);

function tweakFont(base, tweaks = {}) {
  const selected = clamp(Number(tweaks.fontSize ?? 14), 12, 18);
  return Math.max(10, base + selected - 14);
}

// ─── House ring colors ────────────────────────────────────────────
const HOUSE_COLORS = {
  gryffindor: '#c41e3a',
  slytherin:  '#2a8a4a',
  ravenclaw:  '#4169c8',
  hufflepuff: '#f0c75e',
};
function getHouseColor(char) {
  if (!char) return null;
  if (char.house && HOUSE_COLORS[char.house]) return HOUSE_COLORS[char.house];
  // Legacy fallback: scan bio/description
  const text = ((char.bio || '') + ' ' + (char.description || '')).toLowerCase();
  if (text.includes('slytherin'))  return HOUSE_COLORS.slytherin;
  if (text.includes('gryffindor')) return HOUSE_COLORS.gryffindor;
  if (text.includes('ravenclaw'))  return HOUSE_COLORS.ravenclaw;
  if (text.includes('hufflepuff')) return HOUSE_COLORS.hufflepuff;
  return null;
}

// ─── Avatar component ─────────────────────────────────────────────
const AVATAR_COLORS = [
  ['#1a1a2e','#4dabf7'], ['#1a2e1a','#22c55e'], ['#2e1a1a','#ef4444'],
  ['#2a1a2e','#9d5cff'], ['#2e2a1a','#f5c842'], ['#1a2e2a','#22c55e'],
  ['#2e1a2a','#f97316'], ['#1a1a1a','#fff'],
];
function getAvatarColors(id) {
  const i = (id || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % AVATAR_COLORS.length;
  return AVATAR_COLORS[i];
}
function Avatar({ char, size = 42, onClick }) {
  const [bg, fg] = getAvatarColors(char?.id);
  const initials = (char?.name || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const houseColor = getHouseColor(char);
  const ringWidth = Math.max(1, size * 0.022);
  const ringGap = Math.max(0.5, size * 0.015);
  const profilePhoto = char?.profilePhoto || char?.avatar || char?.photo;
  return (
    <div onClick={onClick} style={{
      width: size, height: size, borderRadius: '50%', flexShrink: 0, cursor: onClick ? 'pointer' : 'default',
      padding: houseColor ? ringWidth + ringGap : 0,
      background: houseColor || 'transparent',
      boxSizing: 'border-box',
    }}>
      <div style={{
        width: '100%', height: '100%', borderRadius: '50%', background: bg, overflow:'hidden',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: (size - (houseColor ? (ringWidth + ringGap) * 2 : 0)) * 0.36,
        fontWeight: 700, color: fg,
      }}>
        {profilePhoto
          ? <img src={profilePhoto} alt="" style={{width:'100%', height:'100%', objectFit:'cover', display:'block'}} />
          : initials}
      </div>
    </div>
  );
}

// ─── Verified / Quidditch badge ──────────────────────────────────
function isQuidditchPlayer(char) {
  if (!char) return false;
  if (['tamsin', 'theo', 'elara', '__gmz__'].includes(char.id)) return false;
  const role = (char.position || char.bio || '').toLowerCase();
  if (/former|commentator|student|sister|alumna/.test(role)) return false;
  if (/(beater|chaser|keeper|seeker|captain|reserve)/.test(role)) return true;
  const text = ((char.bio||'') + ' ' + (char.description||'')).toLowerCase();
  return /(chaser trialist|trying out as a chaser|quidditch captain)/.test(text);
}
function CharBadge({ char }) {
  if (!char) return null;
  if (isQuidditchPlayer(char)) return <span style={{fontSize:13, lineHeight:1}}>🧹</span>;
  if ((char.followers||0) >= 1000000) return <svg width="14" height="14" viewBox="0 0 24 24" fill={C.blue} style={{flexShrink:0}}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>;
  return null;
}

function Verified() {
  return <svg width="14" height="14" viewBox="0 0 24 24" fill={C.blue} style={{flexShrink:0}}><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>;
}

// ─── Number formatter ─────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

function playerReplyLikes(nested = true) {
  const min = nested ? 900 : 1800;
  const max = nested ? 14000 : 32000;
  const viralBump = Math.random() < 0.12 ? 18000 + Math.random() * 42000 : 0;
  return Math.floor(min + Math.random() * (max - min) + viralBump);
}

function findCharByHandle(handle, allChars = []) {
  const clean = (handle || '').replace('@','').toLowerCase();
  return allChars.find(c => (c.handle || '').toLowerCase() === clean);
}

function renderLinkedText(text = '', allChars = [], onCharClick) {
  return text.split(/(@\w+)/g).map((part, i) => {
    if (!part.startsWith('@')) return part;
    const mentioned = findCharByHandle(part, allChars);
    return (
      <span
        key={i}
        onClick={e => {
          if (!mentioned || !onCharClick) return;
          e.stopPropagation();
          onCharClick(mentioned);
        }}
        style={{color:C.blue, cursor: mentioned && onCharClick ? 'pointer' : 'default', fontWeight:500}}
      >
        {part}
      </span>
    );
  });
}

function getMentionQuery(text = '') {
  const match = String(text).match(/(^|\s)@([a-z0-9_]*)$/i);
  return match ? match[2].toLowerCase() : null;
}

function applyMentionToText(text = '', handle = '') {
  const cleanHandle = String(handle).replace(/^@/, '');
  return String(text).replace(/(^|\s)@([a-z0-9_]*)$/i, `$1@${cleanHandle} `);
}

function MentionSuggestions({ text, allChars = [], onPick }) {
  const query = getMentionQuery(text);
  if (query === null) return null;
  const matches = allChars
    .filter(c => c?.handle && c.handle.toLowerCase().startsWith(query))
    .slice(0, 5);
  if (!matches.length) return null;

  return (
    <div style={{
      marginTop:8,
      background:C.card,
      border:`1px solid ${C.border}`,
      borderRadius:14,
      overflow:'hidden',
      boxShadow:'0 12px 30px rgba(0,0,0,0.32)',
    }}>
      {matches.map(c => (
        <button
          key={c.id}
          type="button"
          onMouseDown={e => e.preventDefault()}
          onClick={() => onPick(c.handle)}
          style={{
            width:'100%',
            display:'flex',
            alignItems:'center',
            gap:9,
            background:'none',
            border:'none',
            borderBottom:`1px solid ${C.border}`,
            padding:'9px 10px',
            color:C.text,
            textAlign:'left',
            cursor:'pointer',
          }}
        >
          <Avatar char={c} size={30} />
          <span style={{fontWeight:700, fontSize:14}}>{c.name}</span>
          <span style={{color:C.muted, fontSize:13}}>@{c.handle}</span>
        </button>
      ))}
    </div>
  );
}

const DEFAULT_PRONOUNS_BY_ID = {
  player:'she/her',
  havoc:'he/him',
  silas:'he/him',
  callum:'he/him',
  briar:'she/her',
  rowan:'he/him',
  milo:'he/him',
  elara:'she/her',
  theo:'he/him',
  jude:'he/him',
  tamsin:'she/her',
  vesper:'she/her',
  __gmz__:'they/them',
};

const DEFAULT_HOUSE_BY_ID = {
  player:'Slytherin',
  havoc:'Gryffindor',
  silas:'Slytherin',
  callum:'Gryffindor',
  briar:'Gryffindor',
  rowan:'Gryffindor',
  milo:'Gryffindor',
  elara:'Gryffindor',
  theo:'Gryffindor',
  jude:'Slytherin',
  tamsin:'Ravenclaw',
  vesper:'Slytherin',
};

function pronounsFor(char) {
  return (char?.pronouns || DEFAULT_PRONOUNS_BY_ID[char?.id] || 'they/them').trim();
}

function houseFor(char) {
  const raw = char?.house || DEFAULT_HOUSE_BY_ID[char?.id] || '';
  return raw ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
}

function teamFor(char) {
  if (!isQuidditchPlayer(char)) return '';
  const raw = char?.team || houseFor(char) || '';
  return raw ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
}

function identityFactsFor(char) {
  if (!char) return '';
  const house = houseFor(char) || 'unknown house';
  const pronouns = pronounsFor(char);
  if (isQuidditchPlayer(char)) {
    const team = teamFor(char) || house;
    const position = char.position || 'player';
    return `${char.name} (@${char.handle}): pronouns ${pronouns}; house ${house}; ${team} Quidditch ${position}; insider language for ${team}: we/us/our`;
  }
  const role = char.position ? `; role ${char.position}` : '';
  return `${char.name} (@${char.handle}): pronouns ${pronouns}; house ${house}; NOT on a Quidditch team${role}; can comment as an observer, not as a player`;
}

function identityPromptFor(char) {
  return `Locked identity for this speaker: ${identityFactsFor(char)}. Treat house/team like pronouns. Do not make this speaker talk about their own house or team like outsiders. If they are not on a Quidditch team, do not write them as a player. In social posts/replies, this speaker is "I/me/my/we/our", never their own name, handle, or third-person pronouns.`;
}

function pronounRoster(chars = []) {
  return chars
    .filter(Boolean)
    .map(c => `${c.name} (@${c.handle}): ${pronounsFor(c)}`)
    .join('; ');
}

function houseRoster(chars = []) {
  return chars
    .filter(Boolean)
    .map(c => identityFactsFor(c))
    .join('; ');
}

function pronounRule(chars = []) {
  return `IDENTITY RULE: These facts are locked. Use the exact pronouns, house, team, and player/non-player status below. Do not infer identity from names, vibes, colors, avatars, rivalry, or usernames. Pronouns: ${pronounRoster(chars)}. Houses/teams: ${houseRoster(chars)}. House/team logic works like pronouns: exact and sticky. If someone belongs to a house/team, they can roast it as their own mess, but should use insider language like we/us/our/my team/my house unless clearly joking or quoting. If someone is NOT on a Quidditch team, never imply they play, practice, show up on the pitch, need to prove themselves on the pitch, or have teammates in a Quidditch sense. Direct replies should still use natural first- and second-person language like I, me, my, you, your, and we. In social posts/replies, a speaker must not post about themself in third person: if Callum writes, use "i/my", not "Callum/he/his"; if Havoc writes, use "i/my", not "Havoc/he/his". If a character is mentioned by @handle or name, keep their pronouns and house/team consistent. Never say a house "could never" do something if a member of that house just did it in the visible thread.`;
}

function truncateText(text, max = 280) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (clean.length <= max) return clean;
  return clean.slice(0, max - 1).trimEnd() + '…';
}

function compactSummaryText(char = {}, max = 280) {
  const raw = String(char.bio || char.description || '').replace(/\s+/g, ' ').trim();
  const sentence = raw.split(/(?<=[.!?])\s+/)[0] || raw;
  return truncateText(sentence, max);
}

function relationshipLine(sourceChar, targetChar) {
  if (!sourceChar || !targetChar || !sourceChar.relationships) return '';
  const value = sourceChar.relationships[targetChar.id];
  if (value === undefined || value === null) return '';
  return `Relationship to @${targetChar.handle}: ${value}`;
}

function compactRelationshipLine(char, relationshipTarget = null) {
  return relationshipLine(char, relationshipTarget);
}

function compactCharacterCard(char, relationshipTarget = null) {
  if (!char) return '';
  const role = [char.team || teamFor(char), char.position].filter(Boolean).join(' ');
  const pieces = [
    `${char.name || 'Unknown'} (@${char.handle || 'unknown'})`,
    `Pronouns: ${char.pronouns || pronounsFor(char) || 'unknown'}`,
    `House: ${char.house || houseFor(char) || 'unknown'}`,
    role ? `Role: ${role}` : (isQuidditchPlayer(char) ? 'Role: Quidditch player' : 'Role: not on a Quidditch team'),
    char.personality ? `Voice: ${truncateText(char.personality, 220)}` : '',
    relationshipTarget ? relationshipLine(char, relationshipTarget) : '',
    char.bio || char.description ? `Summary: ${truncateText(char.bio || char.description, 280)}` : '',
  ].filter(Boolean);

  return pieces.join('\n');
}

function compactPlayerCard(player) {
  if (!player) return '';
  return compactCharacterCard(player);
}

function compactPostForPrompt(post, chars = [], player = null) {
  if (!post) return '';
  const author = post.charId === 'player'
    ? player
    : (chars || []).find(c => c.id === post.charId);

  return [
    `Post by ${author ? `${author.name} (@${author.handle})` : post.charId || 'unknown'}:`,
    truncateText(post.text || '', 800),
    post.photo ? 'Attached image: yes. Treat the image as a visible selfie/photo attached to the post; react to the image only through the caption and public context, without inventing precise unseen details.' : '',
    post.reply ? `Attached reply by ${post.reply.charId || 'unknown'}: ${truncateText(post.reply.text || '', 500)}` : '',
  ].filter(Boolean).join('\n');
}

function compactCommentForPrompt(comment, chars = [], player = null) {
  if (!comment) return '';
  const id = comment.charId || comment.bot || comment.replyTo || 'unknown';
  const author = id === 'player'
    ? player
    : (chars || []).find(c => c.id === id || c.handle === id);

  const name = author ? `${author.name} (@${author.handle})` : id;
  return `${name}: ${truncateText(comment.text || '', 500)}`;
}

function shouldIncludeKeresHavocRowanCanon(mode, participants = []) {
  const ids = participants.map(p => typeof p === 'string' ? p : p?.id).filter(Boolean);
  const privateMode = ['dm', 'scene', 'private_scene'].includes(mode);
  if (!privateMode) return false;
  const hasKeres = ids.includes('player') || ids.includes('keres');
  const hasHavocOrRowan = ids.includes('havoc') || ids.includes('rowan');
  return hasKeres && hasHavocOrRowan;
}

function buildCoreRules() {
  return `
CORE RULES:
- Output only the requested text or requested JSON. No explanations.
- No em dashes or en dashes.
- Keep replies short, punchy, and conversational.
- Preserve pronouns, house, team, and player/non-player status exactly.
- Do not invent hard canon, secret history, scores, injuries, relationships, screenshots, deleted posts, or off-screen events.
- Rival teams do not pass to each other. Do not accuse an opponent of missing, dropping, or wasting your pass unless the current context explicitly establishes a mixed-team drill or scrimmage.
- If context is thin, stay broad, teasing, evasive, or ask one grounded question.
- Characters should sound like messy college-aged students on a campus social app, not polished adults.
- Avoid generic AI banter, recap-then-verdict replies, and stock endings like "fair", "we'll see", or "prove it".
`;
}

function buildCompactAntiAiRules() {
  return `
ANTI-AI MINI RULES:
- Do not make everyone sound like the same clever person.
- Do not recap the previous message and then label it.
- No generic verdicts like "beautiful. no notes", "that's tactical", "useful, if accidentally".
- No invented off-screen history or "remember when" unless supplied.
- Keep the reply tied to the visible message being answered.
- Pick one social move: tease, dodge, flirt, correct, protect, escalate, deflect, or make the joke worse.
`;
}

function buildPublicReplyRules(options = {}) {
  const { playful = false, gmz = false } = options || {};
  return `
${buildCoreRules()}
PUBLIC REPLY RULES:
- Anchor the reply to the exact visible post/comment being answered.
- Talk directly to the person being answered using "you/your" when appropriate.
- Only @mention the person directly being addressed. Max one @mention.
- Public replies can be playful, smug, flirty, petty, annoyed, protective, or unserious.
- Do not turn joke/flirt threads into interrogations.
- Rival teams can trash talk, but do not invent match results or attendance.
${playful ? '- If the exchange is playful/flirty, meet the joke, worsen it, or deflect in character.' : ''}
${gmz ? '- GMZ/gossip threads may speculate, but keep uncertainty visible with rumor/theory/question language.' : ''}
${RESPONSE_GROUNDING_RULE}
${THREAD_DIRECT_ADDRESS_RULE}
${buildCompactAntiAiRules()}
`;

function compressImageFile(file, { maxSize = 720, quality = 0.78, square = false } = {}) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sourceSize = square ? Math.min(img.width, img.height) : Math.max(img.width, img.height);
        const scale = Math.min(1, maxSize / sourceSize);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((square ? sourceSize : img.width) * scale));
        canvas.height = Math.max(1, Math.round((square ? sourceSize : img.height) * scale));
        const ctx = canvas.getContext('2d');
        if (square) {
          const sx = Math.max(0, (img.width - sourceSize) / 2);
          const sy = Math.max(0, (img.height - sourceSize) / 2);
          ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

function dialogueList(items = []) {
  return (items || []).filter(Boolean).join('; ');
}

function dialogueContractSummaryFor(char) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec) return 'use this character profile for motive, vocabulary, and what they would ignore';
  return `${spec.lane}. Moves: ${dialogueList(spec.moves)}. Shapes: ${dialogueList(spec.shapes)}. Avoid: ${dialogueList(spec.avoid)}`;
}

function dialogueContractFor(char, mode = 'public') {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec) {
    return `DIALOGUE CONTRACT: Use the profile for motive, vocabulary, and what this speaker ignores. In ${mode}, pick one immediate social move and one sentence shape before writing. Avoid generic snark and generic sincerity.`;
  }
  return `DIALOGUE CONTRACT: ${dialogueContractSummaryFor(char)}. In ${mode}, this contract is required voice control, not flavor text. Choose one move and one sentence shape that fit the live situation; do not use every cue at once. If the draft could be swapped with another character by changing only the name, rewrite it before output.`;
}

function multiSpeakerDialogueSeparationRule(chars = [], mode = 'public') {
  const constrained = (chars || []).filter(c => c && CHARACTER_DIALOGUE_CONSTRAINTS[c.id]);
  if (constrained.length < 2) return '';
  const hasRegressionSet = constrained.some(c => c.id === 'theo')
    && constrained.some(c => c.id === 'jude')
    && constrained.some(c => c.id === 'havoc');
  return `MULTI-SPEAKER DIALOGUE SEPARATION:
- Assign each speaker a different social move, sentence shape, and voice lane before writing.
- Do not let two replies use the same key verb, same setup/payoff shape, or same observer-recapping angle.
${hasRegressionSet ? '- Regression case: Theo, Jude, and Havoc must split cleanly. Theo uses media machinery. Jude uses low-effort dry damage. Havoc uses physical bad-idea escalation. They must not converge on the same caption/comeback pattern.' : '- If two lines could swap speakers and still work, rewrite the later line around that speaker\'s contract.'}
${constrained.map(c => `@${c.handle}: ${dialogueContractSummaryFor(c)}`).join('\n')}`;
}

function replaceDialoguePlaceholders(text = '', char = null, player = null) {
  const playerHandle = player?.handle ? `@${player.handle}` : (player?.name || 'you');
  const ownHandle = char?.handle ? `@${char.handle}` : (char?.name || 'i');
  return String(text || '').replace(/\{player\}/g, playerHandle).replace(/\{self\}/g, ownHandle);
}

function fallbackDialogueContractLine(char, player, avoidTexts = []) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  const pool = spec?.publicFallbacks || ['say that again, slower.', 'that is a choice.', 'interesting. inconveniently.'];
  const start = Math.floor(Math.random() * pool.length);
  for (let i = 0; i < pool.length; i++) {
    const candidate = replaceDialoguePlaceholders(pool[(start + i) % pool.length], char, player);
    if (!fallbackWasUsed(char?.id, candidate)
        && !violatesCharacterDialogueContract(candidate, char)
        && !hasDialoguePatternCollision(candidate, avoidTexts || [])) {
      trackFallback(char?.id, candidate);
      return candidate;
    }
  }
  const fallback = replaceDialoguePlaceholders(pool[start], char, player);
  trackFallback(char?.id, fallback);
  return fallback;
}

function violatesCharacterDialogueContract(text = '', char = null) {
  const spec = CHARACTER_DIALOGUE_CONSTRAINTS[char?.id];
  if (!spec || !text) return false;
  const clean = String(text || '').toLowerCase().replace(/[’]/g, "'");
  if (spec.reject && spec.reject.test(clean)) return true;
  return false;
}

  const priority = opts.pinFirstId
    ? [opts.pinFirstId, ...KERES_SPARK_PRIORITY.filter(id => id !== opts.pinFirstId)]

  const picked = priority
    .map(id => (pool || []).find(c => c?.id === id && !excluded.has(c.id)))
    .filter(Boolean)

  const namedGroup = [house, team].filter(Boolean).some(name => lower.includes(name));

function backsHouseTeam(text = '', char) {

function sameHouseOrTeam(a, b) {

  if (name && new RegExp(`\\b${escapeRegExp(name)}\\b`, 'i').test(raw)) return true;
  return !!(firstName.length >= 4 && new RegExp(`\\b${escapeRegExp(firstName)}\\b`, 'i').test(raw));

function mentionedCharactersInText(text = '', roster = []) {

function replyTargetHandleFromText(text = '', fallbackHandle = '', roster = [], speaker = null) {
  const speakerHandle = String(speaker?.handle || '').replace(/^@/, '').toLowerCase();
  const leading = String(text || '').trim().match(/^@([a-z0-9_]+)\b/i);
  const leadingHandle = leading?.[1]?.toLowerCase();
  if (
    leadingHandle
    && leadingHandle !== speakerHandle
    && (roster || []).some(c => String(c?.handle || '').toLowerCase() === leadingHandle)
  ) {
    return leadingHandle;
  }
  return String(fallbackHandle || '').replace(/^@/, '').toLowerCase();
}

function normalizeLeadingReplyHandle(text = '', replyToHandle = '') {
  const handle = String(replyToHandle || '').replace(/^@/, '').trim();
  const raw = String(text || '').trim();
  if (!handle || !raw) return raw;
  if (/^@[a-z0-9_]+\b/i.test(raw)) return raw.replace(/\s{2,}/g, ' ').trim();
  const withoutTarget = raw
    .replace(new RegExp(`(^|\\s)@${escapeRegExp(handle)}\\b\\s*`, 'ig'), ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
  return `@${handle} ${withoutTarget}`.trim();
}

function teammateStakeInText(text = '', responder, roster = []) {

function threadReplyRelevanceScore(replier, targetReply = {}, postText = '', roster = []) {
  if (!replier || !targetReply) return 0;
  const replyText = String(targetReply.text || '');

  const replierHandle = String(replier.handle || '').replace(/^@/, '').toLowerCase();
  let score = 0;
  if (replierHandle && replyTo === replierHandle) score += 5;
  if (characterMentionedInText(replyText, replier)) score += 5;
  if (isHouseTeamCallout(replyText, replier)) score += 3;
  if (teammateStakeInText(replyText, replier, roster)) score += 3;
  if (characterMentionedInText(postText, replier) && /you|your|both|everyone|anyone|room|thread/i.test(replyText)) score += 1;
  return score;
}

function threadRoleContext(text = '', author = null, roster = []) {
  const raw = String(text || '');
  const mentioned = mentionedCharactersInText(raw, roster)
    .filter(c => c?.handle && c.id !== author?.id);
  const mentionedLines = mentioned.map(c => {
    const handle = escapeRegExp(c.handle || '');
    const alibi = new RegExp(`@${handle}\\s*'?s?\\s+alibi|@${handle}[^.?!]*(?:alibi|witness|source|backup|cover)`, 'i').test(raw);
    const directAddress = new RegExp(`(^|\\s)@${handle}\\b`, 'i').test(raw);
    if (alibi) return `@${c.handle} is mentioned as an alibi/witness/cover figure, not automatically as the person the rumor is about.`;
    if (directAddress) return `@${c.handle} is tagged or pulled into the joke. Do not assume that means they are the culprit or subject unless the wording says so.`;
    return `@${c.handle} is mentioned. Keep their role separate from the original poster and the rumor subject.`;
  });
  const rumorish = /\b(?:rumou?r|caught|snogger|alibi|witness|gmz|sources?|saw|spotted|caught|gossip|plot checks out|cooked)\b/i.test(raw);
  const authorLine = author?.handle
    ? `Original poster: @${author.handle}. In direct replies to the main post, "you" usually means @${author.handle} unless the reply explicitly targets someone else.`
    : '';
  const rumorLine = rumorish
    ? 'Rumor logic: do not collapse every mentioned handle into the rumor subject. Separate who posted, who is being roasted, who is tagged as an alibi/witness, and who is replying.'
    : '';
  return `THREAD ROLE LOGIC:
${authorLine}
${mentionedLines.length ? `Mentioned handles: ${mentionedLines.join(' ')}` : 'No extra handles are clearly tagged.'}
${rumorLine}
If the visible wording is ambiguous, reply with teasing uncertainty or ask one playful question instead of assigning the rumor to the wrong person.`;
}

const PHRASE_INFECTION_REGEXES = [
  /\brespect\s+(?:the|that|this)\s+(?:bit|commitment|distraction|chaos|move|energy|dedication)\b/i,
  /\brespect\s+the\s+commitment(?:\s+to\s+(?:the\s+)?bit)?\b/i,
  /\bcommitment\s+to\s+(?:the\s+)?bit\b/i,
  /\b(?:respect|admire)\s+the\s+dedication\s+to\s+making\s+this\s+worse\b/i,
];

const STICKY_PHRASE_BANS = [
  'respect the bit',
  'respect the commitment',
  'commitment to the bit',
  'respect the distraction',
  'respect the commitment to the bit',
  'respect the dedication',
  'i can make that worse',
  'that helped nobody',
  'beautiful. no notes',
  'thats just called having standards',
  "that's just called having standards",
];

function looksLikePhraseInfection(text = '') {
  const source = String(text || '').replace(/[‘’]/g, "'").trim();
  return PHRASE_INFECTION_REGEXES.some(rx => rx.test(source));
}

function collectRecentFeedDialogue(feed = [], opts = {}) {
  const {
    limit = 10,
    includePosts = true,
    includeReplies = true,
    includeComments = true,
    charId = null,
    botId = null,
  } = opts || {};
  const entries = [];
  const push = (text, meta = {}) => {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    if (charId && meta.charId !== charId) return;
    if (botId && meta.botId !== botId) return;
    entries.push({ ...meta, text: clean });
  };

  (feed || []).slice(0, limit).forEach(post => {
    if (includePosts) push(post?.text, { kind:'post', charId: post?.charId, postId: post?.id });
    if (includeReplies && post?.reply) {
      push(post.reply.text, { kind:'reply', charId: post.reply.charId, postId: post?.id });
    }
    if (includeComments) {
      (post?.charComments || []).forEach((cc, index) => {
        push(cc?.text, { kind:'char-comment', charId: cc?.charId, postId: post?.id, index });
      });
      (post?.botComments || []).forEach((bc, index) => {
        push(bc?.text, {
          kind:'bot-comment',
          charId: bc?.isPlayer ? 'player' : null,
          botId: bc?.bot,
          postId: post?.id,
          index,
        });
      });
    }
  });
  return entries;
}

function recentFeedDialogueText(feed = [], opts = {}) {
  return collectRecentFeedDialogue(feed, opts)
    .map(entry => entry.text)
    .join('\n');
}

function repeatedRecentPhrases(feed = [], extra = '', opts = {}) {
  const { dms = {}, charId = null, groupChats = [] } = opts;
  const texts = [
    ...collectRecentFeedDialogue(feed, { limit: 10 }).map(entry => entry.text),
    extra || '',
  ].filter(Boolean);
  if (charId && dms[charId]) {
    dms[charId].slice(-6).forEach(m => { if (m?.text) texts.push(String(m.text)); });
  }
  (groupChats || []).forEach(gc => {
    (gc.messages || []).slice(-4)
      .filter(m => m?.charId === charId && m?.text)
      .forEach(m => texts.push(String(m.text)));
  });
  const found = new Set();
  const counts = new Map();
  const stop = new Set(['the','a','an','and','or','but','to','of','in','on','for','with','is','are','was','were','you','your','my','me','i','it','that','this','at','as']);

  texts.forEach(text => {
    const normalized = String(text)
      .toLowerCase()
      .replace(/@[a-z0-9_]+/g, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/[^a-z0-9'\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    const stickyMatches = normalized.match(/\brespect\s+(?:the|that|this)\s+[a-z0-9']+\b|\bcommitment\s+to\s+(?:the\s+)?[a-z0-9']+\b/g) || [];
    stickyMatches.forEach(match => found.add(match));
    const words = normalized.split(/\s+/).filter(Boolean);
    const perText = new Set();
    for (let size = 3; size <= 4; size++) {
      for (let i = 0; i <= words.length - size; i++) {
        const phrase = words.slice(i, i + size);
        if (phrase.every(w => stop.has(w))) continue;
        if (phrase.filter(w => !stop.has(w)).join('').length < 8) continue;
        perText.add(phrase.join(' '));
      }
    }
    perText.forEach(phrase => counts.set(phrase, (counts.get(phrase) || 0) + 1));
  });

  [...counts.entries()]
    .filter(([, count]) => count > 1)
    .sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)
    .slice(0, 5)
    .forEach(([phrase]) => found.add(phrase));

  return [...found].filter(Boolean).slice(0, 8);
}

function phraseRepetitionGuard(feed = [], extra = '', opts = {}) {
  const recent = repeatedRecentPhrases(feed, extra, opts);
  return `PHRASE REPETITION GUARD:
- Do not copy distinctive wording, sentence scaffolds, or repeated joke tags from the recent feed.
- Never use these sticky scaffolds: ${STICKY_PHRASE_BANS.map(p => `"${p}"`).join(', ')}.
${recent.length ? `- Avoid these recent repeated phrases right now: ${recent.map(p => `"${p}"`).join(', ')}.` : '- If a phrase from the recent feed feels tempting, use a new angle, image, verb, or social move instead.'}`;
}

const DIALOGUE_PATTERN_STOP_WORDS = new Set([
  'the','a','an','and','or','but','to','of','in','on','for','with','is','are','was','were','be','been','being',
  'you','your','yours','me','my','mine','i','im',"i'm",'it','its','that','this','those','these','they','them',
  'he','him','his','she','her','we','us','our','ours','just','really','very','so','bc','because','when','then',
  'there','here','not','no','yes','do','does','did','doing','say','saying','said','back','though','too','also',
]);

function normalizedDialogueWords(text = '') {
  return String(text || '')
    .toLowerCase()
    .replace(/[‘’]/g, "'")
    .replace(/@[a-z0-9_]+/g, '')
    .replace(/[^a-z0-9'\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .split(/\s+/)
    .filter(Boolean);
}

function dialoguePatternFlags(text = '') {
  const clean = normalizedDialogueWords(text).join(' ');
  const flags = new Set();
  if (!clean) return flags;
  const keyConnector = /\b(?:land|lands|landed|landing|hit|hits|hitting|work|works|worked|working|read|reads|sounded|sounds)\b.{0,48}\b(?:when|because|bc|from|coming from)\b/;
  const connectorKey = /\b(?:when|because|bc|from|coming from)\b.{0,48}\b(?:land|lands|landed|landing|hit|hits|hitting|work|works|worked|working|read|reads|sounded|sounds)\b/;
  if (keyConnector.test(clean) || connectorKey.test(clean)) flags.add('key-verb-connector');
  if (/\b(?:land|lands|landed|landing)\b/.test(clean)) flags.add('land');
  if (/\b(?:the\s+)?bit\b/.test(clean)) flags.add('bit');
  if (/\b(?:the\s+)?one\s+(?:saying|posting|doing|making|calling)\s+it\b/.test(clean)) flags.add('the-one-doing-it');
  if (/\b(?:harder|better|different|fine)\s+when\b/.test(clean)) flags.add('adjective-when');
  if (/\b(?:compliment|insult|joke|line|caption)\b.{0,36}\b(?:land|lands|landed|hit|hits|worked|works)\b/.test(clean)) flags.add('commentary-lands');
  if (/\b(?:bad|terrible|awful|great|excellent|useful)\s+for\b.{0,60}\b(?:bad|terrible|awful|great|excellent|useful)\s+for\b/.test(clean)) flags.add('x-for-y-contrast');
  if (/\b(?:caption|headline|ranking|poll|analytics|engagement|documentation|spreadsheet|thread loading|receipts)\b/.test(clean)) flags.add('media-spectator-frame');
  if (/\b(?:beautiful|awful|terrible)\b.{0,18}\b(?:no notes|keep going|useful|almost proud)\b/.test(clean)) flags.add('dry-verdict-fragment');
  if (/\b(?:support|respect|endorse)\b.{0,28}\b(?:getting worse|the bit|this mess|bad idea)\b/.test(clean)) flags.add('support-the-mess');
  return flags;
}

function extractUsedMoves(lines = []) {
  const used = new Set();
  (lines || []).filter(Boolean).forEach(line => {
    const flags = dialoguePatternFlags(String(line));
    flags.forEach(f => used.add(f));
    const lower = String(line).toLowerCase();
    if (/\?$/.test(lower.trim())) used.add('question');
    if (/^[a-z]+[.!]$/.test(lower.trim())) used.add('clipped-verdict');
    if (/@\w+/.test(lower)) used.add('direct-tag');
    if (/^(?:ok|yeah|sure|right|nah|no|yes)\b/i.test(lower.trim())) used.add('one-word-opener');
  });
  return used;
}

function hasRepeatedDialogueNgram(candidate = '', previousTexts = []) {
  const words = normalizedDialogueWords(candidate).filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w));
  if (words.length < 3) return false;
  const candidatePhrases = new Set();
  for (let size = 3; size <= Math.min(5, words.length); size++) {
    for (let i = 0; i <= words.length - size; i++) {
      candidatePhrases.add(words.slice(i, i + size).join(' '));
    }
  }
  return (previousTexts || []).some(prev => {
    const prevWords = normalizedDialogueWords(prev).filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w));
    if (prevWords.length < 3) return false;
    for (let size = 3; size <= Math.min(5, prevWords.length); size++) {
      for (let i = 0; i <= prevWords.length - size; i++) {
        if (candidatePhrases.has(prevWords.slice(i, i + size).join(' '))) return true;
      }
    }
    return false;
  });
}

function compactDialogueFingerprint(text = '') {
  return normalizedDialogueWords(text)
    .filter(w => !DIALOGUE_PATTERN_STOP_WORDS.has(w) && !/^\d+$/.test(w))
    .join(' ');
}

function openingDialogueFingerprint(text = '') {
  return normalizedDialogueWords(text)
    .filter(w => !/^\d+$/.test(w))
    .slice(0, 5)
    .join(' ');
}

function hasDialoguePatternCollision(candidate = '', previousTexts = []) {
  const prior = (previousTexts || [])
    .flatMap(text => String(text || '').split(/\n+/))
    .map(text => text.trim())
    .filter(Boolean)
    .slice(-14);
  if (!candidate || !prior.length) return false;
  const candidateFingerprint = compactDialogueFingerprint(candidate);
  if (candidateFingerprint && candidateFingerprint.split(/\s+/).length >= 4) {
    if (prior.some(prev => compactDialogueFingerprint(prev) === candidateFingerprint)) return true;
  }
  const candidateOpening = openingDialogueFingerprint(candidate);
  if (candidateOpening && candidateOpening.split(/\s+/).length >= 4) {
    if (prior.some(prev => openingDialogueFingerprint(prev) === candidateOpening)) return true;
  }
  if (hasRepeatedDialogueNgram(candidate, prior)) return true;
  const flags = dialoguePatternFlags(candidate);
  if (!flags.size) return false;
  return prior.some(prev => {
    const prevFlags = dialoguePatternFlags(prev);
    if (flags.has('key-verb-connector') && prevFlags.has('key-verb-connector')) return true;
    if (flags.has('land') && prevFlags.has('land') && (flags.has('adjective-when') || prevFlags.has('adjective-when') || flags.has('commentary-lands') || prevFlags.has('commentary-lands'))) return true;
    if (flags.has('the-one-doing-it') && prevFlags.has('the-one-doing-it')) return true;
    if (flags.has('bit') && prevFlags.has('bit') && hasRepeatedDialogueNgram(candidate, [prev])) return true;
    for (const shared of ['x-for-y-contrast', 'media-spectator-frame', 'dry-verdict-fragment', 'support-the-mess']) {
      if (flags.has(shared) && prevFlags.has(shared)) return true;
    }
    return false;
  });
}

function threadPatternVarietyGuard(lines = []) {
  const recent = (lines || [])
    .flatMap(line => String(line || '').split(/\n+/))
    .map(line => line.trim())
    .filter(Boolean)
    .slice(-12);
  return `${THREAD_PATTERN_VARIETY_RULE}
${recent.length ? `RECENT LINE SHAPES TO AVOID ECHOING:\n${recent.map((line, i) => `${i + 1}. ${line.slice(0, 160)}`).join('\n')}` : 'No recent line shapes are available yet, so make each speaker choose a different move.'}`;
}

// When a character is replying to a thread they already replied to,
// surface their previous reply explicitly so the model varies structure
// instead of producing a near-duplicate template with different filler.
function priorReplyVariationRule(charId, charR1) {
  const prev = (charR1 || []).find(cc => cc?.charId === charId);
  if (!prev || !prev.text) return '';
  return `PRIOR REPLY VARIATION:
- You already replied earlier in this thread with: "${String(prev.text).replace(/"/g, '\\"')}"
- Your new reply MUST use a different opening, different sentence shape, and avoid echoing the same phrases, rhythm, or template.
- The substance can build on your earlier point, but the framing should feel like a fresh beat — not the same template with different filler words at the end.`;
}

function cleanGeneratedText(text = '') {
  return String(text)
    .trim()
    .replace(/^["']|["']$/g, '')
    .replace(/[‘’]/g, "'")
    .replace(/[—–]/g, '.')
    .replace(/\bheart emoji\b/gi, '❤️')
    .replace(/\b(?:sparkle|sparkles) emoji\b/gi, '✨')
    .replace(/\b(?:skull|dead) emoji\b/gi, '💀')
    .replace(/\bfire emoji\b/gi, '🔥')
    .replace(/\bcrying emoji\b/gi, '😭')
    .replace(/\blaughing emoji\b/gi, '😂')
    .replace(/\beyes emoji\b/gi, '👀')
    .replace(/\bthis just got interesting\b/gi, 'say that without hovering over the reply button')
    .replace(/\b(?:keep|keeping|keeps) things interesting around here\b/gi, 'make the prefects develop a twitch')
    .replace(/\bget more interesting\b/gi, 'stop being boring')
    .replace(/\blet'?s see it\b/gi, 'try me')
    .replace(/\s+([.,!?])/g, '$1')
    .replace(/([.!?]){2,}/g, '$1')
    .replace(/\s{2,}/g, ' ');
}

function cleanSceneText(text = '') {
  return cleanGeneratedText(text)
    .replace(/[“”"]/g, '')
    .replace(/\s+([.,!?])/g, '$1')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function cleanSceneActionDialogueText(text = '') {
  return cleanSceneText(text)
    .replace(/\*([^*]+)\*/g, '[$1]')
    .replace(/\[\s+/g, '[')
    .replace(/\s+\]/g, ']')
    .trim();
}

function cleanFlyOnWallSceneText(text = '', player = null) {
  const handle = String(player?.handle || '').replace(/^@/, '');
  const firstName = String(player?.name || 'Keres').split(/\s+/)[0];
  const speakerRx = new RegExp(`^\\s*(?:@?${escapeRegExp(handle)}|${escapeRegExp(firstName)})\\s*[:\\-]`, 'i');
  return String(text || '')
    .trim()
    .replace(/^```(?:text)?\n?|\n?```$/g, '')
    .replace(/[“”"]/g, '')
    .split('\n')
    .filter(line => !speakerRx.test(line))
    .join('\n')
    .trim();
}

function renderSceneParts(text = '', mutedColor = C.muted) {
  return String(text || '').split(/(\[[^\]]+\]|\*[^*]+\*)/g).map((part, i) => {
    const isBracketAction = part.startsWith('[') && part.endsWith(']');
    const isStarAction = part.startsWith('*') && part.endsWith('*');
    if (isBracketAction || isStarAction) {
      return <em key={i} style={{color:mutedColor, fontStyle:'italic', fontSize:13}}>{part}</em>;
    }
    return <span key={i}>{part}</span>;
  });
}

function normalizeFlyOnWallOutput(text, presentChars = []) {
  const raw = String(text || '').replace(/^```(?:text)?\n?|\n?```$/g, '').trim();
  const now = Date.now();
  if (!raw) {
    return [{
      role: 'scene',
      charId: null,
      text: 'The room stays quiet for a beat.',
      isNarration: true,
      mode: 'fly_on_wall',
      id: now,
      timestamp: now,
      ts: now,
    }];
  }

  const chars = (presentChars || []).filter(Boolean);
  const charBySpeaker = (speaker = '') => {
    const clean = String(speaker || '').replace(/^@/, '').toLowerCase().trim();
    return chars.find(c => {
      const handle = String(c.handle || '').toLowerCase();
      const name = String(c.name || '').toLowerCase();
      const first = name.split(/\s+/)[0];
      return clean === handle || clean === name || clean === first;
    }) || null;
  };
  const dialogueRx = /^\s*@?([A-Za-z][A-Za-z0-9_]*(?:\s+[A-Za-z][A-Za-z0-9_]*)?)\s*:\s*(.+?)\s*$/;
  const messages = [];
  let narrationBuffer = [];
  let skippedSceneReply = false;
  const flushNarration = () => {
    const narration = narrationBuffer.join('\n').trim();
    narrationBuffer = [];
    if (!narration) return;
    const t = now + messages.length;
    messages.push({
      role: 'scene',
      charId: null,
      text: narration,
      isNarration: true,
      mode: 'fly_on_wall',
      id: t,
      timestamp: t,
      ts: t,
    });
  };

  raw.split(/\n+/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) {
      flushNarration();
      return;
    }
    const match = trimmed.match(dialogueRx);
    const speaker = match ? charBySpeaker(match[1]) : null;
    if (speaker) {
      flushNarration();
      const text = cleanSceneReply(match[2].replace(/^["'“”]+|["'“”]+$/g, '').trim(), speaker, []);
      if (!text) {
        skippedSceneReply = true;
        return;
      }
      const t = now + messages.length;
      messages.push({
        role: 'char',
        charId: speaker.id,
        text,
        mode: 'fly_on_wall',
        id: t,
        timestamp: t,
        ts: t,
      });
      return;
    }
    narrationBuffer.push(trimmed);
  });
  flushNarration();

  if (messages.length) return messages;
  if (skippedSceneReply) return [];
  return [{
    role: 'scene',
    charId: null,
    text: raw,
    isNarration: true,
    mode: 'fly_on_wall',
    id: now,
    timestamp: now,
    ts: now,
  }];
}

function normalizeFlyOnWallBeats(rawText, presentChars = []) {
  const parsed = parseJsonArrayFromText(rawText);
  const chars = (presentChars || []).filter(Boolean);
  const now = Date.now();
  const charByHandle = (value = '') => {
    const clean = String(value || '').replace(/^@/, '').toLowerCase().trim();
    return chars.find(c =>
      String(c.handle || '').toLowerCase() === clean ||
      String(c.id || '').toLowerCase() === clean ||
      String(c.name || '').toLowerCase() === clean ||
      String(c.name || '').toLowerCase().split(/\s+/)[0] === clean
    ) || null;
  };
  const beats = parsed.map((beat, i) => {
    if (!beat || typeof beat !== 'object') return null;
    const speaker = charByHandle(beat.handle || beat.speaker || beat.char || beat.character);
    if (!speaker) return null;
    const action = cleanSceneText(beat.action || '').replace(/^\[|\]$/g, '').trim();
    const dialogue = cleanSceneText(beat.dialogue || beat.text || '').replace(/^\[.*?\]\s*/, '').trim();
    const text = [
      action ? `[${action}]` : '',
      dialogue,
    ].filter(Boolean).join(' ').trim();
    const clean = cleanSceneReply(text, speaker, []);
    if (!clean) return null;
    const t = now + i;
    return {
      role: 'char',
      charId: speaker.id,
      text: clean,
      mode: 'fly_on_wall',
      id: t,
      timestamp: t,
      ts: t,
    };
  }).filter(Boolean);
  if (beats.length) return beats;
  if (parsed.length) return [];
  return normalizeFlyOnWallOutput(cleanFlyOnWallSceneText(rawText), chars);
}

function looksLikeSceneNonResponse(text = '') {
  const raw = String(text || '').trim();
  const lower = raw.toLowerCase().replace(/[’]/g, "'");
  const actionOnly = !lower.replace(/\*[^*]*\*/g, '').replace(/\[[^\]]*\]/g, '').trim();
  const normalized = lower
    .replace(/[\*\[\]".,!?]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (/^(?:try that again|interesting choice|careful|noted|sure|go on|be specific|that's your version|that is your version)$/.test(normalized)) return true;
  if (!actionOnly) return false;
  return /\b(?:leans?\s+back|raises?\s+(?:an\s+)?eyebrows?|almost\s+smiles?|watches\s+you|looks\s+at\s+you|glances?\s+over|says?\s+nothing|waits?|pauses?|considers\s+this|tilts?\s+his\s+head|tilts?\s+her\s+head|exhales?\s+once|looks?\s+away)\b/i.test(normalized);
}

function cleanSceneReply(text = '', char, avoidTexts = []) {
  const clean = cleanSceneText(text);
  const needsFallback =
    !clean
    || looksLikePromptLeak(clean)
    || looksLikeBannedFlatPhrase(clean)
    || looksLikeSceneNonResponse(clean)
    || violatesCharacterDialogueContract(clean, char)
    || hasDialoguePatternCollision(clean, avoidTexts);
  return needsFallback ? '' : clean;
}

function escapeRegExp(text = '') {
  return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function directlyAddressedMembers(text = '', members = [], player = null) {
  const raw = String(text || '');
  return (members || []).filter(member => {
    if (!member || member.id === player?.id) return false;
    const handle = member.handle ? escapeRegExp(member.handle.replace(/^@/, '')) : '';
    const first = member.name ? escapeRegExp(member.name.split(/\s+/)[0]) : '';
    const full = member.name ? escapeRegExp(member.name) : '';
    return !!(
      (handle && new RegExp(`@${handle}\\b`, 'i').test(raw)) ||
      (full && new RegExp(`(?:^|[\\s,])${full}(?:[\\s?.!,]|$)`, 'i').test(raw)) ||
      (first && first.length >= 3 && new RegExp(`(?:^|[\\s,])${first}(?:[\\s?.!,]|$)`, 'i').test(raw))
    );
  });
}

  const groupPool = {
    havoc: ['same mess, better aim. still funny.', 'fine. vague chaos, then. worse for everyone.', 'then say what you meant before rowan starts translating.'],
    rowan: ['then the accusation needs better aim.', 'vague is where bad arguments hide. tragic for everyone.', 'then ask the actual question and stop feeding havoc material.'],

    briar: ['then everyone can stop making bad evidence louder.', 'if that was not the point, say the point.', 'useful correction. annoying that it was needed.'],
  };
  const pool = group && groupPool[char?.id] ? groupPool[char.id] : {
    silas: ['then rowan left it vague. gossip loves bad evidence.', 'if there is no evidence, stop feeding the rumor.', 'the accusation was sloppy. i hate sloppy.'],
    jude: ['then everyone is yelling at a shadow. productive little circus.', 'annoying. bad aim, then.', 'if they guessed wrong, that is almost funnier.'],
    rowan: ['then mystery person stays mysterious. tragic for my caption.', 'i saw motion, not a confession.', 'bad evidence makes everyone louder. convenient for no one.'],
    havoc: ['then everyone is arguing with a ghost. solid afternoon.', 'bad aim, then. still a mess.', 'great. anonymous chaos. my favorite kind to deny.'],
    callum: ['then say that. vague rumors are bad evidence.', 'if they guessed wrong, correct the record and move.', 'same circus, worse aim.'],
    briar: ['then everyone can stop making bad evidence louder.', 'if it was not you, say so cleanly.', 'useful correction. annoying that it was needed.'],
    tamsin: ['then the useful question is who benefited from making it sound like you.', 'vague rumors remain terrible evidence.', 'then they are reacting to a version they invented. familiar problem.'],

  }[char?.id] || ['then the rumor is doing more work than the evidence.', 'bad aim, loud room.', 'if it was not you, that changes the joke.'];
  const start = Math.floor(Math.random() * pool.length);
  for (let i = 0; i < pool.length; i++) {
    const candidate = pool[(start + i) % pool.length];
    if (!fallbackWasUsed(char?.id, candidate)
        && !violatesCharacterDialogueContract(candidate, char)
        && !hasDialoguePatternCollision(candidate, avoidTexts || [])) {
      trackFallback(char?.id, candidate);
      return candidate;

  trackFallback(char?.id, pool[start]);
  return pool[start];
}

function looksLikeTeamPronounFlip(text = '', latestUserText = '') {
  const lower = String(text || '').toLowerCase().replace(/[’]/g, "'");
  const user = String(latestUserText || '').toLowerCase().replace(/[’]/g, "'");
  const userTeamClaim = /\b(?:we|us|our)\b/i.test(user)
    && /\b(?:fine|match|team|slytherin|gryff|gryffindor|quidditch|score|pitch|practice)\b/i.test(user);
  if (!userTeamClaim) return false;
  return /\bwe'?re\s+doing\s+better\s+than\s+fine\b/i.test(lower)
    || /\byou'?re\s+just\s+mad\b/i.test(lower)
    || /\bmad\s+(?:it'?s|that'?s|this\s+is)\s+working\b/i.test(lower);
}

function looksLikeGroupDirectQuestionDodge(text = '', opts = {}) {
  if (!opts.directlyAddressed) return false;
  const lower = String(text || '').toLowerCase().replace(/[’]/g, "'");
  const user = String(opts.latestUserText || '').toLowerCase().replace(/[’]/g, "'");
  if (!/[?]|\b(?:what|why|how|which|who)\b/i.test(user)) return false;
  return /\b(?:ask\s+me\s+when|actually\s+curious|just\s+watching|you'?re\s+just|you\s+only\s+asked|performing|sell\s+it|mad\s+it'?s\s+working)\b/i.test(lower);
}

function cleanChatText(text = '', char = null, player = null, group = false, opts = {}) {
  if (group && typeof group === 'object') {
    opts = group;
    group = !!opts.group;
  }
  opts = opts || {};
  const avoidTexts = [...(opts.avoidTexts || [])];
  if (opts.feed) avoidTexts.push(recentFeedDialogueText(opts.feed, { limit: opts.feedAvoidLimit || 8 }));
  const names = [char?.name, char?.handle, char?.handle ? `@${char.handle}` : ''].filter(Boolean).map(escapeRegExp);
  let clean = cleanGeneratedText(text)
    .replace(/[“”]/g, '"')
    .replace(stripSpeakerLabelRegex(char), '')
    .replace(names.length ? new RegExp(`^\\s*(?:${names.join('|')})\\s*:\\s*`, 'i') : /^$/, '')
    .replace(/^\s*["']|["']\s*$/g, '')
    .trim();
  const getDmProgressFallback = () => (!group && opts.channel === 'dm' && char
    ? fallbackPrivateDmProgressLine(char, player, avoidTexts, opts)
    : '');
  const dmPatternCollision = (!group && opts.channel === 'dm' && char)
    ? hasDialoguePatternCollision(clean, avoidTexts)
    : false;
  if ((!group && opts.channel === 'dm' && char) && (
    /\bjealous\s+is\s+a\s+strong\s+word\b/i.test(clean) ||
    /\bcorrecting\s+the\s+angle\b/i.test(clean)
  )) {
    const dmProgressFallback = getDmProgressFallback();
    if (!dmProgressFallback) {
      return fallbackChatLine(char, player, group, avoidTexts);
    }
    return dmProgressFallback;
  }
  if (char?.id === 'rowan' && /\bshould i be worried\b/i.test(clean)) {
    return 'tamsin is always already worried. the question is how much evidence she has.';
  }
  if (group && char && looksLikeTeamPronounFlip(clean, opts.latestUserText || '')) {
    return fallbackGroupTeamBanterLine(char, player, { ...opts, avoidTexts });
  }
  if (group && char && looksLikeGroupDirectQuestionDodge(clean, opts)) {
    return fallbackGroupQuestionLine(char, player, { ...opts, avoidTexts });
  }
  if (group && char && looksLikeHavocRowanPrivateGroupFailure(clean, char, opts)) {
    return havocRowanPrivateGroupLine(char, player, opts.latestUserText || '') || fallbackChatLine(char, player, group, avoidTexts);
  }
  if (char && (looksLikeUnsupportedPlayerActionClaim(clean, opts.latestUserText || '', player) || looksLikeReactionBlameSpiral(clean))) {
    if (!group && opts.channel === 'dm' && !dmNeedsRumorCorrectionContext(opts.latestUserText || '')) {
      return getDmProgressFallback() || clean;
    }
    return fallbackUnsupportedBlameLine(char, player, group, avoidTexts, opts);
  }
  if (char && looksLikeImpossibleCrossTeamPassClaim(clean, char, player)) {
    return fallbackImpossibleCrossTeamPassLine(char, player, { ...opts, avoidTexts });
  }
  if (char && looksLikePracticeContextDrift(clean, char, { ...opts, avoidTexts })) {
    return fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts });
  }
  if (char && looksLikeInventedTeamWeaknessClaim(clean, { ...opts, avoidTexts })) {
    return isPracticeTrashTalkContext({ ...opts, avoidTexts })
      ? fallbackPracticeTrashTalkLine(char, player, { ...opts, avoidTexts })
      : fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (char && (looksLikeInventedTimelineClaim(clean, { ...opts, avoidTexts }) || looksLikeUnanchoredMediaClaim(clean, { ...opts, avoidTexts }))) {
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (char && (looksLikeAddressSlop(clean, char) || looksLikeCatchphraseSlop(clean) || looksLikeBannedFlatPhrase(clean) || looksLikeRecapThenFlatVerdict(clean, opts))) {
    return fallbackChatLine(char, player, group, avoidTexts);
  }
  if (char?.id === 'jude' && looksLikeJudePsychoanalysis(clean)) {
    return fallbackChatLine(char, player, group, avoidTexts);
  }
  if (!group && char && (looksLikePrivateBanterDareDodge(clean, opts.latestUserText || '') || looksLikePrivateBanterDareDodge(clean, 'annoying'))) {
    return fallbackChatLine(char, player, group, avoidTexts);
  }
  if (char && violatesCharacterDialogueContract(clean, char)) {
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (char && (dmPatternCollision || hasDialoguePatternCollision(clean, avoidTexts))) {
    if (!group && opts.channel === 'dm') {
      // In DMs, preserving the live conversational answer is better than
      // swapping in a detached fallback just because the sentence shape is
      // similar to something earlier in the chat.
      return clean;
    }
    return fallbackDialogueContractLine(char, player, avoidTexts);
  }
  if (!clean || looksLikePromptLeak(clean) || looksLikePhraseInfection(clean) || looksLikeIdentityConfusion(clean, char)) return fallbackChatLine(char, player, group, avoidTexts);
  return clean;
}

function stripSpeakerLabelRegex(char) {
  if (!char?.name && !char?.handle) return /^$/;
  const name = char?.name ? escapeRegExp(char.name) : '';
  const handle = char?.handle ? escapeRegExp(char.handle.replace(/^@/, '')) : '';
  const lead = String.raw`^\s*(?:#+\s*)?`;
  const tail = String.raw`\s*(?::|[-–—])?\s*`;
  if (name && handle) {
    return new RegExp(`${lead}(?:${name}\\s*(?:\\(\\s*@?${handle}\\s*\\))?|@?${handle})${tail}`, 'i');
  }
  return new RegExp(`${lead}(?:${name || `@?${handle}`})${tail}`, 'i');
}

function looksLikePromptLeak(text = '') {

function cleanSelfNarration(text = '', char) {

  const nameGroup = `(?:${names.join('|')})`;
  return String(text)
    .replace(new RegExp(`^${nameGroup}\\s+going\\s+to\\b`, 'i'), "i'm going to")
    .replace(new RegExp(`^${nameGroup}\\s+(?:is|'s)\\s+just\\s+here\\b`, 'i'), "i'm just here")
    .replace(new RegExp(`^${nameGroup}\\s+(?:is|'s)\\s+`, 'i'), "i'm ")

    .replace(new RegExp(`^${nameGroup}\\s+wants\\s+`, 'i'), "i want ")

    .replace(new RegExp(`^${nameGroup}\\s+knows\\s+`, 'i'), "i know ")
    .replace(new RegExp(`^${nameGroup}\\s+would\\s+`, 'i'), "i would ")
    .replace(new RegExp(`^${nameGroup}\\s+will\\s+`, 'i'), "i will ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:doesn't|does not)\\s+`, 'i'), "i don't ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:can't|cannot)\\s+`, 'i'), "i can't ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:won't|will not)\\s+`, 'i'), "i won't ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:wouldn't|would not)\\s+`, 'i'), "i wouldn't ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:isn't|is not)\\s+`, 'i'), "i'm not ")
    .replace(new RegExp(`^${nameGroup}\\s+(?:wasn't|was not)\\s+`, 'i'), "i wasn't ")
    .replace(new RegExp(`^${nameGroup}\\s+likes\\s+`, 'i'), "i like ")
    .replace(new RegExp(`^${nameGroup}\\s+hates\\s+`, 'i'), "i hate ")
    .replace(new RegExp(`^${nameGroup}\\s+loves\\s+`, 'i'), "i love ")

function stripLeadingSelfMention(text = '', char) {
  if (!char?.handle || !text) return text;
  const handle = escapeRegExp(char.handle.replace(/^@/, ''));
  return String(text)
    // Strip @selfhandle anywhere in the text, plus any trailing separator
    // (handles consecutive self-mentions, mid-text mentions, leading-period mentions)
    .replace(new RegExp(`\\.?@${handle}\\b[\\s,;:]*`, 'gi'), '')
    // Collapse any double spaces left behind by mid-text removal
    .replace(/\s{2,}/g, ' ')
    // Clean up any orphaned leading punctuation/whitespace
    .replace(/^[\s,;:]+/, '')
    .trim();
}

function isSelfNarration(text = '', char) {
  if (!char?.name || !text) return false;
  const first = (char.name || '').split(/\s+/)[0];
  const escaped = [char.name, first, char.handle].filter(Boolean).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!escaped.length) return false;
  const selfVerb = `(?:is|'s|has|needs|wants|thinks|knows|would|will|going\\s+to|doesn't|does\\s+not|can't|cannot|won't|will\\s+not|wouldn't|would\\s+not|isn't|is\\s+not|wasn't|was\\s+not|likes|hates|loves|sees|notices|watches|feels|looks|sounds|says|gets|got|can|could|should|might|must|did|does)`;
  return new RegExp(`^(?:\\*\\s*)?(?:${escaped.join('|')})\\s+${selfVerb}\\b`, 'i').test(String(text).trim())
    || new RegExp(`\\b(?:${escaped.join('|')})\\s+${selfVerb}\\b`, 'i').test(String(text).trim())
    || new RegExp(`\\b(?:${escaped.join('|')})\\s*['’]s\\s+(?:own\\s+)?(?:prep|match|routine|team|house|problem|fault|faults|schedule|detention|morning|business|mess|fault)\\b`, 'i').test(String(text).trim());
}

function looksLikeSelfPronounDrift(text = '', char, opts = {}) {
  if (!opts.selfSubject || !char || !text) return false;
  const lower = String(text || '').toLowerCase().replace(/[’]/g, "'");
  const withoutOwnIdentity = lower.replace(new RegExp(`\\b${escapeRegExp((char.name || '').split(/\\s+/)[0]).toLowerCase()}\\b|\\b${escapeRegExp(String(char.handle || '').toLowerCase())}\\b`, 'gi'), '');
  const withoutDirectAddress = withoutOwnIdentity.replace(/^\s*@?[a-z0-9_]+\b[:,]?\s*/i, '');
  const hasOtherPersonAnchor = /\B@[a-z0-9_]+\b/i.test(withoutDirectAddress) || /\b(?:callum|havoc|silas|rowan|milo|theo|jude|briar|elara|tamsin|vesper|keres|gmz)\b/i.test(withoutDirectAddress);
  if (hasOtherPersonAnchor) return false;
  const pronouns = pronounsFor(char).toLowerCase();
  if (pronouns.includes('he/him')) return /\b(?:he|him|his|himself)\b/i.test(lower);
  if (pronouns.includes('she/her')) return /\b(?:she|her|hers|herself)\b/i.test(lower);
  return /\b(?:they|them|their|theirs|themself|themselves)\b/i.test(lower);
}

function looksLikeIdentityConfusion(text = '', char) {
  if (!char || !text) return false;
  const lower = String(text).toLowerCase().replace(/[’]/g, "'");
  const ownTerms = [teamFor(char), char.house].filter(Boolean).map(t => String(t).toLowerCase());
  if (isQuidditchPlayer(char)) {
    return ownTerms.some(term => {
      const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp(`\\b${safe}'s\\b`, 'i').test(lower)
        || new RegExp(`\\b${safe}\\s+(?:is|are|was|were|keeps|needs|has|does|did|would|could|should)\\b`, 'i').test(lower);
    });
  }
  return /\b(?:my|our)\s+(?:team|lineup|captain|keeper|chaser|beater|seeker|practice|match|pitch|formation)\b/i.test(lower)
    || /\bwe\s+(?:played|play|practice|practised|trained|won|lost|showed up|show up|fly|flew)\b/i.test(lower)
    || /\bus\s+(?:on|in)\s+the\s+(?:pitch|field|lineup)\b/i.test(lower)
    || /\b(?:showing up|show up|showed up)\s+to\s+prove\b/i.test(lower)
    || /\b(?:prove|proving)\s+(?:myself|ourselves|things)\s+(?:to|on|at)\b/i.test(lower)
    || /\bon\s+(?:the\s+)?(?:pitch|broom|field|lineup)\b/i.test(lower);
}

function cleanSocialPostText(raw = '', char, player, opts = {}) {
  opts = opts || {};
  const avoidTexts = [...(opts.avoidTexts || [])];
  if (opts.feed) avoidTexts.push(recentFeedDialogueText(opts.feed, { limit: opts.feedAvoidLimit || 8 }));
  const clean = stripLeadingSelfMention(cleanSelfNarration(cleanGeneratedText(raw).replace(stripSpeakerLabelRegex(char), ''), char), char)

function classifyPostIntent(text = '') {
  const lower = String(text || '').toLowerCase().replace(/[']/g, "'");

  if (/\bobviously\b.{0,80}\b(?:most|least|best|worst|dangerous|innocent|guilty)\b/i.test(lower)) return 'playful_banter';
  if (/\b(?:actually|correction|wrong|incorrect|for the record|statistically|evidence|prove|objectively)\b/i.test(lower)) return 'sincere_claim';
  if (/\?/.test(lower) && !looksLikePlayfulBanterText(lower)) return 'genuine_question';

    const cleaned = cleanSocialPostText(post?.text || '', author, player);
    const replyChar = all.find(c => c.id === post?.reply?.charId);
    const cleanedReply = post?.reply?.text && replyChar ? cleanSocialReplyText(post.reply.text, replyChar, player, { contextText: post?.text || '', roster: all, selfSubject: characterMentionedInText(post?.text || '', replyChar) || replyChar.id === post?.charId }) : post?.reply?.text;
    const cleanedBots = Array.isArray(post?.botComments)
      ? post.botComments.map(b => ({ ...b, text: cleanSocialReplyText(b.text || '', null, player, { bot: RECURRING_BOTS.find(rb => rb.id === b.bot) }), nestedReply: false }))
      : post?.botComments;
    const cleanedCharComments = Array.isArray(post?.charComments)
      ? post.charComments.map(cc => {
          const ccChar = all.find(c => c.id === cc.charId);
          return { ...cc, text: ccChar ? cleanSocialReplyText(cc.text || '', ccChar, player, { contextText: `${post?.text || ''} ${cc?.text || ''}`, roster: all, selfSubject: characterMentionedInText(`${post?.text || ''} ${cc?.text || ''}`, ccChar) || ccChar.id === post?.charId }) : cc.text, replyTo: cc.replyTo || author?.handle, nestedReply: false };
        })
      : post?.charComments;
    if (looksLikePromptLeak(post?.text || '') || cleaned !== post?.text || cleanedReply !== post?.reply?.text) {
      return {
        ...post,
        text: cleaned,
        reply: post?.reply ? { ...post.reply, text: cleanedReply } : post?.reply,
        botComments: cleanedBots,
        charComments: cleanedCharComments,
        repairedPromptLeak: looksLikePromptLeak(post?.text || '') || looksLikePromptLeak(post?.reply?.text || ''),

function clamp(num, min, max) {
  return Math.max(min, Math.min(max, num));
}

function scoreDmExchange(messages = []) {
  if (!Array.isArray(messages) || messages.length === 0) return 0;
  const positive = /(honest|honesty|respect|appreciate|value|trust|alliance|ally|study|share|useful|decent case|moves you up|right people|boundary|understand|works|after dinner|good point|fair enough|thank|prefer|practice|quiet|secret)/i;
  const strongPositive = /(secret alliance|great ally|moves you up|value honesty|respect the boundary|decent case|right people|study in peace|share and vice versa)/i;
  const flirtyPositive = /(hot|pretty|beautiful|gorgeous|babe|angle|cheekbones|flirt|kiss|date|attractive|staring|can't look away|good girl|filthy)/i;
  const negative = /(hate|leave me|go away|don't trust|do not trust|annoying|stupid|threat|harass|harassing|back off|shut up|idiot|pathetic)/i;

  let total = 0;
  messages.forEach(msg => {
    if (!msg || typeof msg.text !== 'string') return;
    const text = msg.text;
    const fromChar = msg.role === 'char';
    if (strongPositive.test(text)) total += fromChar ? 0.85 : 0.65;
    else if (positive.test(text)) total += fromChar ? 0.45 : 0.3;
    if (flirtyPositive.test(text)) total += fromChar ? 0.55 : 0.35;
    if (negative.test(text)) total -= fromChar ? 0.45 : 0.3;
  });

  const exchangeBonus = messages.length >= 6 ? 0.8 : messages.length >= 3 ? 0.35 : 0;
  return +clamp(total + exchangeBonus, -10, 12).toFixed(2);
}

function dmRelationshipAddsByChar(dms = {}) {
  return Object.entries(dms || {}).reduce((acc, [charId, messages]) => {
    if (!Array.isArray(messages)) return acc;
    const score = scoreDmExchange(messages);
    if (score !== 0) acc[charId] = score;
    return acc;
  }, {});
}

function groupRelationshipAddsByChar(groupChats = {}) {
  return (groupChats || []).reduce((acc, group) => {
    const members = new Set(group?.members || []);
    if (!members.has('player')) return acc;
    members.forEach(charId => {
      if (charId === 'player') return;
      const relevant = (group.messages || []).filter(m => m.role === 'user' || m.charId === charId);
      if (relevant.length < 2) return;
      const score = scoreDmExchange(relevant) * 0.65 + Math.min(1.2, relevant.length * 0.08);
      if (score !== 0) acc[charId] = +(Number(acc[charId] || 0) + score).toFixed(2);
    });
    return acc;
  }, {});
}
