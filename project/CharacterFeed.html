        <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,fontSize:20,cursor:'pointer'}}>‹</button>
        <span style={{color:C.text, fontWeight:700, fontSize:16}}>Post</span>
      </div>

      {/* Main post */}
      <div style={{padding:'16px'}}>
        <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:14}}>
          <Avatar char={char} size={44} onClick={() => onCharClick(char)} />
          <div style={{flex:1}}>
            <div style={{display:'flex', alignItems:'center', gap:4}}>
              <span style={{fontWeight:700, fontSize:15, color:C.text, cursor:'pointer'}} onClick={() => onCharClick(char)}>{char?.name}</span>
              <CharBadge char={char} />
            </div>
            <span style={{color:C.muted, fontSize:13}}>@{char?.handle}</span>
          </div>
          <span style={{color:C.muted, fontSize:20}}>···</span>
        </div>
        <p style={{color:C.text, fontSize:17, lineHeight:1.6, marginBottom:12}}>{renderText(safePostText)}</p>
        {post.photo && <img src={post.photo} alt="" style={{width:'100%', borderRadius:14, marginBottom:12, maxHeight:260, objectFit:'cover'}}/>}
        <p style={{color:C.muted, fontSize:13, marginBottom:12}}>{fmtTime(post.timestamp)} · <strong style={{color:C.text}}>{fmt(post.likes * 7.2 | 0)}</strong> Views</p>
        <div style={{borderTop:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`, padding:'10px 0', display:'flex', gap:16, alignItems:'center'}}>
          <button onClick={() => openReplyTarget({ kind:'post', handle: char?.handle, targetChar: char, sourceText: post.text })} style={{background:C.blue+'22', color:C.blue, border:'none', borderRadius:22, padding:'9px 18px', fontSize:14, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:7}}>
            <ReplyGlyph size={17} /> Reply
          </button>
          <div style={{display:'flex', alignItems:'center', gap:6, color:C.muted, fontSize:13}}>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            {fmt(post.reposts)}
          </div>
          <button onClick={() => setLiked(l=>!l)} style={{display:'flex', alignItems:'center', gap:6, color: liked ? '#e91e8c' : C.muted, background:'none', border:'none', fontSize:13, cursor:'pointer'}}>
            <svg viewBox="0 0 24 24" width="16" height="16" fill={liked?'#e91e8c':'none'} stroke={liked?'#e91e8c':'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            {fmt(post.likes + (liked?1:0))}
          </button>
        </div>
      </div>

      {/* Character reply if exists */}
      {post.reply && replyChar && (
        <div style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
          <div style={{display:'flex', gap:10}}>
            <Avatar char={replyChar} size={38} onClick={() => onCharClick(replyChar)} />
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:4}}>
                <span style={{fontWeight:700, fontSize:14, color:C.text}}>{replyChar.name}</span>
                <CharBadge char={replyChar} />
                <span style={{color:C.muted, fontSize:13}}>@{replyChar.handle}</span>
              </div>
              <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{renderText(safePostReplyText)}</p>
              <div style={{display:'flex', gap:16, marginTop:8, alignItems:'center'}}>
                <span style={{color:C.muted, fontSize:12, display:'flex', alignItems:'center', gap:4}}>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  {fmt(post.likes * 62)}
                </span>
                <span style={{color:C.muted, fontSize:12}}>Reply</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Comments — chars + bots, chronological */}
      {(loadingChars || loadingBots) && mergedReplies.length === 0 && (
        <p style={{color:C.muted, fontSize:13, padding:'14px 16px'}}>Loading comments...</p>
      )}
      {mergedReplies.map((item, mi) => {
        if (item.kind === 'char') {
          const cc = item.data;
          const i = item.idx;
          const cChar = allChars.find(c => c.id === cc.charId);
          if (!cChar) return null;
          const isLiked = !!likedCharComments[i];
          const isReplying = replyingToChar === i;

          async function handleCharReply() {
            if (!charReplyText.trim() || charReplyLoading) return;
            setCharReplyLoading(true);
            const playerReply = charReplyText.trim();
            setCharReplyText('');
            setReplyingToChar(null);
            const replyBaseTs = Number(cc.timestamp || post.timestamp || Date.now());
            const playerEntry = {
              charId: player.id,
              text: playerReply,
              likes: playerReplyLikes(true),
              timestamp: replyBaseTs + 0.1,
              replyTo: cChar.handle,
              nestedReply: false,
            };
            setCharComments(prev => {
              const next = [...prev];
              next.splice(i + 1, 0, playerEntry);
              return next;
            });
            try {
              const priorCharLines = speakerThreadHistory(cChar.id, 5);
              const playfulThreadRule = !isGMZThread && (isKeresThread || looksLikePlayfulBanterText(`${post.text || ''} ${cc.text || ''} ${playerReply || ''}`)) ? PLAYFUL_PUBLIC_THREAD_RULE : '';
              const res = await window.claude.complete({
                messages:[{ role:'user', content:
                  `Write as ${cChar.name}, and output only the public reply text.
${identityPromptFor(cChar)}
Voice cues: ${cChar.personality}.
${pronounRule([cChar, player, char])}
${CHARACTER_TONE_RULE}
${communicationStyleFor(cChar, 'public reply to player')}
${playfulThreadRule}
${stanceFor(cChar)}
${threadRoleContext(post.text || '', char, [player, ...chars, GMZ_CHAR])}
${gmzSpeculationRule}
${threadPatternVarietyGuard([post.text, chronologicalTranscript(12), priorCharLines, cc.text, playerReply])}

Original post by @${char?.handle}: "${post.text}"
Recent visible thread:
${chronologicalTranscript(12) || '(no earlier replies shown)'}
${priorCharLines ? `\nYour previous public lines in this thread:\n${priorCharLines}` : ''}

Your comment: "${cc.text}"
${player.name} (@${player.handle}) replied to you: "${playerReply}"

Write ONE short response to ${player.name}. Stay in character. Preserve the visible order of events: do not claim ${player.name} started, swung first, dodged, or caused something if the recent thread shows someone else did it first. If ${player.name} corrects the timeline, answer that correction instead of repeating the wrong read unless your character is intentionally baiting. Keep your own stance consistent with your previous lines in this thread; do not suddenly reverse your opinion unless you make the reversal part of the joke. Keep the thread roles straight: original poster, tagged handle, alibi/witness, and rumor subject may be different people. If this is about ${player.name} being a hot new transfer with a record/reputation, default toward curiosity, attraction, competitive interest, approval, or trying-not-to-be-impressed. If she is joking, flirting, deflecting, laughing, or clearly doing it for the reaction, meet the humor instead of interrogating her motive. If she roasts you or jokes about shoving you into a locker, do not deny it, redirect it to another character, or claim she is proving someone right; take the hit, escalate the joke, flirt, or answer with a sharper tease. On GMZ threads, they can speculate, ask what GMZ is leaving out, or push an alibi theory if they mark it as gossip. Do not bully her or tear her down unless your character has a specific reason. They can tease, flirt, joke, deflect, speculate, or be awkward instead of angry. 6-24 words. No quotes.
${BANNED_PHRASES_RULE}`
                }]
              });
              const reply = {
                charId: cChar.id,
                text: cleanSocialReplyText(res, cChar, player, { avoidTexts: [post.text, chronologicalTranscript(12), priorCharLines, cc.text, playerReply], playfulBanter: !!playfulThreadRule, selfSubject: cChar.id === post.charId || characterMentionedInText(`${post.text || ''} ${cc.text || ''} ${playerReply || ''}`, cChar), contextText: `${post.text || ''} ${cc.text || ''} ${playerReply || ''}`, roster: [player, ...chars, GMZ_CHAR] }),
                likes: Math.floor(Math.random()*9000),
                timestamp: replyBaseTs + 0.2,
                replyTo: player.handle,
                nestedReply: false,
              };
              setCharComments(prev => {
                const next = [...prev];
                const insertAt = next.findIndex(c => c === playerEntry);
                next.splice((insertAt < 0 ? i + 1 : insertAt) + 1, 0, reply);
                return next;
              });
              triggerCharacterFollowups({
                playerText: playerReply,
                targetChar: null,
                sourceText: cc.text,
                baseTs: replyBaseTs + 0.25,
                mode: 'direct',
                excludeIds: [cChar.id],
                replyToHandle: cChar.handle,
              });
            } catch(e) {}
            setCharReplyLoading(false);
          }

          return (
            <div key={`char-${i}`} style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
              <div style={{display:'flex', gap:10, marginLeft: 0}}>
                <Avatar char={cChar} size={38} onClick={() => onCharClick(cChar)}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:4, marginBottom:2, flexWrap:'wrap'}}>
                    <span style={{fontWeight:700, fontSize:14, color:C.text, cursor:'pointer'}} onClick={() => onCharClick(cChar)}>{cChar.name}</span>
                    <CharBadge char={cChar} />
                    <span style={{color:C.muted, fontSize:13}}>@{cChar.handle}</span>
                    <span style={{color:C.muted, fontSize:13}}>·</span>
                    <span style={{color:C.muted, fontSize:13}}>{timeAgo(cc.timestamp || post.timestamp)}</span>
                  </div>
                  <p style={{color:C.text, fontSize:14, lineHeight:1.5, margin:0}}>{renderText(visibleReplyText(cc.text, cc.replyTo))}</p>
                  <div style={{display:'flex', gap:24, marginTop:10, alignItems:'center'}}>
                    {cChar.id !== player.id && (
                      <button
                        type="button"
                        onClick={(e) => {
                          e.stopPropagation();
                          openReplyTarget({ kind:'char', handle:cChar.handle, targetChar:cChar, sourceText:cc.text, replyBaseTs:Number(cc.timestamp || post.timestamp || Date.now()) });
                        }}
                        style={{background:'none', border:'none', color: C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4, padding:'6px 8px 6px 0', minHeight:30}}>
                        <ReplyGlyph size={14} />
                        Reply
                      </button>
                    )}
                    <button onClick={() => setLikedCharComments(p => ({...p, [i]: !p[i]}))}
                      style={{background:'none', border:'none', color: isLiked ? C.red : C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4}}>
                      <svg viewBox="0 0 24 24" width="14" height="14" fill={isLiked?C.red:'none'} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                      {fmt((cc.likes||0) + (isLiked?1:0))}
                    </button>
                  </div>
                  {false && isReplying && cChar.id !== player.id && (
                    <div style={{marginTop:10, display:'flex', gap:8, alignItems:'flex-end'}}>
                      <Avatar char={player} size={28}/>
                      <div style={{flex:1, background:C.card2, borderRadius:12, border:`1px solid ${charReplyText.trim() ? C.blue+'66' : C.border}`, padding:'8px 12px', transition:'border-color 0.2s'}}>
                        <input
                          value={charReplyText}
                          onChange={e => setCharReplyText(e.target.value)}
                          onKeyDown={e => e.key === 'Enter' && handleCharReply()}
                          placeholder="Write a reply…"
                          style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:13, outline:'none'}}
                          autoFocus
                        />
                      </div>
                      <button
                        onClick={handleCharReply}
                        disabled={!charReplyText.trim() || charReplyLoading}
                        style={{background: charReplyText.trim() ? C.blue : C.card2, color: charReplyText.trim() ? '#fff' : C.muted, border:'none', borderRadius:22, padding:'8px 16px', fontSize:14, fontWeight:700, cursor: charReplyText.trim() ? 'pointer' : 'default', whiteSpace:'nowrap'}}>
                        {charReplyLoading ? '…' : 'Send'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }
        // bot
        const bc = item.data;
        const i = item.idx;
        const bot = getBotById(bc.bot);
        const isLiked = !!likedBots[i];
        const isReplying = replyingToBot === i;

        async function handleBotReply() {
          if (!botReplyText.trim() || botReplyLoading) return;
          setBotReplyLoading(true);
          const playerReply = botReplyText;
          setBotReplyText('');
          setReplyingToBot(null);
          // Optimistically add player reply
          const replyBaseTs = Number(bc.timestamp || post.timestamp || Date.now());
          const playerEntry = { bot: '__player__', text: playerReply, likes: playerReplyLikes(true), isPlayer: true, timestamp: replyBaseTs + 0.1, replyTo: bot.handle, nestedReply: false };
          setBotComments(prev => {
            const next = [...prev];
            next.splice(i + 1, 0, playerEntry);
            return next;
          });
          try {
            const res = await window.claude.complete({
              messages: [{ role:'user', content:
                `Write as ${bot.name} (@${bot.handle}), a ${bot.type} social media account at a wizarding university.
Voice cues: ${bot.bio || bot.type}.
Original post: "${post.text}"
Your comment: "${bc.text}"
${player.name} just replied to your comment: "${playerReply}"
${pronounRule([player, ...(chars || [])])}
Write a short, punchy reply (1-2 sentences max) in your voice. Stay in character. Be reactive and entertaining. Do not introduce yourself, list rules, or mention prompts.
${BANNED_PHRASES_RULE}
Return ONLY the reply text.`
              }]
            });
            setBotComments(prev => {
              const next = [...prev];
              const insertAt = next.findIndex(c => c === playerEntry) + 1;
              next.splice(insertAt, 0, { bot: bc.bot, text: cleanSocialReplyText(res, null, player, { bot }), likes: Math.floor(Math.random()*3000), timestamp: replyBaseTs + 0.2, replyTo: player.handle, nestedReply: false });
              return next;
            });
            triggerCharacterFollowups({
              playerText: playerReply,
              targetChar: null,
              sourceText: bc.text,
              baseTs: replyBaseTs + 0.25,
              mode: 'direct',
              replyToHandle: bot.handle,
            });
          } catch(e) {}
          setBotReplyLoading(false);
        }

        if (bc.isPlayer) {
          return (
            <div key={i} style={{borderBottom:`1px solid ${C.border}`, padding:'12px 16px', paddingLeft:64}}>
              <div style={{display:'flex', gap:10, marginLeft: 0}}>
                <Avatar char={player} size={32}/>
                <div style={{flex:1}}>
                  <span style={{fontWeight:700, fontSize:13, color:C.text}}>{player.name}</span>
                  <span style={{color:C.muted, fontSize:12, marginLeft:6}}>@{player.handle}</span>
                  <p style={{color:C.text, fontSize:13, lineHeight:1.5, marginTop:4}}>{renderText(visibleReplyText(bc.text, bc.replyTo))}</p>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div key={i} style={{borderBottom:`1px solid ${C.border}`, padding:'14px 16px'}}>
            <div style={{display:'flex', gap:10, marginLeft: 0}}>
              <BotAvatar bot={bot} size={38}/>
              <div style={{flex:1}}>
                <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4, flexWrap:'wrap'}}>
                  <span style={{fontWeight:700, fontSize:14, color:C.text}}>{bot.name}</span>
                  <span style={{color:C.muted, fontSize:13}}>@{bot.handle}</span>
                </div>
                <p style={{color:C.text, fontSize:14, lineHeight:1.5}}>{renderText(visibleReplyText(bc.text, bc.replyTo))}</p>
                <div style={{display:'flex', gap:20, marginTop:10, alignItems:'center'}}>
                  <button
                    type="button"
                    onClick={(e) => {
                      e.stopPropagation();
                      openReplyTarget({ kind:'bot', handle:bot.handle, bot, sourceText:bc.text, replyBaseTs:Number(bc.timestamp || post.timestamp || Date.now()) });
                    }}
                    style={{background:'none', border:'none', color: C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4, padding:'6px 8px 6px 0', minHeight:30}}>
                    <ReplyGlyph size={14} />
                    Reply
                  </button>
                  <button
                    onClick={() => setLikedBots(prev => ({...prev, [i]: !prev[i]}))}
                    style={{background:'none', border:'none', color: isLiked ? '#e91e8c' : C.muted, fontSize:12, cursor:'pointer', display:'flex', alignItems:'center', gap:4}}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill={isLiked ? '#e91e8c' : 'none'} stroke={isLiked ? '#e91e8c' : 'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    {fmt(bc.likes + (isLiked ? 1 : 0))}
                  </button>
                </div>
                {false && isReplying && (
                  <div style={{marginTop:10, display:'flex', gap:8, alignItems:'flex-end'}}>
                    <Avatar char={player} size={28}/>
                    <div style={{flex:1, background:C.card2, borderRadius:12, border:`1px solid ${botReplyText.trim() ? C.blue+'66' : C.border}`, padding:'8px 12px', transition:'border-color 0.2s'}}>
                      <input
                        value={botReplyText}
                        onChange={e => setBotReplyText(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleBotReply()}
                        placeholder="Write a reply…"
                        style={{width:'100%', background:'none', border:'none', color:C.text, fontSize:13, outline:'none'}}
                        autoFocus
                      />
                    </div>
                    <button
                      onClick={handleBotReply}
                      disabled={!botReplyText.trim() || botReplyLoading}
                      style={{background: botReplyText.trim() ? C.blue : C.card2, color: botReplyText.trim() ? '#fff' : C.muted, border:'none', borderRadius:22, padding:'8px 16px', fontSize:14, fontWeight:700, cursor: botReplyText.trim() ? 'pointer' : 'default', whiteSpace:'nowrap'}}>
                      {botReplyLoading ? '…' : 'Send'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}
      {(loadingChars || loadingBots) && mergedReplies.length > 0 && (
        <p style={{color:C.muted, fontSize:12, padding:'10px 16px', textAlign:'center', fontStyle:'italic'}}>more replies coming in...</p>
      )}
      <div style={{height: replyOpen ? 170 : 130}}/>
    </div>

    {/* Reply input bar */}
    {replyOpen && (
      <div style={{
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.28)',
        flexShrink:0,
        zIndex:8,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${replyText.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={replyInputRef}
            value={replyText}
            onChange={e => setReplyText(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Escape') { setReplyOpen(false); setReplyText(''); setReplyTarget(null); }
              if (e.key === 'Enter' && !e.shiftKey && replyText.trim()) {
                e.preventDefault();
                submitPostReply();
              }
            }}
            placeholder="Write a reply…"
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={replyText}
            allChars={allChars}
            onPick={handle => {
              setReplyText(t => applyMentionToText(t, handle));
              setTimeout(() => replyInputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button
          onClick={submitPostReply}
          disabled={!replyText.trim()}
          style={{background: replyText.trim() ? C.blue : C.card2, color:'#fff', border:'none', borderRadius:'50%', width:48, height:48, minWidth:48, cursor: replyText.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0}}>
          →
        </button>
      </div>
    )}
    </div>
  );
}

// ─── Live Match Modal ─────────────────────────────────────────────
function LiveMatchModal({ match, chars, player, onClose, onPostToFeed, onMatchEnd }) {
  const [phase, setPhase] = useState('kickoff'); // kickoff | live | postgame
  const [events, setEvents] = useState([]);
  const [visibleIdx, setVisibleIdx] = useState(-1);
  const [score, setScore] = useState({ home:0, away:0 });
  const [loading, setLoading] = useState(false);
  const slyColor = '#2a8a4a';
  const gryfColor = '#c41e3a';
  const homeColor = match.home === 'Slytherin' ? slyColor : gryfColor;
  const awayColor = match.away === 'Slytherin' ? slyColor : gryfColor;

  function startMatch() {
    const evts = generateMatchEvents(match, chars, player);
    setEvents(evts);
    setPhase('live');
    setVisibleIdx(0);
    // Post kickoff to feed
    onPostToFeed(`KICKOFF: ${match.home} vs ${match.away} — ${match.location}. It's on.`, '__gmz__');
  }

  function nextEvent() {
    const ev = events[visibleIdx];
    if (!ev) return;
    // Update score
    if (ev.type === 'goal') {
      const isHome = ev.team !== 'away';
      setScore(s => isHome ? {...s, home: s.home+10} : {...s, away: s.away+10});
    }
    if (ev.type === 'snitch') {
      // Snitch caught — random team catches, +150
      const slyWins = Math.random() > 0.45;
      setScore(s => slyWins
        ? (match.home==='Slytherin' ? {...s, home:s.home+150} : {...s, away:s.away+150})
        : (match.home==='Gryffindor' ? {...s, home:s.home+150} : {...s, away:s.away+150})
      );
      // Post to feed
      onPostToFeed(ev.text, '__gmz__');
      setTimeout(() => setPhase('postgame'), 600);
      return;
    }
    // Post event to feed
    onPostToFeed(ev.text, '__gmz__');
    if (visibleIdx < events.length - 1) setVisibleIdx(i => i+1);
  }

  const currentEv = events[visibleIdx];
  const homeWon = score.home > score.away;

  return (
    <div style={{position:'absolute', inset:0, zIndex:200, background:C.bg, display:'flex', flexDirection:'column'}}>
      {/* Header */}
      <div style={{padding:'14px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:10}}>

            <div style={{fontSize:60, marginBottom:20}}>🏟️</div>
            <div style={{display:'flex', alignItems:'center', gap:16, marginBottom:24, justifyContent:'center'}}>
              <div style={{textAlign:'center'}}>

                <p style={{color:homeColor, fontWeight:800, fontSize:15}}>{match.home}</p>
              </div>
              <span style={{color:C.muted, fontSize:24, fontWeight:700}}>vs</span>
              <div style={{textAlign:'center'}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:awayColor, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, margin:'0 auto 6px'}}>🦁</div>
                <p style={{color:awayColor, fontWeight:800, fontSize:15}}>{match.away}</p>

            </div>
            <p style={{color:C.muted, fontSize:13, marginBottom:24}}>{match.location}</p>
            <button onClick={startMatch} style={{background:C.blue, color:'#fff', border:'none', borderRadius:20, padding:'14px 40px', fontSize:16, fontWeight:700, cursor:'pointer'}}>

        {phase === 'live' && currentEv && (
          <div style={{width:'100%', maxWidth:360}}>
            {/* Current event card */}
            <div style={{background:C.card2, borderRadius:20, padding:'24px 20px', marginBottom:20, textAlign:'center', minHeight:160, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:12}}>

            {/* Score */}
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', background:C.card2, borderRadius:14, padding:'12px 20px', marginBottom:20}}>

            {/* Event counter */}
            <div style={{display:'flex', gap:4, justifyContent:'center', marginBottom:20}}>
              {events.map((e,i) => (
                <div key={i} style={{width: i===visibleIdx ? 20 : 6, height:6, borderRadius:3, background: i<=visibleIdx ? C.blue : C.border, transition:'all 0.3s'}}/>
              ))}

            <button onClick={nextEvent} style={{width:'100%', background:C.text, color:C.bg, border:'none', borderRadius:14, padding:'14px', fontSize:15, fontWeight:700, cursor:'pointer'}}>
              {currentEv.type === 'snitch' ? '🌟 Catch the Snitch' : 'Next →'}

        {phase === 'postgame' && (
          <div style={{textAlign:'center', width:'100%', maxWidth:360}}>
            <div style={{fontSize:52, marginBottom:12}}>{homeWon === (match.home==='Slytherin') ? '🐍' : '🦁'}</div>
            <h2 style={{color:C.text, fontSize:22, fontWeight:800, marginBottom:4}}>
              {score.home === score.away ? 'Draw' : `${score.home > score.away ? match.home : match.away} wins`}
            </h2>
            <div style={{display:'flex', justifyContent:'center', gap:20, marginBottom:24}}>
              <div style={{textAlign:'center'}}>
                <p style={{color:homeColor, fontWeight:800, fontSize:32}}>{score.home}</p>
                <p style={{color:C.muted, fontSize:12}}>{match.home}</p>

              <div style={{textAlign:'center'}}>

            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <button onClick={() => { onMatchEnd(score); onClose(); }} style={{background:C.blue, color:'#fff', border:'none', borderRadius:14, padding:'13px', fontSize:15, fontWeight:700, cursor:'pointer'}}>

// ─── Feed Screen ──────────────────────────────────────────────────
function FeedScreen({ chars, player, feed, setFeed, day, onCharClick, onEvent, setTab, onCompose, onOpenThread, onWatchMatch, currentMatch, onRefreshFeed, tweaks = TWEAK_DEFAULTS, onOpenTweaks }) {
  const [showEvent, setShowEvent] = useState(false);
  const [pullStart, setPullStart] = useState(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const currentEvent = EVENT_POOL[day % EVENT_POOL.length];

  function beginPull(e) {
    if (e.currentTarget.scrollTop <= 0) setPullStart(e.touches[0].clientY);
  }

  function movePull(e) {
    if (pullStart === null || e.currentTarget.scrollTop > 0 || refreshing) return;
    const distance = Math.max(0, e.touches[0].clientY - pullStart);
    setPullDistance(Math.min(distance, 92));
  }

  async function endPull() {
    if (pullDistance > 68 && onRefreshFeed) {
      setRefreshing(true);
      await onRefreshFeed();
      setRefreshing(false);
    }
    setPullStart(null);
    setPullDistance(0);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', minHeight:0}}>
      <div
        onTouchStart={beginPull}
        onTouchMove={movePull}
        onTouchEnd={endPull}
        onTouchCancel={endPull}
        style={{flex:1, overflowY:'auto', position:'relative'}}
      >
        {/* Header */}
        <div style={{padding:'10px 16px', borderBottom:`1px solid ${C.border}`, position:'sticky', top:0, background:C.bg, zIndex:10}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <div style={{display:'flex', alignItems:'center', gap:6}}>
              <span style={{fontSize:16}}>☀️</span>
              <span style={{color:C.text, fontWeight:700}}>Day {day}</span>
            </div>
            <div style={{display:'flex', gap:8}}>
              <button
                onClick={onOpenTweaks}
                title="Tweaks"
                style={{width:42, height:42, background:C.card2, border:'none', color:C.muted, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}
              >
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <path d="M4 7h10" />
                  <path d="M18 7h2" />
                  <path d="M4 17h2" />
                  <path d="M10 17h10" />
                  <circle cx="16" cy="7" r="2" />
                  <circle cx="8" cy="17" r="2" />
                </svg>
              </button>
              <div style={{width:42, height:42, background:C.card2, borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}} onClick={() => setTab('profile')}>
                <svg viewBox="0 0 24 24" width="24" height="24" fill={C.muted}><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
              </div>
            </div>
          </div>

        </div>

        {(pullDistance > 0 || refreshing) && (
          <div style={{height:refreshing ? 42 : Math.max(26, pullDistance * 0.55), display:'flex', alignItems:'center', justifyContent:'center', color:C.muted, fontSize:12, transition:refreshing?'height 0.18s ease':'none'}}>
            {refreshing ? 'Loading new posts...' : pullDistance > 68 ? 'Release to refresh' : 'Pull for new posts'}
          </div>
        )}

        {/* Match day banner */}
        <MatchDayBanner match={currentMatch} day={day} onWatch={onWatchMatch} />

        {/* Posts */}
        {feed.map(post => (
          <PostCard key={post.id} post={post} chars={chars} player={player} onCharClick={onCharClick} onOpenThread={onOpenThread} tweaks={tweaks} />
        ))}

        {/* Spacer */}
        <div style={{height:18}}/>
      </div>

      {/* Feed actions */}
      <div style={{display:'flex', justifyContent:'center', gap:12, padding:'10px 16px 12px', background:C.bg, borderTop:`1px solid ${C.border}`, flexShrink:0}}>
        <button onClick={() => onEvent(currentEvent)} style={{
          background:'linear-gradient(135deg, #4dabf7, #2280d2)', color:'#fff', border:'none',
          borderRadius:28, padding:'13px 28px', fontSize:16, fontWeight:700, cursor:'pointer',
          display:'flex', alignItems:'center', gap:8, boxShadow:'0 3px 14px rgba(77,171,247,0.28)',
        }}>

        </button>
        <button onClick={onCompose} style={{
          background:C.blue, color:'#fff', border:'none',
          borderRadius:'50%', width:50, height:50, fontSize:28, cursor:'pointer',

        }}>+</button>

  );

// ─── Messages Screen ──────────────────────────────────────────────
function MessagesScreen({ chars, player, dms, onOpenChat, dmNotifs = {}, setDmNotifs, groupChats = [], onOpenGroup, setGroupChats }) {
  const totalDmNotifs = Object.values(dmNotifs).reduce((a,b) => a+b, 0);
  const [creatingGroup, setCreatingGroup] = useState(false);
  const [groupName, setGroupName] = useState('');
  const [selectedMembers, setSelectedMembers] = useState([]);
  // GMZ can always receive tips, even before they have opened a DM thread.
  const charsWithGmz = [GMZ_CHAR, ...chars.filter(c => c.id !== GMZ_CHAR.id)];
  const visibleGroupChats = groupChats.filter(gc => (gc.members || []).includes('player'));

  function toggleMember(id) {
    setSelectedMembers(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  function createGroupChat() {
    const members = ['player', ...selectedMembers.filter(Boolean)];
    if (members.length < 2) return;
    const memberNames = selectedMembers.map(id => chars.find(c => c.id === id)?.name.split(' ')[0]).filter(Boolean);
    const next = {
      id: `gc-custom-${Date.now()}`,
      name: groupName.trim() || memberNames.join(', ') || 'New Group Chat',
      members,
      messages: [],
      custom: true,
    };
    setGroupChats(gs => [next, ...gs]);
    setCreatingGroup(false);
    setGroupName('');
    setSelectedMembers([]);
    onOpenGroup(next);
  }

  return (
    <div style={{flex:1, overflowY:'auto'}}>
      <div style={{padding:'16px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <h1 style={{color:C.text, fontSize:22, fontWeight:700}}>Messages</h1>
        <button onClick={() => setCreatingGroup(v => !v)} style={{background:C.blue, color:'#fff', border:'none', borderRadius:12, minWidth:44, height:40, fontSize:24, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>+</button>
      </div>

      {creatingGroup && (
        <div style={{margin:'10px 12px', padding:14, background:C.card2, border:`1px solid ${C.border}`, borderRadius:14}}>
          <input
            value={groupName}
            onChange={e => setGroupName(e.target.value)}
            placeholder="Group chat name"
            style={{width:'100%', background:C.card, border:`1px solid ${C.border}`, color:C.text, borderRadius:10, padding:'11px 12px', fontSize:14, outline:'none', marginBottom:12}}
          />
          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:12}}>
            {chars.map(char => {
              const selected = selectedMembers.includes(char.id);
              return (
                <button key={char.id} onClick={() => toggleMember(char.id)} style={{display:'flex', alignItems:'center', gap:7, background:selected ? C.blue+'22' : C.card, color:selected ? C.blue : C.text, border:`1px solid ${selected ? C.blue : C.border}`, borderRadius:999, padding:'7px 10px', fontSize:13, cursor:'pointer'}}>
                  <Avatar char={char} size={22}/>
                  {char.name.split(' ')[0]}
                </button>
              );
            })}
          </div>
          <button onClick={createGroupChat} disabled={!selectedMembers.length} style={{width:'100%', background:selectedMembers.length ? C.blue : C.card, color:selectedMembers.length ? '#fff' : C.muted, border:'none', borderRadius:12, padding:'12px', fontSize:14, fontWeight:700, cursor:selectedMembers.length ? 'pointer' : 'default'}}>
            Create Chat
          </button>
        </div>
      )}

      {/* Group chats */}
      {visibleGroupChats.length > 0 && (
        <>
          <div style={{padding:'10px 16px 4px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Group Chats</span>
          </div>
          {visibleGroupChats.map(gc => {
            const memberChars = gc.members.map(id => id === 'player' ? player : chars.find(c => c.id === id)).filter(Boolean);
            const lastMsg = gc.messages[gc.messages.length - 1];
            const lastSender = lastMsg ? (lastMsg.charId === 'player' ? player : chars.find(c=>c.id===lastMsg.charId) || null) : null;
            const groupNotifKey = `group:${gc.id}`;
            const notifCount = dmNotifs[groupNotifKey] || 0;
            const hasUnread = notifCount > 0;
            return (
              <div key={gc.id} onClick={() => { setDmNotifs && setDmNotifs(n => ({...n, [groupNotifKey]: 0})); onOpenGroup(gc); }} style={{
                display:'flex', gap:12, padding:'12px 16px', borderBottom:`1px solid ${C.border}`,
                cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
              }}>
                <div style={{position:'relative', width:48, height:48, flexShrink:0}}>
                  {memberChars.slice(0,2).map((m,i) => (
                    <div key={m.id} style={{position:'absolute', top: i===0?0:'auto', bottom: i===1?0:'auto', left: i===0?0:'auto', right: i===1?0:'auto'}}>
                      <Avatar char={m} size={28}/>
                    </div>
                  ))}
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <span style={{fontWeight:700, fontSize:15, color:C.text}}>{gc.name}</span>
                  <p style={{color:C.muted, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                    {lastMsg ? `${lastSender?.name?.split(' ')[0] || 'Someone'}: ${lastMsg.text}` : 'Start the conversation'}
                  </p>
                </div>
                {hasUnread && (
                  <div style={{background:C.blue, color:'#fff', minWidth:22, height:22, borderRadius:999, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, padding:'0 6px'}}>
                    {notifCount}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{padding:'10px 16px 4px'}}>
            <span style={{color:C.muted, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:1}}>Direct Messages</span>
          </div>
        </>
      )}

      {/* DMs */}
      {charsWithGmz.map(char => {
        const msgs = dms[char.id] || [];
        const last = msgs[msgs.length - 1];
        const notifCount = dmNotifs[char.id] || 0;
        const hasUnread = notifCount > 0;
        return (
          <div key={char.id} onClick={() => { onOpenChat(char); setDmNotifs && setDmNotifs(n => ({...n, [char.id]: 0})); }} style={{
            display:'flex', gap:12, padding:'14px 16px', borderBottom:`1px solid ${C.border}`,
            cursor:'pointer', alignItems:'center', background: hasUnread ? C.card2 : 'transparent',
          }}>
            <div style={{position:'relative'}}>
              <Avatar char={char} size={48} />
              <div style={{position:'absolute', bottom:0, right:0, background:C.purple, borderRadius:'50%', width:16, height:16, display:'flex', alignItems:'center', justifyContent:'center', border:`2px solid ${C.bg}`}}>
                <span style={{fontSize:8}}>✦</span>
              </div>
            </div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{display:'flex', alignItems:'center', gap:4}}>
                <span style={{fontWeight: hasUnread ? 800 : 700, fontSize:15, color:C.text}}>{char.name}</span>
                <CharBadge char={char} />
              </div>
              <p style={{color: hasUnread ? C.text : C.muted, fontWeight: hasUnread ? 600 : 400, fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2}}>
                {last ? (last.role === 'char' ? last.text : `You: ${last.text}`) : (char.id === GMZ_CHAR.id ? 'Send an anonymous tip...' : `Say hi to ${char.name.split(' ')[0]}...`)}
              </p>
            </div>
            {hasUnread && (
              <div style={{background:'#e91e8c', borderRadius:'50%', width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#fff', flexShrink:0}}>
                {notifCount}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Chat Screen ──────────────────────────────────────────────────
function buildSystemPrompt(char, player, allChars, feed, dms, eventLog = [], groupChats = [], latestUserText = '') {
  // Recent feed posts (last 12, newest first)
  const recentPosts = [...feed].slice(0, 12).map(p => {
    const poster = allChars.find(c => c.id === p.charId);
    const lines = [`@${poster?.handle || p.charId}: "${p.text}"`];
    if (p.reply) {
      const replier = allChars.find(c => c.id === p.reply.charId);
      lines.push(`  ↳ @${replier?.handle || p.reply.charId} replied: "${p.reply.text}"`);
    }
    return lines.join('\n');
  }).join('\n');

  // Relationships with other chars
  const relLines = allChars
    .filter(c => c.id !== char.id)
    .map(c => {
      const val = char.relationships?.[c.id];
      const feel = val === undefined ? 'neutral' : val > 60 ? 'close friends / very positive' : val > 20 ? 'friendly' : val > 0 ? 'acquaintances' : val > -30 ? 'tense / complicated' : 'enemies / strongly negative';
      return `- ${identityFactsFor(c)}: ${feel}${val !== undefined ? ` (${val > 0 ? '+':''}${val}%)` : ''}`;
    }).join('\n');

  // Past DM history summary (only if exists)
  const pastMsgs = (dms[char.id] || []);
  const historyNote = pastMsgs.length > 0
    ? `\nYou and ${player.name} have been talking. Here are your recent exchanges — reference them naturally if relevant:\n` +
      pastMsgs.slice(-10).map(m => `${m.role === 'user' ? player.name : char.name}: "${m.text}"`).join('\n')
    : '';
  const effectiveRel = effectivePlayerRelationship(char, eventLog, dms, groupChats).value;
  const appMemory = recentMemoryContext({ feed, eventLog, groupChats, dms, char, player, allChars, channel:'dm' });

  return `Write as ${char.name} (@${char.handle}), a real person with a social media presence.

${identityPromptFor(char)}
Pronouns: ${pronounsFor(char)}
Voice cues: ${char.personality}
Profile context: ${char.bio}. ${char.description}

${pronounRule(allChars)}
${CHARACTER_TONE_RULE}
${communicationStyleFor(char, 'private DM')}
${relationshipLogicFor(char)}
${dmSituationRulesFor(char, player, latestUserText)}
${playerStance(char, player, effectiveRel)}
Current effective relationship with ${player.name}, including this DM history: ${effectiveRel > 0 ? '+' : ''}${effectiveRel}%. Keep that relationship level consistent without mentioning the number.
${appMemory}

YOUR RELATIONSHIPS WITH OTHERS:
${relLines || 'No known relationships yet.'}

WHAT'S BEEN HAPPENING ON THE FEED RECENTLY:
${recentPosts || 'Nothing yet.'}
${historyNote}

This is a private DM with ${player.name} (@${player.handle}).

RULES:
- Stay completely in character. Never break the fourth wall or mention being an AI.
- Output ONLY the DM message you would send. Do not say "I'm ready", "Understood", "I know the rules", "What's my reply", or describe the task.
- Do not introduce yourself, list your traits, summarize continuity rules, or explain your relationship score.
- Use the pronouns listed above exactly. Do not misgender anyone, including in gossip or third-person comments.
- Treat house/team/player status like fixed identity. If you are talking about your own house or Quidditch team, use we/us/our. If you are not on a Quidditch team, do not speak as if you play.
- Be brief: 1-3 sentences max unless pushed.
- Reference the feed naturally if it's relevant — bring up posts, gossip, what others did.
- Remember prior events, scenes, DMs, and group chats from app memory when they are relevant to your character. Do not borrow another character's concerns, priorities, or relationships as your own.
- If ${player.name} tells you what happened in a completed scene, accept it as the current shared reality and move forward from it. Do not remain in a pre-scene "are you okay / what happened" mentality after she has recapped the scene.
- Do not ask whether you should understand an obvious relationship consequence. If someone mentions your sister, best friend, ex, captain, or teammate reacting to gossip about you, reason from what you know about that person only if that relationship is actually yours.
- Remember what ${player.name} has told you in this conversation.
- Your personality drives EVERYTHING: tone, vocabulary, what you care about, what you ignore.
- React to ${player.name}'s messages the way YOUR character would — not generically.
- If ${player.name} makes a playful private bid like "I can fix that" or "I can be more annoying", treat it as banter. Do not turn it into "prove it", "do it on the feed", or a public challenge unless she explicitly asks for one.
${BANNED_PHRASES_RULE}`;
}

function gmzTipReceiptText() {
  const receipts = [
    'tip received. if this makes the feed, your name stays out of it.',
    'received. source protected, chaos pending.',
    'noted. gmz is reviewing this with extremely unserious professionalism.',
    'tip logged. if anyone asks, this arrived by owl from nowhere.',
  ];
  return receipts[Math.floor(Math.random() * receipts.length)];
}

function ChatScreen({ char, player, allChars, feed, dms, eventLog = [], groupChats = [], setDms, onBack, onGMZTipSubmit }) {
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const msgs = dms[char.id] || [];
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const isGMZChat = char.id === GMZ_CHAR.id;

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollTop = 9999;
  }, [msgs]);

  async function send() {
    if (!input.trim() || loading) return;
    const outgoingText = input.trim();
    const userMsg = { role:'user', text: outgoingText, id: Date.now() };
    const newMsgs = [...msgs, userMsg];
    setDms(d => ({ ...d, [char.id]: newMsgs, [`${char.id}_seen`]: false }));
    setInput('');
    setLoading(true);
    if (isGMZChat) {
      setTimeout(() => {
        const charMsg = { role:'char', text: gmzTipReceiptText(), id: Date.now()+1, tipReceipt: true };
        setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg], [`${char.id}_seen`]: false }));
        setLoading(false);
      }, 650);
      if (onGMZTipSubmit) {
        setTimeout(() => onGMZTipSubmit(outgoingText), 1600);
      }
      return;
    }
    try {
      // Smart silence: reserved/quiet chars sometimes don't reply
      const quietPersonalities = ['reserved', 'quiet', 'deadpan', 'minimal'];
      const isQuiet = quietPersonalities.some(q => (char.personality||'').toLowerCase().includes(q));
      const silenceChance = isQuiet ? 0.25 : 0.08;
      const mustAnswer = dmNeedsReply(outgoingText, char, eventLog, player);
      if (!mustAnswer && Math.random() < silenceChance && msgs.length > 0) {
        // Show "seen" indicator after a delay
        setTimeout(() => {
          setDms(d => ({ ...d, [`${char.id}_seen`]: true }));
          setLoading(false);
        }, 1800);
        return;
      }
      const systemPrompt = buildSystemPrompt(char, player, allChars, feed, dms, eventLog, groupChats, outgoingText);
      const history = newMsgs.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
      const reply = await window.claude.complete({
        messages: [
          { role:'user', content: systemPrompt },
          ...history,
        ]
      });
      const charMsg = { role:'char', text: cleanChatText(reply, char, player, false, { latestUserText: outgoingText }), id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), charMsg] }));
    } catch(e) {
      const errMsg = { role:'char', text: '...', id: Date.now()+1 };
      setDms(d => ({ ...d, [char.id]: [...(d[char.id]||[]), errMsg] }));
    }
    setLoading(false);
  }

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', gap:12}}>
        <button onClick={onBack} style={{background:'none', border:'none', color:C.blue, fontSize:16, cursor:'pointer', padding:'0 4px 0 0'}}>‹</button>
        <Avatar char={char} size={36} />
        <div>
          <div style={{display:'flex', alignItems:'center', gap:4}}>
            <span style={{fontWeight:700, color:C.text}}>{char.name}</span>
            <CharBadge char={char} />
          </div>
          <span style={{color:C.muted, fontSize:12}}>@{char.handle}</span>
        </div>
      </div>
      {/* Messages */}
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10}}>
        {msgs.length === 0 && (
          <div style={{textAlign:'center', color:C.muted, fontSize:14, marginTop:40}}>
            <div style={{fontSize:40, marginBottom:8}}><Avatar char={char} size={60} /></div>
            <p style={{marginTop:8}}><strong style={{color:C.text}}>{char.name}</strong></p>
            <p style={{marginTop:4, fontSize:13}}>{char.bio}</p>
            <p style={{marginTop:12, fontSize:12}}>{isGMZChat ? 'Submit an anonymous tip' : 'Start a conversation'}</p>
          </div>
        )}
        {msgs.map(m => (
          <div key={m.id} style={{display:'flex', flexDirection: m.role === 'user' ? 'row-reverse' : 'row', gap:8, alignItems:'flex-end'}}>
            {m.role !== 'user' && <Avatar char={char} size={28} />}
            <div style={{
              maxWidth:'75%', padding:'10px 14px', borderRadius: m.role === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              background: m.role === 'user' ? C.blue : C.card2, color:'#fff', fontSize:14, lineHeight:1.5,
            }}>{renderLinkedText(m.text, allChars)}</div>
          </div>
        ))}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28} />
            <div style={{padding:'10px 16px', borderRadius:'18px 18px 18px 4px', background:C.card2, color:C.muted, fontSize:14}}>
              <span style={{animation:'blink 1s infinite'}}>···</span>
            </div>
          </div>
        )}
        {!loading && dms[`${char.id}_seen`] && msgs.length > 0 && msgs[msgs.length-1].role === 'user' && (
          <div style={{textAlign:'right', color:C.muted, fontSize:11, padding:'0 4px'}}>Seen ✓</div>
        )}
      </div>
      {/* Input */}
      <div style={{
        padding:`10px 12px ${bottomSafe(10)} 12px`,
        borderTop:`1px solid ${C.border}`,
        background:C.bg,
        display:'flex',
        gap:10,
        alignItems:'flex-end',
        boxShadow:'0 -10px 24px rgba(0,0,0,0.24)',
        flexShrink:0,
      }}>
        <Avatar char={player} size={34}/>
        <div style={{
          flex:1,
          minWidth:0,
          background:C.card2,
          borderRadius:18,
          border:`1px solid ${input.trim() ? C.blue+'66' : C.border}`,
          padding:'10px 13px',
          transition:'border-color 0.2s',
        }}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => {
              if (e.key === 'Enter' && !e.shiftKey && input.trim()) {
                e.preventDefault();
                send();
              }
            }}
            placeholder={isGMZChat ? 'Submit a tip...' : `Message ${char.name.split(' ')[0]}...`}
            rows={1}
            style={{
              width:'100%',
              minHeight:42,
              maxHeight:96,
              resize:'none',
              background:'none',
              border:'none',
              color:C.text,
              fontSize:16,
              lineHeight:1.35,
              outline:'none',
              display:'block',
            }}
          />
          <MentionSuggestions
            text={input}
            allChars={allChars}
            onPick={handle => {
              setInput(t => applyMentionToText(t, handle));
              setTimeout(() => inputRef.current?.focus(), 20);
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? C.blue : C.card2, border:'none', borderRadius:'50%', width:48, height:48, minWidth:48,
          color:'#fff', cursor: input.trim() ? 'pointer' : 'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20,
        }}>
          →
        </button>
      </div>
    </div>
  );
}

  { id:'fight',    label:'Heated argument',    emoji:'⚡', color:'#ef4444' },

function scoreSceneRelationshipForChar(char, sceneMessages = [], vibe) {
  if (!char) return 0;
  const relevant = (sceneMessages || []).filter(m => m.role === 'user' || m.charId === char.id);
  if (relevant.length < 2) return 0;
  const text = relevant.map(m => m.text || '').join(' ');
  const warm = /(trust|honest|honesty|respect|appreciate|soft|care|close|stay|wanted|miss|like you|good|beautiful|hot|flirt|kiss|touch|smile|laugh|safe|alliance|ally|thank|yes|please)/i;
  const sharp = /(hate|leave|back off|shut up|idiot|stupid|threat|angry|hurt|liar|fight|fucked|fuck you|don't touch|do not touch|no)/i;
  const vibeBase = {
    catchup: 0.7,
    drama: 0.45,
    flirty: 1.1,
    fight: -0.15,
    more: 1.25,
  }[vibe?.id] ?? 0.45;
  let score = vibeBase + Math.min(1.4, relevant.length * 0.12);
  if (warm.test(text)) score += 0.75;
  if (sharp.test(text)) score -= 0.65;
  return +clamp(score, -2.5, 3.5).toFixed(2);
}

function SceneSetupModal({ char, chars = [], player, onClose, onStart }) {
  const [step, setStep] = useState('setup'); // setup | invite | declined
  const [setting, setSetting] = useState(null);
  const [vibe, setVibe] = useState(null);
  const [selectedIds, setSelectedIds] = useState([char.id]);
  const [inviteLoading, setInviteLoading] = useState(false);
  const [inviteResponse, setInviteResponse] = useState(null);
  const sceneChoices = chars.filter(c => c?.description && c.id !== 'player' && c.id !== '__gmz__');
  const selectedChars = sceneChoices.filter(c => selectedIds.includes(c.id));

  function toggleSceneChar(id) {
    if (id === char.id) return;
    setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  }

  async function sendInvite() {
    if (!setting || !vibe || selectedChars.length === 0) return;
    setInviteLoading(true);
    setStep('invite');
    try {
      const roster = selectedChars.map(c => `${identityFactsFor(c)}. Voice cues: ${c.personality}. ${c.description?.slice(0,150)||c.bio}`).join('\n');
      const res = await window.claude.complete({
        messages:[{ role:'user', content:
          `${player.name} (@${player.handle}) is setting up a scene at ${setting.label} — "${setting.sub}" — vibe: ${vibe.label}.

Invited characters:
${roster}

${pronounRule([player, ...selectedChars])}
${COMMUNICATION_PATTERN_RULE}
${selectedChars.map(c => communicationStyleFor(c, 'scene invite')).join('\n')}
${multiSpeakerDialogueSeparationRule(selectedChars, 'scene invite')}

Write a short in-character group acceptance preview. It can include one or two quick lines from the invited characters, but keep it compact and natural. 1-3 sentences total. If there are multiple characters, let the chemistry of the group show. NO quotes around the whole response.` }]
      });
      setInviteResponse(cleanChatText(res, selectedChars[0], player, selectedChars.length > 1));
      // Detect decline — if response contains "can't", "won't", "no", "not tonight", "busy" etc.
      const lower = res.toLowerCase();
      const declined = ['can\'t', 'won\'t', 'not tonight', 'busy', 'not interested', 'leave me', 'go away'].some(w => lower.includes(w)) && !lower.includes('can\'t wait') && !lower.includes('won\'t be late');
      if (declined) setStep('declined');
      else setStep('accepted');
    } catch(e) {
      setInviteResponse('...fine. But this doesn\'t mean anything.');
      setStep('accepted');
    }
    setInviteLoading(false);

  return (

        {step === 'setup' && <>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:20}}>
            <Avatar char={char} size={36}/>
            <div>
              <p style={{color:C.text, fontWeight:700, fontSize:15}}>Invite {char.name.split(' ')[0]}</p>
              <p style={{color:C.muted, fontSize:12}}>Pick a setting and a vibe</p>
            </div>
          </div>

          <p style={{color:C.muted, fontSize:12, fontWeight:600, letterSpacing:'0.06em', marginBottom:10}}>WHERE</p>
          <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:18}}>
            {SCENE_SETTINGS.map(s => (
              <button key={s.id} onClick={() => setSetting(s)} style={{
                display:'flex', alignItems:'center', gap:12, background: setting?.id===s.id ? `${C.blue}18` : C.card2,
                border:`1.5px solid ${setting?.id===s.id ? C.blue : C.border}`, borderRadius:12,
                padding:'10px 14px', cursor:'pointer', textAlign:'left', transition:'all 0.15s',
              }}>
                <span style={{fontSize:20}}>{s.emoji}</span>

                  <p style={{color:C.text, fontSize:13, fontWeight:600}}>{s.label}</p>
                  <p style={{color:C.muted, fontSize:11}}>{s.sub}</p>

          <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:24}}>

function SceneChatScreen({ char, sceneChars, player, setting, vibe, onClose, onEnd }) {
  const participants = (sceneChars && sceneChars.length ? sceneChars : [char]).filter(Boolean);
  const primaryChar = participants[0];
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const getSceneChar = id => participants.find(c => c.id === id) || primaryChar;

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollTop = 9999;
  }, [msgs]);

  // Opening line from character
  useEffect(() => {
    async function openingLine() {
      setLoading(true);
      // Short delay before first line — feels like they just arrived
      await new Promise(res => setTimeout(res, 2000 + Math.random()*3000));
      try {
        const res = await window.claude.complete({
          messages:[{ role:'user', content: buildScenePrompt('') + '\n\nOpen the scene with 1-2 short lines from the invited character(s). Return ONLY a JSON array of objects like [{"handle":"havocfang","text":"*He leans against the wall.* You picked a dramatic spot."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. Hints at inner state through physical tells only. Short and atmospheric.' }]
        });
        const parsed = JSON.parse(res.trim().replace(/^```json\n?|\n?```$/g,''));
        const openers = parsed.slice(0,2).map((m, i) => {
          const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
          return { role:'char', charId:speaker.id, text: cleanSceneText(m.text || ''), id: Date.now() + i, ts: Date.now() };
        }).filter(m => m.text);
        setMsgs(openers.length ? openers : [{ role:'char', charId:primaryChar.id, text:'*glances over, saying nothing for a moment.*', id: Date.now(), ts: Date.now() }]);
      } catch(e) {
        setMsgs([{ role:'char', charId:primaryChar.id, text: '*glances over, saying nothing for a moment.*', id: Date.now(), ts: Date.now() }]);
      }
      setLoading(false);
    }
    openingLine();
  }, []);

  function buildScenePrompt(history) {
    const roster = participants.map(c => `${identityFactsFor(c)}. Voice cues: ${c.personality}. ${c.description?.slice(0,220)||c.bio}\n${communicationStyleFor(c, 'live scene')}`).join('\n');
    return `Write a live scene with these characters:
${roster}

${pronounRule([player, ...participants])}
${COMMUNICATION_PATTERN_RULE}
${multiSpeakerDialogueSeparationRule(participants, 'live scene')}
${threadPatternVarietyGuard(history ? [history] : [])}

SCENE: ${setting.label} — ${setting.sub}
VIBE: ${vibe.label} ${vibe.emoji}
OTHER PERSON: ${player.name} (@${player.handle}) — ${player.bio}

RESPONSE FORMAT — follow this exactly:
- Actions go in italics asterisks, third person: *She glances up slowly, saying nothing at first.*
- Dialogue is plain text with NO quote marks. Never wrap spoken words in " " or curly quotes.
- Thoughts are NEVER stated directly. At most a very brief physical tell that hints at them: *something flickers across her face* — not "she thinks" or "she wonders".
- A response might be just dialogue, just an action, or both — whatever feels natural.
- Keep it SHORT: 1-2 lines total. This is live conversation, not a story. No paragraph blocks.
- Do not write stage-play beats like "Pauses." or long narrated reactions. Use one small physical action at most.
- Stay completely in character for whoever is speaking. Let the group chemistry matter.
- Use the pronouns listed above exactly. Do not misgender anyone.
- Treat house/team/player status like fixed identity. If someone is not on a Quidditch team, do not write them as a player. If someone mentions their own house or team, they use we/us/our.
- The vibe is ${vibe.label}. Honor it.
- If the player writes [something in brackets], treat it as a physical action and react naturally.
${history ? `\nCONVERSATION SO FAR:\n${history}` : ''}
${BANNED_PHRASES_RULE}`;
  }

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = { role:'user', charId:'player', text: input.trim(), id: Date.now(), ts: Date.now() };
    setMsgs(prev => [...prev, userMsg]);
    setInput('');
    setLoading(true);
    // Realistic typing delay: 4-8 seconds
    const typingDelay = 4000 + Math.random() * 4000;
    await new Promise(res => setTimeout(res, typingDelay));
    try {
      const history = [...msgs, userMsg].map(m =>
        m.role === 'user' ? `${player.name}: ${m.text}` : `${getSceneChar(m.charId)?.name}: ${m.text}`
      ).join('\n');
      const res = await window.claude.complete({
        messages:[{ role:'user', content: buildScenePrompt(history) + `\n\nRespond to: ${userMsg.text}\nChoose the character or characters who would naturally answer. In a group scene, not everyone needs to speak every turn, but more than one may jump in if the moment invites it.\nReturn ONLY a JSON array of 1-3 objects like [{"handle":"rowancade","text":"..."}]. Use exact handles from the roster. Format actions in *third person asterisks*, then dialogue as plain text with NO quote marks. No narration. No inner monologue spelled out.` }]
      });
      const parsed = JSON.parse(res.trim().replace(/^```json\n?|\n?```$/g,''));
      const replies = parsed.slice(0,3).map((m, i) => {
        const speaker = participants.find(c => c.handle === String(m.handle || '').replace('@','')) || participants[i] || primaryChar;
        return { role:'char', charId:speaker.id, text: cleanSceneText(m.text || ''), id: Date.now()+1+i, ts: Date.now() };
      }).filter(m => m.text);
      if (replies.length) setMsgs(prev => [...prev, ...replies]);
    } catch(e) {}
    setLoading(false);
  }

  function endScene() {
    if (onEnd) onEnd(participants, msgs, vibe);
    onClose();
  }

  const vibeColor = vibe.color;

  return (
    <div style={{
      position:'fixed',
      inset:0,
      zIndex:500,
      height:'100dvh',
      maxHeight:'100dvh',
      overflow:'hidden',
      display:'flex',
      flexDirection:'column',
      background:C.bg,
    }}>
      {/* Header */}
      <div style={{padding:'12px 16px', borderBottom:`1px solid ${C.border}`, background:C.bg, display:'flex', alignItems:'center', gap:10}}>
        <button onClick={onClose} style={{background:'none', border:'none', color:C.blue, fontSize:22, cursor:'pointer', lineHeight:1}}>‹</button>
        <div style={{display:'flex'}}>
          {participants.slice(0,3).map((c,i) => <div key={c.id} style={{marginLeft:i ? -9 : 0}}><Avatar char={c} size={34}/></div>)}
        </div>
        <div style={{flex:1}}>
          <p style={{color:C.text, fontWeight:700, fontSize:14}}>{participants.map(c => c.name.split(' ')[0]).join(', ')}</p>
          <p style={{color:C.muted, fontSize:11}}>{setting.emoji} {setting.label}</p>
        </div>
        <div style={{background:`${vibeColor}18`, border:`1px solid ${vibeColor}44`, borderRadius:20, padding:'4px 10px', display:'flex', alignItems:'center', gap:4}}>
          <span style={{fontSize:12}}>{vibe.emoji}</span>
          <span style={{color:vibeColor, fontSize:11, fontWeight:600}}>{vibe.label}</span>
        </div>
        <button onClick={endScene} style={{background:C.card2, color:C.text, border:`1px solid ${C.border}`, borderRadius:18, padding:'7px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>End</button>
      </div>

      {/* Scene setting banner */}
      <div style={{padding:'10px 16px', background:C.card2, borderBottom:`1px solid ${C.border}`}}>
        <p style={{color:C.muted, fontSize:12, textAlign:'center'}}>{setting.sub}</p>
      </div>

      {/* Messages */}
      <div ref={bottomRef} style={{flex:1, overflowY:'auto', padding:`16px 14px ${bottomSafe(92)}`, display:'flex', flexDirection:'column', gap:12}}>
        {msgs.map(m => {
          const isMe = m.role === 'user';
          const displayText = isMe ? m.text : cleanSceneText(m.text);
          return (
            <div key={m.id} style={{display:'flex', flexDirection: isMe?'row-reverse':'row', gap:8, alignItems:'flex-end'}}>
              {!isMe && <Avatar char={getSceneChar(m.charId)} size={28}/>}
              {isMe && <Avatar char={player} size={28}/>}
              <div style={{
                maxWidth:'76%', padding:'10px 14px',
                borderRadius: isMe ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                background: isMe ? C.blue : C.card2,
                color: isMe ? '#fff' : C.text,
                fontSize:14, lineHeight:1.7,
              }}>
                {isMe ? displayText : displayText.split(/(\*[^*]+\*)/g).map((part, i) =>
                  part.startsWith('*') && part.endsWith('*')
                    ? <em key={i} style={{color:C.muted, fontStyle:'italic', fontSize:13}}>{part.slice(1,-1)}</em>
                    : <span key={i}>{part}</span>
                )}
              </div>
            </div>
          );
        })}
        {loading && (
          <div style={{display:'flex', gap:8, alignItems:'flex-end'}}>
            <Avatar char={char} size={28}/>
            <div style={{background:C.card2, borderRadius:'18px 18px 18px 4px', padding:'10px 16px'}}>
              <div style={{display:'flex', gap:4, alignItems:'center'}}>
                {[0,1,2].map(i => <div key={i} style={{width:6, height:6, borderRadius:'50%', background:C.muted, opacity:0.6, animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Input */}
      <div style={{padding:`10px 12px ${bottomSafe(10)}`, borderTop:`1px solid ${C.border}`, background:C.bg, display:'flex', gap:8, alignItems:'flex-end'}}>
        <div style={{flex:1, background:C.card2, borderRadius:22, border:`1px solid ${input.trim() ? vibeColor+'66' : C.border}`, padding:'11px 14px', transition:'border-color 0.2s'}}>
          <textarea ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onFocus={() => setTimeout(() => { if (bottomRef.current) bottomRef.current.scrollTop = 9999; }, 250)}

          />
        </div>
        <button onClick={send} disabled={!input.trim() || loading} style={{
          background: input.trim() ? vibeColor : C.card2, color:'#fff', border:'none',
          borderRadius:'50%', width:46, height:46, cursor: input.trim() ? 'pointer' : 'default',
          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:18,
          transition:'background 0.2s',
        }}>→</button>
      </div>
      <style>{`@keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }`}</style>
    </div>
  );
}

const CHEMISTRY_LABELS = {
  default: 'Chaos Co-Conspirators',
  rivals: 'Sworn Rivals with Unresolved Tension',
  spicy: 'Spicy Situationship Energy',
  lovers: 'Star-Crossed Lovers',
  enemies: 'Enemies with Very Bad Ideas',
  friends: 'Ride-or-Die Friends',
};
const CHEMISTRY_CHIPS = [
  {id:'rivals', icon:'⚔️', label:'Rivals'},
  {id:'spicy', icon:'🌶️', label:'Spicy'},
  {id:'lovers', icon:'💕', label:'Lovers'},
  {id:'enemies', icon:'😈', label:'Enemies'},
  {id:'friends', icon:'🤝', label:'Friends'},
];

function relationshipStageLabel(value) {
  if (value >= 60) return 'Close Orbit';
  if (value >= 25) return 'Warm Interest';
  if (value > 0) return 'Something Brewing';
  if (value === 0) return 'Neutral';
  if (value > -25) return 'Complicated';
  return 'Bad Blood';
}

function fallbackProfileFeeling(char, rel = 0) {
  const positive = rel > 8;
  const warm = rel > 0;
  const guarded = rel < 0;
  const pool = {
    tamsin: positive
      ? ['I trust her more than I planned to, which is inconvenient but not unpleasant.']
      : guarded
        ? ['I am watching the pattern before I decide how worried to be.']
        : ['She is interesting enough to keep watching. I mean that neutrally, mostly.'],
    havoc: warm
      ? ['She is trouble in a way that makes standing still feel stupid.']
      : ['She hits back fast. Obviously I noticed.'],
    rowan: warm
      ? ['She keeps changing the room before anyone admits they are watching.']
      : ['She is either a problem or the point, which is inconveniently funny.'],
    silas: warm
      ? ['She is useful, sharp, and far too aware of it.', 'She and Jude are loud proof that attention is not the same thing as leverage. irritatingly effective proof.']
      : ['She has talent. Whether she has discipline remains the question.', 'She has talent. Jude encouraging the spectacle is not improving my confidence.'],
    callum: warm
      ? ['She is good, which is annoying because pretending otherwise would be sloppy.']
      : ['She talks like the scoreboard already belongs to her. It does not.'],
    jude: warm
      ? ['She makes the room worse in a way I respect professionally.', 'She understands that being vain and annoying is better as a team sport.']
      : ['She is loud enough to be useful and annoying enough to be fun.', 'She has public nuisance instincts. obviously useful.'],
  }[char?.id] || (warm
    ? ['I am paying attention, which is already more than most people get.']
    : guarded
      ? ['I am keeping my distance until the pattern gets clearer.']
      : ['I am watching the situation develop with terrible judgment.']);
  return pool[Math.floor(Math.random() * pool.length)];
}

function cleanProfileFeelingText(raw = '', char, rel = 0) {
  const clean = stripLeadingSelfMention(cleanSelfNarration(cleanGeneratedText(raw), char), char)
    .replace(/^current feeling:\s*/i, '')
    .replace(/^feeling:\s*/i, '')
    .replace(/^["']|["']$/g, '')
    .trim();
  if (!clean || looksLikePromptLeak(clean) || isSelfNarration(clean, char) || clean.length > 180) {
    return fallbackProfileFeeling(char, rel);
  }
  return clean;
}
